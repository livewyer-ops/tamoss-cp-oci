["test:bootstrap:render"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}'",
  "helm lint '{{ vars.ROOT }}/charts/bootstrap' --set-file environmentDefinition='{{ vars.ROOT }}/charts/environment/definition.yaml' --set-file foundationDefinition='{{ vars.ROOT }}/charts/secret-foundation/definition.yaml'",
  "helm template bootstrap '{{ vars.ROOT }}/charts/bootstrap' --set-file environmentDefinition='{{ vars.ROOT }}/charts/environment/definition.yaml' --set-file foundationDefinition='{{ vars.ROOT }}/charts/secret-foundation/definition.yaml' > '{{ env.TASKV_DIRECTORY }}/api.yaml'",
  '''yq 'select(.kind == "Composition")' {{ env.TASKV_DIRECTORY }}/api.yaml > {{ env.TASKV_DIRECTORY }}/composition.yaml''',
  '''yq -n 'load("{{ vars.ROOT }}/environments/example/environment.yaml") as $e | {"apiVersion": "tamoss.livewyer.io/v1alpha1", "kind": "TamossBootstrap", "metadata": {"name": "bootstrap-check", "namespace": "tamoss-infra"}, "spec": {"deploymentId": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "released": false, "foundationName": "bootstrap-check", "foundation": load("{{ vars.ROOT }}/environments/example/foundation.yaml").spec, "environment": ($e.spec * {"managementPolicies": ["*"]})}}' > '{{ env.TASKV_DIRECTORY }}/root.yaml'''',
  "crossplane resource validate '{{ env.TASKV_DIRECTORY }}/api.yaml' '{{ env.TASKV_DIRECTORY }}/root.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ vars.ROOT }}/.local/tmp/check/crossplane' --error-on-missing-schemas",
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/initial.yaml'",
  '''yq 'select(.kind == "SecretFoundation") | .status = {"conditions": [{"type": "Ready", "status": "True"}], "vaultId": "ocid1.vault.oc1.fixture", "keyId": "ocid1.key.oc1.fixture"}' '{{ env.TASKV_DIRECTORY }}/initial.yaml' > '{{ env.TASKV_DIRECTORY }}/foundation.yaml'''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/foundation.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/waiting.yaml'",
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/foundation.yaml' --required-resources='{{ vars.ROOT }}/tests/bootstrap/credentials.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/creating.yaml'",
  '''yq '.spec.data[0].remoteRef.key = "different-deployment-database-admin"' {{ vars.ROOT }}/tests/bootstrap/credentials.yaml > {{ env.TASKV_DIRECTORY }}/wrong-credentials.yaml''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/foundation.yaml' --required-resources='{{ env.TASKV_DIRECTORY }}/wrong-credentials.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/wrong-delivery.yaml'",
  '''yq 'select(.kind != "TamossBootstrap") | .status.conditions = [{"type": "Ready", "status": "True"}] | with(select(.kind == "SecretFoundation"); .status = load("{{ env.TASKV_DIRECTORY }}/foundation.yaml").status)' {{ env.TASKV_DIRECTORY }}/creating.yaml > {{ env.TASKV_DIRECTORY }}/ready-observed.yaml''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/ready-observed.yaml' --required-resources='{{ vars.ROOT }}/tests/bootstrap/credentials.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/ready.yaml'",
  "yq 'del(.status)' {{ env.TASKV_DIRECTORY }}/ready-observed.yaml > {{ env.TASKV_DIRECTORY }}/recovering-observed.yaml",
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/recovering-observed.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/recovering.yaml'",
  "yq '.spec.released = true' {{ env.TASKV_DIRECTORY }}/root.yaml > {{ env.TASKV_DIRECTORY }}/released-root.yaml",
  '''yq 'with(select(.kind == "TamossEnvironment"); .spec.managementPolicies = ["Observe"] | .spec.database.backupRetentionDays = 2)' {{ env.TASKV_DIRECTORY }}/ready-observed.yaml > {{ env.TASKV_DIRECTORY }}/released-observed.yaml''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/released-root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/released-observed.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/released.yaml'",
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/released-root.yaml' '{{ env.TASKV_DIRECTORY }}/composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/foundation.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/deleted-child.yaml'",
  '''yq 'with(select(.kind == "TamossEnvironment"); .metadata.annotations."tamoss.livewyer.io/deployment-id" = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb")' {{ env.TASKV_DIRECTORY }}/ready-observed.yaml > {{ env.TASKV_DIRECTORY }}/foreign-observed.yaml''',
  '''{% for item in ["initial", "waiting", "creating", "wrong-delivery", "ready", "recovering", "released", "deleted-child"] %}
yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_DIRECTORY }}/{{ item }}.yaml > {{ env.TASKV_DIRECTORY }}/{{ item }}-list.yaml
{% endfor %}''',
  "chainsaw test --no-cluster --test-dir '{{ vars.ROOT }}/tests/bootstrap/render' --set-string root='{{ vars.ROOT }}' --set-string crossplaneImage={{ vars.CORE }} --report-format JUNIT-TEST --report-path '{{ vars.ROOT }}/.local/reports' --report-name bootstrap-render",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/bootstrap{% endif %}"

["test:bootstrap:inputs"]
hide = true
run = [
  "mise run test:setup:fixture",
  "mise run test:setup:render",
  "mise run setup:publish-inputs",
  '''yq -n '{"deploymentUID":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "oci":{"user":"ocid1.user.oc1.fixture", "tenancy":"ocid1.tenancy.oc1.fixture"}}' > '{{ env.DIRECTORY }}/identity.yaml'''',
  "test ! -e '{{ env.DIRECTORY }}/management.kubeconfig'",
  "mise run bootstrap:render",
  "crossplane resource validate '.local/tmp/check/bootstrap/api.yaml' '{{ env.DIRECTORY }}/bootstrap.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='.local/tmp/check/crossplane' --error-on-missing-schemas",
  '''yq -e '.spec.credentialsEstablished == false and .spec.remoteBootstrap == null and .spec.storageCredentials.domainId == "ocid1.domain.oc1.fixture" and .spec.vaultAuth.user == "ocid1.user.oc1.fixture"' '{{ env.DIRECTORY }}/bootstrap.yaml'''',
  '''yq -i '.credentialsEstablished = true' '{{ env.DIRECTORY }}/identity.yaml'''',
  "mise run bootstrap:render",
  '''yq -e '.credentialsEstablished == true and .instance.spec.credentialsEstablished == true and .instance.spec.deploymentId == "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' '{{ env.DIRECTORY }}/management-values.yaml'''',
]
env.DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap-inputs"
env.ENV_DIR = "{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap-inputs"
