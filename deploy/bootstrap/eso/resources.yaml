apiVersion: v1
kind: Namespace
metadata: {name: external-secrets}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: external-secrets, namespace: flux-system}
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: external-secrets, namespace: external-secrets}
spec:
  interval: 10m
  timeout: 10m
  releaseName: external-secrets
  targetNamespace: external-secrets
  storageNamespace: external-secrets
  install:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  chart:
    spec:
      chart: external-secrets
      version: REPLACE
      sourceRef: {kind: HelmRepository, name: external-secrets, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: external-secrets-values, valuesKey: values.yaml}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-secrets-values
  namespace: external-secrets
  labels: {reconcile.fluxcd.io/watch: Enabled}
data:
  values.yaml: "{}"
