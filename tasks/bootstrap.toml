  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:composite",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:record-observed-composite",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run transfer:return-ownership",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:resources",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:observe-owned",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:remote",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:remove-application",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:prepare-deletion",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete tamossenvironment/{{ env.TASKV_NAME }} --ignore-not-found --cascade=foreground --wait=true --timeout=1800s",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:delete-backups",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:audit",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete pushsecret/adoption-bindings --ignore-not-found --wait=true --timeout=120s",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:remove-access",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait policy.identity.oci.m.upbound.io --all --for=delete --timeout=300s",
  "mise run storage:retire",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:secret-inventory",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:retire-secrets",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:retained-foundation",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "kind delete cluster --name 'tamoss-cp-{{ env.TASKV_NAME }}'",
  "rm -f '{{ vars.ENV_DIR }}/management.kubeconfig' '{{ vars.ENV_DIR }}/remote.kubeconfig' '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' '{{ vars.ENV_DIR }}/oke-connection.json'",
  "echo 'Environment removed; vault/key ownership and scheduled secret deletions are recorded in {{ vars.ENV_DIR }}/retained-foundation.yaml'",
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:remove-access:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(test -s '{{ vars.ENV_DIR }}/management.kubeconfig') && (kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get helmrelease/runtime-access --ignore-not-found -o json | yq -p=json -e 'length == 0')"
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete helmrelease/runtime-access --ignore-not-found --wait=true --timeout=600s",
]

["bootstrap:remove-access"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -s '{{ vars.ENV_DIR }}/management.kubeconfig' || { printf '%s\n' "The original management kubeconfig is required to remove runtime access" >&2; exit 1; }''',
  "mise run bootstrap:remove-access:apply",
]

["bootstrap:ready"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:{% if env.TASKV_GITOPS == "true" %}git-ready{% else %}local-ready{% endif %}''',
]
env.TASKV_GITOPS = '''{% if env.GITOPS is defined %}{{ env.GITOPS }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.gitopsEstablished == true' " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:local-ready"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} DEPLOYMENT_DIR={{ ((vars.ENV_DIR) ~ "/deployment") | quote }} REVISION={{ ("") | quote }} mise run bootstrap:observe-ready''',
]

["bootstrap:git-ready"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:current-checkout",
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} DEPLOYMENT_DIR={{ ((vars.CHECKOUT) ~ "/" ~ (env.TASKV_PATH_IN_GIT)) | quote }} REVISION="$(git -C {{ (vars.CHECKOUT) | quote }} rev-parse HEAD)" mise run bootstrap:observe-ready''',
]
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''

["bootstrap:observe-ready"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_DEPLOYMENT_DIR | quote }} || { printf '%s\n' "Missing required input: DEPLOYMENT_DIR" >&2; exit 1; }''',
  '''kubectl kustomize '{{ env.TASKV_DEPLOYMENT_DIR }}' | yq -e 'select(.kind == "Kustomization" and .metadata.name == "runtime") | .spec.postBuild.substitute.VALUES_CONFIGMAP | test("^tamoss-gitops-values-[a-z0-9]+$")' > /dev/null || { printf '%s\n' "Update the environment starter to use content-hashed values references before checking this product revision" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} REVISION={{ ((env.TASKV_REVISION)) | quote }} mise run bootstrap:observe-git",
  '''KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig' chainsaw test --skip-delete --namespace flux-system --test-dir deploy/gitops/readiness-check --assert-timeout 1800s --set-string productRevision="$(yq -r 'select(.metadata.name == "tamoss-product") | .spec.ref.commit' '{{ env.TASKV_DEPLOYMENT_DIR }}/sources.yaml')" --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name deployment-ready''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get tamoss/tamoss -o json | yq -p=json -e '.spec.version == load("{{ env.TASKV_DEPLOYMENT_DIR }}/values.yaml").release.tag' > /dev/null''',
]
env.TASKV_DEPLOYMENT_DIR = '''{{ env.DEPLOYMENT_DIR | default(value="") }}'''
env.TASKV_REVISION = '''{{ env.REVISION | default(value="") }}'''

["bootstrap:observe-git:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(test -z "$TASKV_REVISION")'''
run = [
  "KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig' chainsaw test --skip-delete --namespace flux-system --test-dir deploy/gitops/sync-check --assert-timeout 600s --set-string revision={{ (env.TASKV_REVISION) | quote }} --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name gitops-sync",
]
env.TASKV_REVISION = '''{{ env.REVISION | default(value="") }}'''

["bootstrap:observe-git"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:observe-git:apply",
]

["bootstrap:qualify"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:ready",
  '''yq '.release | {"tag": .tag, "releaseSha256": .releaseSha256, "sourceSha256": .sourceSha256}' '{{ env.TASKV_DEPLOYMENT_DIR }}/values.yaml' > '{{ vars.ENV_DIR }}/tamoss-release.current.yaml'''',
  '''RELEASE_LOCK={{ ((vars.ENV_DIR) ~ "/tamoss-release.current.yaml") | quote }} mise run tamoss:fetch''',
  '''RELEASE_LOCK={{ ((vars.ENV_DIR) ~ "/tamoss-release.current.yaml") | quote }} mise run tamoss:release''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:record-release",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n auth get configmap/database-connection -o json | yq -p=json -o=json -e 'select(.data.DATABASE_ID == load("{{ vars.ENV_DIR }}/outputs.json").databaseId) | {"data": {"primary-db-endpoint": {"fqdn": .data.DATABASE_HOST}, "ca-certificate": (.data.DATABASE_CA_BASE64 | @base64d)}}' > '{{ vars.ENV_DIR }}/database-connection.json'''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:run",
]
env.TASKV_GITOPS = '''{% if env.GITOPS is defined %}{{ env.GITOPS }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.gitopsEstablished == true' " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "test ! -s " ~ (vars.ENV_DIR) ~ "/gitops.yaml || yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_DEPLOYMENT_DIR = '''{% if env.DEPLOYMENT_DIR is defined %}{{ env.DEPLOYMENT_DIR }}{% else %}{% if env.TASKV_GITOPS == "true" %}{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}{% else %}{{ vars.ENV_DIR }}/deployment{% endif %}{% endif %}'''

["bootstrap:record-release"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''yq -e 'select(.metadata.name == "tamoss-upstream") | .spec.ref.commit == load("{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_KEY }}/release.json").sourceCommit' '{{ env.TASKV_DEPLOYMENT_DIR }}/sources.yaml' > /dev/null''',
  "cp --no-clobber '{{ vars.ENV_DIR }}/tamoss-release.yaml' '{{ vars.ENV_DIR }}/tamoss-release.bootstrap.yaml'",
  "mv '{{ vars.ENV_DIR }}/tamoss-release.current.yaml' '{{ vars.ENV_DIR }}/tamoss-release.yaml'",
]
env.TASKV_GITOPS = '''{% if env.GITOPS is defined %}{{ env.GITOPS }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.gitopsEstablished == true' " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .releaseSha256 " ~ (vars.ENV_DIR) ~ "/tamoss-release.current.yaml") }}{% endif %}'''
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "test ! -s " ~ (vars.ENV_DIR) ~ "/gitops.yaml || yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_DEPLOYMENT_DIR = '''{% if env.DEPLOYMENT_DIR is defined %}{{ env.DEPLOYMENT_DIR }}{% else %}{% if env.TASKV_GITOPS == "true" %}{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}{% else %}{{ vars.ENV_DIR }}/deployment{% endif %}{% endif %}'''
