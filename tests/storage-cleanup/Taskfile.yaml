version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT_DIR: '{{.PROJECT_ROOT}}'
includes:
  cloud: {taskfile: ../../tasks/cloud.yaml, dir: '{{.PROJECT_ROOT}}', internal: true}
tasks:
  prepare:
    requires: {vars: [STORAGE_DIR, MANAGEMENT_KUBECONFIG, CHECK_NAME]}
    cmds:
      - install -d -m 700 '{{.STORAGE_DIR}}'
      - cp '{{.MANAGEMENT_KUBECONFIG}}' '{{.STORAGE_DIR}}/management.kubeconfig'
      - >-
        yq -n '{"compartmentId": "ocid1.compartment.fixture", "objectNamespace": "fixture",
        "bucketName": "{{.CHECK_NAME}}", "expiresAt": "2099-01-01T00:00:00Z",
        "oci": {"tenancy": "ocid1.tenancy.fixture", "user": "ocid1.user.fixture", "fingerprint": "fixture", "region": "eu-frankfurt-1"}}'
        > '{{.STORAGE_DIR}}/values.yaml'
      - yq -n -o=json '{"data":[]}' > '{{.STORAGE_DIR}}/baseline.json'
  remove:
    cmds:
      - task: cloud:storage-remove-bucket
  cleanup:
    cmds:
      - task: cloud:storage-cleanup
        vars: {OCI: 'false'}
  audit:
    cmds:
      - task: cloud:storage-audit
