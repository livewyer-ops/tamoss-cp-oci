["qualification:availability-report"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''vegeta encode --to=json '{{ vars.ENV_DIR }}/reports/availability.bin' | yq eval-all -p=json '. as $sample ireduce ([]; . + [{"timestamp": ($sample.timestamp | to_unix), "url": $sample.url, "code": $sample.code, "error": $sample.error}])' > '{{ vars.ENV_DIR }}/reports/samples.yaml'''',
  '''yq -n '(load_str("{{ vars.ENV_DIR }}/reports/drain-start") | trim | tonumber) as $start | (load_str("{{ vars.ENV_DIR }}/reports/drain-end") | trim | tonumber) as $end | {"apiVersion": "qualification.livewyer.io/v1alpha1", "kind": "AvailabilityCheck", "drainStart": $start, "drainEnd": $end, "endpoints": [load("{{ vars.ENV_DIR }}/reports/samples.yaml") | group_by(.url) | .[] | {"url": .[0].url, "before": ([.[] | select(.timestamp < $start)] | length), "during": ([.[] | select(.timestamp >= $start and .timestamp <= $end)] | length), "after": ([.[] | select(.timestamp > $end)] | length), "failed": ([.[] | select(.code != 200 or .error != "")] | length)}]}' > '{{ vars.ENV_DIR }}/reports/availability-check.yaml'''',
  "chainsaw assert -r '{{ vars.ENV_DIR }}/reports/availability-check.yaml' -f deploy/contracts/availability.yaml --timeout 1s",
]

