{{- $domain := printf "%s.sslip.io" (replace "." "-" .Values.runtime.publicIp) -}}
{{- $revision := printf "%s/%s" .Values.databaseId .Values.databaseRefreshRevision | sha256sum | trunc 12 -}}
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: credentials, namespace: auth}
spec:
  interval: 1m
  timeout: 5m
  prune: false
  path: ./deploy/gitops/readiness
  sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  healthChecks:
{{ range $ns, $names := dict "tamoss-infra" (list "database-admin") "auth" (list "database-admin" "tams-database" "authentik-values") "tams" (list "tams-database" "tams-s3" "qualification-source") }}
{{ range $names }}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: {{ . }}, namespace: {{ $ns }}}
{{ end }}
{{ end }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: database-connection, namespace: auth}
spec:
  interval: 1m
  timeout: 5m
  prune: false
  path: ./deploy/gitops/readiness
  sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  healthChecks:
    - {apiVersion: batch/v1, kind: Job, name: database-connection-{{ $revision }}, namespace: auth}
    - {apiVersion: v1, kind: ConfigMap, name: database-connection, namespace: auth}
  healthCheckExprs:
    - apiVersion: v1
      kind: ConfigMap
      current: >-
        'DATABASE_ID' in data && 'DATABASE_HOST' in data && 'DATABASE_CA_BASE64' in data &&
        data.DATABASE_ID == '{{ .Values.databaseId }}' && data.DATABASE_HOST != '' && data.DATABASE_CA_BASE64 != '' &&
        metadata.annotations['tamoss.livewyer.io/connection-revision'] == '{{ $revision }}'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: database-ca, namespace: auth}
spec:
  interval: 1m
  timeout: 5m
  prune: true
  dependsOn: [{name: database-connection}]
  path: ./deploy/gitops/database-ca
  sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: database-connection}]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform, namespace: auth}
spec:
  interval: 1m
  timeout: 15m
  prune: false
  dependsOn: [{name: credentials}, {name: database-ca}]
  path: ./deploy/gitops/readiness
  sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  healthChecks:
{{ range $ns, $names := dict "cert-manager" (list "cert-manager") "traefik" (list "traefik") "auth" (list "authentik" "tamoss-database-init") "tamoss-platform" (list "tamoss-platform-config") }}
{{ range $names }}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: {{ . }}, namespace: {{ $ns }}}
{{ end }}
{{ end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: tamoss-operator, namespace: tamoss-system}
spec:
  minAvailable: 1
  selector:
    matchLabels: {control-plane: controller-manager}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: tamoss-operator, namespace: auth}
spec:
  interval: 5m
  timeout: 10m
  prune: false
  deletionPolicy: Orphan
  dependsOn: [{name: platform}]
  path: ./
  sourceRef: {kind: OCIRepository, name: tamoss-release, namespace: flux-system}
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: operator-controller-manager, namespace: tamoss-system}
  images:
    - {name: livewyer/tamoss-operator, newName: docker.io/livewyer/tamoss-operator}
  patches:
    - target: {kind: Namespace, name: tamoss-system}
      patch: |-
        apiVersion: v1
        kind: Namespace
        metadata: {name: tamoss-system}
        $patch: delete
    - target: {kind: Deployment, name: operator-controller-manager}
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: operator-controller-manager}
        spec:
          replicas: 2
          template:
            spec:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels: {control-plane: controller-manager}
                      topologyKey: kubernetes.io/hostname
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: tamoss, namespace: auth}
spec:
  interval: 5m
  timeout: 15m
  prune: false
  deletionPolicy: Orphan
  dependsOn: [{name: tamoss-operator}, {name: credentials}, {name: database-ca}, {name: calico}]
  path: ./deploy/tamoss/instance
  sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: database-connection}]
  healthChecks:
    - {apiVersion: tamoss.livewyer.io/v1alpha1, kind: Tamoss, name: tamoss, namespace: tams}
    - {apiVersion: tamoss.livewyer.io/v1alpha1, kind: StorageBackend, name: tams-storage-default, namespace: tams}
  patches:
    - target: {kind: Tamoss}
      patch: |-
        apiVersion: tamoss.livewyer.io/v1alpha1
        kind: Tamoss
        metadata: {name: tamoss, namespace: tams}
        spec:
          version: {{ .Values.release.tag | quote }}
          images:
            schemaMigrationPostgresClient: {{ .Values.release.postgresImage | quote }}
          publicEndpoint:
            baseDomain: {{ $domain }}
            uiURL: https://app.{{ $domain }}
          ingress:
            api: {host: api.{{ $domain }}}
            ui:
              web: {host: app.{{ $domain }}}
          api:
            cors: {allowedOrigins: ['https://app.{{ $domain }}']}
          auth:
            authentikBlueprints: {issuerURL: 'https://auth.{{ $domain }}'}
          backends:
            db:
              external: {host: '${DATABASE_HOST}'}
            s3:
              external:
                region: {{ .Values.region }}
                bucket: {{ .Values.runtime.bucket }}
                endpoint:
                  default: {url: {{ .Values.runtime.objectEndpoint | quote }}}
                  public: {url: {{ .Values.runtime.objectEndpoint | quote }}}
          ingest:
            sources:
              - name: qualification
                kind: S3
                s3:
                  endpoint: {{ .Values.runtime.objectEndpoint | quote }}
                  region: {{ .Values.region }}
                  bucket: {{ .Values.runtime.bucket }}
                  keyPrefixes: [qualification-input/]
                  pathStyle: true
                  credentialSecretRef: {name: qualification-source}
    - target: {kind: StorageBackend}
      patch: |-
        apiVersion: tamoss.livewyer.io/v1alpha1
        kind: StorageBackend
        metadata: {name: tams-storage-default, namespace: tams}
        spec:
          region: {{ .Values.region }}
          bucketName: {{ .Values.runtime.bucket }}
          endpoint:
            default: {url: {{ .Values.runtime.objectEndpoint | quote }}}
            public: {url: {{ .Values.runtime.objectEndpoint | quote }}}
