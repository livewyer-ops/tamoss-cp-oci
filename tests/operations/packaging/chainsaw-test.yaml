apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: operational-chart-dependencies}
spec:
  steps:
    - name: fetch packaged operation charts by digest
      try:
        - apply: {file: ../../../.local/tmp/check/oci/operations.yaml}
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata: {name: tamoss-chart-database-connection, namespace: tamoss-infra}
              (status.observedGeneration == metadata.generation): true
              (status.artifact.revision == spec.ref.digest): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata: {name: tamoss-chart-secrets, namespace: tamoss-infra}
              (status.observedGeneration == metadata.generation): true
              (status.artifact.revision == spec.ref.digest): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
