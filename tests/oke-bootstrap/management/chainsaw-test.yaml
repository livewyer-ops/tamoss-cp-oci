apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: remote-bootstrap-job}
spec:
  concurrent: false
  steps:
    - name: wait for prerequisites without creating a Job
      try:
        - apply:
            resource: {apiVersion: v1, kind: Namespace, metadata: {name: oke-check}}
        - apply: {file: barrier-access.yaml}
        - apply:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata: {name: prerequisites, namespace: oke-check}
              data: {ready: 'false'}
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: oci-vault-bootstrap, namespace: oke-check}
              stringData: {fingerprint: fixture, privatekey: fixture}
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: github-app, namespace: oke-check}
              stringData: {githubAppID: '1', githubAppInstallationID: '2', githubAppPrivateKey: fixture}
        - apply: {file: '../../../.local/tmp/check/oke-bootstrap/fixture-secret.yaml'}
        - apply: {file: '../../../.local/tmp/check/oke-bootstrap/input.yaml'}
        - apply: {file: '../../../.local/tmp/check/oke-bootstrap/composition.yaml'}
        - command:
            entrypoint: kubectl
            args: [create, --dry-run=server, -f, ../../../.local/tmp/check/oke-bootstrap/missing-auth.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'Remote bootstrap requires the Kind OCI identity')): true
        - apply: {file: '../../../.local/tmp/check/oke-bootstrap/management-root.yaml'}
        - assert:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              status: {remoteBootstrapPhase: Waiting, remoteBootstrapReady: false}
        - error:
            resource: {apiVersion: batch/v1, kind: Job, metadata: {name: oke-bootstrap, namespace: oke-check}}
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, patch, tamossbootstrap, oke-check, --type=merge, '-p={"spec":{"remoteBootstrap":{"fluxVersion":"v2.0.0"}}}']
            check: {($error != null): true}
    - name: controller installs Flux and survives an interrupted Pod
      try:
        - patch:
            resource: {apiVersion: v1, kind: ConfigMap, metadata: {name: prerequisites, namespace: oke-check}, data: {ready: 'true'}}
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata: {namespace: oke-check, labels: {job-name: oke-bootstrap}}
              status:
                (initContainerStatuses[?name == 'before-seed'] | [0].started): true
        - command:
            entrypoint: kubectl
            env:
              - {name: TARGET_KUBECONFIG, value: "(join('', [$values.directory, '/target.kubeconfig']))"}
            args: [--kubeconfig, $TARGET_KUBECONFIG, -n, flux-system, get, deployment, kustomize-controller]
        - command:
            entrypoint: kubectl
            args: [auth, can-i, get, secrets/oke-connection, -n, oke-check, '--as=system:serviceaccount:oke-check:oke-bootstrap']
            check: {($stdout): "yes\n"}
        - command:
            entrypoint: kubectl
            args: [auth, can-i, get, secrets/github-app, -n, oke-check, '--as=system:serviceaccount:oke-check:oke-bootstrap']
            check: {($error != null): true, ($stdout): "no\n"}
    - name: reject a changed remote identity and retry the interrupted seed
      bindings:
        - name: originalUID
          value: (x_k8s_get($client, 'v1', 'Secret', 'oke-check', 'oke-connection').data.remoteUID)
      try:
        - patch:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: oke-connection, namespace: oke-check}
              data: {remoteUID: ZGlmZmVyZW50}
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, delete, pod, -l, job-name=oke-bootstrap, --wait=true, --timeout=120s]
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata: {namespace: oke-check, labels: {job-name: oke-bootstrap}}
              status:
                (initContainerStatuses[?name == 'validate'] | [0].state.terminated.exitCode): 1
        - patch:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: oke-connection, namespace: oke-check}
              data: {remoteUID: ($originalUID)}
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, delete, pod, -l, job-name=oke-bootstrap, --field-selector=status.phase=Failed, --wait=true, --timeout=120s]
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata: {namespace: oke-check, labels: {job-name: oke-bootstrap}}
              status:
                (initContainerStatuses[?name == 'before-seed'] | [0].started): true
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, annotate, secret, oke-connection, allow-seed=true]
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata: {namespace: oke-check, labels: {job-name: oke-bootstrap}}
              status:
                (initContainerStatuses[?name == 'before-complete'] | [0].started): true
        - command:
            entrypoint: kubectl
            env:
              - {name: TARGET_KUBECONFIG, value: "(join('', [$values.directory, '/target.kubeconfig']))"}
            args: [--kubeconfig, $TARGET_KUBECONFIG, -n, flux-system, get, gitrepository/environment, kustomization/environment, secret/github-app, configmap/bootstrap-facts]
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, delete, pod, -l, job-name=oke-bootstrap, --wait=true, --timeout=120s]
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, annotate, secret, oke-connection, allow-complete=true]
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata: {name: oke-bootstrap, namespace: oke-check}
              status: {succeeded: 1}
        - assert:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              status: {remoteBootstrapPhase: Succeeded, remoteBootstrapReady: true, remoteBootstrapCompleted: true}
    - name: recorded completion prevents replay after Job removal
      try:
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, delete, job, oke-bootstrap, --cascade=foreground, --wait=true, --timeout=120s]
        - command:
            entrypoint: kubectl
            args: [-n, oke-check, annotate, tamossbootstrap, oke-check, crossplane.io/reconcile=receipt]
        - assert:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              status: {remoteBootstrapReady: true}
              spec:
                crossplane:
                  (resourceRefs[?kind == 'Job'] | length(@)): 0
        - error:
            resource: {apiVersion: batch/v1, kind: Job, metadata: {name: oke-bootstrap, namespace: oke-check}}
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              spec: {released: true}
        - assert:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              status: {released: true, remoteBootstrapPhase: Released}
      catch:
        - podLogs: {namespace: oke-check, selector: job-name=oke-bootstrap, tail: 30}
        - events: {namespace: oke-check}
    - name: release removes an active Job before reporting completion
      try:
        - delete:
            ref: {apiVersion: tamoss.livewyer.io/v1alpha1, kind: TamossBootstrap, name: oke-check, namespace: oke-check}
        - error:
            resource: {apiVersion: v1, kind: Secret, metadata: {name: oke-connection, namespace: oke-check}}
        - apply: {file: '../../../.local/tmp/check/oke-bootstrap/management-root.yaml'}
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata: {namespace: oke-check, labels: {job-name: oke-bootstrap}}
              status:
                (initContainerStatuses[?name == 'before-seed'] | [0].started): true
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              spec: {released: true}
        - assert:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: TamossBootstrap
              metadata: {name: oke-check, namespace: oke-check}
              status: {released: true, remoteBootstrapPhase: Released, remoteBootstrapCompleted: false}
        - error:
            resource: {apiVersion: batch/v1, kind: Job, metadata: {name: oke-bootstrap, namespace: oke-check}}
        - error:
            resource: {apiVersion: v1, kind: Pod, metadata: {namespace: oke-check, labels: {job-name: oke-bootstrap}}}
