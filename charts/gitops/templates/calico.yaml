apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: calico, namespace: auth}
spec:
  interval: 10m
  timeout: 5m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: OCIRepository, name: tamoss-product, namespace: flux-system}
  path: ./upstream/calico
  healthChecks:
    - {apiVersion: apps/v1, kind: DaemonSet, name: calico-node, namespace: kube-system}
  patches:
    - target: {kind: DaemonSet, name: calico-node}
      patch: |
{{ .Files.Get "files/calico-oci.yaml" | indent 8 }}
