{{- if and .Values.services .Values.okeWorkloadIdentity.region }}
apiVersion: v1
kind: Secret
metadata:
  name: oci-workload-identity
  namespace: tamoss-infra
type: Opaque
stringData:
  credentials: {{ dict "auth" "OKEWorkloadIdentity" "region" .Values.okeWorkloadIdentity.region | toJson | quote }}
---
apiVersion: oci.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: oci
  namespace: tamoss-infra
spec:
  credentials:
    source: Secret
    secretRef:
      name: oci-workload-identity
      namespace: tamoss-infra
      key: credentials
{{- end }}
