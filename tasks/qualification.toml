  '''yq -p=xml -oy -e '.testsuites.testsuite | [(."+@tests" == "5"), (."+@failures" == "0"), (."+@errors" == "0"), (."+@skipped" == "0")] | all' {{ vars.ENV_DIR }}/reports/browser.xml > /dev/null''',
]
depends_post = ["qualification:browser:cleanup"]

