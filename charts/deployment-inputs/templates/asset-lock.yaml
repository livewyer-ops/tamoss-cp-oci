{{- if .Values.files.source }}
{{- $source := .Values.files.source | fromYaml -}}
{{- $pins := .Values.files.pins | fromYaml -}}
{{- with $pins.tadoss }}{{- $_ := unset . "enabled" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tamoss-assets
  namespace: tamoss-infra
  labels: {reconcile.fluxcd.io/watch: Enabled}
  annotations: {kustomize.toolkit.fluxcd.io/substitute: disabled}
data:
  schemaVersion: '4'
  productCommit: {{ required "source commit is required" $source.commit | quote }}
  values.yaml: |
{{ $pins | toYaml | indent 4 }}
    assets:
      url: {{ required "source URL is required" $source.url | quote }}
      commit: {{ $source.commit | quote }}
      secretName: {{ ternary "deployment-git" "" $source.private | quote }}
{{- end }}
