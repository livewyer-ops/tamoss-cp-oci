apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adoption-bindings
  namespace: tamoss-infra
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  prune: false
  deletionPolicy: Orphan
  path: ./deploy/gitops/bindings
  sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  dependsOn: [{name: infrastructure-controllers, namespace: flux-system}]
  postBuild:
    substitute:
      DEPLOYMENT_ID: {{ .Values.deploymentId | quote }}
  healthChecks:
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: adoption-bindings, namespace: tamoss-infra}
    - {apiVersion: v1, kind: Secret, name: adoption-bindings, namespace: tamoss-infra}
  healthCheckExprs:
    - apiVersion: v1
      kind: Secret
      current: >-
        'SCHEMA_VERSION' in data && data.SCHEMA_VERSION == 'MQ==' &&
        'DEPLOYMENT_ID' in data && data.DEPLOYMENT_ID == '{{ .Values.deploymentId | b64enc }}'
