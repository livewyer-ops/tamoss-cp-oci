apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: calico-node
  namespace: kube-system
spec:
  template:
    spec:
      initContainers: null
      containers:
        - name: calico-node
          envFrom: null
          env:
            - name: FELIX_TYPHAK8SSERVICENAME
              $patch: delete
            - {name: FELIX_INTERFACEPREFIX, value: oci}
            - {name: NO_DEFAULT_POOLS, value: 'true'}
            - {name: FELIX_CHAININSERTMODE, value: Append}
            - {name: FELIX_IPTABLESMANGLEALLOWACTION, value: Return}
            - {name: FELIX_IPTABLESBACKEND, value: NFT}
          volumeMounts:
            - name: cni-net-dir
              $patch: delete
            - name: cni-log-dir
              $patch: delete
      volumes:
        - name: cni-bin-dir
          $patch: delete
        - name: cni-net-dir
          $patch: delete
        - name: cni-log-dir
          $patch: delete
