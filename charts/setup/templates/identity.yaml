{{- if .Values.discovery }}
{{- $e := include (print .Template.BasePath "/environment.yaml") . | fromYaml }}
deploymentUID: {{ randBytes 32 | sha256sum | trunc 32 | quote }}
environment:
  name: {{ $e.metadata.name | quote }}
  namespace: {{ $e.metadata.namespace | quote }}
{{ pick $e.spec "region" "compartmentId" "providerConfigName" "storage" | toYaml | indent 2 }}
oci:
{{ pick (.Values.oci | default dict) "tenancy" "user" "fingerprint" "region" | toYaml | indent 2 }}
{{- end }}
