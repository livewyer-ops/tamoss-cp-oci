apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tamoss-infra
secretGenerator:
  - name: asset-reader
    files: [accesskey=asset-accesskey, secretkey=asset-secretkey]
  - name: oci-vault-bootstrap
    files: [privatekey=oci-private-key, fingerprint=oci-fingerprint]
generatorOptions:
  disableNameSuffixHash: true
