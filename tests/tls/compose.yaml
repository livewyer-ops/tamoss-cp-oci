services:
  certificates:
    extends: {file: database.compose.yaml, service: certificates}
  database:
    extends: {file: database.compose.yaml, service: database}
  plaintext:
    extends: {file: database.compose.yaml, service: plaintext}
  psql:
    image: ${TEST_DB_IMAGE}
    entrypoint: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --command=SELECT 1]
    environment:
      PGHOST: ${TLS_HOST:-database}
      PGDATABASE: tams
      PGUSER: tams
      PGPASSWORD: local-test-only
      PGCONNECT_TIMEOUT: '5'
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /ca/${TLS_CA:-server.crt}
    volumes: &ca
      - ${TEST_TLS_DIRECTORY}/server.crt:/ca/server.crt:ro
      - ${TEST_TLS_DIRECTORY}/untrusted.crt:/ca/untrusted.crt:ro
  migration:
    image: ${TEST_API_IMAGE:?}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint: [uv, run, --no-sync, tamoss-db, migrate]
    command: [--revision, '${TEST_DB_REVISION:?}']
    environment:
      POSTGRES_HOST: ${TLS_HOST:-database}
      POSTGRES_PORT: '5432'
      POSTGRES_DB: tams
      POSTGRES_USER: tams
      POSTGRES_PASSWORD: local-test-only
      PGCONNECT_TIMEOUT: '5'
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /ca/${TLS_CA:-server.crt}
      UV_CACHE_DIR: /tmp/uv
      PYTHONDONTWRITEBYTECODE: '1'
    volumes: *ca
networks:
  default:
    internal: true
volumes:
  keys: {}
