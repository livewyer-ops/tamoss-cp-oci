
["test:setup:check"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "chainsaw test --no-cluster --test-dir '{{ vars.ROOT }}/tests/setup/contracts' --exec-timeout 120s --set-string root='{{ vars.ROOT }}' --report-format JUNIT-TEST --report-path '{{ vars.ROOT }}/.local/reports' --report-name setup",
  "mise run test:setup:discovery:prepare",
  "mise run test:setup:preflight:prepare",
  "chainsaw test --no-cluster --test-dir tests/setup/discovery --exec-timeout 60s --set-string root='{{ vars.ROOT_DIR }}' --report-format JUNIT-TEST --report-path .local/reports --report-name setup-discovery",
]

["test:setup:fixture"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "rm -rf '{{ env.TASKV_DIRECTORY }}'",
  "ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} mise run setup:initialise",
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}')" = 700''',
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}/values.yaml')" = 600''',
  "cp tests/setup/values.yaml '{{ env.TASKV_DIRECTORY }}/values.yaml'",
  "cp '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/before-setup.yaml'",
  "ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} mise run setup:initialise",
  "cmp '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/before-setup.yaml'",
  "OCI_CLI_CONFIG_FILE='{{ vars.ROOT }}/tests/setup/oci-config' OCI_CLI_PROFILE=demo ENV_DIR='{{ env.TASKV_DIRECTORY }}' mise run --skip-deps setup:resolve",
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}/discovery/credentials.json')" = 600''',
  '''yq -p=json -o=yaml -e '.user_ocid == "ocid1.user.oc1.fixture" and .tenancy_ocid == "ocid1.tenancy.oc1.fixture" and .private_key == load_str("tests/setup/signing-key") and .private_key_password == "fixture-passphrase"' '{{ env.TASKV_DIRECTORY }}/discovery/credentials.json'''',
  "cmp '{{ env.TASKV_DIRECTORY }}/discovery/privatekey' tests/setup/signing-key",
  "grep -qx 'passphrase=fixture-passphrase' '{{ env.TASKV_DIRECTORY }}/discovery/vault.env'",
  "yq -o=json . tests/source/source.yaml > '{{ env.TASKV_DIRECTORY }}/source.json'",
  "ENV_DIR='{{ env.TASKV_DIRECTORY }}' mise run setup:facts",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:render"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} mise run setup:render",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:defaults"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run test:setup:render",
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}/deployment.yaml')" = 600''',
  '''yq -e '[(.deploymentId | test("^[a-f0-9]{32}$")), .oci.privateKey == null, .oci.region == "eu-frankfurt-1", .oci.tenancy == "ocid1.tenancy.oc1.fixture", .oci.user == "ocid1.user.oc1.fixture", .oci.fingerprint == "fixture", .assets.secretName == "deployment-git"] | all' '{{ env.TASKV_DIRECTORY }}/deployment.yaml'''',
  '''yq -e '.acmeEmail == "operator@example.test" and .adminEmail == "operator@example.test" and .storageIdentity.domainId == "ocid1.domain.oc1.fixture" and .storageIdentity.idcsEndpoint == "https://identity.example.test:443" and .storageIdentity.email == "operator@example.test" and .storageIdentity.images == null' '{{ env.TASKV_DIRECTORY }}/settings.yaml'''',
  '''yq -e '[.metadata.name == "setup-test", .spec.region == "eu-frankfurt-1", .spec.owner == "operator@example.test", .spec.expiresAt == null, .spec.budget == null, .spec.oke.imageId == "ocid1.image.oc1.fixture", (.spec.oke.placements | length == 3), .spec.oke.placements[0].availabilityDomain == "fixture:AD-1", .spec.oke.ocpus == 4, .spec.database == null, .spec.storage.bucket == "tamoss-setup-test-media"] | all' '{{ env.TASKV_DIRECTORY }}/environment.yaml'''',
  '''yq -e '.spec.region == "eu-frankfurt-1" and .spec.owner == "operator@example.test"' '{{ env.TASKV_DIRECTORY }}/foundation.yaml'''',
  '''yq -e '.spec as $s | load("{{ env.TASKV_DIRECTORY }}/values.yaml") as $v | ($s.oke.placements | sort_keys(..) | to_json(0)) == ($v.oke.placements | sort_keys(..) | to_json(0)) and $s.oke.imageId == $v.oke.imageId and $s.network.ociServiceId == $v.network.ociServiceId and $s.network.ociServiceCidr == $v.network.ociServiceCidr and $s.storage.namespace == $v.storage.namespace' '{{ env.TASKV_DIRECTORY }}/environment.yaml'''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:explicit"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''yq -i '.oke.imageId = "ocid1.image.oc1.custom-fixture" | .oke.placements |= reverse' '{{ env.TASKV_DIRECTORY }}/values.yaml'''',
  "mise run test:setup:render",
  '''yq -e '.spec.oke.imageId == "ocid1.image.oc1.custom-fixture" and (.spec.oke.placements | sort_keys(..) | to_json(0)) == (load("{{ env.TASKV_DIRECTORY }}/values.yaml").oke.placements | sort_keys(..) | to_json(0)) and .spec.oke.placements[0].availabilityDomain == "fixture:AD-3"' '{{ env.TASKV_DIRECTORY }}/environment.yaml'''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:bad-input"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "yq -i '{{ env.TASKV_CHANGE }}' {{ env.TASKV_DIRECTORY }}/values.yaml",
  "mise run test:setup:render",
]
env.TASKV_CHANGE = '''{{ env.CHANGE | default(value="") }}'''
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:recorded"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/recorded/checkout/.git'",
  '''yq -n '{"gitopsEstablished": true}' > {{ env.TASKV_DIRECTORY }}/recorded/identity.yaml''',
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/recorded") | quote }} CHECKOUT={{ ((env.TASKV_DIRECTORY) ~ "/recorded/checkout") | quote }} mise run setup:initialise''',
  "test ! -e '{{ env.TASKV_DIRECTORY }}/recorded/values.yaml'",
  "test ! -e '{{ env.TASKV_DIRECTORY }}/recorded/discovery'",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:existing"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/old'",
  "touch '{{ env.TASKV_DIRECTORY }}/old/identity.yaml'",
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/old") | quote }} mise run setup:initialise''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:interrupted"]
hide = true
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/interrupted'",
  "cp tests/setup/deployment-release.yaml '{{ env.TASKV_DIRECTORY }}/interrupted/identity.yaml'",
  "ENV_DIR='{{ env.TASKV_DIRECTORY }}/interrupted' mise run bootstrap:install",
]
env.TASKV_DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/check/setup"

["test:setup:discovery:prepare"]
hide = true
run = [
  "rm -rf '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery'",
  "install -d -m 700 '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/fixtures'",
  "cp tests/setup/discovery/*.json tests/setup/discovery/public-ip '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/fixtures/'",
  '''PROJECT_ROOT={{ vars.ROOT_DIR | quote }} yq eval-all -p=toml -o=toml '
    select(fileIndex == 0) as $root | select(fileIndex == 1) as $setup | select(fileIndex == 0) |
    {"vars":{"ROOT_DIR":strenv(PROJECT_ROOT), "ENV_DIR":(strenv(PROJECT_ROOT) + "/.local/tmp/check/setup-discovery/environment")},
     "env":{"OCI_CLI_CONFIG_FILE":(strenv(PROJECT_ROOT) + "/tests/setup/oci-config"), "OCI_CLI_PROFILE":"demo"},
     "task_config":{"shell":$root.task_config.shell},
     "tasks":{"setup":$root.tasks.setup, "setup:initialise":$setup."setup:initialise", "setup:discover":$setup."setup:discover"}} |
    .tasks[].dir = strenv(PROJECT_ROOT) |
    .tasks."setup:discover".run |= map(sub("(?m)^(oci|curl) [^\\n]+ > (\\x27[^\\n]+/([^/\\x27]+)\\x27)";
      "cat " + ((strenv(PROJECT_ROOT) + "/.local/tmp/check/setup-discovery/fixtures/${3}") | @sh) + " > ${2}"))' mise.toml tasks/setup.toml > '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/fixture.mise.toml' ''',
  '''yq -p=toml -o=yaml -e '.tasks."setup:discover".run | join("\n") | test("(?m)^(oci|curl) ") | not' '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/fixture.mise.toml' > /dev/null''',
  "mise trust '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/fixture.mise.toml'",
]

["test:setup:discovery:run"]
hide = true
run = ["MISE_OVERRIDE_CONFIG_FILENAMES=fixture.mise.toml mise -C '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery' run setup"]

["test:setup:discovery:defaults"]
hide = true
run = [
  "mise run test:setup:discovery:run",
  '''yq -e '[.storageIdentity.domainId == "ocid1.domain.oc1.fixture", .storageIdentity.idcsEndpoint == "https://identity.example.test:443/", .storage.namespace == "fixture-namespace", .network.ociServiceId == "ocid1.service.oc1.fixture", .network.ociServiceCidr == "all-fra-services-in-oracle-services-network", .oke.imageId == "ocid1.image.oc1.fixture", (.oke.placements | length == 3), .oke.placements[0].availabilityDomain == "fixture:AD-1", .oke.placements[1].availabilityDomain == "fixture:AD-2", .oke.placements[2].availabilityDomain == "fixture:AD-3", (.adminCidrs | join(",") == "192.0.2.25/32"), .compartmentId == "ocid1.compartment.oc1..REPLACE", .contactEmail == "operator@example.invalid", .tadoss.enabled == false, .oci == null] | all' '{{ env.TASKV_DIRECTORY }}/values.yaml' ''',
  '''test "$(cat '{{ env.TASKV_DIRECTORY }}/discovery/tenancy')" = ocid1.tenancy.oc1.fixture''',
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}')" = 700 && test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}/values.yaml')" = 600''',
  "test ! -e '{{ env.TASKV_DIRECTORY }}/identity.yaml'",
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/environment'

["test:setup:discovery:overrides"]
hide = true
run = [
  "cp tests/setup/values.yaml '{{ env.TASKV_DIRECTORY }}/values.yaml'",
  '''yq -i '.tadoss.enabled = true | .oke.placements |= reverse' '{{ env.TASKV_DIRECTORY }}/values.yaml' ''',
  "cp '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/before.yaml'",
  "mv '{{ env.TASKV_DIRECTORY }}/../fixtures' '{{ env.TASKV_DIRECTORY }}/../fixtures-unused'",
  "mise run test:setup:discovery:run",
  "cmp '{{ env.TASKV_DIRECTORY }}/before.yaml' '{{ env.TASKV_DIRECTORY }}/values.yaml'",
  "mv '{{ env.TASKV_DIRECTORY }}/../fixtures-unused' '{{ env.TASKV_DIRECTORY }}/../fixtures'",
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/environment'

["test:setup:discovery:partial"]
hide = true
run = [
  '''yq -i 'del(.storageIdentity.domainId, .network.ociServiceCidr, .oke.imageId, .oke.placements) | .oke.version = "v1.36.1"' '{{ env.TASKV_DIRECTORY }}/values.yaml' ''',
  '''yq -i '.data = [.data[0]]' '{{ env.TASKV_DIRECTORY }}/../fixtures/domains.json' ''',
  "mise run test:setup:discovery:run",
  '''yq -e '[.storageIdentity.domainId == "ocid1.domain.oc1.fixture", .storageIdentity.idcsEndpoint == "https://identity.example.test:443/", .network.ociServiceCidr == "all-fra-services-in-oracle-services-network", .oke.imageId == "ocid1.image.oc1.other-version", .oke.version == "v1.36.1", .storage.namespace == "fixture", (.adminCidrs | join(",") == "192.0.2.10/32"), .tadoss.enabled == true, ([.oke.placements[].availabilityDomain] | join(",") == "fixture:AD-3,fixture:AD-3,fixture:AD-3"), ([.oke.placements[].faultDomain] | join(",") == "FAULT-DOMAIN-1,FAULT-DOMAIN-2,FAULT-DOMAIN-3")] | all' '{{ env.TASKV_DIRECTORY }}/values.yaml' ''',
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/environment'

["test:setup:discovery:failure"]
hide = true
run = [
  "cp tests/setup/discovery/*.json tests/setup/discovery/public-ip '{{ env.TASKV_DIRECTORY }}/../fixtures/'",
  "cp environments/example/values.yaml '{{ env.TASKV_DIRECTORY }}/values.yaml'",
  "cp '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/before.yaml'",
  '''{% if env.CASE == "api" %}
rm '{{ env.TASKV_DIRECTORY }}/../fixtures/namespace.json'
{% elif env.CASE == "domain" %}
yq -i '.data += [.data[-1]]' '{{ env.TASKV_DIRECTORY }}/../fixtures/identity-domains.json'
{% elif env.CASE == "image" %}
yq -i '.data.sources = []' '{{ env.TASKV_DIRECTORY }}/../fixtures/node-options.json'
{% elif env.CASE == "ip" %}
printf '999.1.2.3\n' > '{{ env.TASKV_DIRECTORY }}/../fixtures/public-ip'
{% elif env.CASE == "identity" %}
touch '{{ env.TASKV_DIRECTORY }}/identity.yaml'
{% endif %}''',
  "mise run test:setup:discovery:run",
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/environment'

["test:setup:discovery:arguments"]
hide = true
run = [
  "cp tests/setup/discovery/*.json tests/setup/discovery/public-ip '{{ env.TASKV_DIRECTORY }}/../fixtures/'",
  "rm -rf '{{ env.TASKV_DIRECTORY }}'",
  "MISE_OVERRIDE_CONFIG_FILENAMES=fixture.mise.toml mise -C '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery' run setup --compartment-id ocid1.compartment.oc1..fixture --contact-email operator@fixture.test",
  """yq -e '[.compartmentId == "ocid1.compartment.oc1..fixture", .contactEmail == "operator@fixture.test", .storage.namespace == "fixture-namespace", .source.private == true] | all' '{{ env.TASKV_DIRECTORY }}/values.yaml' > /dev/null""",
  """test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}/values.yaml')" = 600""",
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-discovery/environment'

["test:setup:preflight:prepare"]
hide = true
run = [
  "rm -rf '{{ env.TASKV_DIRECTORY }}'",
  "install -d -m 700 '{{ env.TASKV_DIRECTORY }}/bin' '{{ env.TASKV_DIRECTORY }}/environment' '{{ env.TASKV_DIRECTORY }}/fail'",
  """for tool in docker gh oci; do printf '#!/bin/sh\ntest ! -e "%s/fail/$(basename "$0")"\n' '{{ env.TASKV_DIRECTORY }}' > '{{ env.TASKV_DIRECTORY }}/bin/'"$tool"; chmod 700 '{{ env.TASKV_DIRECTORY }}/bin/'"$tool"; done""",
  """PROJECT_ROOT={{ vars.ROOT_DIR | quote }} DIRECTORY={{ env.TASKV_DIRECTORY | quote }} yq eval-all -p=toml -o=toml '
    select(fileIndex == 0) as $root | select(fileIndex == 1) as $setup | select(fileIndex == 0) |
    {"vars":{"ROOT_DIR":strenv(PROJECT_ROOT), "ENV_DIR":(strenv(DIRECTORY) + "/environment")},
     "task_config":{"shell":$root.task_config.shell},
     "tasks":{"preflight":$setup.preflight}}' mise.toml tasks/setup.toml > '{{ env.TASKV_DIRECTORY }}/fixture.mise.toml'""",
  "mise trust '{{ env.TASKV_DIRECTORY }}/fixture.mise.toml'",
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-preflight'

["test:setup:preflight"]
hide = true
run = [
  "rm -f '{{ env.TASKV_DIRECTORY }}/fail/'* '{{ env.TASKV_DIRECTORY }}/environment/values.yaml'",
  """{% if env.CASE != "missing" %}
yq '.compartmentId = "ocid1.compartment.oc1..fixture" | .contactEmail = "operator@fixture.test"' environments/example/values.yaml > '{{ env.TASKV_DIRECTORY }}/environment/values.yaml'
{% endif %}
{% if env.CASE == "placeholder" %}
cp environments/example/values.yaml '{{ env.TASKV_DIRECTORY }}/environment/values.yaml'
{% elif env.CASE == "docker" or env.CASE == "gh" or env.CASE == "oci" %}
touch '{{ env.TASKV_DIRECTORY }}/fail/{{ env.CASE }}'
{% elif env.CASE == "public" %}
touch '{{ env.TASKV_DIRECTORY }}/fail/gh'
yq -i '.source.private = false' '{{ env.TASKV_DIRECTORY }}/environment/values.yaml'
{% endif %}""",
  "PATH='{{ env.TASKV_DIRECTORY }}/bin':\"$PATH\" MISE_OVERRIDE_CONFIG_FILENAMES=fixture.mise.toml mise -C '{{ env.TASKV_DIRECTORY }}' run preflight",
]
env.TASKV_DIRECTORY = '{{ vars.ROOT_DIR }}/.local/tmp/check/setup-preflight'
