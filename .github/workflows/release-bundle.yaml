name: Publish release assets
on:
  workflow_dispatch:
    inputs:
      application:
        description: Application release to package
        type: choice
        required: true
        default: tamoss
        options: [tamoss, tadoss, deployment]
permissions:
  contents: read
  packages: write
concurrency:
  group: tamoss-release-assets
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPLICATION: ${{ inputs.application }}
      PACKAGE_NAME: ${{ inputs.application == 'deployment' && 'tamoss-release-assets' || format('{0}-release-assets', inputs.application) }}
      PACKAGE_OWNER: ${{ github.repository_owner }}
      PRODUCT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: --locked
      - name: Require public visibility for any existing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          mkdir -p -m 700 .local/tmp/check
          gh api "/users/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME" > .local/tmp/check/package.json ||
            yq -e '.status == "404"' .local/tmp/check/package.json
          yq -o=json '{"status": .status, "visibility": .visibility, "repository": .repository.full_name}' .local/tmp/check/package.json
          yq -e '(.status == "404") or (.visibility == "public")' .local/tmp/check/package.json
      - name: Verify the release and prepare the allowlisted bundle
        run: mise run check
      - name: Build the deployment release
        if: inputs.application == 'deployment'
        run: mise run release:build
      - name: Authenticate the publisher
        env:
          PUBLISHER: ${{ github.actor }}
          PUBLISH_TOKEN: ${{ github.token }}
        run: printf '%s' "$PUBLISH_TOKEN" | docker login ghcr.io --username "$PUBLISHER" --password-stdin
      - name: Publish Helm charts and seal the deployment bundle
        if: inputs.application == 'deployment'
        env:
          PRODUCT_COMMIT: ${{ github.sha }}
          CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/tamoss-release-assets/charts
        run: |
          HELM_REGISTRY_CONFIG="$HOME/.docker/config.json" mise run release:charts
          mise run release:seal
      - name: Publish reproducibly
        env:
          PRODUCT_COMMIT: ${{ github.sha }}
          PRODUCT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$APPLICATION" = deployment ]; then
            bundle_tag="deployment-$PRODUCT_COMMIT"
            bundle_path=.local/tmp/release/assets-build/tree
          else
            bundle_tag="$(yq -r .tag "deploy/$APPLICATION/release.yaml")-$PRODUCT_COMMIT"
            bundle_path=".local/tmp/$APPLICATION-bundle"
          fi
          flux push artifact "oci://ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$bundle_tag" --path "$bundle_path" --ignore-paths=.git/,.local/,AGENTS.md,CLAUDE.md --reproducible --source "https://github.com/$PRODUCT_REPOSITORY" --revision "$PRODUCT_BRANCH@sha1:$PRODUCT_COMMIT" --output json > .local/tmp/check/published-bundle.json
      - name: Verify the published package and record the digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/users/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME" > .local/tmp/check/published-package.json
          yq -o=json '{"visibility": .visibility, "repository": .repository.full_name}' .local/tmp/check/published-package.json
          yq -e '.visibility == "public"' .local/tmp/check/published-package.json
          yq -r '"OCI digest: `" + .digest + "`"' .local/tmp/check/published-bundle.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous consumption
        run: |
          mkdir -p .local/tmp/anonymous-registry .local/tmp/anonymous-bundle
          DOCKER_CONFIG="$PWD/.local/tmp/anonymous-registry" flux pull artifact "oci://ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME@$(yq -r .digest .local/tmp/check/published-bundle.json)" --output .local/tmp/anonymous-bundle --timeout=60s
          if [ "$APPLICATION" = deployment ]; then
            diff -r .local/tmp/release/assets-build/tree .local/tmp/anonymous-bundle
          else
            diff -r ".local/tmp/$APPLICATION-bundle" .local/tmp/anonymous-bundle
          fi
      - name: Remove publisher credentials
        if: always()
        run: docker logout ghcr.io
