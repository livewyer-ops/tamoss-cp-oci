{{- $password := dict "secretKey" "password" "remoteKey" "database-admin" -}}
{{- $deliveries := dict
  "tamoss-infra" (list (dict "name" "database-admin" "template" (dict "passwordType" "PLAIN_TEXT") "data" (list $password)))
  "flux-system" (list
    (dict "name" "github-app" "data" (list
      (dict "secretKey" "githubAppID" "remoteKey" "github-app" "property" "githubAppID")
      (dict "secretKey" "githubAppInstallationID" "remoteKey" "github-app" "property" "githubAppInstallationID")
      (dict "secretKey" "githubAppPrivateKey" "remoteKey" "github-app" "property" "githubAppPrivateKey")))
    (dict "name" "ghcr" "type" "kubernetes.io/dockerconfigjson" "data" (list (dict "secretKey" ".dockerconfigjson" "remoteKey" "ghcr" "property" "dockerconfigjson"))))
  "auth" (list
    (dict "name" "database-admin" "template" (dict "username" .Values.databaseAdministrator) "data" (list $password))
    (dict "name" "tams-database" "template" (dict "username" "tams") "data" (list (dict "secretKey" "password" "remoteKey" "tams-database")))
    (dict "name" "authentik-values" "data" (list
      (dict "secretKey" "secretKey" "remoteKey" "authentik-secret-key")
      (dict "secretKey" "password" "remoteKey" "authentik-password")
      (dict "secretKey" "token" "remoteKey" "authentik-token")
      (dict "secretKey" "databasePassword" "remoteKey" "authentik-database"))
      "template" (dict "values.yaml" "authentik:\n  secretKey: '{{ .secretKey }}'\n  bootstrap:\n    password: '{{ .password }}'\n    token: '{{ .token }}'\n  postgresql:\n    password: '{{ .databasePassword }}'\n    postgresPassword: '{{ .databasePassword }}'\n")))
  "tams" (list
    (dict "name" "qualification-source" "data" (list
      (dict "secretKey" "AWS_ACCESS_KEY_ID" "remoteKey" "s3" "property" "accessKey")
      (dict "secretKey" "AWS_SECRET_ACCESS_KEY" "remoteKey" "s3" "property" "secretKey")))
    (dict "name" "tams-database" "template" (dict "username" "tams") "data" (list (dict "secretKey" "password" "remoteKey" "tams-database")))
    (dict "name" "tams-s3" "data" (list
      (dict "secretKey" "accessKey" "remoteKey" "s3" "property" "accessKey")
      (dict "secretKey" "secretKey" "remoteKey" "s3" "property" "secretKey")))) -}}
{{ if .Values.tadoss.enabled }}
{{- $_ := set $deliveries "auth" (concat (index $deliveries "auth") (list
    (dict "name" "tadoss-database" "data" (list (dict "secretKey" "password" "remoteKey" "tadoss-database")))
    (dict "name" "tadoss-oauth" "data" (list (dict "secretKey" "password" "remoteKey" "tadoss-oauth"))))) -}}
{{ end }}
{{ range $namespace, $items := $deliveries }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tamoss-secrets
  namespace: {{ $namespace }}
spec:
  interval: 5m
  timeout: 5m
  releaseName: tamoss-secrets
  install:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  targetNamespace: {{ $namespace }}
  storageNamespace: {{ $namespace }}
  dependsOn: [{name: external-secrets, namespace: external-secrets}]
  chart:
    spec:
      chart: ./charts/secrets
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  values:
    deploymentId: {{ $.Values.deploymentId | quote }}
    oracle:
      region: {{ $.Values.region }}
      vault: {{ $.Values.vaultId }}
      principalType: Workload
      serviceAccountRef: {name: tamoss-vault}
    deliveries:
{{ $items | toYaml | indent 6 }}
{{ end }}
