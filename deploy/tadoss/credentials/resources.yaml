apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tadoss-secrets
  namespace: tads
  labels: {tamoss.livewyer.io/deployment-id: '${DEPLOYMENT_ID}'}
spec:
  interval: 5m
  timeout: 5m
  releaseName: tadoss-secrets
  targetNamespace: tads
  storageNamespace: tads
  dependsOn: [{name: external-secrets, namespace: external-secrets}]
  chart:
    spec:
      chart: ./${ASSET_PREFIX}charts/secrets
      reconcileStrategy: Revision
      sourceRef: {kind: Bucket, name: tamoss-product, namespace: flux-system}
  values:
    deploymentId: ${DEPLOYMENT_ID}
    oracle:
      region: ${OCI_REGION}
      vault: ${VAULT_ID}
      principalType: Workload
      serviceAccountRef: {name: tamoss-vault}
    deliveries:
      - name: tadoss-database
        data: [{secretKey: password, remoteKey: tadoss-database}]
        template:
          uri: 'postgresql://tadoss:{{ .password | urlquery }}@${DATABASE_HOST}:5432/tadoss?sslmode=verify-full'
