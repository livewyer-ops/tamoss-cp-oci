apiVersion: batch/v1
kind: Job
(spec.activeDeadlineSeconds > `0`): true
(spec.backoffLimit >= `0`): true
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        (runAsUser > `0`): true
        seccompProfile: {type: RuntimeDefault}
      (length(containers) > `0`): true
      (length([initContainers, containers][] | [?securityContext.readOnlyRootFilesystem == `true` && securityContext.allowPrivilegeEscalation == `false` && contains(securityContext.capabilities.drop, 'ALL')]) == length([initContainers, containers][])): true
      (length([initContainers, containers][] | [?resources.requests.cpu && resources.requests.memory && resources.limits.memory]) == length([initContainers, containers][])): true
      (length([initContainers, containers][] | [?contains(image, '@sha256:')]) == length([initContainers, containers][])): true
      (length(volumes[?emptyDir && (emptyDir.medium != 'Memory' || !emptyDir.sizeLimit)])): 0
      (length([initContainers, containers][].env[] | [?valueFrom.secretKeyRef && value])): 0
