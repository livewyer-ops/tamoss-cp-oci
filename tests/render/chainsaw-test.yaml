apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rendered-contracts
spec:
  steps:
    - name: composition
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/initial-list.yaml, -f, initial.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/partial-list.yaml, -f, partial.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/ready-list.yaml, -f, ready.yaml]
    - name: services
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-initial-list.yaml, -f, services-initial.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-created-list.yaml, -f, services-binding.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-created-list.yaml, -f, services-created.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-ready-list.yaml, -f, services-binding.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-ready-list.yaml, -f, services-ready.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-recovering-list.yaml, -f, services-binding.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-recovering-list.yaml, -f, services-ready.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-instance-list.yaml, -f, services-instance.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/services-packages-list.yaml, -f, services-packages.yaml]
    - name: application
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/platform-list.yaml, -f, platform.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/tamoss-list.yaml, -f, tamoss.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/operator-list.yaml, -f, operator.yaml]
