{{- $password := dict "secretKey" "password" "remoteKey" "database-admin" -}}
{{- $deliveries := dict
  "auth" (list
    (dict "name" "database-admin" "template" (dict "username" .Values.databaseAdministrator) "data" (list $password))
    (dict "name" "tams-database" "template" (dict "username" "tams") "data" (list (dict "secretKey" "password" "remoteKey" "tams-database"))))
  "tams" (list
    (dict "name" "qualification-source" "data" (list
      (dict "secretKey" "AWS_ACCESS_KEY_ID" "remoteKey" "s3" "property" "accessKey")
      (dict "secretKey" "AWS_SECRET_ACCESS_KEY" "remoteKey" "s3" "property" "secretKey")))
    (dict "name" "tams-database" "template" (dict "username" "tams") "data" (list (dict "secretKey" "password" "remoteKey" "tams-database")))
    (dict "name" "tams-s3" "data" (list
      (dict "secretKey" "accessKey" "remoteKey" "s3" "property" "accessKey")
      (dict "secretKey" "secretKey" "remoteKey" "s3" "property" "secretKey")))) -}}
{{ if .Values.tadoss.enabled }}
{{- $_ := set $deliveries "auth" (concat (index $deliveries "auth") (list
    (dict "name" "tadoss-database" "data" (list (dict "secretKey" "password" "remoteKey" "tadoss-database")))
    (dict "name" "tadoss-oauth" "data" (list (dict "secretKey" "password" "remoteKey" "tadoss-oauth"))))) -}}
{{ end }}
{{ range $namespace, $items := $deliveries }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tamoss-secrets-{{ $namespace }}
  namespace: tamoss-infra
spec:
  interval: 5m
  timeout: 5m
  releaseName: tamoss-secrets
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  install:
    createNamespace: true
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  targetNamespace: {{ $namespace }}
  storageNamespace: {{ $namespace }}
  dependsOn: [{name: oke-external-secrets}]
  chart:
    spec:
      chart: ./charts/secrets
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
  values:
    deploymentId: {{ $.Values.deploymentId | quote }}
    oracle:
      region: {{ $.Values.region }}
      vault: {{ $.Values.vaultId }}
      principalType: Workload
      serviceAccountRef: {name: tamoss-vault}
    deliveries:
{{ $items | toYaml | indent 6 }}
{{ end }}
