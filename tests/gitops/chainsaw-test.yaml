apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gitops-contracts
spec:
  timeouts:
    exec: 30s
  steps:
  - name: validate the rendered controller and credential contracts
    try:
    - command:
        entrypoint: chainsaw
        args:
        - assert
        - -r
        - ../../.local/tmp/check/gitops-list.yaml
        - -f
        - render.yaml
        - --timeout
        - 1s
