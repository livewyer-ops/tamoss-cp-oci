apiVersion: v1
kind: Namespace
metadata:
  name: tamoss-infra
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tamoss-bootstrap-product
  namespace: tamoss-infra
spec:
  interval: 1m
  url: https://github.com/example/fixture
  ref:
    commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
status:
  observedGeneration: 1
  conditions:
  - type: Ready
    status: 'True'
    reason: Fixture
    message: Fixture
    lastTransitionTime: '2026-01-01T00:00:00Z'
  artifact:
    revision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    path: fixture
    url: http://example.invalid/fixture
    lastUpdateTime: '2026-01-01T00:00:00Z'
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: tamoss-infra-tamoss-gitops
  namespace: tamoss-infra
spec:
  interval: 1m
  chart: ./charts/gitops
  sourceRef:
    kind: GitRepository
    name: tamoss-bootstrap-product
status:
  observedGeneration: 1
  conditions:
  - type: Ready
    status: 'True'
    reason: Fixture
    message: Fixture
    lastTransitionTime: '2026-01-01T00:00:00Z'
  observedSourceArtifactRevision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  artifact:
    revision: 0.1.0+aaaa
    path: fixture
    url: http://example.invalid/fixture
    lastUpdateTime: '2026-01-01T00:00:00Z'
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tamoss-gitops
  namespace: tamoss-infra
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gitops
      sourceRef:
        kind: GitRepository
        name: tamoss-bootstrap-product
status:
  observedGeneration: 1
  conditions:
  - type: Ready
    status: 'True'
    reason: Fixture
    message: Fixture
    lastTransitionTime: '2026-01-01T00:00:00Z'
  lastAttemptedRevision: 0.1.0+aaaa
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deployment-ready
  namespace: tamoss-infra
spec:
  interval: 1m
  path: ./
  prune: false
  sourceRef:
    kind: GitRepository
    name: tamoss-bootstrap-product
status:
  observedGeneration: 1
  conditions:
  - type: Ready
    status: 'True'
    reason: Fixture
    message: Fixture
    lastTransitionTime: '2026-01-01T00:00:00Z'
  lastAppliedRevision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
