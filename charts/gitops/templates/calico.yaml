apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: calico, namespace: flux-system}
spec:
  interval: 1h
  timeout: 5m
  url: https://github.com/projectcalico/calico
  ref: {commit: {{ .Values.dependencies.calicoCommit | quote }}}
  sparseCheckout: [manifests]
  ignore: |
    /*
    !/manifests
    /manifests/*
    !/manifests/calico-policy-only.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: calico, namespace: auth}
spec:
  interval: 10m
  timeout: 5m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: calico, namespace: flux-system}
  path: ./manifests
  healthChecks:
    - {apiVersion: apps/v1, kind: DaemonSet, name: calico-node, namespace: kube-system}
  patches:
    - target: {kind: DaemonSet, name: calico-node}
      patch: |
{{ .Files.Get "files/calico-oci.yaml" | indent 8 }}
