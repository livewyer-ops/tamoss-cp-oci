apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tadoss-authentik, namespace: tads}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: tadoss, app.kubernetes.io/component: api}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: websecure}]
