apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: gitops-publication}
spec:
  timeouts: {exec: 30s}
  steps:
    - name: publish only generated paths and preserve unrelated staged files
      try:
        - command:
            entrypoint: task
            env: &paths
              - {name: PROJECT_ROOT, value: ($values.root)}
              - {name: DIRECTORY, value: "(join('', [$values.directory, '-publication']))"}
            args: [-t, ../Taskfile.yaml, publication-fixture]
        - command: &publish
            entrypoint: task
            env: *paths
            args: [-t, ../Taskfile.yaml, publish]
        - command:
            entrypoint: git
            env: *paths
            args: [-C, '$DIRECTORY/checkout', diff, --cached, --name-only]
            check:
              ($stdout): "unrelated.txt\n"
        - command: *publish
        - command:
            entrypoint: git
            env: *paths
            args: [-C, '$DIRECTORY/checkout', rev-list, --count, HEAD]
            check:
              ($stdout): "1\n"
    - name: resume publication after a policy edit or a commit without a push
      try:
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.spec.managementPolicies = ["*"]', '$DIRECTORY/checkout/clusters/oci-dev/infrastructure/environment.yaml']
        - command: &promotion
            entrypoint: task
            env: *paths
            args: [-t, ../Taskfile.yaml, promotion]
        - command:
            entrypoint: git
            env: *paths
            args: [-C, '$DIRECTORY/checkout', commit, --only, -m, 'feat: promote fixture', --, clusters/oci-dev/infrastructure/environment.yaml]
        - command: *promotion
        - command:
            entrypoint: task
            env: *paths
            args: [-t, ../Taskfile.yaml, initial-export]
            check:
              ($error != null): true
              (contains($stderr, 'Initial publication requires observe-only infrastructure')): true
        - command: *publish
        - command: *promotion
    - name: skip completed bootstrap with promoted policy and a different product checkout
      try:
        - command:
            entrypoint: task
            env: *paths
            args: [-t, ../Taskfile.yaml, completed-bootstrap]
        - command:
            entrypoint: git
            env: *paths
            args: [-C, '$DIRECTORY/checkout', rev-list, --count, HEAD]
            check:
              ($stdout): "2\n"
    - name: reject unrelated desired changes during promotion recovery
      try:
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.runtime.adminEmail = "unpublished@example.invalid"', '$DIRECTORY/checkout/clusters/oci-dev/values.yaml']
        - command:
            <<: *promotion
            check: {($error != null): true}
        - command:
            entrypoint: git
            env: *paths
            args: [-C, '$DIRECTORY/checkout', restore, clusters/oci-dev/values.yaml]
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.spec.storage.bucket = "changed-during-promotion"', '$DIRECTORY/checkout/clusters/oci-dev/infrastructure/environment.yaml']
        - command:
            <<: *promotion
            check: {($error != null): true}
    - name: include native Flux manifests and enable only Git credential delivery
      try:
        - command:
            entrypoint: git
            env: *paths
            args: [-C, '$DIRECTORY/checkout', restore, clusters/oci-dev/infrastructure/environment.yaml]
        - command:
            entrypoint: task
            env: *paths
            args: [-t, ../Taskfile.yaml, native-git-fixture]
        - command:
            entrypoint: task
            env: *paths
            args: [-t, ../Taskfile.yaml, enable-key-delivery]
        - command:
            entrypoint: kubectl
            env: *paths
            args: [kustomize, '$DIRECTORY/checkout/clusters/oci-dev', -o, '$DIRECTORY/git-root.yaml']
        - command:
            entrypoint: yq
            env: *paths
            args: [eval-all, -e, '[select(.kind == "Kustomization" and .metadata.name == "flux-system")] | select(length == 1) | .[0].spec | [.prune == false, .deletionPolicy == "Orphan"] | all', '$DIRECTORY/git-root.yaml']
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.gitops.enabled == true and .tadoss.enabled == false', '$DIRECTORY/checkout/clusters/oci-dev/values.yaml']
