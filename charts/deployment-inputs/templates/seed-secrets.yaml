{{- if .Values.files.ociProfile }}
{{- $oci := (.Values.files.ociProfile | fromYaml).oci -}}

apiVersion: v1
kind: Secret
metadata: {name: oci-api-key, namespace: tamoss-infra}
type: Opaque
stringData:
  credentials: {{ dict "auth" "ApiKey" "tenancy_ocid" $oci.tenancy "user_ocid" $oci.user "fingerprint" $oci.fingerprint "region" $oci.region "private_key" $oci.privateKey "private_key_password" ($oci.privateKeyPassword | default "") | toJson | quote }}
---
apiVersion: v1
kind: Secret
metadata: {name: oci-vault-bootstrap, namespace: tamoss-infra}
type: Opaque
stringData:
  privatekey: {{ $oci.privateKey | quote }}
  fingerprint: {{ $oci.fingerprint | quote }}
  user: {{ $oci.user | quote }}
  tenancy: {{ $oci.tenancy | quote }}
  passphrase: {{ $oci.privateKeyPassword | default "" | quote }}
{{- end }}
