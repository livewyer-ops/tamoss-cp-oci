apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deployment-time-window
spec:
  steps:
  - name: retain the fixed deadline when repeating a deployment
    try:
    - command:
        entrypoint: mkdir
        args: [-p, ../../../.local/tmp/check/time-window]
    - command:
        entrypoint: cp
        args: [environment.yaml, ../valid-cost.yaml, ../../../.local/tmp/check/time-window/]
    - command:
        entrypoint: mv
        args: [../../../.local/tmp/check/time-window/valid-cost.yaml, ../../../.local/tmp/check/time-window/cost.yaml]
    - command:
        entrypoint: cp
        args: [../../../tasks/lifecycle.yaml, ../../../.local/tmp/check/time-window/Taskfile.yaml]
    # Fix only the clock; exercise the production deadline checks unchanged.
    - command:
        entrypoint: yq
        args: [-i, 'del(.tasks."time-window".vars.NOW, .tasks."time-window".vars.DAY_END)', ../../../.local/tmp/check/time-window/Taskfile.yaml]
    - command:
        entrypoint: task
        workDir: ../../..
        args: [-d, ., -t, .local/tmp/check/time-window/Taskfile.yaml, time-window, ENV_DIR=.local/tmp/check/time-window, NOW=32400, DAY_END=86400]
    - command:
        entrypoint: task
        workDir: ../../..
        args: [-d, ., -t, .local/tmp/check/time-window/Taskfile.yaml, time-window, ENV_DIR=.local/tmp/check/time-window, NOW=37800, DAY_END=86400]
        check:
          ($error != null): true
          (contains($stderr, 'A new environment needs the complete test and cleanup window')): true
    - command:
        entrypoint: touch
        args: [../../../.local/tmp/check/time-window/identity.yaml]
    - command:
        entrypoint: yq
        args: [-i, '.managementUID = "fixture-management-uid"', ../../../.local/tmp/check/time-window/identity.yaml]
    - command:
        entrypoint: task
        workDir: ../../..
        args: [-d, ., -t, .local/tmp/check/time-window/Taskfile.yaml, time-window, ENV_DIR=.local/tmp/check/time-window, NOW=37800, DAY_END=86400]
    - command:
        entrypoint: cmp
        args: [environment.yaml, ../../../.local/tmp/check/time-window/environment.yaml]
    - command:
        entrypoint: task
        workDir: ../../..
        args: [-d, ., -t, .local/tmp/check/time-window/Taskfile.yaml, time-window, ENV_DIR=.local/tmp/check/time-window, NOW=41400, DAY_END=86400]
        check:
          ($error != null): true
          (contains($stderr, 'Insufficient time remains before expiry for cleanup')): true
    - command:
        entrypoint: task
        workDir: ../../..
        args: [-d, ., -t, .local/tmp/check/time-window/Taskfile.yaml, time-window, ENV_DIR=.local/tmp/check/time-window, NOW=37800, DAY_END=40000]
        check:
          ($error != null): true
          (contains($stderr, 'The qualification expiry must be no later than the next UTC midnight')): true
    - command:
        entrypoint: yq
        args: [-i, 'del(.managementUID)', ../../../.local/tmp/check/time-window/identity.yaml]
    - command:
        entrypoint: task
        workDir: ../../..
        args: [-d, ., -t, .local/tmp/check/time-window/Taskfile.yaml, time-window, ENV_DIR=.local/tmp/check/time-window, NOW=37800, DAY_END=86400]
        check:
          ($error != null): true
          (contains($stderr, 'A new environment needs the complete test and cleanup window')): true
    finally:
    - command:
        entrypoint: rm
        args: [-rf, ../../../.local/tmp/check/time-window]
