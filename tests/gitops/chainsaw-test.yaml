apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: gitops-contracts}
spec:
  timeouts: {exec: 30s}
  steps:
    - name: validate the rendered controller and credential contracts
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, -r, ../../.local/tmp/check/gitops-list.yaml, -f, render.yaml, --timeout, 1s]
        - command:
            entrypoint: chainsaw
            args: [assert, -r, ../../.local/tmp/check/runtime-seed-list.yaml, -f, seed.yaml, --timeout, 1s]
    - name: export only the initial non-secret configuration
      try:
        - command: &fixture
            entrypoint: env
            env: &env
              - {name: PROJECT_ROOT, value: ($values.root)}
              - {name: DIRECTORY, value: ($values.directory)}
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:fixture"]
        - command: &export
            entrypoint: env
            env: *env
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:export"]
        - command:
            entrypoint: env
            env: *env
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:shared-configuration"]
        - command:
            entrypoint: kubectl
            env: *env
            args: [kustomize, '$DIRECTORY/checkout/clusters/oci-dev', -o, '$DIRECTORY/before.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [eval-all, -e, '[select(.kind != null)] as $r | ($r[] | select(.kind == "HelmRelease")).spec.valuesFrom[0].name == ($r[] | select(.kind == "ConfigMap" and (.metadata.name | test("^tamoss-gitops-values-")))).metadata.name', '$DIRECTORY/before.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-r, 'select(.kind == "HelmRelease").spec.valuesFrom[0].name', '$DIRECTORY/before.yaml']
            outputs:
              - name: beforeReference
                value: ($stdout)
        - command:
            entrypoint: yq
            env: *env
            args: [-e, '.tadoss.enabled == false and .tadoss.release.digest == load(strenv(DIRECTORY) + "/inputs/product.yaml").tadoss.bundle.digest', '$DIRECTORY/checkout/clusters/oci-dev/values.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-e, '.spec.managementPolicies | join(",") == "Observe"', '$DIRECTORY/checkout/clusters/oci-dev/infrastructure/environment.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.runtime.adminEmail = "changed@example.invalid"', '$DIRECTORY/checkout/clusters/oci-dev/values.yaml']
        - command: *export
        - command:
            entrypoint: kubectl
            env: *env
            args: [kustomize, '$DIRECTORY/checkout/clusters/oci-dev', -o, '$DIRECTORY/after.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-r, 'select(.kind == "HelmRelease").spec.valuesFrom[0].name', '$DIRECTORY/after.yaml']
            check:
              ($error == null): true
              ($stdout != $beforeReference): true
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.generatorOptions.disableNameSuffixHash = true', '$DIRECTORY/checkout/clusters/oci-dev/kustomization.yaml']
        - command:
            entrypoint: env
            env: *env
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:ready"]
            check:
              ($error != null): true
              (contains($stderr, 'content-hashed values references')): true
        - command:
            entrypoint: yq
            env: *env
            args: [-i, 'del(.generatorOptions.disableNameSuffixHash)', '$DIRECTORY/checkout/clusters/oci-dev/kustomization.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-e, '.runtime.adminEmail == "changed@example.invalid"', '$DIRECTORY/checkout/clusters/oci-dev/values.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.deploymentUID = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"', '$DIRECTORY/inputs/identity.yaml']
        - command:
            <<: *export
            check:
              ($error != null): true
              (contains($stderr, 'different deployment')): true
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.deploymentUID = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"', '$DIRECTORY/inputs/identity.yaml']
        - command:
            entrypoint: rm
            env: *env
            args: ['$DIRECTORY/checkout/clusters/oci-dev/infrastructure/environment.yaml']
        - command:
            <<: *export
            check:
              ($error != null): true
              (contains($stderr, 'incomplete')): true
    - name: mark the Git-owned fixture
      try:
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.gitopsEstablished = true', '$DIRECTORY/inputs/identity.yaml']
    - name: reject mismatched release sources without changing the installed record
      try:
        - command:
            entrypoint: cp
            env: *env
            args: ['$DIRECTORY/inputs/tamoss-release.yaml', '$DIRECTORY/inputs/tamoss-release.current.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.tag = "0.0.0-record-fixture"', '$DIRECTORY/inputs/tamoss-release.yaml']
        - command:
            entrypoint: cp
            env: *env
            args: ['$DIRECTORY/inputs/tamoss-release.yaml', '$DIRECTORY/inputs/initial-release.yaml']
        - command:
            entrypoint: cp
            env: *env
            args: ['$DIRECTORY/checkout/clusters/oci-dev/sources.yaml', '$DIRECTORY/inputs/expected-sources.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-i, 'with(select(.metadata.name == "tamoss-upstream"); .spec.ref.commit = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb")', '$DIRECTORY/checkout/clusters/oci-dev/sources.yaml']
        - command:
            entrypoint: env
            env: *env
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:record-release"]
            check: {($error != null): true}
        - command:
            entrypoint: cmp
            env: *env
            args: ['$DIRECTORY/inputs/initial-release.yaml', '$DIRECTORY/inputs/tamoss-release.yaml']
        - command:
            entrypoint: test
            env: *env
            args: ['!', -e, '$DIRECTORY/inputs/tamoss-release.bootstrap.yaml']
    - name: preserve the initial release when recording the current selection and retrying
      try:
        - command:
            entrypoint: cp
            env: *env
            args: ['$DIRECTORY/inputs/expected-sources.yaml', '$DIRECTORY/checkout/clusters/oci-dev/sources.yaml']
        - command:
            entrypoint: env
            env: *env
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:record-release"]
            check: {($error == null): true}
        - command:
            entrypoint: cmp
            env: *env
            args: ['$PROJECT_ROOT/deploy/tamoss/release.yaml', '$DIRECTORY/inputs/tamoss-release.yaml']
        - command:
            entrypoint: cmp
            env: *env
            args: ['$DIRECTORY/inputs/initial-release.yaml', '$DIRECTORY/inputs/tamoss-release.bootstrap.yaml']
        - command:
            entrypoint: cp
            env: *env
            args: ['$PROJECT_ROOT/deploy/tamoss/release.yaml', '$DIRECTORY/inputs/tamoss-release.current.yaml']
        - command:
            entrypoint: env
            env: *env
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops:record-release"]
            check: {($error == null): true}
        - command:
            entrypoint: cmp
            env: *env
            args: ['$DIRECTORY/inputs/initial-release.yaml', '$DIRECTORY/inputs/tamoss-release.bootstrap.yaml']
    - name: prepare the local seed before cloud outputs exist
      try:
        - command:
            entrypoint: rm
            env: *env
            args: [-rf, '$DIRECTORY/checkout/clusters/oci-dev', '$DIRECTORY/inputs/deployment']
        - command:
            entrypoint: rm
            env: *env
            args: ['$DIRECTORY/inputs/resources-current.yaml', '$DIRECTORY/inputs/outputs.json']
        - command:
            entrypoint: yq
            env: *env
            args: [-i, 'del(.creationCompositeUID)', '$DIRECTORY/inputs/identity.yaml']
        - command:
            <<: *export
            check: {($error == null): true}
        - command:
            entrypoint: yq
            env: *env
            args: [-e, '.databaseId == null and .vaultId == null and .runtime.publicIp == null and .runtime.loadBalancerSubnetId == null', '$DIRECTORY/checkout/clusters/oci-dev/values.yaml']
        - command:
            entrypoint: yq
            env: *env
            args: [-e, '.spec.adoption.creationCompositeUID == ("$" + "{CREATION_COMPOSITE_UID}") and (.spec.adoption.externalNames | length == 23)', '$DIRECTORY/checkout/clusters/oci-dev/infrastructure/environment.yaml']
        - command:
            entrypoint: helm
            env: *env
            args: [lint, $PROJECT_ROOT/charts/gitops-bootstrap, -f, '$DIRECTORY/checkout/clusters/oci-dev/values.yaml', --set, vaultId=ocid1.vault.oc1.fixture]
    - name: reject invalid desired settings before publishing or provisioning
      try:
        - command:
            entrypoint: rm
            env: *env
            args: [-rf, '$DIRECTORY/checkout/clusters/oci-dev', '$DIRECTORY/inputs/deployment']
        - command:
            entrypoint: yq
            env: *env
            args: [-i, '.acmeEmail = "invalid"', '$DIRECTORY/inputs/settings.yaml']
        - command:
            <<: *export
            check:
              ($error != null): true
              (contains($stdout, '/runtime/acmeEmail')): true
        - command:
            entrypoint: test
            env: *env
            args: ['!', -d, '$DIRECTORY/checkout/clusters/oci-dev']
