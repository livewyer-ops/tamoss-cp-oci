apiVersion: v1
kind: Namespace
metadata: {name: tamoss-infra}
---
apiVersion: v1
kind: Namespace
metadata: {name: tams}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: Bucket
metadata: {name: asset-probe, namespace: flux-system}
spec:
  interval: 10s
  provider: generic
  bucketName: REPLACE
  endpoint: REPLACE
  region: REPLACE
  prefix: REPLACE
  secretRef: {name: asset-reader}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: asset-probe, namespace: flux-system}
spec:
  interval: 10s
  path: REPLACE
  prune: true
  sourceRef: {kind: Bucket, name: asset-probe}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: asset-probe, namespace: flux-system}
spec:
  interval: 10s
  chart:
    spec:
      chart: REPLACE
      reconcileStrategy: Revision
      sourceRef: {kind: Bucket, name: asset-probe}
  values:
    runtime:
      databaseHost: database.example.invalid
      objectEndpoint: https://storage.example.invalid
      region: eu-frankfurt-1
      bucket: fixture
      ingestURI: s3://fixture/ingest.mp4
      postgresImage: fixture
      baseDomain: example.invalid
      apiHost: api.example.invalid
      uiHost: ui.example.invalid
      apiURL: https://api.example.invalid
      uiURL: https://ui.example.invalid
      issuerURL: https://auth.example.invalid
