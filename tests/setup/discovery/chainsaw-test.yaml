apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: setup-discovery}
spec:
  steps:
    - name: discover defaults using the selected profile without provisioning
      try:
        - command:
            entrypoint: mise
            env: &paths [{name: PROJECT_ROOT, value: ($values.root)}]
            args: [-C, $PROJECT_ROOT, run, test:setup:discovery:defaults]
            check:
              ($error == null): true
              (contains(join('', [$stdout, $stderr]), 'Enter compartmentId and contactEmail in')): true
    - name: preserve explicit settings and skip every supplied lookup
      try:
        - command:
            entrypoint: mise
            env: *paths
            args: [-C, $PROJECT_ROOT, run, test:setup:discovery:overrides]
    - name: fill partial settings and use separate fault domains in a single availability domain
      try:
        - command:
            entrypoint: mise
            env: *paths
            args: [-C, $PROJECT_ROOT, run, test:setup:discovery:partial]
    - name: retain the original inputs when a lookup fails
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=api, mise, -C, $PROJECT_ROOT, run, test:setup:discovery:failure]
            check: {($error != null): true}
        - command: &unchanged
            entrypoint: cmp
            env: *paths
            args: [$PROJECT_ROOT/.local/tmp/check/setup-discovery/environment/before.yaml, $PROJECT_ROOT/.local/tmp/check/setup-discovery/environment/values.yaml]
    - name: reject an ambiguous Default identity domain
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=domain, mise, -C, $PROJECT_ROOT, run, test:setup:discovery:failure]
            check: {($error != null): true}
        - command: *unchanged
    - name: reject a missing compatible image
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=image, mise, -C, $PROJECT_ROOT, run, test:setup:discovery:failure]
            check: {($error != null): true}
        - command: *unchanged
    - name: reject malformed public IPv4 discovery
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=ip, mise, -C, $PROJECT_ROOT, run, test:setup:discovery:failure]
            check: {($error != null): true}
        - command: *unchanged
    - name: refuse to change an existing deployment even when values are present
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=identity, mise, -C, $PROJECT_ROOT, run, test:setup:discovery:failure]
            check:
              ($error != null): true
              (contains($stderr, 'existing deployment')): true
        - command: *unchanged
    - name: accept the required settings as setup arguments
      try:
        - command:
            entrypoint: mise
            env: *paths
            args: [-C, $PROJECT_ROOT, run, test:setup:discovery:arguments]
            check:
              ($error == null): true
              (contains(join('', [$stdout, $stderr]), 'Settings are ready in')): true
    - name: pass preflight with complete settings and available tools
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=complete, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
    - name: skip GitHub checks for a public source
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=public, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
    - name: stop before deployment without settings
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=missing, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
            check:
              ($error != null): true
              (contains($stderr, 'No settings found')): true
    - name: stop before deployment with placeholder settings
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=placeholder, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
            check:
              ($error != null): true
              (contains($stderr, 'Enter compartmentId and contactEmail')): true
    - name: stop before deployment when Docker is unavailable
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=docker, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
            check:
              ($error != null): true
              (contains($stderr, 'Docker is not running')): true
    - name: stop before deployment without GitHub access to a private source
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=gh, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
            check:
              ($error != null): true
              (contains($stderr, 'Sign in to GitHub')): true
    - name: stop before deployment when the compartment is unreadable
      try:
        - command:
            entrypoint: env
            env: *paths
            args: [CASE=oci, mise, -C, $PROJECT_ROOT, run, test:setup:preflight]
            check:
              ($error != null): true
              (contains($stderr, 'cannot read the deployment compartment')): true
