{{ range $name, $url := dict "jetstack" "https://charts.jetstack.io" "traefik" "https://traefik.github.io/charts" "authentik" "https://charts.goauthentik.io" }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ $name }}
  namespace: flux-system
spec:
  interval: 1h
  url: {{ $url }}
{{ end }}
