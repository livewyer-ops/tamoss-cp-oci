apiVersion: v1
kind: ConfigMap
metadata: {name: tadoss-authentik-blueprint, namespace: {{ .Release.Namespace }}}
data:
  tadoss.yaml: |
    version: 1
    metadata: {name: tadoss}
    entries:
{{ range list "read" "write" "delete" "admin" }}
      - model: authentik_providers_oauth2.scopemapping
        id: scope-tads-api-{{ . }}
        state: present
        identifiers: {scope_name: tads-api/{{ . }}}
        attrs:
          name: TADOSS API {{ . }}
          scope_name: tads-api/{{ . }}
          expression: return {}
{{ end }}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        state: present
        identifiers: {name: tadoss}
        attrs:
          name: tadoss
          client_id: {{ required "clientId is required" .Values.clientId | quote }}
          client_secret: !Env TADOSS_CLIENT_SECRET
          client_type: confidential
          redirect_uris: []
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
{{ range list "read" "write" "delete" "admin" }}
            - !KeyOf scope-tads-api-{{ . }}
{{ end }}
      - model: authentik_core.application
        state: present
        identifiers: {slug: tadoss}
        attrs:
          name: TADOSS
          slug: tadoss
          provider: !KeyOf provider
