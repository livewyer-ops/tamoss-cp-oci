

["cloud:credentials"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ env.TASKV_CREDENTIAL_DIR | quote }} || { printf '%s\n' "Missing required input: CREDENTIAL_DIR" >&2; exit 1; }''',
  '''test -f '{{ env.TASKV_OCI_CONFIG }}' && test -z "$(find '{{ env.TASKV_OCI_CONFIG }}' -perm /077 -print)" || { printf '%s\n' "OCI config must have owner-only permissions" >&2; exit 1; }''',
  '''test -f '{{ env.TASKV_OCI_KEY_FILE }}' && test -z "$(find '{{ env.TASKV_OCI_KEY_FILE }}' -perm /077 -print)" || { printf '%s\n' "OCI key must exist and have owner-only permissions" >&2; exit 1; }''',
  '''yq -n -e 'strenv(OCI_KEY_FILE) | test("^/")' || { printf '%s\n' "OCI key_file must be an absolute path" >&2; exit 1; }''',
  '''yq -p=ini -e 'strenv(OCI_PROFILE) == "DEFAULT" or has(strenv(OCI_PROFILE))' {{ (env.TASKV_OCI_CONFIG) | quote }} || { printf '%s\n' "Selected OCI profile is missing" >&2; exit 1; }''',
  "mkdir -p -m 700 '{{ env.TASKV_CREDENTIAL_DIR }}'",
  "install -m 600 /dev/null '{{ env.TASKV_CREDENTIAL_DIR }}/credentials.json'",
  '''yq -p=ini -o=json '(. * (.[strenv(OCI_PROFILE)] // {})) | {"auth": "ApiKey", "tenancy_ocid": .tenancy, "user_ocid": .user, "fingerprint": .fingerprint, "region": .region, "private_key": load_str(strenv(OCI_KEY_FILE)), "private_key_password": .pass_phrase} | with_entries(select(.value != null))' {{ (env.TASKV_OCI_CONFIG) | quote }} > '{{ env.TASKV_CREDENTIAL_DIR }}/credentials.json'''',
  "cp deploy/credentials/kustomization.yaml deploy/credentials/namespace.yaml '{{ env.TASKV_CREDENTIAL_DIR }}/'",
  "yq -i '.resources = []' {{ env.TASKV_CREDENTIAL_DIR }}/kustomization.yaml",
]
env.TASKV_CREDENTIAL_DIR = '''{{ env.CREDENTIAL_DIR | default(value="") }}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.TASKV_OCI_KEY_FILE = '''{% if env.OCI_KEY_FILE is defined %}{{ env.OCI_KEY_FILE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "OCI_PROFILE=" ~ ((env.TASKV_OCI_PROFILE) | quote) ~ " yq -p=ini -oy -r '(. * (.[strenv(OCI_PROFILE)] // {})).key_file' " ~ ((env.TASKV_OCI_CONFIG) | quote)) }}{% endif %}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"
env.OCI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"
env.OCI_KEY_FILE = "{{ env.TASKV_OCI_KEY_FILE }}"

["cloud:storage-run:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_OCI_TEST_COMPARTMENT_ID | quote }} || { printf '%s\n' "Missing required input: OCI_TEST_COMPARTMENT_ID" >&2; exit 1; }''',
  '''CREDENTIAL_DIR={{ ((vars.STORAGE_DIR) ~ "/credentials") | quote }} MANAGEMENT_KUBECONFIG={{ ((vars.STORAGE_DIR) ~ "/management.kubeconfig") | quote }} mise run cloud:credentials''',
  "cp environments/example/provider.yaml '{{ vars.STORAGE_DIR }}/credentials/'",
  '''yq -i '.resources += ["namespace.yaml", "provider.yaml"]' {{ vars.STORAGE_DIR }}/credentials/kustomization.yaml''',
  "kubectl --kubeconfig '{{ vars.STORAGE_DIR }}/management.kubeconfig' apply --server-side -k '{{ vars.STORAGE_DIR }}/credentials'",
  "KUBECONFIG='{{ vars.STORAGE_DIR }}/management.kubeconfig' chainsaw test --skip-delete --exec-timeout 600s --test-dir tests/storage --values '{{ vars.STORAGE_DIR }}/values.yaml' --set-string root='{{ vars.ROOT_DIR }}' --set-string directory='{{ vars.STORAGE_DIR }}' --report-format JUNIT-TEST --report-path .local/reports --report-name storage",
  "mise run cloud:storage-cleanup",
  "echo 'Storage lifecycle check passed and cleanup was verified.'",
]
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.TASKV_OCI_TEST_COMPARTMENT_ID = '''{{ env.OCI_TEST_COMPARTMENT_ID | default(value="") }}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"
depends_post = ["cloud:storage-run:cleanup"]

["cloud:storage-run:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_OCI_TEST_COMPARTMENT_ID | quote }} || { printf '%s\n' "Missing required input: OCI_TEST_COMPARTMENT_ID" >&2; exit 1; }''',
  "rm -f '{{ vars.STORAGE_DIR }}/credentials/credentials.json'",
]
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.TASKV_OCI_TEST_COMPARTMENT_ID = '''{{ env.OCI_TEST_COMPARTMENT_ID | default(value="") }}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-run"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_OCI_TEST_COMPARTMENT_ID | quote }} || { printf '%s\n' "Missing required input: OCI_TEST_COMPARTMENT_ID" >&2; exit 1; }''',
  '''test ! -e '{{ vars.STORAGE_DIR }}/values.yaml' && test ! -e '{{ vars.STORAGE_DIR }}/management.kubeconfig' || { printf '%s\n' "A previous storage run is retained; run mise run check:storage:cleanup before retrying" >&2; exit 1; }''',
  '''yq -n -e '"{{ env.TASKV_OCI_TEST_COMPARTMENT_ID }}" | test("^ocid1\\.(compartment|tenancy)\\.")' || { printf '%s\n' "Set the authorised test compartment OCID" >&2; exit 1; }''',
  "mkdir -p -m 700 '{{ vars.STORAGE_DIR }}' '{{ vars.ROOT_DIR }}/.local/reports'",
  "mise run cloud:storage-context",
  "{{ env.TASKV_OCI }} os ns get --query data --raw-output > {{ vars.STORAGE_DIR }}/namespace.txt",
  '''{{ env.TASKV_OCI }} os bucket list --compartment-id {{ (env.TASKV_OCI_TEST_COMPARTMENT_ID) | quote }} --namespace-name "$(cat {{ vars.STORAGE_DIR }}/namespace.txt)" --all > {{ vars.STORAGE_DIR }}/baseline.json''',
  '''yq -i '. // {"data": []}' {{ vars.STORAGE_DIR }}/baseline.json''',
  "install -m 600 /dev/null '{{ vars.STORAGE_DIR }}/values.yaml'",
  '''yq -n '{"compartmentId": "{{ env.TASKV_OCI_TEST_COMPARTMENT_ID }}", "objectNamespace": (load_str("{{ vars.STORAGE_DIR }}/namespace.txt") | trim), "bucketName": "{{ env.TASKV_CHECK_NAME }}", "oci": load("{{ vars.STORAGE_DIR }}/oci-current.yaml")}' > '{{ vars.STORAGE_DIR }}/values.yaml'''',
  '''yq -e '[.data[] | select(.name == "{{ env.TASKV_CHECK_NAME }}")] | length == 0' {{ vars.STORAGE_DIR }}/baseline.json''',
  "kind create cluster --name '{{ env.TASKV_CHECK_NAME }}' --config deploy/management/kind.yaml --kubeconfig '{{ vars.STORAGE_DIR }}/management.kubeconfig' --wait 120s",
  '''MANAGEMENT_KUBECONFIG={{ ((vars.STORAGE_DIR) ~ "/management.kubeconfig") | quote }} mise run management:install''',
  "OCI_CONFIG={{ env.TASKV_OCI_CONFIG | quote }} OCI_PROFILE={{ env.TASKV_OCI_PROFILE | quote }} OCI={{ env.TASKV_OCI | quote }} CHECK_NAME={{ env.TASKV_CHECK_NAME | quote }} mise run cloud:storage-run:protected",
]
env.TASKV_CHECK_NAME = '''{% if env.CHECK_NAME is defined %}{{ env.CHECK_NAME }}{% else %}tamoss-cp-storage-{{ now() | date(format="%s") }}{% endif %}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.TASKV_OCI_TEST_COMPARTMENT_ID = '''{{ env.OCI_TEST_COMPARTMENT_ID | default(value="") }}'''
env.TASKV_OCI = "{% if env.OCI is defined %}{{ env.OCI }}{% else %}oci --config-file {{ (env.TASKV_OCI_CONFIG) | quote }} --profile {{ (env.TASKV_OCI_PROFILE) | quote }} --connection-timeout 10 --read-timeout 30 --max-retries 0{% endif %}"
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-context"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''yq -p=ini -oy '(. * (.[strenv(OCI_PROFILE)] // {})) | {"tenancy": .tenancy, "user": .user, "fingerprint": .fingerprint, "region": .region}' {{ (env.TASKV_OCI_CONFIG) | quote }} > '{{ vars.STORAGE_DIR }}/oci-current.yaml'''',
  '''yq -e '[.tenancy, .user, .fingerprint, .region] | all_c((. != null) and (. != ""))' '{{ vars.STORAGE_DIR }}/oci-current.yaml' > /dev/null''',
]
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"
env.OCI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -s '{{ vars.STORAGE_DIR }}/values.yaml' && test -s '{{ vars.STORAGE_DIR }}/baseline.json' || { printf '%s\n' "No complete storage probe record; retain any Kind state and establish ownership before cleanup" >&2; exit 1; }''',
  "mise run cloud:storage-context",
  '''yq -e 'load("{{ vars.STORAGE_DIR }}/oci-current.yaml") as $current | [(.oci.tenancy == $current.tenancy), (.oci.user == $current.user), (.oci.fingerprint == $current.fingerprint), (.oci.region == $current.region), (.bucketName | test("^tamoss-cp-[a-z0-9-]+$"))] | all' '{{ vars.STORAGE_DIR }}/values.yaml' > /dev/null''',
  "CHECK_NAME={{ ((env.TASKV_CHECK_NAME)) | quote }} mise run cloud:storage-remove",
  '''{{ env.TASKV_OCI }} os bucket list --compartment-id "$(yq -r .compartmentId '{{ vars.STORAGE_DIR }}/values.yaml')" --namespace-name "$(yq -r .objectNamespace '{{ vars.STORAGE_DIR }}/values.yaml')" --all > '{{ vars.STORAGE_DIR }}/after.json'''',
  "mise run cloud:storage-audit",
  "kind delete cluster --name '{{ env.TASKV_CHECK_NAME }}'",
  "rm -f '{{ vars.STORAGE_DIR }}/management.kubeconfig' '{{ vars.STORAGE_DIR }}/observed.kubeconfig' '{{ vars.STORAGE_DIR }}/credentials/credentials.json'",
  "mkdir -p -m 700 '{{ vars.ROOT_DIR }}/.local/reports/storage'",
  "mv '{{ vars.STORAGE_DIR }}' '{{ vars.ROOT_DIR }}/.local/reports/storage/{{ env.TASKV_CHECK_NAME }}'",
  "echo 'Storage probe deletion verified; its records are archived under .local/reports/storage.'",
]
env.TASKV_CHECK_NAME = '''{% if env.CHECK_NAME is defined %}{{ env.CHECK_NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -e -r .bucketName " ~ ((vars.STORAGE_DIR) | quote) ~ "/values.yaml") }}{% endif %}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.TASKV_OCI = "{% if env.OCI is defined %}{{ env.OCI }}{% else %}oci --config-file {{ (env.TASKV_OCI_CONFIG) | quote }} --profile {{ (env.TASKV_OCI_PROFILE) | quote }} --connection-timeout 10 --read-timeout 30 --max-retries 0{% endif %}"
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-remove:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(docker ps -aq --filter "label=io.x-k8s.kind.cluster=${TASKV_CHECK_NAME}" | wc -c | xargs test 0 -eq)'''
run = [
  "install -m 600 /dev/null '{{ vars.STORAGE_DIR }}/observed.kubeconfig'",
  "kind get kubeconfig --name '{{ env.TASKV_CHECK_NAME }}' > '{{ vars.STORAGE_DIR }}/observed.kubeconfig'",
  '''yq -e 'load("{{ vars.STORAGE_DIR }}/observed.kubeconfig") as $current | [((.clusters | length) == 1), (($current.clusters | length) == 1), (.clusters[0].name == $current.clusters[0].name), (.clusters[0].cluster.server == $current.clusters[0].cluster.server), (.clusters[0].cluster."certificate-authority-data" == $current.clusters[0].cluster."certificate-authority-data")] | all' '{{ vars.STORAGE_DIR }}/management.kubeconfig' > /dev/null''',
  "mise run cloud:storage-remove-bucket",
]
env.TASKV_CHECK_NAME = '''{{ env.CHECK_NAME | default(value="") }}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-remove"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_CHECK_NAME | quote }} || { printf '%s\n' "Missing required input: CHECK_NAME" >&2; exit 1; }''',
  "mise run cloud:storage-remove:apply",
]
env.TASKV_CHECK_NAME = '''{{ env.CHECK_NAME | default(value="") }}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-remove-bucket"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(kubectl --kubeconfig '{{ vars.STORAGE_DIR }}/management.kubeconfig' get crd buckets.objectstorage.oci.m.upbound.io --ignore-not-found -o json | yq -e 'length == 0' > /dev/null)"
run = [
  "kubectl --kubeconfig '{{ vars.STORAGE_DIR }}/management.kubeconfig' -n tamoss-infra get bucket.objectstorage.oci.m.upbound.io storage-check --ignore-not-found -o json > '{{ vars.STORAGE_DIR }}/bucket.json'",
  '''yq -e '(length == 0) or ([(.spec.forProvider.name == load("{{ vars.STORAGE_DIR }}/values.yaml").bucketName), (.spec.forProvider.compartmentId == load("{{ vars.STORAGE_DIR }}/values.yaml").compartmentId), (.spec.forProvider.namespace == load("{{ vars.STORAGE_DIR }}/values.yaml").objectNamespace), (.spec.forProvider.freeformTags.purpose == "storage-lifecycle-check")] | all)' '{{ vars.STORAGE_DIR }}/bucket.json' > /dev/null''',
  "helmfile --kubeconfig '{{ vars.STORAGE_DIR }}/management.kubeconfig' -f deploy/storage-check/helmfile.yaml.gotmpl --state-values-file '{{ vars.STORAGE_DIR }}/values.yaml' destroy",
  "kubectl --kubeconfig '{{ vars.STORAGE_DIR }}/management.kubeconfig' -n tamoss-infra delete bucket.objectstorage.oci.m.upbound.io storage-check --ignore-not-found --wait=true --timeout=300s",
]
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:storage-audit"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''yq -i '. // {"data": []}' {{ vars.STORAGE_DIR }}/after.json''',
  '''{% for item in ["baseline", "after"] %}
yq -e '.data | tag == "!!seq"' {{ vars.STORAGE_DIR }}/{{ item }}.json > /dev/null
{% endfor %}''',
  '''yq -e '[.data[] | select(.name == load("{{ vars.STORAGE_DIR }}/values.yaml").bucketName)] | length == 0' {{ vars.STORAGE_DIR }}/after.json''',
  "yq -r '.data[] | [.name, .id] | @tsv' {{ vars.STORAGE_DIR }}/baseline.json | sort > {{ vars.STORAGE_DIR }}/baseline-names.txt",
  "yq -r '.data[] | [.name, .id] | @tsv' {{ vars.STORAGE_DIR }}/after.json | sort > {{ vars.STORAGE_DIR }}/after-names.txt",
  "diff -u '{{ vars.STORAGE_DIR }}/baseline-names.txt' '{{ vars.STORAGE_DIR }}/after-names.txt'",
]
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:inventory"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_INVENTORY_DIR | quote }} || { printf '%s\n' "Missing required input: INVENTORY_DIR" >&2; exit 1; }''',
  "mkdir -p -m 700 '{{ env.TASKV_INVENTORY_DIR }}'",
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/deploy/oci/inventory.yaml") %}
{{ env.TASKV_OCI }} {{ item.command }} --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --all > {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ENV_DIR ~ "/environment.yaml") | get(key="spec") | get(key="oke") | get(key="placements") | map(attribute="availabilityDomain") | unique %}
{{ env.TASKV_OCI }} bv boot-volume list --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --availability-domain {{ (item) | quote }} --all > {{ env.TASKV_INVENTORY_DIR }}/boot-volumes-{{ (item) | hash }}.json
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/deploy/oci/inventory.yaml") %}
yq -i '. // {"data": []}' {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/deploy/oci/inventory.yaml") %}
yq -r '(.data | (select(tag == "!!seq"), (select(tag == "!!map") | .items))) // [] | .[] | select(."lifecycle-state" != "DELETED" and ."lifecycle-state" != "TERMINATED") | .id // .name' {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json | sort > {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json.ids
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ENV_DIR ~ "/environment.yaml") | get(key="spec") | get(key="oke") | get(key="placements") | map(attribute="availabilityDomain") | unique %}
yq -r '(.data // [])[] | select(."lifecycle-state" != "TERMINATED") | .id' {{ env.TASKV_INVENTORY_DIR }}/boot-volumes-{{ (item) | hash }}.json | sort > {{ env.TASKV_INVENTORY_DIR }}/boot-volumes-{{ (item) | hash }}.json.ids
{% endfor %}''',
  "touch '{{ env.TASKV_INVENTORY_DIR }}/.complete'",
]
env.TASKV_COMPARTMENT = '''{% if env.COMPARTMENT is defined %}{{ env.COMPARTMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.compartmentId " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''
env.TASKV_INVENTORY_DIR = '''{{ env.INVENTORY_DIR | default(value="") }}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
env.TASKV_OCI = "{% if env.OCI is defined %}{{ env.OCI }}{% else %}oci --config-file {{ (env.TASKV_OCI_CONFIG) | quote }} --profile {{ (env.TASKV_OCI_PROFILE) | quote }} --connection-timeout 10 --read-timeout 30 --max-retries 0{% endif %}"
env.OCI_CLI_CONFIG_FILE = "{{ env.TASKV_OCI_CONFIG }}"
env.OCI_CLI_PROFILE = "{{ env.TASKV_OCI_PROFILE }}"

["cloud:audit"]
hide = true
run = [
  "INVENTORY_DIR='{{ vars.ENV_DIR }}/inventory-after' mise run cloud:inventory",
