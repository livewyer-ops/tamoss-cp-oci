apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: calico, namespace: tamoss-infra}
spec:
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  interval: 10m
  timeout: 5m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product, namespace: tamoss-infra}
  path: ./upstream/calico
  healthChecks:
    - {apiVersion: apps/v1, kind: DaemonSet, name: calico-node, namespace: kube-system}
  patches:
    - target: {kind: DaemonSet, name: calico-node}
      patch: |
{{ .Files.Get "files/calico-oci.yaml" | indent 8 }}
