{{- $r := deepCopy .Values.runtime -}}
{{- $domain := printf "%s.sslip.io" (replace "." "-" $r.publicIp) -}}
{{- $_ := set $r "authHost" (printf "auth.%s" $domain) -}}
{{- $_ := set $r "databaseHost" "pending.invalid" -}}
{{- $_ := required "Supply the pinned upstream platform defaults through valuesFrom" .Values.authentikChart -}}
{{- $context := dict "Values" (dict "runtime" $r) -}}
{{- $platform := mergeOverwrite (deepCopy .Values) (tpl (.Files.Get "files/platform-values.yaml.gotmpl") $context | fromYaml) -}}
{{- $bom := .Values.dependencies.platform -}}
{{- $releases := list
  (dict "name" "cert-manager" "namespace" "cert-manager" "chart" "cert-manager" "source" "jetstack" "version" $bom.certManager.chartVersion "values" (index $platform "cert-manager"))
  (dict "name" "traefik" "namespace" "traefik" "chart" "traefik" "source" "traefik" "version" $bom.traefik.chartVersion "values" $platform.traefik)
  (dict "name" "authentik-bootstrap" "namespace" "auth" "chart" "./deploy/platform/charts/authentik-bootstrap" "values" (dict "authentik" $platform.authentik "authentikChart" $platform.authentikChart) "secret" "authentik-values" "connection" true "needs" (list (dict "name" "tamoss-secrets" "namespace" "auth") (dict "name" "tamoss-database-connection" "namespace" "auth")))
  (dict "name" "tamoss-database-connection" "namespace" "auth" "product" true "chart" "./charts/database-connection" "values" (dict "databaseId" .Values.databaseId "region" .Values.region "refreshRevision" .Values.databaseRefreshRevision "images" .Values.connectionImages))
  (dict "name" "tamoss-database-init" "namespace" "auth" "product" true "chart" "./deploy/tamoss/database/chart" "values" dict "connection" true "needs" (list (dict "name" "authentik-bootstrap" "namespace" "auth") (dict "name" "tamoss-database-connection" "namespace" "auth")))
  (dict "name" "authentik" "namespace" "auth" "chart" "authentik" "source" "authentik" "version" $bom.authentik.chartVersion "values" $platform.authentikChart "connection" true "needs" (list (dict "name" "tamoss-database-init" "namespace" "auth")))
  (dict "name" "tamoss-platform-config" "namespace" "tamoss-platform" "chart" "./deploy/platform/charts/config" "values" (dict "authentik" $platform.authentik "authentikChart" $platform.authentikChart "tls" $platform.tls "clusterIssuer" $platform.clusterIssuer) "needs" (list (dict "name" "cert-manager" "namespace" "cert-manager") (dict "name" "authentik" "namespace" "auth"))) -}}
{{ range $releases }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  interval: 10m
  timeout: 15m
  releaseName: {{ .name }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
{{ with .needs }}
  dependsOn:
{{ . | toYaml | indent 4 }}
{{ end }}
  chart:
    spec:
      chart: {{ .chart }}
{{ if .source }}
      version: {{ .version | quote }}
      sourceRef: {kind: HelmRepository, name: {{ .source }}, namespace: flux-system}
{{ else }}
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: {{ ternary "tamoss-product" "tamoss-upstream" (.product | default false) }}, namespace: flux-system}
{{ end }}
{{ if or .secret .connection }}
  valuesFrom:
{{ if .secret }}
    - {kind: Secret, name: {{ .secret }}, valuesKey: values.yaml}
{{ end }}
{{ if .connection }}
    - kind: ConfigMap
      name: database-connection
      valuesKey: DATABASE_HOST
      targetPath: {{ if eq .name "authentik-bootstrap" }}authentikChart.authentik.postgresql.host{{ else }}{{ ternary "authentik.postgresql.host" "host" (eq .name "authentik") }}{{ end }}
{{ end }}
{{ end }}
  values:
{{ if eq .name "authentik" }}
{{- $_ := unset .values.authentik.postgresql "host" -}}
{{ end }}
{{ if .secret }}
{{- $_ := unset .values.authentikChart.authentik.postgresql "host" -}}
{{- $_ := unset .values.authentik "secretKey" -}}
{{- $_ := unset .values.authentik.bootstrap "password" -}}
{{- $_ := unset .values.authentik.bootstrap "token" -}}
{{- $_ := unset .values.authentik.postgresql "password" -}}
{{- $_ := unset .values.authentik.postgresql "postgresPassword" -}}
{{ end }}
{{ .values | toYaml | indent 4 }}
{{ end }}
