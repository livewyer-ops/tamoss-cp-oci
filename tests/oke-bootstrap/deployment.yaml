apiVersion: v1
kind: Secret
metadata: {name: proof-values, namespace: tamoss-infra}
stringData: {token: from-kind}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: proof-input, namespace: tamoss-infra}
data: {PROOF_VALUE: from-kind}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seed-proof
  namespace: tamoss-infra
  labels: {tamoss.livewyer.io/deployment-id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
spec:
  interval: 10s
  timeout: 30s
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  releaseName: seed-proof
  targetNamespace: seed-proof
  storageNamespace: seed-proof
  install: {createNamespace: true}
  chart:
    spec:
      chart: ./tests/oke-bootstrap/chart
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
  valuesFrom:
    - {kind: Secret, name: proof-values, valuesKey: token, targetPath: token}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oke-workload
  namespace: tamoss-infra
  labels: {tamoss.livewyer.io/deployment-id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
spec:
  interval: 10s
  timeout: 30s
  retryInterval: 5s
  prune: false
  deletionPolicy: Orphan
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
  path: ./tests/oke-bootstrap/workload
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: proof-input}]
  healthChecks:
    - {apiVersion: v1, kind: ConfigMap, name: remote-proof, namespace: seed-proof}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oke-ready
  namespace: tamoss-infra
  labels: {tamoss.livewyer.io/deployment-id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
spec:
  interval: 10s
  timeout: 30s
  retryInterval: 5s
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
  path: ./deploy/gitops/readiness
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: seed-proof, namespace: tamoss-infra}
    - {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, name: oke-workload, namespace: tamoss-infra}
