apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secret-delivery-render
spec:
  steps:
    - try:
        - command:
            entrypoint: chainsaw
            args: [assert, -r, ../../.local/tmp/check/runtime-access-list.yaml, -f, access.yaml, --timeout, 1s]
        - command:
            entrypoint: helm
            args: [template, access, ../../charts/runtime-access, -f, access-values.yaml, --set, "clusterId=ocid1.cluster.oc1..example' or 'x' = 'x"]
            check:
              ($error != null): true
        - command:
            entrypoint: chainsaw
            args: [assert, -r, ../../.local/tmp/check/secrets-list.yaml, -f, render.yaml, --timeout, 1s]
        - command:
            entrypoint: chainsaw
            args: [assert, -r, ../../.local/tmp/check/secrets-runtime-list.yaml, -f, runtime.yaml, --timeout, 1s]
        - command:
            entrypoint: chainsaw
            args: [assert, -r, ../../.local/tmp/check/foundation-ready-list.yaml, -f, foundation-render.yaml, --timeout, 1s]
        - command:
            entrypoint: helm
            args: [template, secrets, ../../charts/secrets, -f, values.yaml, --set, deploymentId=wrong]
            check:
              ($error != null): true
        - command:
            entrypoint: helm
            args: [template, secrets, ../../charts/secrets, -f, values.yaml, -f, runtime-values.yaml, --set, initialise=true]
            check:
              ($error != null): true
