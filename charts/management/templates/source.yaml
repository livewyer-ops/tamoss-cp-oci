apiVersion: v1
kind: Namespace
metadata: {name: tamoss-infra}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: Bucket
metadata: {name: {{ .Values.sourceName }}, namespace: tamoss-infra}
spec:
  interval: 1m
  timeout: 1m
  provider: generic
  bucketName: {{ required "assets.bucketName is required" .Values.assets.bucketName | quote }}
  endpoint: {{ required "assets.endpoint is required" .Values.assets.endpoint | quote }}
  region: {{ required "assets.region is required" .Values.assets.region | quote }}
  prefix: {{ .Values.assets.prefix | quote }}
  secretRef: {name: asset-reader}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: crossplane, namespace: tamoss-infra}
spec: {interval: 1h, url: 'https://charts.crossplane.io/stable'}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: external-secrets, namespace: tamoss-infra}
spec: {interval: 1h, url: 'https://charts.external-secrets.io'}
