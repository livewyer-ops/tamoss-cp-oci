apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [environment.yaml]
secretGenerator:
  - name: database-admin
    namespace: tamoss-infra
    literals: [passwordType=PLAIN_TEXT]
    files: [password=secrets/database-admin-password]
generatorOptions:
  disableNameSuffixHash: true
