{{- $compartment := .Values.compartmentId -}}
{{- $cluster := .Values.clusterId -}}
{{- $deliveries := dict "auth" (list "database-admin" "tams-database" "tadoss-database" "tadoss-oauth") "tams" (list "tams-database" "s3") "tads" (list "tadoss-database") -}}
{{ range $namespace, $names := $deliveries }}
---
apiVersion: identity.oci.m.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ $.Values.deploymentId }}-secrets-{{ $namespace }}
  namespace: {{ $.Release.Namespace }}
  labels:
    tamoss.livewyer.io/iam-role: runtime
    tamoss.livewyer.io/deployment-id: {{ $.Values.deploymentId | quote }}
spec:
  providerConfigRef: {kind: ProviderConfig, name: {{ $.Values.providerConfigName }}}
  forProvider:
    compartmentId: {{ $compartment }}
    name: {{ $.Values.deploymentId }}-secrets-{{ $namespace }}
    description: {{ printf "Read persisted credentials for %s" $namespace | quote }}
    freeformTags: {tamoss-deployment: {{ $.Values.deploymentId | quote }}}
    statements:
{{ range $names }}
      - {{ printf "Allow any-user to read secret-bundles in compartment id %s where all {request.principal.type = 'workload', request.principal.cluster_id = '%s', request.principal.namespace = '%s', request.principal.service_account = '%s', target.vault.id = '%s', target.secret.name = '%s-%s'}" $compartment $cluster $namespace "tamoss-vault" $.Values.vaultId $.Values.deploymentId . | quote }}
{{ end }}
{{ end }}
