apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: seed-proof, namespace: tamoss-infra}
spec:
  interval: 10s
  chart:
    spec:
      chart: ./chart
      sourceRef: {kind: Bucket, name: tamoss-product, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: deployment-ready, namespace: flux-system}
spec:
  interval: 10s
  timeout: 30s
  retryInterval: 5s
  prune: false
  sourceRef: {kind: Bucket, name: tamoss-product}
  path: ./readiness
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: seed-proof, namespace: tamoss-infra}
