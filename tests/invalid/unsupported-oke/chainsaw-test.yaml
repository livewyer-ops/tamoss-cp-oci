apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reject-unsupported-oke
spec:
  steps:
    - name: reject invalid configuration
      try:
        - command:
            entrypoint: crossplane
            env:
              - {name: CROSSPLANE_IMAGE, value: ($values.crossplaneImage)}
            args: [resource, validate, "../../../.local/tmp/check/schemas,../../../charts/environment/definition.yaml", ../../../.local/tmp/check/rejected-unsupported-oke.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --cache-dir=../../../.local/tmp/check/crossplane, --error-on-missing-schemas]
            check:
              ($error != null): true
              (contains($stdout, 'failure cases')): true
              (contains($stdout, 'should match')): true
