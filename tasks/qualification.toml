["qualification:browser-target"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get tamoss tamoss -o json | yq -p=json -e -r ' .status.auth.applicationSlug | select(length > 0)' > '{{ vars.ENV_DIR }}/browser-slug'",
  '''{% for item in ["browser.env", "browser-secrets.json"] %}
install -m 600 /dev/null '{{ vars.ENV_DIR }}/{{ item }}'
{% endfor %}''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n auth get secret authentik -o json | yq -p=json -o=json '.data | {"TEST_TAMOSS_AUTH_USER": (.AUTHENTIK_BOOTSTRAP_USERNAME | @base64d), "TEST_TAMOSS_AUTH_PASSWORD": (.AUTHENTIK_BOOTSTRAP_PASSWORD | @base64d)}' > '{{ vars.ENV_DIR }}/browser-secrets.json'''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get secret "$(kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get tamoss tamoss -o jsonpath='{.status.resolved.generatedSecrets.oauth2Credentials}')" -o json | yq -p=json -r '.data | {"TEST_TAMOSS_OAUTH_CLIENT_ID": (.TAMOSS_OAUTH_CLIENT_ID | @base64d), "TEST_TAMOSS_OAUTH_CLIENT_SECRET": (.TAMOSS_OAUTH_CLIENT_SECRET | @base64d)} * load("{{ vars.ENV_DIR }}/browser-secrets.json") | to_entries | .[] | .key + "=" + (.value | @sh)' > '{{ vars.ENV_DIR }}/browser.env'''',
  '''yq -r '.data | {"TEST_TARGET": "oci", "TEST_TAMOSS_API": .apiURL, "TEST_TAMOSS_UI": .uiURL, "TEST_TAMOSS_AUTH": .issuerURL, "TEST_TAMOSS_S3": .objectEndpoint, "TEST_TAMOSS_TOKEN": (load_str("{{ vars.ENV_DIR }}/api-token") | trim), "TEST_TAMOSS_UI_EXPECT_STATUS": "200,302", "TEST_TAMOSS_BROWSER_API_AVAILABLE": "true", "TEST_INSECURE_SKIP_TLS_VERIFY": "false", "TEST_TAMOSS_OAUTH2_ENABLED": "true", "TEST_TAMOSS_OAUTH_ISSUER": (.issuerURL + "/application/o/" + (load_str("{{ vars.ENV_DIR }}/browser-slug") | trim) + "/")} | to_entries | .[] | .key + "=" + (.value | @sh)' '{{ vars.ENV_DIR }}/instance/runtime.yaml' >> '{{ vars.ENV_DIR }}/browser.env'''',
]
