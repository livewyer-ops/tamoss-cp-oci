{{- if and .Values.files.foundation .Values.files.environmentDefinition .Values.files.pins -}}
{{- $_ := set .Values.files "seedValues" (include (print .Template.BasePath "/values.yaml") .) -}}
{{- $_ := set .Values.files "seedEnvironment" (include (print .Template.BasePath "/environment.yaml") .) -}}
{{- end -}}
{{- if .Values.files.seedValues }}
{{- $identity := .Values.files.identity | fromYaml -}}
{{- $assets := include "deployment.assets" . | fromYaml -}}
{{- $environment := .Values.files.environment | fromYaml }}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-distribution
  namespace: tamoss-infra
  labels:
    tamoss.livewyer.io/remote-bootstrap: 'true'
    tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}
spec:
  interval: 1h
  url: oci://ghcr.io/fluxcd/flux-manifests
  ref:
    digest: {{ (.Values.files.dependencies | fromYaml).flux.manifestsDigest | quote }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oke-flux
  namespace: tamoss-infra
  labels:
    tamoss.livewyer.io/remote-bootstrap: 'true'
    tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 10m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: OCIRepository, name: flux-distribution}
  path: ./
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  patches:
    - target:
        labelSelector: app.kubernetes.io/component in (image-reflector-controller,image-automation-controller,source-watcher)
      patch: |-
        $patch: delete
        apiVersion: v1
        kind: List
        metadata: {name: unused}
    - target: {kind: ClusterRoleBinding, name: crd-controller-flux-system}
      patch: |-
        - op: replace
          path: /subjects
          value:
            - {kind: ServiceAccount, name: source-controller, namespace: flux-system}
            - {kind: ServiceAccount, name: kustomize-controller, namespace: flux-system}
            - {kind: ServiceAccount, name: helm-controller, namespace: flux-system}
            - {kind: ServiceAccount, name: notification-controller, namespace: flux-system}
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: source-controller, namespace: flux-system}
    - {apiVersion: apps/v1, kind: Deployment, name: kustomize-controller, namespace: flux-system}
    - {apiVersion: apps/v1, kind: Deployment, name: helm-controller, namespace: flux-system}
    - {apiVersion: apps/v1, kind: Deployment, name: notification-controller, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oke-seed
  namespace: tamoss-infra
  labels:
    tamoss.livewyer.io/remote-bootstrap: 'true'
    tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: OCIRepository, name: tamoss-bootstrap-product}
  path: ./deploy/bootstrap/remote
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  dependsOn: [{name: oke-eso}]
  commonMetadata:
    labels:
      tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: oke-bootstrap-facts}]
  patches:
    - target: {kind: 'HelmRelease|Kustomization'}
      patch: |-
        - op: add
          path: /spec/commonMetadata
          value:
            labels: {tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}}
    - target: {kind: ConfigMap, name: tamoss-assets}
      patch: |
{{ .Values.files.assets | indent 8 }}
    - target: {kind: ConfigMap, name: tamoss-gitops-values}
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata: {name: tamoss-gitops-values, namespace: tamoss-infra}
        data:
          values.yaml: {{ .Values.files.seedValues | toJson }}
    - target: {kind: ConfigMap, name: infrastructure-intent}
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata: {name: infrastructure-intent, namespace: tamoss-infra}
        data:
          environment.yaml: {{ .Values.files.seedEnvironment | toJson }}
{{- range $name, $source := dict "tamoss-product" (dict "url" $assets.url "digest" $assets.digest) "tamoss-chart-gitops-bootstrap" (index $assets.charts "gitops-bootstrap") }}
    - target: {kind: OCIRepository, name: {{ $name }}}
      patch: |
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata: {name: {{ $name }}, namespace: flux-system}
        spec:
          url: {{ $source.url | quote }}
          ref: {digest: {{ $source.digest | quote }}}
{{- end }}
    - target: {kind: Kustomization, name: infrastructure}
      patch: |-
        - op: replace
          path: /spec/postBuild/substitute/ENVIRONMENT_NAME
          value: {{ $environment.metadata.name | quote }}
        - op: replace
          path: /spec/healthChecks/0/name
          value: {{ $environment.metadata.name | quote }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oke-eso
  namespace: tamoss-infra
  labels:
    tamoss.livewyer.io/remote-bootstrap: 'true'
    tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 10m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: OCIRepository, name: tamoss-bootstrap-product}
  path: ./deploy/bootstrap/eso
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  dependsOn: [{name: oke-flux}]
  commonMetadata:
    labels: {tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: oke-bootstrap-facts}]
  patches:
    - target: {kind: HelmRelease, name: external-secrets}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: external-secrets, namespace: external-secrets}
        spec:
          chart:
            spec:
              version: {{ ($.Values.files.assets | fromYaml).data.externalSecretsVersion | quote }}
    - target: {kind: ConfigMap, name: external-secrets-values}
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata: {name: external-secrets-values, namespace: external-secrets}
        data:
          values.yaml: {{ ($.Values.files.assets | fromYaml).data.externalSecretsValues | toJson }}
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: external-secrets, namespace: external-secrets}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oke-ready
  namespace: tamoss-infra
  labels:
    tamoss.livewyer.io/remote-bootstrap: 'true'
    tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 30m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: OCIRepository, name: tamoss-bootstrap-product}
  path: ./deploy/gitops/readiness
  kubeConfig:
    secretRef: {name: oke-bootstrap-access}
  dependsOn: [{name: oke-seed}]
  healthChecks:
    - {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, name: deployment-ready, namespace: flux-system}
  healthCheckExprs:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      current: >-
        (!has(spec.suspend) || !spec.suspend) &&
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.conditions) && status.conditions.exists(c,
        c.type == 'Ready' && c.status == 'True')
{{- end }}
