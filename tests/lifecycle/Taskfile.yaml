version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT_DIR: '{{.PROJECT_ROOT}}'
  CORE:
    sh: yq -r '"xpkg.crossplane.io/crossplane/crossplane:v" + .crossplane.version' '{{.PROJECT_ROOT}}/dependencies.yaml'
includes:
  identity: {taskfile: ../../tasks/identity.yaml, internal: true}
  application: {taskfile: ../../tasks/application.yaml, internal: true}
  lifecycle: {taskfile: ../../tasks/lifecycle.yaml, internal: true}
  cloud: {taskfile: ../../tasks/cloud.yaml, internal: true}
tasks:
  prepare:
    cmds:
      - mkdir -p -m 700 '{{.ENV_DIR}}'
      - cp environments/example/environment.yaml '{{.ENV_DIR}}/'
      - task: identity:observe-inputs
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: identity:initialise
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - cp '{{.MANAGEMENT_KUBECONFIG}}' '{{.ENV_DIR}}/management.kubeconfig'
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' get namespace kube-system -o jsonpath='{.metadata.uid}' > '{{.ENV_DIR}}/management-uid'
      - 'yq -i ''.managementUID = load_str("{{.ENV_DIR}}/management-uid")'' {{.ENV_DIR}}/identity.yaml'
      - cp '{{.MANAGEMENT_KUBECONFIG}}' '{{.ENV_DIR}}/remote.kubeconfig'
      - install -m 600 /dev/null '{{.ENV_DIR}}/exec-credential.json'
      - >-
        kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' config view --raw -o json |
        yq -p=json -o=json '{"apiVersion": "client.authentication.k8s.io/v1beta1", "kind": "ExecCredential",
        "status": {"clientCertificateData": (.users[0].user."client-certificate-data" | @base64d),
        "clientKeyData": (.users[0].user."client-key-data" | @base64d)}}' > '{{.ENV_DIR}}/exec-credential.json'
      - >-
        yq -i '.users[0].user = {"exec": {"apiVersion": "client.authentication.k8s.io/v1beta1", "command": "cat", "args": ["{{.ENV_DIR}}/exec-credential.json"]}}'
        '{{.ENV_DIR}}/remote.kubeconfig'
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' config view --minify -o jsonpath='{.clusters[0].cluster.server}' > '{{.ENV_DIR}}/remote-server'
      - 'yq -i ''.remoteUID = .managementUID | .remoteServer = load_str("{{.ENV_DIR}}/remote-server") | .clusterID = "{{.ENV_DIR}}/exec-credential.json"'' {{.ENV_DIR}}/identity.yaml'
      - cp '{{.ENV_DIR}}/identity.yaml' '{{.ENV_DIR}}/identity-valid.yaml'
  management:
    cmds:
      - task: identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  prepare-composite:
    cmds:
      - 'yq ''.metadata.annotations."tamoss.livewyer.io/deployment-id" = load("{{.ENV_DIR}}/identity.yaml").deploymentUID | .metadata.annotations."crossplane.io/paused" = "true"'' {{.ENV_DIR}}/environment.yaml > {{.ENV_DIR}}/composite-fixture.yaml'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' apply --server-side -f '{{.ENV_DIR}}/composite-fixture.yaml'
      - task: identity:record-composite
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - 'yq -e ''.creationCompositeUID == .compositeUID and .creationCompositeUID != null'' {{.ENV_DIR}}/identity.yaml'
      - cp '{{.ENV_DIR}}/identity.yaml' '{{.ENV_DIR}}/identity-valid.yaml'
  local-owner:
    cmds:
      - task: identity:local-owner
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  initialise:
    cmds:
      - task: identity:initialise
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  repeat-bootstrap:
    cmds:
      - task: identity:initialise
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - cmp '{{.ENV_DIR}}/identity-valid.yaml' '{{.ENV_DIR}}/identity.yaml'
      - task: lifecycle:create-management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: lifecycle:password
        vars: {ENV_DIR: '{{.ENV_DIR}}', DESTINATION: '{{.ENV_DIR}}/password'}
      - cp '{{.ENV_DIR}}/password' '{{.ENV_DIR}}/password.saved'
      - mkdir '{{.ENV_DIR}}/inventory-before'
      - touch '{{.ENV_DIR}}/inventory-before/.complete'
      - task: lifecycle:password
        vars: {ENV_DIR: '{{.ENV_DIR}}', DESTINATION: '{{.ENV_DIR}}/password'}
      - cmp '{{.ENV_DIR}}/password.saved' '{{.ENV_DIR}}/password'
      - task: lifecycle:baseline
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - 'yq -n ''[]'' > {{.ENV_DIR}}/owned-current.yaml'
      - task: cloud:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  remote:
    cmds:
      - task: identity:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  secrets:
    cmds:
      - mkdir -p -m 700 '{{.ENV_DIR}}/secrets'
      - for: [database-admin-password, tams-database-password, s3-access-key, s3-secret-key]
        cmd: install -m 600 '{{.PROJECT_ROOT}}/tests/lifecycle/oci-config' '{{.ENV_DIR}}/secrets/{{.ITEM}}'
      - for: [s3-access-key, s3-secret-key]
        cmd: printf '%s' fixture-credential > '{{.ENV_DIR}}/secrets/{{.ITEM}}'
      - cp '{{.PROJECT_ROOT}}/tests/lifecycle/oci-config' '{{.ENV_DIR}}/database-ca.pem'
      - task: application:secrets
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth get secret database-admin -o jsonpath='{.data.password}' | base64 --decode | cmp '{{.ENV_DIR}}/secrets/database-admin-password' -
  reject-secret-newline:
    cmds:
      - mkdir -p -m 700 '{{.ENV_DIR}}/invalid-credentials/secrets'
      - touch '{{.ENV_DIR}}/invalid-credentials/environment.yaml' '{{.ENV_DIR}}/invalid-credentials/settings.yaml'
      - 'yq -n ''{"runHours": 1, "cleanupHours": 1}'' > {{.ENV_DIR}}/invalid-credentials/cost.yaml'
      - cp '{{.ENV_DIR}}/secrets/s3-access-key' '{{.ENV_DIR}}/invalid-credentials/secrets/'
      - install -m 600 '{{.PROJECT_ROOT}}/tests/lifecycle/oci-config' '{{.ENV_DIR}}/invalid-credentials/secrets/s3-secret-key'
      - task: lifecycle:preflight
        vars: {ENV_DIR: '{{.ENV_DIR}}/invalid-credentials'}
  create-management:
    cmds:
      - task: lifecycle:create-management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  wait-deletion:
    cmds:
      - task: lifecycle:wait-deletion
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  remove-instance:
    cmds:
      - task: application:remove-instance
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  remove-operator:
    cmds:
      - mkdir -p '{{.ENV_DIR}}/operator-removal'
      - cp '{{.PROJECT_ROOT}}/.local/tmp/check/operator.yaml' '{{.ENV_DIR}}/operator-removal/rendered.yaml'
      - task: application:remove-operator
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
