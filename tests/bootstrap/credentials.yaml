apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-admin
  namespace: tamoss-infra
spec:
  secretStoreRef: {name: tamoss-vault, kind: SecretStore}
  target: {name: database-admin}
  data:
    - secretKey: password
      remoteRef: {key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-database-admin}
status:
  conditions:
    - {type: Ready, status: 'True'}
