apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth
resources: [namespace.yaml]
secretGenerator:
  - name: database-admin
    files: [password=database-admin-password]
  - name: tams-database
    literals: [username=tams]
    files: [password=tams-database-password]
configMapGenerator:
  - name: database-ca
    files: [ca.pem=database-ca.pem]
generatorOptions:
  disableNameSuffixHash: true
