{{ range $name, $url := dict "crossplane" "https://charts.crossplane.io/stable" }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ $name }}
  namespace: flux-system
spec:
  interval: 1h
  url: {{ $url }}
{{ end }}
{{- range $name := list "packages" "environment" "secrets" "gitops" "database-connection" "authentik-bootstrap" "tamoss-platform-config" "tamoss-database-init" "tadoss-config" }}
{{- $chart := index $.Values.assets.charts $name }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: tamoss-chart-{{ $name }}, namespace: flux-system}
spec:
  interval: 10m
  url: {{ $chart.url | quote }}
  ref: {digest: {{ $chart.digest | quote }}}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
{{- end }}
