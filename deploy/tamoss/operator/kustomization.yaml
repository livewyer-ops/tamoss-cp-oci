apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The checker copies this overlay beside the checksum-verified release asset.
resources:
  - install.yaml
  - pdb.yaml
images:
  - name: livewyer/tamoss-operator
    newName: docker.io/livewyer/tamoss-operator
patches:
  - target:
      kind: Deployment
      name: operator-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: operator-controller-manager
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        control-plane: controller-manager
                    topologyKey: kubernetes.io/hostname
