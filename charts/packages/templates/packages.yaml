{{- if .Values.family }}
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: oracle-provider-family-oci
spec:
  package: ghcr.io/oracle/provider-family-oci:{{ .Values.providerVersion }}
  revisionHistoryLimit: 1
{{- end }}
{{- if or .Values.services .Values.foundation }}
{{- $services := list }}
{{- if .Values.services }}
{{- $services = concat $services (list "networking" "containerengine" "psql" "objectstorage") }}
{{- end }}
{{- if .Values.foundation }}
{{- $services = concat $services (list "kms" "identity") }}
{{- end }}
{{- range $service := $services }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-oci-{{ $service }}
spec:
  package: ghcr.io/oracle/provider-oci-{{ $service }}:{{ $.Values.providerVersion }}
  revisionHistoryLimit: 1
{{- if $.Values.okeWorkloadIdentity.region }}
  runtimeConfigRef:
    name: provider-oci-{{ $service }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-oci-{{ $service }}
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-oci-{{ $service }}
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          automountServiceAccountToken: true
          containers:
            - name: package-runtime
              env:
                - name: OCI_RESOURCE_PRINCIPAL_VERSION
                  value: '2.2'
                - name: OCI_RESOURCE_PRINCIPAL_REGION
                  value: {{ $.Values.okeWorkloadIdentity.region | quote }}
                - name: OCI_RESOURCE_PRINCIPAL_WORKLOAD_IDENTITY
                  value: '1'
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.services }}
{{- range $name, $version := .Values.functions }}
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-{{ $name }}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-{{ $name }}:{{ $version }}
  revisionHistoryLimit: 1
{{- end }}
{{- end }}
