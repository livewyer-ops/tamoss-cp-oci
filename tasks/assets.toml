["assets:fetch"]
hide = true
run = [
  "test -z \"$(git status --porcelain)\" || { echo 'Deploy a clean, committed and pushed checkout.' >&2; exit 1; }",
  "install -d -m 700 '{{ vars.ENV_DIR }}'",
  '''ORIGIN="$(git remote get-url origin)" COMMIT="$(git rev-parse HEAD)" yq -n -e -o=json 'select(strenv(ORIGIN) | test("^(git@github.com:|https://github.com/|ssh://git@github.com/)")) | {"repository": (strenv(ORIGIN) | sub("^git@github.com:"; "") | sub("^https://github.com/"; "") | sub("^ssh://git@github.com/"; "") | sub("[.]git$"; "")), "commit": strenv(COMMIT), "private": (load("{{ vars.ENV_DIR }}/values.yaml").source.private == true)} | select(.repository | test("^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$")) | .url = ((select(.private) | "ssh://git@github.com/" + .repository + ".git") // ("https://github.com/" + .repository + ".git"))' > '{{ vars.ENV_DIR }}/source.json'''',
  '''source='{{ vars.ENV_DIR }}/source.json'
remote=origin
if yq -e '.private == false' "$source" > /dev/null 2>&1; then
  remote="$(yq -r .url "$source")"
fi
# Force a remote check even when HEAD is already present locally.
git fetch --refetch --no-tags "$remote" "$(yq -r .commit "$source")"''',
]

["assets:verify"]
hide = true
run = [
  '''test "$(git rev-parse HEAD)" = "$(yq -r .commit '{{ vars.ENV_DIR }}/source.json')" || { echo 'Use the recorded deployment revision for this environment.' >&2; exit 1; }''',
]

["assets:restore-runtime"]
hide = true
run = [
  { task = "assets:verify" },
  "cp '{{ vars.ROOT_DIR }}/deploy/tamoss/release.yaml' '{{ vars.ENV_DIR }}/tamoss-release.current.yaml'",
  "RELEASE_LOCK='{{ vars.ENV_DIR }}/tamoss-release.current.yaml' mise run tamoss:fetch",
]
