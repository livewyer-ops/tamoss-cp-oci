apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: operational-chart-dependencies}
spec:
  steps:
    - name: build local library dependencies from the product source
      try:
        - apply:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: operation-connection-check, namespace: tamoss-infra}
              spec:
                interval: 1m
                chart: ./charts/database-connection
                reconcileStrategy: Revision
                sourceRef: {kind: Bucket, name: tamoss-bootstrap-product}
        - apply:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: operation-retirement-check, namespace: tamoss-infra}
              spec:
                interval: 1m
                chart: ./charts/secret-retirement
                reconcileStrategy: Revision
                sourceRef: {kind: Bucket, name: tamoss-bootstrap-product}
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: operation-connection-check, namespace: tamoss-infra}
              (status.observedGeneration == metadata.generation): true
              (status.observedSourceArtifactRevision == x_k8s_get($client, 'source.toolkit.fluxcd.io/v1', 'Bucket', 'tamoss-infra', 'tamoss-bootstrap-product').status.artifact.revision): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: operation-retirement-check, namespace: tamoss-infra}
              (status.observedGeneration == metadata.generation): true
              (status.observedSourceArtifactRevision == x_k8s_get($client, 'source.toolkit.fluxcd.io/v1', 'Bucket', 'tamoss-infra', 'tamoss-bootstrap-product').status.artifact.revision): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - apply:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: operation-s3-check, namespace: tamoss-infra}
              spec:
                interval: 1m
                chart: ./charts/secrets
                reconcileStrategy: Revision
                sourceRef: {kind: Bucket, name: tamoss-bootstrap-product}
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: operation-s3-check, namespace: tamoss-infra}
              (status.observedGeneration == metadata.generation): true
              (status.observedSourceArtifactRevision == x_k8s_get($client, 'source.toolkit.fluxcd.io/v1', 'Bucket', 'tamoss-infra', 'tamoss-bootstrap-product').status.artifact.revision): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
