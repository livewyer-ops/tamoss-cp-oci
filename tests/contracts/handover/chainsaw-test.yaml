apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: handover-completion}
spec:
  timeouts: {exec: 30s}
  steps:
    - name: resume each interrupted ownership boundary
      try:
        - command: &prepare
            entrypoint: task
            env: &paths
              - {name: PROJECT_ROOT, value: ($values.root)}
            args: [prepare]
        - command: &interrupted
            entrypoint: task
            env: *paths
            args: [run, STOP_AT=before-promotion]
            check: &interruption
              ($error != null): true
              (contains($stderr, 'Injected interruption')): true
        - command: &incomplete
            entrypoint: task
            env: *paths
            args: [incomplete]
        - command: &resume
            entrypoint: task
            env: *paths
            args: [run]
        - command: &complete
            entrypoint: task
            env: *paths
            args: [complete]
        - command: *prepare
        - command:
            entrypoint: task
            env: *paths
            args: [run, STOP_AT=after-iam]
            check: *interruption
        - command: *incomplete
        - command: *resume
        - command: *complete
        - command: *prepare
        - command:
            entrypoint: task
            env: *paths
            args: [run, STOP_AT=after-publication]
            check: *interruption
        - command: *incomplete
        - command: *resume
        - command: *complete
        - command: *prepare
        - command:
            entrypoint: task
            env: *paths
            args: [run, STOP_AT=before-stop]
            check: *interruption
        - command: *incomplete
        - command: *resume
        - command: *complete
    - name: repeat observes readiness without restarting Kind or publishing again
      try:
        - command: *prepare
        - command: *resume
        - command: *complete
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 1', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command:
            entrypoint: task
            env: *paths
            args: [repeat]
    - name: failed readiness cannot complete handover and is checked again on repeat
      try:
        - command: *prepare
        - command: &unhealthy
            entrypoint: yq
            env: *paths
            args: [-i, '.unhealthy = true', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: &failed
            <<: *resume
            check: {($error != null): true}
        - command: *incomplete
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, 'del(.unhealthy)', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: *resume
        - command: *complete
        - command: *unhealthy
        - command: *failed
