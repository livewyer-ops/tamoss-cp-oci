["assets:fetch"]
hide = true
run = [
  "test -z \"$(git status --porcelain)\" || { echo 'Deploy a clean, committed and pushed checkout.' >&2; exit 1; }",
  "install -d -m 700 '{{ vars.ENV_DIR }}'",
  '''ORIGIN="$(git remote get-url origin)" COMMIT="$(git rev-parse HEAD)" yq -n -e -o=json 'select(strenv(ORIGIN) | test("^(git@github.com:|https://github.com/|ssh://git@github.com/)")) | {"repository": (strenv(ORIGIN) | sub("^git@github.com:"; "") | sub("^https://github.com/"; "") | sub("^ssh://git@github.com/"; "") | sub("[.]git$"; "")), "commit": strenv(COMMIT), "private": (load("{{ vars.ENV_DIR }}/values.yaml").source.private != false)} | select(.repository | test("^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$")) | .url = ((select(.private) | "ssh://git@github.com/" + .repository + ".git") // ("https://github.com/" + .repository + ".git"))' > '{{ vars.ENV_DIR }}/source.json'''',
  '''git fetch --no-tags origin "$(yq -r .commit '{{ vars.ENV_DIR }}/source.json')"''',
]

["assets:verify"]
hide = true
run = [
  '''test "$(git rev-parse HEAD)" = "$(yq -r .commit '{{ vars.ENV_DIR }}/source.json')" || { echo 'Use the recorded deployment revision for this environment.' >&2; exit 1; }''',
]

