
["gitops:attach:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(yq -e '.gitopsEstablished == true' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:configure",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:export",
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} MESSAGE={{ ("feat: adopt the deployed environment") | quote }} FILES={{ ("values.yaml sources.yaml infrastructure/environment.yaml releases.yaml namespaces.yaml kustomization.yaml kustomizeconfig.yaml") | quote }} mise run gitops:publish''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:github-bootstrap",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run gitops:persist-key",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:enable-key-delivery",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:git-ready",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run gitops:verify-key",
  "yq -i '.gitopsEstablished = true' {{ vars.ENV_DIR }}/identity.yaml",
]

["gitops:attach"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "mise run gitops:attach:apply",
]

["gitops:configure"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test -s {{ vars.ENV_DIR }}/gitops.yaml && yq -e '[(.owner | test("^[a-zA-Z0-9][a-zA-Z0-9-]*$")), .owner != "REPLACE", (.repository // "tamoss-environments" | test("^[a-zA-Z0-9][a-zA-Z0-9_.-]*$")), (.branch // "main" | test("^[a-zA-Z0-9][a-zA-Z0-9/_.-]*$")), (.path // ("clusters/" + load("{{ vars.ENV_DIR }}/identity.yaml").environment.name) | test("^clusters/[a-z][a-z0-9-]*$"))] | all' {{ vars.ENV_DIR }}/gitops.yaml > /dev/null || { printf '%s\n' "Set the GitHub owner in gitops.yaml; repository, branch and cluster path have defaults" >&2; exit 1; }''',
  '''test ! -e '{{ vars.ENV_DIR }}/gitops-setup.yaml' || cmp --silent '{{ vars.ENV_DIR }}/gitops.yaml' '{{ vars.ENV_DIR }}/gitops-setup.yaml' || { printf '%s\n' "Git attachment has started; retain the recorded repository and path" >&2; exit 1; }''',
  "gh auth status --hostname github.com",
  "gh auth setup-git --hostname github.com",
  '''yq -i '.repository = (.repository // "tamoss-environments") | .branch = (.branch // "main") | .path = (.path // ("clusters/" + load("{{ vars.ENV_DIR }}/identity.yaml").environment.name)) | .url = ("https://github.com/" + .owner + "/" + .repository)' '{{ vars.ENV_DIR }}/gitops.yaml'''',
  "install -m 600 '{{ vars.ENV_DIR }}/gitops.yaml' '{{ vars.ENV_DIR }}/gitops-setup.yaml'",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run gitops:repository",
  '''gh repo view "$(yq -r '.owner + "/" + .repository' '{{ vars.ENV_DIR }}/gitops.yaml')" --json visibility --jq .visibility | xargs test PRIVATE =''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:checkout",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:export-inputs",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:author",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:write-access",
]

["gitops:repository:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(gh repo view "$TASKV_REPOSITORY" --json name > /dev/null)'''
run = [
  "gh repo create {{ (env.TASKV_REPOSITORY) | quote }} --private --add-readme",
]
env.TASKV_REPOSITORY = '''{% if env.REPOSITORY is defined %}{{ env.REPOSITORY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.owner + \"/\" + .repository' " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''

["gitops:repository"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run gitops:repository:apply",
]

["gitops:checkout:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(test -d {{ (vars.CHECKOUT) | quote }}/.git)"
run = [
  '''git clone --single-branch --branch "$(yq -r .branch '{{ vars.ENV_DIR }}/gitops.yaml')" "$(yq -r .url '{{ vars.ENV_DIR }}/gitops.yaml')" '{{ vars.CHECKOUT }}'''',
]

["gitops:checkout"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "mise run gitops:checkout:apply",
]

["gitops:author:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(git -C '{{ vars.CHECKOUT }}' var GIT_AUTHOR_IDENT > /dev/null) && (git -C '{{ vars.CHECKOUT }}' var GIT_COMMITTER_IDENT > /dev/null)"
run = [
  '''git -C '{{ vars.CHECKOUT }}' config user.name "$(gh api user --jq .login)"''',
  '''git -C '{{ vars.CHECKOUT }}' config user.email "$(yq -r .adminEmail '{{ vars.ENV_DIR }}/settings.yaml')"''',
]

["gitops:author"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "mise run gitops:author:apply",
]

["gitops:export"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:export-inputs",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:initialise-checkout",
]

["gitops:initialise-checkout:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(test -s "$TASKV_DESTINATION"/values.yaml)'''
run = [
  "mkdir -p '{{ vars.CHECKOUT }}/clusters'",
  "cp -a '{{ vars.ENV_DIR }}/deployment' '{{ env.TASKV_DESTINATION }}'",
  '''yq -i 'with(select(.kind == "HelmRelease" and .metadata.name == "tamoss-gitops-bootstrap"); .spec.values.vaultId = load("{{ vars.ENV_DIR }}/foundation-record.yaml").vaultId) | with(select(.kind == "Kustomization" and .metadata.name == "runtime"); .spec.postBuild.substitute.VAULT_ID = load("{{ vars.ENV_DIR }}/foundation-record.yaml").vaultId)' '{{ env.TASKV_DESTINATION }}/releases.yaml'''',
  "kubectl kustomize '{{ env.TASKV_DESTINATION }}' > /dev/null",
]
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_DESTINATION = "{% if env.DESTINATION is defined %}{{ env.DESTINATION }}{% else %}{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}{% endif %}"

["gitops:initialise-checkout"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test ! -e '{{ env.TASKV_DESTINATION }}' || test -s '{{ env.TASKV_DESTINATION }}/values.yaml' || { printf '%s\n' "The cluster directory already exists; refuse to overwrite another deployment" >&2; exit 1; }''',
  '''test ! -e '{{ env.TASKV_DESTINATION }}/values.yaml' || yq -e '.spec.managementPolicies | join(",") == "Observe"' '{{ env.TASKV_DESTINATION }}/infrastructure/environment.yaml' > /dev/null || { printf '%s\n' "Initial publication requires observe-only infrastructure" >&2; exit 1; }''',
  '''test -s '{{ vars.ENV_DIR }}/foundation-record.yaml' || { printf '%s\n' "Complete the quick deployment before exporting it to Git" >&2; exit 1; }''',
  "mise run gitops:initialise-checkout:apply",
]
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_DESTINATION = "{% if env.DESTINATION is defined %}{{ env.DESTINATION }}{% else %}{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}{% endif %}"

["gitops:github-bootstrap"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  "flux --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' bootstrap github --owner='{{ env.TASKV_OWNER }}' --repository='{{ env.TASKV_REPOSITORY }}' --personal={{ env.TASKV_PERSONAL }} --branch='{{ env.TASKV_BRANCH }}' --path='{{ env.TASKV_PATH_IN_GIT }}' --token-auth=false --version='{{ env.TASKV_FLUX_VERSION }}' --timeout=10m",
  "git -C '{{ vars.CHECKOUT }}' pull --ff-only origin '{{ env.TASKV_BRANCH }}'",
]
env.TASKV_BRANCH = '''{% if env.BRANCH is defined %}{{ env.BRANCH }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .branch " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_FLUX_VERSION = '''{% if env.FLUX_VERSION is defined %}{{ env.FLUX_VERSION }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -p=toml -r '.tools.\"aqua:fluxcd/flux2\"' " ~ (vars.ROOT_DIR) ~ "/mise.toml") }}{% endif %}'''
env.TASKV_OWNER = '''{% if env.OWNER is defined %}{{ env.OWNER }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .owner " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_REPOSITORY = '''{% if env.REPOSITORY is defined %}{{ env.REPOSITORY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .repository " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_PERSONAL = '''{% if env.PERSONAL is defined %}{{ env.PERSONAL }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "gh api repos/" ~ (env.TASKV_OWNER) ~ "/" ~ (env.TASKV_REPOSITORY) ~ " --jq '.owner.type == \"User\"'") }}{% endif %}'''
env.GITHUB_TOKEN = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "gh auth token --hostname github.com") }}'''

["gitops:persist-key:apply:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system get secret flux-system -o json | yq -p=json '{"apiVersion": "v1", "kind": "Secret", "metadata": {"name": "gitops-input", "namespace": "tamoss-infra"}, "type": "Opaque", "data": {"identity": .data.identity, "publicKey": .data."identity.pub", "known_hosts": .data.known_hosts}}' > '{{ vars.ENV_DIR }}/gitops-key.yaml'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' apply --server-side -f '{{ vars.ENV_DIR }}/gitops-key.yaml'",
  '''yq '{"deploymentId": .deploymentUID, "initialise": true}' {{ vars.ENV_DIR }}/identity.yaml > {{ vars.ENV_DIR }}/gitops-auth-values.yaml''',
  "flux create helmrelease gitops-auth -n tamoss-infra --source=GitRepository/tamoss-bootstrap-product --chart=./charts/gitops-auth --values='{{ vars.ENV_DIR }}/gitops-auth-values.yaml' --export > '{{ vars.ENV_DIR }}/gitops-auth.yaml'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' apply --server-side -f '{{ vars.ENV_DIR }}/gitops-auth.yaml'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait externalsecret/gitops --for=create --timeout=300s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait externalsecret/gitops --for=condition=Ready --timeout=300s",
  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/gitops-key-readback.json'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get secret gitops -o json > '{{ vars.ENV_DIR }}/gitops-key-readback.json'",
  '''yq -p=json -e '.data | .publicKey = ."identity.pub" | del(."identity.pub") | (sort_keys(.) | to_json(0)) == (load("{{ vars.ENV_DIR }}/gitops-key.yaml").data | sort_keys(.) | to_json(0))' {{ vars.ENV_DIR }}/gitops-key-readback.json > /dev/null''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra patch helmrelease/gitops-auth --type=merge -p '{"spec":{"values":{"initialise":false}}}'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait pushsecret/gitops --for=delete --timeout=300s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete secret gitops-input --ignore-not-found",
  "yq -i '.gitopsKeyEstablished = true' {{ vars.ENV_DIR }}/identity.yaml",
]
depends_post = ["gitops:persist-key:apply:cleanup"]

["gitops:persist-key:apply:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  "rm -f '{{ vars.ENV_DIR }}/gitops-key.yaml' '{{ vars.ENV_DIR }}/gitops-key-readback.json'",
]

["gitops:persist-key:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
skip_if = "(yq -e '.gitopsKeyEstablished == true' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/gitops-key.yaml'",
  "mise run gitops:persist-key:apply:protected",
]

["gitops:persist-key"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run gitops:persist-key:apply",
]

["gitops:enable-key-delivery"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "yq -i '.gitops.enabled = true' {{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}/values.yaml",
  '''yq -i '.resources = ((.resources + ["flux-system"]) | unique)' {{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}/kustomization.yaml''',
  '''yq -i 'with(select(.kind == "Kustomization"); .spec.prune = false | .spec.deletionPolicy = "Orphan")' {{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}/flux-system/gotk-sync.yaml''',
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} MESSAGE={{ ("feat: adopt Flux and read its deploy key from Vault") | quote }} FILES={{ ("values.yaml kustomization.yaml flux-system/gotk-sync.yaml") | quote }} mise run gitops:publish''',
]
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ (vars.ENV_DIR) ~ "/gitops.yaml") }}{% endif %}'''

["gitops:verify-key:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get secret gitops -o json > '{{ vars.ENV_DIR }}/gitops-key-readback.json'",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system get secret flux-system -o json | yq -p=json -e '(.data | sort_keys(.) | to_json(0)) == (load("{{ vars.ENV_DIR }}/gitops-key-readback.json").data | sort_keys(.) | to_json(0)) and (.metadata.ownerReferences | map(select(.controller == true) | .kind + "/" + .name) | contains(["ExternalSecret/flux-system"]))' > /dev/null''',
]
depends_post = ["gitops:verify-key:cleanup"]

["gitops:verify-key:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "rm -f '{{ vars.ENV_DIR }}/gitops-key-readback.json'",
]

["gitops:verify-key"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system wait externalsecret/flux-system --for=create --timeout=300s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system wait externalsecret/flux-system --for=condition=Ready --timeout=300s",
  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/gitops-key-readback.json'",
  "mise run gitops:verify-key:protected",
]

["gitops:pins"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_RELEASE_LOCK | quote }} || { printf '%s\n' "Missing required input: RELEASE_LOCK" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_OUTPUT | quote }} || { printf '%s\n' "Missing required input: OUTPUT" >&2; exit 1; }''',
  '''yq -n 'load("{{ vars.ROOT_DIR }}/dependencies.yaml") as $d | {"tadoss": {"enabled": false, "release": { "version": load("{{ env.TASKV_TADOSS_ASSETS }}/release.json").version, "releaseSha256": "{{ env.TASKV_TADOSS_KEY }}", "runtimeImage": ("docker.io/" + load("{{ env.TASKV_TADOSS_ASSETS }}/release.json").runtimeImage)}}, "dependencies": {"crossplane": $d.crossplane, "externalSecrets": $d.externalSecrets, "platform": load("{{ env.TASKV_ASSETS }}/dependencies.yaml").spec, "calicoCommit": ($d.artifacts[] | select(.path == "calico/calico-policy-only.yaml") | .url | split("/")[5])}, "packages": load("{{ vars.ROOT_DIR }}/charts/packages/values.yaml"), "externalSecrets": load("{{ vars.ROOT_DIR }}/deploy/secrets/controller-values.yaml"), "connectionImages": {"oci": load("{{ vars.ROOT_DIR }}/dependencies.yaml").oci.image, "yq": $d.connectionDetails.yqImage, "kubectl": $d.connectionDetails.kubectlImage}, "release": {"tag": load("{{ env.TASKV_RELEASE_LOCK }}").tag, "releaseSha256": load("{{ env.TASKV_RELEASE_LOCK }}").releaseSha256, "sourceSha256": load("{{ env.TASKV_RELEASE_LOCK }}").sourceSha256, "postgresImage": (load("{{ env.TASKV_ASSETS }}/release.json").runtime.images.postgresClient | sub("^postgres:"; "docker.io/library/postgres:"))}}' > {{ (env.TASKV_OUTPUT) | quote }}''',
]
env.TASKV_OUTPUT = '''{{ env.OUTPUT | default(value="") }}'''
env.TASKV_RELEASE_LOCK = '''{{ env.RELEASE_LOCK | default(value="") }}'''
env.TASKV_TADOSS_KEY = '''{% if env.TADOSS_KEY is defined %}{{ env.TADOSS_KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.artifacts.\"release.json\"' " ~ (vars.ROOT_DIR) ~ "/deploy/tadoss/release.yaml") }}{% endif %}'''
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .releaseSha256 " ~ ((env.TASKV_RELEASE_LOCK) | quote)) }}{% endif %}'''
env.TASKV_TADOSS_ASSETS = "{% if env.TADOSS_ASSETS is defined %}{{ env.TADOSS_ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tadoss/{{ env.TASKV_TADOSS_KEY }}{% endif %}"
env.TASKV_ASSETS = "{% if env.ASSETS is defined %}{{ env.ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_KEY }}{% endif %}"

["gitops:export-inputs"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''yq -e '.path | test("^clusters/[a-z][a-z0-9-]*$")' {{ (vars.ENV_DIR) | quote }}/gitops.yaml || { printf '%s\n' "GitOps path must identify one cluster under clusters/" >&2; exit 1; }''',
  '''test "$(git -C {{ (vars.CHECKOUT) | quote }} rev-parse --show-toplevel)" = "$(realpath {{ (vars.CHECKOUT) | quote }})" || { printf '%s\n' "CHECKOUT must be the root of the environment Git repository" >&2; exit 1; }''',
  '''test "$(git -C {{ (vars.CHECKOUT) | quote }} remote get-url origin)" = "$(yq -r .url {{ (vars.ENV_DIR) | quote }}/gitops.yaml)" || { printf '%s\n' "Environment repository origin differs from the selected GitOps repository" >&2; exit 1; }''',
  '''test "$(git -C {{ (vars.CHECKOUT) | quote }} symbolic-ref --short HEAD)" = "$(yq -r .branch {{ (vars.ENV_DIR) | quote }}/gitops.yaml)" || { printf '%s\n' "Select the configured environment branch before exporting" >&2; exit 1; }''',
  '''test ! -L {{ (vars.CHECKOUT) | quote }}/clusters && test ! -L {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }} || { printf '%s\n' "Refuse an export through a symlink" >&2; exit 1; }''',
  '''test ! -e {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }}/values.yaml || yq -e '.deploymentId == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID' {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }}/values.yaml > /dev/null || { printf '%s\n' "Existing Git configuration belongs to a different deployment" >&2; exit 1; }''',
  '''test ! -e {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }}/values.yaml || (test -s {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }}/infrastructure/environment.yaml && kubectl kustomize {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }} > /dev/null) || { printf '%s\n' "Existing Git configuration is incomplete or uses an older layout; use its deployed product revision for teardown" >&2; exit 1; }''',
]
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''

["gitops:render:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(test -s "$TASKV_DESTINATION"/values.yaml)'''
run = [
  "mkdir -p -m 700 '{{ env.TASKV_CANDIDATE }}/infrastructure'",
  '''RELEASE_LOCK={{ ((vars.ENV_DIR) ~ "/tamoss-release.yaml") | quote }} OUTPUT={{ ((env.TASKV_CANDIDATE) ~ "/pins.yaml") | quote }} mise run gitops:pins''',
  '''yq -n 'load("{{ vars.ENV_DIR }}/environment.yaml").spec as $e | load("{{ vars.ENV_DIR }}/settings.yaml") as $s | load("{{ vars.ENV_DIR }}/product.yaml") as $g | {"deploymentId": load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID, "region": $e.region, "databaseAdministrator": $e.database.administrator, "release": {"bundleURL": $g.bundle.url, "digest": $g.bundle.digest}, "runtime": {"bucket": $e.storage.bucket, "objectEndpoint": ("https://" + $e.storage.namespace + ".compat.objectstorage." + $e.region + ".oci.customer-oci.com"), "acmeEmail": $s.acmeEmail, "adminEmail": $s.adminEmail}} * load("{{ env.TASKV_CANDIDATE }}/pins.yaml")' > '{{ env.TASKV_CANDIDATE }}/values.yaml'''',
  '''yq -i 'with(select(load("{{ vars.ENV_DIR }}/product.yaml").tadoss.bundle != null); .tadoss.release.bundleURL = load("{{ vars.ENV_DIR }}/product.yaml").tadoss.bundle.url | .tadoss.release.digest = load("{{ vars.ENV_DIR }}/product.yaml").tadoss.bundle.digest)' '{{ env.TASKV_CANDIDATE }}/values.yaml'''',
  "helm lint '{{ vars.ROOT_DIR }}/charts/gitops' -f '{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_KEY }}/source/deploy/platform/values/defaults.yaml' -f '{{ env.TASKV_CANDIDATE }}/values.yaml' --set vaultId=ocid1.vault.oc1.validation,databaseId=ocid1.postgresqldbsystem.oc1.validation --set runtime.publicIp=203.0.113.1,runtime.loadBalancerSubnetId=ocid1.subnet.oc1.validation",
  '''yq 'load("{{ vars.ENV_DIR }}/identity.yaml") as $id | {"apiVersion": .apiVersion, "kind": .kind, "metadata": {"name": .metadata.name, "namespace": .metadata.namespace, "annotations": {"tamoss.livewyer.io/deployment-id": $id.deploymentUID}}, "spec": (.spec | del(.crossplane))} | .spec.managementPolicies = ["Observe"] | .spec.adoption = {"deploymentId": "${DEPLOYMENT_ID}", "creationCompositeUID": "${CREATION_COMPOSITE_UID}", "externalNames": (load("{{ vars.ROOT_DIR }}/charts/environment/definition.yaml").spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.adoption.properties.externalNames.required | .[] as $key ireduce ({}; .[$key] = ("${" + ($key | upcase | sub("-"; "_")) + "}")))}' '{{ vars.ENV_DIR }}/environment.yaml' > '{{ env.TASKV_CANDIDATE }}/infrastructure/environment.yaml'''',
  "cp '{{ vars.ROOT_DIR }}/deploy/gitops/starter/kustomization.yaml' '{{ vars.ROOT_DIR }}/deploy/gitops/starter/kustomizeconfig.yaml' '{{ vars.ROOT_DIR }}/deploy/gitops/starter/sources.yaml' '{{ vars.ROOT_DIR }}/deploy/gitops/starter/releases.yaml' '{{ env.TASKV_CANDIDATE }}/'",
  "cp '{{ vars.ROOT_DIR }}/deploy/gitops/starter/namespaces.yaml' '{{ env.TASKV_CANDIDATE }}/'",
  '''yq -i 'with(select(.metadata.name == "tamoss-upstream"); .spec.ref.commit = load("{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_KEY }}/release.json").sourceCommit) | with(select(.metadata.name == "tamoss-product"); .spec.url = load("{{ vars.ENV_DIR }}/product.yaml").product.url | .spec.ref.commit = load("{{ vars.ENV_DIR }}/product.yaml").product.commit)' '{{ env.TASKV_CANDIDATE }}/sources.yaml'''',
  '''yq -i 'with(select(.metadata.name == "infrastructure"); .spec.healthChecks[0].name = load("{{ vars.ENV_DIR }}/environment.yaml").metadata.name | .spec.postBuild.substitute.ENVIRONMENT_NAME = load("{{ vars.ENV_DIR }}/environment.yaml").metadata.name) | with(select(.kind == "HelmRelease" or .kind == "Kustomization"); .spec.commonMetadata.labels."tamoss.livewyer.io/deployment-id" = load("{{ env.TASKV_CANDIDATE }}/values.yaml").deploymentId)' '{{ env.TASKV_CANDIDATE }}/releases.yaml'''',
  '''yq -i '.labels = [{"pairs": {"tamoss.livewyer.io/deployment-id": load("{{ env.TASKV_CANDIDATE }}/values.yaml").deploymentId}}]' {{ env.TASKV_CANDIDATE }}/kustomization.yaml''',
  "kubectl kustomize '{{ env.TASKV_CANDIDATE }}' > '{{ vars.ENV_DIR }}/deployment.yaml'",
  "rm '{{ env.TASKV_CANDIDATE }}/pins.yaml'",
  "mv '{{ env.TASKV_CANDIDATE }}' '{{ env.TASKV_DESTINATION }}'",
]
env.TASKV_CANDIDATE = "{% if env.CANDIDATE is defined %}{{ env.CANDIDATE }}{% else %}{{ vars.ENV_DIR }}/deployment.pending{% endif %}"
env.TASKV_DESTINATION = "{% if env.DESTINATION is defined %}{{ env.DESTINATION }}{% else %}{{ vars.ENV_DIR }}/deployment{% endif %}"
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .releaseSha256 " ~ ((vars.ENV_DIR) | quote) ~ "/tamoss-release.yaml") }}{% endif %}'''

["gitops:render"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test ! -e {{ (env.TASKV_DESTINATION) | quote }} || test -s {{ (env.TASKV_DESTINATION) | quote }}/values.yaml || { printf '%s\n' "The destination already exists; review it rather than overwriting user files" >&2; exit 1; }''',
  '''yq -e '.deploymentUID != null' {{ (vars.ENV_DIR) | quote }}/identity.yaml > /dev/null || { printf '%s\n' "Record the deployment identity before preparing the deployment" >&2; exit 1; }''',
  "mise run gitops:render:apply",
]
env.TASKV_DESTINATION = "{% if env.DESTINATION is defined %}{{ env.DESTINATION }}{% else %}{{ vars.ENV_DIR }}/deployment{% endif %}"

["gitops:current-checkout"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test -z "$(git -C {{ (vars.CHECKOUT) | quote }} status --porcelain -- '{{ env.TASKV_PATH_IN_GIT }}')" || { printf '%s\n' "Publish intended environment edits, or resume mise run handover for a pending ownership change" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:export-inputs",
  "git -C {{ (vars.CHECKOUT) | quote }} ls-files --error-unmatch '{{ env.TASKV_PATH_IN_GIT }}/values.yaml' '{{ env.TASKV_PATH_IN_GIT }}/infrastructure/environment.yaml' > /dev/null",
  "git -C {{ (vars.CHECKOUT) | quote }} fetch origin {{ (env.TASKV_BRANCH) | quote }}",
  '''test "$(git -C {{ (vars.CHECKOUT) | quote }} rev-parse HEAD)" = "$(git -C {{ (vars.CHECKOUT) | quote }} rev-parse FETCH_HEAD)"''',
]
env.TASKV_BRANCH = '''{% if env.BRANCH is defined %}{{ env.BRANCH }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .branch " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''

["gitops:publish"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_FILES | quote }} || { printf '%s\n' "Missing required input: FILES" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_MESSAGE | quote }} || { printf '%s\n' "Missing required input: MESSAGE" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:export-inputs",
  "kubectl kustomize '{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}' > /dev/null",
  "CHECKOUT={{ ((vars.CHECKOUT)) | quote }} PATHS={{ ((env.TASKV_PATHS)) | quote }} MESSAGE={{ ((env.TASKV_MESSAGE)) | quote }} mise run gitops:commit",
  '''git -C {{ (vars.CHECKOUT) | quote }} push origin {{ ("HEAD:" ~ (env.TASKV_BRANCH)) | quote }}''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:current-checkout",
]
env.TASKV_BRANCH = '''{% if env.BRANCH is defined %}{{ env.BRANCH }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .branch " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_FILES = '''{{ env.FILES | default(value="") }}'''
env.TASKV_MESSAGE = '''{{ env.MESSAGE | default(value="") }}'''
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_PATHS = '''{% if env.PATHS is defined %}{{ env.PATHS }}{% else %}{% for file in env.TASKV_FILES | split(pat=" ") %}{{ (env.TASKV_PATH_IN_GIT ~ "/" ~ file) | quote }} {% endfor %}{% endif %}'''

["gitops:write-access"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "git -C {{ (vars.CHECKOUT) | quote }} var GIT_AUTHOR_IDENT > /dev/null",
  "git -C {{ (vars.CHECKOUT) | quote }} var GIT_COMMITTER_IDENT > /dev/null",
  '''git -C {{ (vars.CHECKOUT) | quote }} push --dry-run origin {{ ("HEAD:" ~ (env.TASKV_BRANCH)) | quote }}''',
]
env.TASKV_BRANCH = '''{% if env.BRANCH is defined %}{{ env.BRANCH }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .branch " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''

["gitops:commit:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(test -z "$(git -C {{ (vars.CHECKOUT) | quote }} status --porcelain -- {{ env.PATHS | default(value="") }})")'''
run = [
  "git -C {{ (vars.CHECKOUT) | quote }} add -- {{ env.TASKV_PATHS }}",
  "git -C {{ (vars.CHECKOUT) | quote }} commit --only -m {{ (env.TASKV_MESSAGE) | quote }} -- {{ env.TASKV_PATHS }}",
]
env.TASKV_MESSAGE = '''{{ env.MESSAGE | default(value="") }}'''
env.TASKV_PATHS = '''{{ env.PATHS | default(value="") }}'''

["gitops:commit"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_PATHS | quote }} || { printf '%s\n' "Missing required input: PATHS" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_MESSAGE | quote }} || { printf '%s\n' "Missing required input: MESSAGE" >&2; exit 1; }''',
  "mise run gitops:commit:apply",
]
env.TASKV_MESSAGE = '''{{ env.MESSAGE | default(value="") }}'''
env.TASKV_PATHS = '''{{ env.PATHS | default(value="") }}'''

["gitops:promotion-checkout"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:export-inputs",
  "git -C {{ (vars.CHECKOUT) | quote }} fetch origin {{ (env.TASKV_BRANCH) | quote }}",
  "git -C {{ (vars.CHECKOUT) | quote }} diff --quiet FETCH_HEAD -- '{{ env.TASKV_PATH_IN_GIT }}' ':(exclude){{ env.TASKV_PATH_IN_GIT }}/infrastructure/environment.yaml'",
  '''test -z "$(git -C {{ (vars.CHECKOUT) | quote }} ls-files --others --exclude-standard -- '{{ env.TASKV_PATH_IN_GIT }}')"''',
  "git -C {{ (vars.CHECKOUT) | quote }} show 'FETCH_HEAD:{{ env.TASKV_PATH_IN_GIT }}/infrastructure/environment.yaml' > '{{ vars.ENV_DIR }}/promotion-published.yaml'",
  '''yq '.spec.managementPolicies = ["*"]' {{ vars.ENV_DIR }}/promotion-published.yaml > {{ vars.ENV_DIR }}/promotion-candidate.yaml''',
  "cmp --silent '{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}/infrastructure/environment.yaml' '{{ vars.ENV_DIR }}/promotion-published.yaml' || cmp --silent '{{ vars.CHECKOUT }}/{{ env.TASKV_PATH_IN_GIT }}/infrastructure/environment.yaml' '{{ vars.ENV_DIR }}/promotion-candidate.yaml'",
]
env.TASKV_BRANCH = '''{% if env.BRANCH is defined %}{{ env.BRANCH }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .branch " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''
