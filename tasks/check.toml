
["verify:tools"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise install --locked",
  '''test "$(oci --version)" = "$(yq -r .oci.version dependencies.yaml)"''',
  '''{% for item in ["kind", "kubectl", "helm", "helmfile", "crossplane", "yq", "chainsaw", "vegeta", "hurl", "flux", "uv", "oci"] %}
mise which {{ item }} > /dev/null
{% endfor %}''',
]

["verify:privacy"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "test ! -d scripts",
  "git ls-files --cached --others --exclude-standard -z -- '*.py' '*.sh' | wc -c | xargs test 0 -eq",
  "git ls-files -z -- AGENTS.md CLAUDE.md .local | wc -c | xargs test 0 -eq",
  "git check-ignore -q AGENTS.md",
  "git check-ignore -q .local/AGENTS.md",
]

["verify:artifacts"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p -m 700 '{{ env.TASKV_CACHE }}'",
  "rm -rf '{{ env.TASKV_CACHE }}/schemas'",
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") | get(key="artifacts") %}
URL={{ ((item.url)) | quote }} TARGET={{ ((item.path)) | quote }} SHA={{ ((item.sha256)) | quote }} mise run verify:artifact
{% endfor %}''',
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"

["verify:artifact"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(echo "${TASKV_SHA}  ${TASKV_CACHE}/${TASKV_TARGET}" | sha256sum --check --status)'''
run = [
  "curl --fail --location --silent --show-error --max-time 60 --max-filesize 16777216 --create-dirs --output '{{ env.TASKV_CACHE }}/{{ env.TASKV_TARGET }}.download' '{{ env.TASKV_URL }}'",
  "echo '{{ env.TASKV_SHA }}  {{ env.TASKV_CACHE }}/{{ env.TASKV_TARGET }}.download' | sha256sum --check --status",
  "mv '{{ env.TASKV_CACHE }}/{{ env.TASKV_TARGET }}.download' '{{ env.TASKV_CACHE }}/{{ env.TASKV_TARGET }}'",
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"
env.TASKV_SHA = '''{{ env.SHA | default(value="") }}'''
env.TASKV_TARGET = '''{{ env.TARGET | default(value="") }}'''
env.TASKV_URL = '''{{ env.URL | default(value="") }}'''

["verify:render"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run tamoss:media",
  "mise run runtime:fixture",
  "helm lint charts/packages charts/environment charts/services deploy/tamoss/database/chart",
  "helm template environment charts/environment > '{{ env.TASKV_CACHE }}/environment-api.yaml'",
  '''yq 'select(.kind == "Composition")' {{ env.TASKV_CACHE }}/environment-api.yaml > {{ env.TASKV_CACHE }}/composition.yaml''',
  '''helm template packages charts/packages --set services=true | yq 'select(.kind == "Function")' > '{{ env.TASKV_CACHE }}/functions.yaml'''',
  "mise run application:calico",
  "mise run tamoss:operator",
  "cp '{{ env.TASKV_CACHE }}/operator/rendered.yaml' '{{ env.TASKV_CACHE }}/operator.yaml'",
  '''OUTPUT_DIR={{ ((env.TASKV_CACHE) ~ "/instance-base") | quote }} mise run tamoss:instance''',
  "cp '{{ env.TASKV_CACHE }}/instance-base/rendered.yaml' '{{ env.TASKV_CACHE }}/tamoss.yaml'",
  '''yq 'select(.kind == "Tamoss") | .spec as $s | {"apiVersion": "v1", "kind": "List", "items": ["api", "worker", "ui", "console"] | map( {"apiVersion": "v1", "kind": "Pod", "metadata": {"name": ("ha-admission-" + .), "namespace": "tams", "labels": ({"app.kubernetes.io/instance": "tamoss"} * $s[.].podLabels)}, "spec": {"affinity": $s[.].affinity, "containers": [{"name": "check", "image": load("{{ vars.ROOT_DIR }}/deploy/tamoss/database/chart/values.yaml").image}]}})}' '{{ env.TASKV_CACHE }}/tamoss.yaml' > '{{ env.TASKV_CACHE }}/ha-pods.yaml'''',
  "kubectl kustomize deploy/tamoss/ingest > '{{ env.TASKV_CACHE }}/ingest.yaml'",
  "TAMOSS_ENV_DIR='{{ vars.ROOT_DIR }}/.local/tmp/check/runtime' helmfile -f deploy/tamoss/platform/helmfile.yaml.gotmpl --state-values-file '{{ vars.ROOT_DIR }}/deploy/runtime/values.yaml.gotmpl' template > '{{ env.TASKV_CACHE }}/platform.yaml'",
  "TAMOSS_ENV_DIR='{{ vars.ROOT_DIR }}/.local/tmp/check/runtime' helmfile -f deploy/tamoss/database/helmfile.yaml.gotmpl --state-values-file '{{ vars.ROOT_DIR }}/deploy/runtime/values.yaml.gotmpl' template > '{{ env.TASKV_CACHE }}/database.yaml'",
  '''yq eval-all -e '[.. | select(tag == "!!map") | select(has("image")) | .image | select(tag == "!!str") | select(test("^[^/]*[.:][^/]*/") | not)] | length == 0' '{{ env.TASKV_CACHE }}/calico.yaml' '{{ env.TASKV_CACHE }}/platform.yaml' '{{ env.TASKV_CACHE }}/operator.yaml' '{{ env.TASKV_CACHE }}/database.yaml'''',
  '''{% for item in ["calico", "platform", "operator"] %}
yq 'select(.kind == "CustomResourceDefinition")' {{ env.TASKV_CACHE }}/{{ item }}.yaml > {{ env.TASKV_CACHE }}/schemas/{{ item }}.yaml
{% endfor %}''',
  "crossplane composition render environments/example/environment.yaml {{ env.TASKV_CACHE }}/composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/initial.yaml",
  '''yq 'select(.metadata.annotations."crossplane.io/composition-resource-name" != null) | .status = {"conditions": [{"type": "Ready", "status": "True"}], "atProvider": {"id": ("ocid1.test.oc1.." + .metadata.annotations."crossplane.io/composition-resource-name")}}' {{ env.TASKV_CACHE }}/initial.yaml > {{ env.TASKV_CACHE }}/observed.yaml''',
  "crossplane composition render environments/example/environment.yaml {{ env.TASKV_CACHE }}/composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/partial.yaml",
  '''yq 'select(.kind == "Cluster") | del(.metadata.ownerReferences) | .metadata.annotations."crossplane.io/paused" = "true"' {{ env.TASKV_CACHE }}/partial.yaml > {{ env.TASKV_CACHE }}/cluster-reference.yaml''',
  '''yq 'select(.metadata.annotations."crossplane.io/composition-resource-name" != null) | .status.conditions = [{"type": "Ready", "status": "True"}]' {{ env.TASKV_CACHE }}/partial.yaml > {{ env.TASKV_CACHE }}/observed.yaml''',
  "crossplane composition render environments/example/environment.yaml {{ env.TASKV_CACHE }}/composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/ready.yaml",
  "yq 'del(.status)' {{ env.TASKV_CACHE }}/observed.yaml > {{ env.TASKV_CACHE }}/recovering-observed.yaml",
  "crossplane composition render environments/example/environment.yaml {{ env.TASKV_CACHE }}/composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/recovering-observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/recovering.yaml",
  '''{% for item in ["calico", "platform", "operator", "database", "tamoss", "ingest", "initial", "partial", "ready", "recovering"] %}
crossplane resource validate {{ env.TASKV_CACHE }}/schemas,charts/environment/definition.yaml {{ env.TASKV_CACHE }}/{{ item }}.yaml --crossplane-image={{ vars.CORE }} --cache-dir={{ env.TASKV_CACHE }}/crossplane --error-on-missing-schemas --skip-success-results
{% endfor %}''',
  '''{% for item in ["initial", "partial", "ready", "platform", "operator", "tamoss"] %}
yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_CACHE }}/{{ item }}.yaml > {{ env.TASKV_CACHE }}/{{ item }}-list.yaml
{% endfor %}''',
  '''yq 'select(.kind != "TamossEnvironment") | del(.status)' {{ env.TASKV_CACHE }}/partial.yaml > {{ env.TASKV_CACHE }}/expected-recovery.yaml''',
  '''yq 'select(.kind != "TamossEnvironment") | del(.status)' {{ env.TASKV_CACHE }}/recovering.yaml > {{ env.TASKV_CACHE }}/actual-recovery.yaml''',
  "diff -u '{{ env.TASKV_CACHE }}/expected-recovery.yaml' '{{ env.TASKV_CACHE }}/actual-recovery.yaml'",
  '''yq 'with(select(.metadata.annotations."crossplane.io/composition-resource-name" == "service"); del(.status))' {{ env.TASKV_CACHE }}/observed.yaml > {{ env.TASKV_CACHE }}/service-recovering-observed.yaml''',
  "crossplane composition render environments/example/environment.yaml {{ env.TASKV_CACHE }}/composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/service-recovering-observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/service-recovering.yaml",
  '''yq 'select(.kind != "TamossEnvironment") | del(.status)' {{ env.TASKV_CACHE }}/service-recovering.yaml > {{ env.TASKV_CACHE }}/service-recovering-resources.yaml''',
  "diff -u '{{ env.TASKV_CACHE }}/expected-recovery.yaml' '{{ env.TASKV_CACHE }}/service-recovering-resources.yaml'",
  '''helm template services charts/services | yq 'select(.kind == "Composition")' > '{{ env.TASKV_CACHE }}/services-composition.yaml'''',
  "crossplane composition render environments/example/services.yaml {{ env.TASKV_CACHE }}/services-composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/services-initial.yaml",
  '''yq 'select(.metadata.annotations."crossplane.io/composition-resource-name" != null) | .status.conditions = [{"type": "Ready", "status": "False"}] | with(select(.kind == "PsqlDbSystem"); .status.atProvider.id = "ocid1.postgresqldbsystem.oc1.eu-frankfurt-1.fixture")' {{ env.TASKV_CACHE }}/services-initial.yaml > {{ env.TASKV_CACHE }}/services-created-observed.yaml''',
  "crossplane composition render environments/example/services.yaml {{ env.TASKV_CACHE }}/services-composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/services-created-observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/services-created.yaml",
  '''yq '.status.conditions = [{"type": "Ready", "status": "True"}]' {{ env.TASKV_CACHE }}/services-created-observed.yaml > {{ env.TASKV_CACHE }}/services-ready-observed.yaml''',
  "crossplane composition render environments/example/services.yaml {{ env.TASKV_CACHE }}/services-composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/services-ready-observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/services-ready.yaml",
  '''yq 'select(.metadata.annotations."crossplane.io/composition-resource-name" != null) | del(.status)' {{ env.TASKV_CACHE }}/services-ready.yaml > {{ env.TASKV_CACHE }}/services-recovering-observed.yaml''',
  "crossplane composition render environments/example/services.yaml {{ env.TASKV_CACHE }}/services-composition.yaml {{ env.TASKV_CACHE }}/functions.yaml --include-full-xr --observed-resources={{ env.TASKV_CACHE }}/services-recovering-observed.yaml --crossplane-image={{ vars.CORE }} > {{ env.TASKV_CACHE }}/services-recovering.yaml",
  '''yq '{"services": .}' environments/example/services.yaml > '{{ env.TASKV_CACHE }}/services-instance-values.yaml'''',
  "helm lint charts/services-instance -f '{{ env.TASKV_CACHE }}/services-instance-values.yaml'",
  "helm template tamoss-services charts/services-instance -n tamoss-infra -f '{{ env.TASKV_CACHE }}/services-instance-values.yaml' > '{{ env.TASKV_CACHE }}/services-instance.yaml'",
  '''{% for item in ["initial", "created", "ready", "recovering", "instance"] %}
crossplane resource validate {{ env.TASKV_CACHE }}/schemas,charts/services/definition.yaml {{ env.TASKV_CACHE }}/services-{{ item }}.yaml --crossplane-image={{ vars.CORE }} --cache-dir={{ env.TASKV_CACHE }}/crossplane --error-on-missing-schemas --skip-success-results
{% endfor %}''',
  '''{% for item in ["initial", "created", "ready", "recovering", "instance"] %}
yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_CACHE }}/services-{{ item }}.yaml > {{ env.TASKV_CACHE }}/services-{{ item }}-list.yaml
{% endfor %}''',
  '''helm template packages charts/packages --set family=true,services=true,workloadIdentityRegion=eu-frankfurt-1 --set-json 'serviceProviders=["psql","objectstorage"]' | yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' > '{{ env.TASKV_CACHE }}/services-packages-list.yaml'''',
  "chainsaw test --no-cluster --test-dir tests/render --report-format JUNIT-TEST --report-path .local/reports --report-name render",
  "helm dependency build --skip-refresh charts/bootstrap",
  "ROOT={{ vars.ROOT_DIR }} mise run test:bootstrap:render",
  "mise run test:s3:render",
  "ROOT={{ vars.ROOT_DIR }} mise run test:bootstrap:render-native",
  "mise run test:bootstrap:credential-completion",
  "mise run test:bootstrap:seed-inputs",
  "mise run test:s3:composition",
  "ROOT={{ vars.ROOT_DIR }} mise run test:controller-state:render",
  "mise run test:oke-bootstrap:retirement",
  "mise run verify:secrets",
  "mise run verify:connection-details",
  "mise run verify:operations",
  "mise run verify:gitops",
  "mise run verify:tadoss",
  "ROOT={{ vars.ROOT_DIR }} mise run test:setup:check",
  "mise run test:account:check",
  "mise run test:bootstrap:inputs",
  '''{% for item in ["open-api", "overlap", "outside-vcn", "service-overlap", "catalogue-shape", "unsupported-oke", "duplicate-placement", "name-length"] %}
kubectl kustomize --load-restrictor=LoadRestrictionsNone tests/invalid/{{ item }} > '{{ env.TASKV_CACHE }}/rejected-{{ item }}.yaml'
{% endfor %}''',
  "chainsaw test --no-cluster --set-string crossplaneImage={{ vars.CORE }} --test-dir tests/invalid --report-format JUNIT-TEST --report-path .local/reports --report-name invalid-inputs",
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"

["verify:secrets"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "helm lint charts/secret-foundation",
  "helm lint charts/secrets -f tests/secrets/values.yaml",
  "helm template foundation charts/secret-foundation > '{{ env.TASKV_CACHE }}/foundation-api.yaml'",
  '''yq 'del(.metadata.uid) | .metadata.annotations."crossplane.io/paused" = "true"' tests/secrets/foundation.yaml > {{ env.TASKV_CACHE }}/foundation-admission.yaml''',
  '''yq 'select(.kind == "Composition")' {{ env.TASKV_CACHE }}/foundation-api.yaml > {{ env.TASKV_CACHE }}/foundation-composition.yaml''',
  "crossplane composition render tests/secrets/foundation.yaml '{{ env.TASKV_CACHE }}/foundation-composition.yaml' '{{ env.TASKV_CACHE }}/functions.yaml' --include-full-xr --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_CACHE }}/foundation-initial.yaml'",
  '''yq 'select(.kind == "Vault") | .status.atProvider = {"id": "ocid1.vault.oc1..example", "managementEndpoint": "https://example-management.kms.eu-frankfurt-1.oraclecloud.com"}' {{ env.TASKV_CACHE }}/foundation-initial.yaml > {{ env.TASKV_CACHE }}/foundation-observed.yaml''',
  "crossplane composition render tests/secrets/foundation.yaml '{{ env.TASKV_CACHE }}/foundation-composition.yaml' '{{ env.TASKV_CACHE }}/functions.yaml' --observed-resources='{{ env.TASKV_CACHE }}/foundation-observed.yaml' --include-full-xr --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_CACHE }}/foundation-ready.yaml'",
  '''yq 'select(.kind == "Vault" or .kind == "Key") | del(.status)' {{ env.TASKV_CACHE }}/foundation-ready.yaml > {{ env.TASKV_CACHE }}/foundation-recovering-observed.yaml''',
  "crossplane composition render tests/secrets/foundation.yaml '{{ env.TASKV_CACHE }}/foundation-composition.yaml' '{{ env.TASKV_CACHE }}/functions.yaml' --observed-resources='{{ env.TASKV_CACHE }}/foundation-recovering-observed.yaml' --include-full-xr --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_CACHE }}/foundation-recovering.yaml'",
  '''{% for item in ["ready", "recovering"] %}
yq 'select(.kind == "Vault" or .kind == "Key") | del(.status)' {{ env.TASKV_CACHE }}/foundation-{{ item }}.yaml > {{ env.TASKV_CACHE }}/foundation-{{ item }}-resources.yaml
{% endfor %}''',
  "diff -u '{{ env.TASKV_CACHE }}/foundation-ready-resources.yaml' '{{ env.TASKV_CACHE }}/foundation-recovering-resources.yaml'",
  '''yq '. * load("tests/secrets/foundation-adoption.yaml")' tests/secrets/foundation.yaml > {{ env.TASKV_CACHE }}/foundation-adoption.yaml''',
  '''yq 'del(.metadata.uid) | .metadata.annotations."crossplane.io/paused" = "true"' {{ env.TASKV_CACHE }}/foundation-adoption.yaml > {{ env.TASKV_CACHE }}/foundation-adoption-admission.yaml''',
  "crossplane composition render '{{ env.TASKV_CACHE }}/foundation-adoption.yaml' '{{ env.TASKV_CACHE }}/foundation-composition.yaml' '{{ env.TASKV_CACHE }}/functions.yaml' --include-full-xr --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_CACHE }}/foundation-adoption-render.yaml'",
  '''yq eval-all -e '[select(.kind == "Vault" or .kind == "Key") | .spec.managementPolicies | join(",")] | join(",") == "Observe,Observe"' {{ env.TASKV_CACHE }}/foundation-adoption-render.yaml''',
  '''yq eval-all -e '[select(.kind == "Key") | (.metadata.annotations."crossplane.io/external-name" == load("tests/secrets/foundation-adoption.yaml").spec.adoption.keyExternalName)] | [length > 0, all] | all' {{ env.TASKV_CACHE }}/foundation-adoption-render.yaml''',
  "helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml > '{{ env.TASKV_CACHE }}/secrets.yaml'",
  "helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml -f tests/secrets/runtime-values.yaml > '{{ env.TASKV_CACHE }}/secrets-runtime.yaml'",
  "helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml -f charts/bootstrap/secret-values.yaml --set initialise=true > '{{ env.TASKV_CACHE }}/secrets-bootstrap.yaml'",
  "helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml -f charts/bootstrap/secret-values.yaml --set initialise=false > '{{ env.TASKV_CACHE }}/secrets-established.yaml'",
  '''yq eval-all -e '[select(.kind == "PushSecret" or .kind == "Password")] | length == 0' {{ env.TASKV_CACHE }}/secrets-established.yaml''',
  '''yq eval-all -e '[select(.kind == "ExternalSecret")] | length == 9' {{ env.TASKV_CACHE }}/secrets-established.yaml''',
  '''yq '.metadata.namespace = "secret-check" | with(select(.kind == "SecretStore"); .spec.provider = load("tests/secret-persistence/provider.yaml")) | with(select(.kind == "PushSecret" and .metadata.name == "database-admin"); .spec.data[0].match.remoteRef.property = "password") | with(select(.kind == "ExternalSecret" and .metadata.name == "database-admin"); .spec.data[0].remoteRef.property = "password")' '{{ env.TASKV_CACHE }}/secrets.yaml' > '{{ env.TASKV_CACHE }}/secrets-persistence.yaml'''',
  '''{% for item in ["secrets", "secrets-runtime", "secrets-bootstrap", "secrets-established", "foundation-initial", "foundation-ready", "foundation-recovering"] %}
crossplane resource validate '{{ env.TASKV_CACHE }}/schemas,charts/secret-foundation/definition.yaml' '{{ env.TASKV_CACHE }}/{{ item }}.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results
{% endfor %}''',
  '''{% for item in ["secrets", "secrets-runtime", "foundation-ready"] %}
yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_CACHE }}/{{ item }}.yaml > {{ env.TASKV_CACHE }}/{{ item }}-list.yaml
{% endfor %}''',
  "chainsaw test --no-cluster --test-dir tests/secrets --report-format JUNIT-TEST --report-path .local/reports --report-name secrets",
  "mkdir -p '{{ env.TASKV_CACHE }}/secret-retirement'",
  '''yq '{"deploymentUID": .deploymentId, "oci": .oracle.auth}' tests/secrets/values.yaml > {{ env.TASKV_CACHE }}/secret-retirement/identity.yaml''',
  '''yq '.oracle | {"region": .region, "vaultId": .vault, "compartmentId": .compartment}' tests/secrets/values.yaml > {{ env.TASKV_CACHE }}/secret-retirement/foundation-record.yaml''',
  "TAMOSS_ENV_DIR='{{ env.TASKV_CACHE }}/secret-retirement' helmfile -f deploy/secrets/retirement-helmfile.yaml.gotmpl template > '{{ env.TASKV_CACHE }}/secret-retirement.yaml'",
  "crossplane resource validate '{{ env.TASKV_CACHE }}/schemas' '{{ env.TASKV_CACHE }}/secret-retirement.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results",
  '''yq '.metadata.namespace = "secret-retirement-check" | del(.metadata.annotations) | .spec.template.spec.initContainers[0].image = .spec.template.spec.containers[0].image | .spec.template.spec.initContainers[0].command = ["cp"] | .spec.template.spec.initContainers[0].args = ["/fixture/secrets.json", "/work/secrets.json"] | .spec.template.spec.initContainers[0].env = [] | .spec.template.spec.initContainers[0].volumeMounts += [{"name": "fixture", "mountPath": "/fixture", "readOnly": true}] | .spec.template.spec.volumes += [{"name": "fixture", "configMap": {"name": "secret-inventory"}}]' '{{ env.TASKV_CACHE }}/secret-retirement.yaml' > '{{ env.TASKV_CACHE }}/secret-retirement-fixture.yaml'''',
  '''yq '.metadata.name = "retirement-timeout" | .spec.activeDeadlineSeconds = 30' {{ env.TASKV_CACHE }}/secret-retirement-fixture.yaml > {{ env.TASKV_CACHE }}/secret-retirement-timeout.yaml''',
  '''yq '.metadata.name = "retirement-fetch-failed" | .spec.backoffLimit = 0 | .spec.template.spec.initContainers[0].command = ["false"] | .spec.template.spec.initContainers[0].args = []' {{ env.TASKV_CACHE }}/secret-retirement-fixture.yaml > {{ env.TASKV_CACHE }}/secret-retirement-fetch-failed.yaml''',
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"

["verify:connection-details"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "helm dependency build --skip-refresh charts/database-connection",
  '''yq -n '{"databaseId": "ocid1.postgresqldbsystem.oc1.eu-frankfurt-1.example", "region": "eu-frankfurt-1", "images": {"oci": load("dependencies.yaml").oci.image, "yq": load("dependencies.yaml").connectionDetails.yqImage, "kubectl": load("dependencies.yaml").connectionDetails.kubectlImage}}' > '{{ env.TASKV_CACHE }}/connection-values.yaml'''',
  "helm lint charts/database-connection -f '{{ env.TASKV_CACHE }}/connection-values.yaml'",
  "helm template connection charts/database-connection -n database-connection-check -f '{{ env.TASKV_CACHE }}/connection-values.yaml' > '{{ env.TASKV_CACHE }}/database-connection.yaml'",
  "crossplane resource validate '{{ env.TASKV_CACHE }}/schemas' '{{ env.TASKV_CACHE }}/database-connection.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results",
  '''yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_CACHE }}/database-connection.yaml > {{ env.TASKV_CACHE }}/database-connection-list.yaml''',
