version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT_DIR: '{{.PROJECT_ROOT}}'
  CORE: {sh: 'yq -r ''"xpkg.crossplane.io/crossplane/crossplane:v" + .crossplane.version'' {{.ROOT_DIR}}/dependencies.yaml'}
includes:
  tadoss: {taskfile: ../../deploy/tadoss/Taskfile.yaml, dir: '{{.PROJECT_ROOT}}'}
  verify: {taskfile: ../../tasks/check.yaml, dir: '{{.PROJECT_ROOT}}'}
  gitops: {taskfile: ../../tasks/gitops.yaml, dir: '{{.PROJECT_ROOT}}'}
tasks:
  check:
    cmds:
      - task: tadoss:fetch
      - task: tadoss:bundle
      - task: verify:tadoss
  tls:
    cmds:
      - task: tadoss:tls
  remove-instance:
    cmds:
      - task: tadoss:remove-instance
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
