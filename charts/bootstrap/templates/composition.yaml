apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tamoss-bootstrap
spec:
  compositeTypeRef:
    apiVersion: tamoss.livewyer.io/v1alpha1
    kind: TamossBootstrap
  mode: Pipeline
  pipeline:
    - step: bootstrap
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
{{ .Files.Get "composition.gotmpl" | replace "__SECRET_VALUES__" (.Files.Get "secret-values.yaml" | fromYaml | toJson | quote) | replace "__RETIREMENT__" (.Files.Get "retirement.gotmpl") | replace "__KIND_RETIREMENT__" (.Files.Get "kind-retirement.gotmpl") | replace "__RETIREMENT_IMAGES__" (.Values.connectionImages | default dict | toJson) | replace "__STORAGE_IDENTITY__" (.Files.Get "storage.gotmpl") | indent 12 }}
