deploymentId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
oracle:
  region: eu-frankfurt-1
  vault: ocid1.vault.oc1..example
  compartment: ocid1.compartment.oc1..example
  encryptionKey: ocid1.key.oc1..example
  principalType: UserPrincipal
  auth:
    user: ocid1.user.oc1..example
    tenancy: ocid1.tenancy.oc1..example
    secretRef:
      privatekey: {name: oci-eso, key: privateKey}
      fingerprint: {name: oci-eso, key: fingerprint}
initialise: true
passwords: [database-admin]
imports:
  - name: git-auth
    sourceSecret: git-auth-input
deliveries:
  - name: database-admin
    template:
      passwordType: PLAIN_TEXT
    data:
      - secretKey: password
        remoteKey: database-admin
  - name: git-auth
    data:
      - secretKey: githubAppID
        remoteKey: git-auth
        property: githubAppID
