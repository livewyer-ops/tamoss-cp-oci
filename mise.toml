min_version = "2026.11.3"

[tools]
"aqua:kubernetes-sigs/kind" = "v0.33.0"
"aqua:kubernetes/kubectl" = "v1.37.1"
"aqua:helm/helm" = "v4.3.1"
"aqua:helmfile/helmfile" = "v1.8.2"
"aqua:crossplane/cli" = "v2.5.0"
"aqua:mikefarah/yq" = "v4.54.1"
"aqua:kyverno/chainsaw" = "v0.2.15"
"aqua:tsenart/vegeta" = "v12.13.0"
"aqua:Orange-OpenSource/hurl" = "8.0.1"
"aqua:fluxcd/flux2" = "v2.9.6"
"aqua:cli/cli" = "v2.103.3"
"uv" = "0.13.7"
"pypi:oci-cli" = { "version" = "{{ vars.OCI_VERSION }}", "python" = "3.12" }

[task_config]
shell = "bash -euo pipefail -c"
includes = ["deploy/tadoss/tasks.toml", "deploy/tamoss/tasks.toml", "tasks/application.toml", "tasks/bootstrap.toml", "tasks/check.toml", "tasks/cloud.toml", "tasks/gitops.toml", "tasks/identity.toml", "tasks/lifecycle.toml", "tasks/management.toml", "tasks/qualification.toml", "tasks/runtime.toml", "tasks/setup.toml", "tasks/storage.toml", "tasks/transfer.toml", "tests/bootstrap/tasks.toml", "tests/contracts/handover/tasks.toml", "tests/controller-state/tasks.toml", "tests/flux-bootstrap/tasks.toml", "tests/gitops-key/tasks.toml", "tests/gitops/tasks.toml", "tests/kind-restart/tasks.toml", "tests/lifecycle/tasks.toml", "tests/oke-bootstrap/tasks.toml", "tests/release/tasks.toml", "tests/setup/tasks.toml", "tests/storage-cleanup/tasks.toml", "tests/tadoss/tasks.toml", "tests/s3-credentials/tasks.toml", "tests/storage-identity/tasks.toml", "tests/sequences.toml", "tests/status.toml"]

[vars]
ROOT_DIR = "{{config_root}}"
PROJECT_ROOT = "{{config_root}}"
ROOT = "{{config_root}}"
ENV_DIR = '''{% if env.ENV_DIR | default(value="") %}{{ env.ENV_DIR }}{% else %}{{ config_root }}/.local/environment{% endif %}'''
CHECKOUT = '''{% if env.CHECKOUT | default(value="") %}{{ env.CHECKOUT }}{% else %}{{ config_root }}/.local/gitops{% endif %}'''
STORAGE_DIR = '''{% if env.STORAGE_DIR | default(value="") %}{{ env.STORAGE_DIR }}{% else %}{{ config_root }}/.local/tmp/storage-check{% endif %}'''
ENV_PATH = "{{vars.ENV_DIR | absolute}}"
CHECKOUT_PATH = "{{vars.CHECKOUT | absolute}}"
STORAGE_PATH = "{{vars.STORAGE_DIR | absolute}}"
CORE = '''{% set dependencies = read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") %}xpkg.crossplane.io/crossplane/crossplane:v{{ dependencies.crossplane.version }}'''
OCI_VERSION = '''{% set dependencies = read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") %}{{ dependencies.oci.version }}'''

[tasks."setup"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Install pinned tooling and prepare private deployment settings"
run = [
  "mise run verify:tools",
  "mise run verify:privacy",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run setup:initialise",
]

[tasks."check"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Validate pinned artefacts, composition lifecycle and native deployment configuration"
run = [
  "mise run verify:tools",
  "echo 'Running local checks; reports: .local/reports'",
  "mise run verify:privacy",
  "mkdir -p -m 700 '{{ vars.ROOT_DIR }}/.local/reports'",
  "mise run verify:artifacts",
  "mise run tamoss:fetch",
  "mise run tamoss:release",
  "mise run tamoss:bundle",
  "mise run tadoss:fetch",
  "mise run tadoss:bundle",
  "mise run verify:render",
  "mise run verify:database",
  "mise run tamoss:tls",
  "mise run tadoss:tls",
  "mise run runtime:check",
  "mise run verify:contracts",
  "mise run tamoss:browser-build",
  "mise run tamoss:source-check",
  "chainsaw test --no-cluster --test-dir tests/release --set-string root='{{ vars.ROOT_DIR }}' --report-format JUNIT-TEST --report-path .local/reports --report-name release",
]

[tasks."check:management"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Run local checks and a disposable credential-free Kind bootstrap"
run = [
  "mise run check",
  "mise run management:check",
]

[tasks."check:storage"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Test a real OCI bucket in an authorised compartment, then verify cleanup"
run = [
  "mise run verify:tools",
  "mise run verify:privacy",
  "STORAGE_DIR={{ ((vars.STORAGE_PATH)) | quote }} mise run cloud:storage-run",
]

[tasks."check:storage:cleanup"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Finish an interrupted storage probe's deletion without recording a test pass"
run = [
  "mise run verify:tools",
  "STORAGE_DIR={{ ((vars.STORAGE_PATH)) | quote }} mise run cloud:storage-cleanup",
]

[tasks."up"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Deploy OCI and TAMOSS with Kind retaining infrastructure ownership"
run = [
  "mise run verify:tools",
  "mise run verify:privacy",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run setup:resolve",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} CHECKOUT={{ ((vars.CHECKOUT_PATH)) | quote }} mise run bootstrap:up",
]

[tasks."handover"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Enable GitOps, transfer infrastructure ownership to OKE and stop original Kind"
run = [
  "mise run verify:tools",
  "mise run verify:privacy",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} CHECKOUT={{ ((vars.CHECKOUT_PATH)) | quote }} mise run bootstrap:handover",
]

[tasks."qualify"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Qualify ingest, media reads and availability during one worker drain"
run = [
  '''test -s '{{ vars.ENV_PATH }}/tamoss-release.yaml' || { printf '%s\n' "Selected environment has no TAMOSS release record" >&2; exit 1; }''',
  "mise run verify:tools",
  "mise run verify:privacy",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} CHECKOUT={{ ((vars.CHECKOUT_PATH)) | quote }} mise run bootstrap:qualify",
]

[tasks."down"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Remove hardware and retire secrets, returning GitOps ownership when needed"
run = [
  '''test -f '{{ vars.ENV_DIR }}/management.kubeconfig' || { printf '%s\n' "No selected management kubeconfig; no deletion attempted" >&2; exit 1; }''',
  "mise run verify:tools",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} CHECKOUT={{ ((vars.CHECKOUT_PATH)) | quote }} mise run bootstrap:down",
]
