apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: setup-contracts}
spec:
  steps:
    - name: initialise privately and render deterministic HA defaults without lifetime inputs
      try:
        - command:
            entrypoint: env
            env: &paths [{name: PROJECT_ROOT, value: ($values.root)}]
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:fixture-defaults"]
    - name: reject missing or ambiguous Default identity domains
      try:
        - command:
            entrypoint: yq
            env: &domainpaths [{name: ROOT, value: ($values.root)}]
            args: [-i, '.data = []', $ROOT/.local/tmp/check/setup/discovery/identity-domains.json]
        - command: &domainrender
            entrypoint: mise
            env: *domainpaths
            args: [-C, $ROOT, run, 'test:setup:render']
            check:
              ($error != null): true
              (contains($stderr, 'exactly one active Default identity domain')): true
        - command:
            entrypoint: yq
            env: *domainpaths
            args: [-i, '.data = load(strenv(ROOT) + "/tests/setup/discovery/identity-domains.json").data | .data += .data', $ROOT/.local/tmp/check/setup/discovery/identity-domains.json]
        - command: *domainrender
        - command:
            entrypoint: mise
            env: *domainpaths
            args: [-C, $ROOT, run, 'test:setup:fixture']
    - name: reject ambiguous images
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:ambiguous"]
            check:
              ($error != null): true
              (contains($stderr, 'unavailable or ambiguous')): true
    - name: reject unavailable images
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:unavailable"]
            check:
              ($error != null): true
              (contains($stderr, 'unavailable or ambiguous')): true
    - name: reject unrestricted API access and development configuration
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:fixture"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "CHANGE=.adminCidrs = [\"0.0.0.0/0\"]", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:bad-input"]
            check:
              ($error != null): true
              (contains($stderr, 'adminCidrs')): true
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:fixture"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "CHANGE=.budget = {\"amount\": 50}", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:bad-input"]
            check:
              ($error != null): true
              (contains($stderr, 'budget')): true
    - name: accept automatic identity and reject the removed manual user setting
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:fixture"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ENV_DIR=$PROJECT_ROOT/.local/tmp/check/setup", "OCI_CONFIG=$PROJECT_ROOT/tests/lifecycle/oci-config", "OCI_PROFILE=DEFAULT", "mise", "-C", "$PROJECT_ROOT", "run", "setup:validate"]
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.storage.userId = "ocid1.user.fixture"', $PROJECT_ROOT/.local/tmp/check/setup/values.yaml]
        - command:
            entrypoint: env
            env: *paths
            args: ["ENV_DIR=$PROJECT_ROOT/.local/tmp/check/setup", "OCI_CONFIG=$PROJECT_ROOT/tests/lifecycle/oci-config", "OCI_PROFILE=DEFAULT", "mise", "-C", "$PROJECT_ROOT", "run", "setup:validate"]
            check:
              ($error != null): true
              (contains($stdout, 'userId')): true
    - name: repeat preparation without discovery and reject changes to recorded bootstrap choices
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:fixture-preserve"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:changed"]
            check:
              ($error != null): true
              (contains($stderr, 'already recorded')): true
    - name: retain existing deployment directories
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:recorded"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "mise", "-C", "$PROJECT_ROOT", "run", "test:setup:existing"]
            check:
              ($error != null): true
              (contains($stderr, 'existing deployment')): true
