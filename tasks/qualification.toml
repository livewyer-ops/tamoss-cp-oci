["qualification:drain:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "sleep 10",
  "date -u +%s > '{{ vars.ENV_DIR }}/reports/drain-start'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' drain '{{ env.TASKV_NODE }}' --ignore-daemonsets --delete-emptydir-data --timeout=180s",
  "date -u +%s > '{{ vars.ENV_DIR }}/reports/drain-end'",
  '''{% for item in ["api", "ui", "worker", "console"] %}
kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams rollout status deployment/tams-{{ item }} --timeout=60s
{% endfor %}''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams wait tamoss/tamoss --for=condition=Ready --timeout=60s",
]
env.TASKV_NODE = '''{% if env.NODE is defined %}{{ env.NODE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "kubectl --kubeconfig " ~ (vars.ENV_DIR) ~ "/remote.kubeconfig -n tams get pods -l tamoss.livewyer.io/replica-set=api -o json | yq -p=json -e -r '[.items[] | select(.status.phase == \"Running\") | .spec.nodeName] | .[0]'") }}{% endif %}'''
depends_post = ["qualification:drain:cleanup"]

["qualification:drain:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} NODE={{ ((env.TASKV_NODE)) | quote }} mise run qualification:restore-node",
]
env.TASKV_NODE = '''{% if env.NODE is defined %}{{ env.NODE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "kubectl --kubeconfig " ~ (vars.ENV_DIR) ~ "/remote.kubeconfig -n tams get pods -l tamoss.livewyer.io/replica-set=api -o json | yq -p=json -e -r '[.items[] | select(.status.phase == \"Running\") | .spec.nodeName] | .[0]'") }}{% endif %}'''

