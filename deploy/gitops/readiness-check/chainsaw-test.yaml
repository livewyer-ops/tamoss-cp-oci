apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: deployment-ready}
spec:
  steps:
    - name: observe the selected environment revision
      try:
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: GitRepository
              metadata: {name: environment, namespace: flux-system}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              status:
                (ends_with(artifact.revision || '', $values.revision)): true
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata: {name: environment, namespace: flux-system}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              status:
                (ends_with(lastAppliedRevision || '', $values.revision)): true
                (conditions[?type == 'Ready'] | [0].status): 'True'
    - name: observe infrastructure and runtime revisions before accepting existing releases
      try:
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata: {name: infrastructure, namespace: tamoss-infra}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              status:
                (ends_with(lastAppliedRevision || '', $values.revision)): true
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata: {name: runtime, namespace: tamoss-infra}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              status:
                (ends_with(lastAppliedRevision || '', $values.revision)): true
                (conditions[?type == 'Ready'] | [0].status): 'True'
    - name: observe the selected product and its chart
      try:
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: GitRepository
              metadata: {name: tamoss-product, namespace: flux-system}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              (ends_with(status.artifact.revision || '', spec.ref.commit)): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: HelmChart
              metadata: {name: tamoss-infra-tamoss-gitops, namespace: flux-system}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              (status.observedSourceArtifactRevision == x_k8s_get($client, 'source.toolkit.fluxcd.io/v1', 'GitRepository', 'flux-system', 'tamoss-product').status.artifact.revision): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
    - name: observe the current values and rendered workload health
      try:
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata: {name: tamoss-gitops, namespace: tamoss-infra}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              (status.lastAttemptedRevision == x_k8s_get($client, 'source.toolkit.fluxcd.io/v1', 'HelmChart', 'flux-system', 'tamoss-infra-tamoss-gitops').status.artifact.revision): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata: {name: deployment-ready, namespace: flux-system}
              (spec.suspend != `true`): true
              (status.observedGeneration == metadata.generation): true
              (status.lastAppliedRevision == x_k8s_get($client, 'source.toolkit.fluxcd.io/v1', 'GitRepository', 'flux-system', 'tamoss-product').status.artifact.revision): true
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
