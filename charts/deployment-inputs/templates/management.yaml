{{- if and (or .Values.files.bootstrap .Values.files.foundation) .Values.files.packages }}
dependencies:
{{ .Values.files.dependencies | fromYaml | toYaml | indent 2 }}
packages:
{{ .Values.files.packages | fromYaml | toYaml | indent 2 }}
externalSecrets:
{{ .Values.files.externalSecrets | fromYaml | toYaml | indent 2 }}
product:
{{ (.Values.files.product | fromYaml).product | toYaml | indent 2 }}
assets:
{{ include "deployment.assets" . | indent 2 }}
credentialsEstablished: {{ (.Values.files.identity | fromYaml).credentialsEstablished | default false }}
instance:
{{ (.Values.files.bootstrap | default (include (print .Template.BasePath "/bootstrap.yaml") .)) | fromYaml | toYaml | indent 2 }}
{{- end }}
