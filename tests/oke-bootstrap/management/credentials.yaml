apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: tamoss-secrets, namespace: tamoss-infra}
spec:
  suspend: true
  interval: 1m
  chart: {spec: {chart: unused, sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}}}
  values: {initialise: false}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: tamoss-bootstrap-product, namespace: tamoss-infra}
spec:
  suspend: true
  interval: 1m
  url: https://github.com/example/fixture
