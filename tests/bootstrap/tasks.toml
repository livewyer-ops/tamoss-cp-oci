["test:bootstrap:reject-replaced-root:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''yq -i '.bootstrapUID = "replaced-root"' {{ env.TASKV_DIRECTORY }}/management/identity.yaml''',
  "mise run test:bootstrap:observe",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap{% endif %}"
depends_post = ["test:bootstrap:reject-replaced-root:cleanup"]

