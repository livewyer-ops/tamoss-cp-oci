apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: controller-state-conflicts}
spec:
  timeouts: {exec: 60s}
  steps:
    - name: refuse changing established creation bindings
      try:
        - command:
            entrypoint: crossplane
            env: &paths
              - {name: ROOT, value: ($values.root)}
              - {name: DIRECTORY, value: ($values.directory)}
              - {name: CORE, value: ($values.core)}
            args: [composition, render, $DIRECTORY/creation.yaml, $ROOT/.local/tmp/check/composition.yaml, $ROOT/.local/tmp/check/functions.yaml, --observed-resources, $DIRECTORY/changed.yaml, --crossplane-image, $CORE]
            check:
              ($error != null): true
              (contains($stderr, 'Established adoption bindings differ')): true
    - name: refuse a different Vault readback
      try:
        - command:
            entrypoint: crossplane
            env: *paths
            args: [composition, render, $ROOT/.local/tmp/check/bootstrap/native-root.yaml, $ROOT/.local/tmp/check/bootstrap/native-composition.yaml, $ROOT/.local/tmp/check/functions.yaml, --observed-resources, $DIRECTORY/bootstrap-observed.yaml, --required-resources, $DIRECTORY/wrong-readback.yaml, --crossplane-image, $CORE]
            check:
              ($error != null): true
              (contains($stderr, 'Vault adoption bindings differ')): true
