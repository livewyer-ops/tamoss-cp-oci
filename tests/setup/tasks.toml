
["test:setup:check"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "chainsaw test --no-cluster --test-dir '{{ vars.ROOT }}/tests/setup/contracts' --exec-timeout 120s --set-string root='{{ vars.ROOT }}' --report-format JUNIT-TEST --report-path '{{ vars.ROOT }}/.local/reports' --report-name setup",
]

["test:setup:fixture"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "rm -rf '{{ env.TASKV_DIRECTORY }}'",
  "ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} mise run setup:initialise",
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}')" = 700''',
  '''test "$(stat -c '%a' '{{ env.TASKV_DIRECTORY }}/values.yaml')" = 600''',
  '''yq -i '.name = "setup-test" | .compartmentId = "ocid1.compartment.oc1.fixture" | .contactEmail = "operator@example.test" | .adminCidrs = ["192.0.2.10/32"]' '{{ env.TASKV_DIRECTORY }}/values.yaml'''',
  "cp '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/before-setup.yaml'",
  "ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} mise run setup:initialise",
  "cmp '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/before-setup.yaml'",
  "install -d -m 700 '{{ env.TASKV_DIRECTORY }}/discovery'",
  "cp '{{ vars.ROOT }}/tests/setup/discovery/'* '{{ env.TASKV_DIRECTORY }}/discovery/'",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:render"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} mise run setup:render",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:defaults"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run test:setup:render",
  '''yq -e '[.metadata.name == "setup-test", .spec.region == "eu-frankfurt-1", .spec.owner == "operator@example.test", .spec.expiresAt == null, .spec.budget == null, .spec.oke.imageId == "ocid1.image.oc1.fixture", (.spec.oke.placements | length == 3), .spec.oke.placements[0].availabilityDomain == "fixture:AD-1", .spec.oke.ocpus == 4, .spec.database.ocpus == 2, .spec.storage.bucket == "tamoss-setup-test-media"] | all' '{{ env.TASKV_DIRECTORY }}/setup-render/setup/templates/environment.yaml'''',
  "yq -e '.product.commit != null and .tadoss.bundle.digest != null and .url == null' {{ env.TASKV_DIRECTORY }}/setup-render/setup/templates/product.yaml",
  '''yq -e '.spec.region == "eu-frankfurt-1" and .spec.owner == "operator@example.test"' {{ env.TASKV_DIRECTORY }}/setup-render/setup/templates/foundation.yaml''',
  "cp '{{ env.TASKV_DIRECTORY }}/setup-render/setup/templates/environment.yaml' '{{ env.TASKV_DIRECTORY }}/before-reorder.yaml'",
  "yq -i '.data |= reverse' {{ env.TASKV_DIRECTORY }}/discovery/domains.json",
  "mise run test:setup:render",
  "cmp '{{ env.TASKV_DIRECTORY }}/before-reorder.yaml' '{{ env.TASKV_DIRECTORY }}/setup-render/setup/templates/environment.yaml'",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:ambiguous"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "yq -i '.data.sources += .data.sources' {{ env.TASKV_DIRECTORY }}/discovery/node-options.json",
  "mise run test:setup:render",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:unavailable"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "yq -i '.data.sources = []' {{ env.TASKV_DIRECTORY }}/discovery/node-options.json",
  "mise run test:setup:render",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:bad-input"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "yq -i '{{ env.TASKV_CHANGE }}' {{ env.TASKV_DIRECTORY }}/values.yaml",
  "mise run test:setup:render",
]
env.TASKV_CHANGE = '''{{ env.CHANGE | default(value="") }}'''
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:preserve"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run test:setup:render",
  "install -m 600 '{{ env.TASKV_DIRECTORY }}/values.yaml' '{{ env.TASKV_DIRECTORY }}/setup-values.yaml'",
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/checkout/.git'",
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} CHECKOUT={{ ((env.TASKV_DIRECTORY) ~ "/checkout") | quote }} mise run setup:resolve''',
  "test -s '{{ env.TASKV_DIRECTORY }}/environment.yaml'",
  "rm '{{ env.TASKV_DIRECTORY }}/foundation.yaml'",
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} CHECKOUT={{ ((env.TASKV_DIRECTORY) ~ "/checkout") | quote }} mise run setup:resolve''',
  "test -s '{{ env.TASKV_DIRECTORY }}/foundation.yaml'",
  '''yq -i '.name = "changed"' {{ env.TASKV_DIRECTORY }}/values.yaml''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:changed"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY)) | quote }} CHECKOUT={{ ((env.TASKV_DIRECTORY) ~ "/checkout") | quote }} mise run setup:resolve''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:recorded"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/recorded/checkout/.git'",
  '''yq -n '{"gitopsEstablished": true}' > {{ env.TASKV_DIRECTORY }}/recorded/identity.yaml''',
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/recorded") | quote }} CHECKOUT={{ ((env.TASKV_DIRECTORY) ~ "/recorded/checkout") | quote }} mise run setup:resolve''',
  "test ! -e '{{ env.TASKV_DIRECTORY }}/recorded/values.yaml'",
  "test ! -e '{{ env.TASKV_DIRECTORY }}/recorded/discovery'",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"

["test:setup:existing"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/old'",
  "touch '{{ env.TASKV_DIRECTORY }}/old/identity.yaml'",
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/old") | quote }} mise run setup:initialise''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/setup{% endif %}"
