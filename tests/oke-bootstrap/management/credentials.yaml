apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: tamoss-secrets, namespace: tamoss-infra}
spec:
  suspend: true
  interval: 1m
  chart: {spec: {chart: unused, sourceRef: {kind: Bucket, name: tamoss-bootstrap-product}}}
  values: {initialise: false}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: Bucket
metadata: {name: tamoss-bootstrap-product, namespace: tamoss-infra}
spec:
  suspend: true
  interval: 1m
  provider: generic
  bucketName: fixture
  endpoint: storage.example.invalid
  secretRef: {name: asset-reader}
