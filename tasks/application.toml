
["application:remove-instance"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} RESOURCE_NAMESPACE={{ ("tams") | quote }} CRD={{ ("ingestruns.tamoss.livewyer.io") | quote }} RESOURCE={{ ("ingestrun/qualification") | quote }} mise run application:remove-resource''',
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} RESOURCE_NAMESPACE={{ ("tams") | quote }} CRD={{ ("storagebackends.tamoss.livewyer.io") | quote }} RESOURCE={{ ("storagebackend/tams-storage-default") | quote }} mise run application:remove-resource''',
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} RESOURCE_NAMESPACE={{ ("tams") | quote }} CRD={{ ("tamosses.tamoss.livewyer.io") | quote }} RESOURCE={{ ("tamoss/tamoss") | quote }} mise run application:remove-resource''',
]

["application:remove-resource:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(RESOURCE="$(kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' get crd "${TASKV_CRD}" --ignore-not-found -o name)" && test -z "$RESOURCE")'''
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  '''yq -n '{"workloads": [{"namespace": "{{ env.TASKV_RESOURCE_NAMESPACE }}", "resource": "{{ env.TASKV_CRD }}", "name": "{{ env.TASKV_RESOURCE | split(pat="/") | last }}"}]}' > '{{ vars.ENV_DIR }}/retirement-values.yaml'''',
  { task = "retirement:run" },
]
env.TASKV_CRD = '''{{ env.CRD | default(value="") }}'''
env.TASKV_RESOURCE = '''{{ env.RESOURCE | default(value="") }}'''
env.TASKV_RESOURCE_NAMESPACE = '''{{ env.RESOURCE_NAMESPACE | default(value="") }}'''

["application:remove-resource"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_RESOURCE_NAMESPACE | quote }} || { printf '%s\n' "Missing required input: RESOURCE_NAMESPACE" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_CRD | quote }} || { printf '%s\n' "Missing required input: CRD" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_RESOURCE | quote }} || { printf '%s\n' "Missing required input: RESOURCE" >&2; exit 1; }''',
  "mise run application:remove-resource:apply",
]
env.TASKV_CRD = '''{{ env.CRD | default(value="") }}'''
env.TASKV_RESOURCE = '''{{ env.RESOURCE | default(value="") }}'''
env.TASKV_RESOURCE_NAMESPACE = '''{{ env.RESOURCE_NAMESPACE | default(value="") }}'''
