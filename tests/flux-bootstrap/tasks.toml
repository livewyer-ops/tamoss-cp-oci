dir = "{{ vars.ROOT_DIR }}"
run = [
  "install -m 600 /dev/null '{{ env.TASKV_DIRECTORY }}/restart-input.kubeconfig'",
  "DIRECTORY={{ env.TASKV_DIRECTORY | quote }} FLUX_VERSION={{ env.TASKV_FLUX_VERSION | quote }} NAME={{ env.TASKV_NAME | quote }} mise run test:flux-bootstrap:restart:protected",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check/flux-bootstrap{% endif %}"
