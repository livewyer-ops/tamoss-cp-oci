min_version = "2026.11.3"

[tools]
"aqua:kubernetes-sigs/kind" = "v0.33.0"
"aqua:kubernetes/kubectl" = "v1.37.1"
"aqua:helm/helm" = "v4.3.1"
"aqua:helmfile/helmfile" = "v1.8.2"
"aqua:crossplane/cli" = "v2.5.0"
"aqua:mikefarah/yq" = "v4.54.1"
"aqua:kyverno/chainsaw" = "v0.2.15"
"aqua:tsenart/vegeta" = "v12.13.0"
"aqua:Orange-OpenSource/hurl" = "8.0.1"
"aqua:fluxcd/flux2" = "v2.9.6"
"aqua:cli/cli" = "v2.103.3"
"uv" = "0.13.7"
"pypi:oci-cli" = { "version" = "{{ vars.OCI_VERSION }}", "python" = "3.12" }

[env]
OCI_CLI_CONFIG_FILE = '{{ env.OCI_CLI_CONFIG_FILE | default(value=env.HOME ~ "/.oci/config") }}'
OCI_CLI_PROFILE = '{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}'

[task_config]
shell = "bash -euo pipefail -c"
includes = ["deploy/tamoss/tasks.toml", "tasks/account.toml", "tasks/assets.toml", "tasks/bootstrap.toml", "tasks/check.toml", "tasks/identity.toml", "tasks/lifecycle.toml", "tasks/management.toml", "tasks/runtime.toml", "tasks/setup.toml", "tasks/source.toml", "tasks/seed.toml", "tests/account/tasks.toml", "tests/bootstrap/tasks.toml", "tests/controller-state/tasks.toml", "tests/kind-restart/tasks.toml", "tests/setup/tasks.toml", "tests/source/tasks.toml", "tests/s3-credentials/tasks.toml", "tests/storage-identity/tasks.toml", "tests/sequences.toml"]

[vars]
ROOT_DIR = "{{config_root}}"
ENV_DIR = '''{% if env.ENV_DIR | default(value="") %}{{ env.ENV_DIR | absolute }}{% else %}{{ config_root }}/.local/environment{% endif %}'''
ENV_PATH = "{{vars.ENV_DIR | absolute}}"
CORE = '''{% set dependencies = read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") %}{{ dependencies.crossplane.imageRepository }}:v{{ dependencies.crossplane.version }}'''
OCI = "oci --connection-timeout 10 --read-timeout 30 --max-retries 0"
OCI_VERSION = '''{% set dependencies = read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") %}{{ dependencies.oci.version }}'''

[tasks."setup"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Prepare private deployment settings and discover OCI values"
usage = '''
flag "--compartment-id <ocid>" help="OCID of the empty deployment compartment"
flag "--contact-email <email>" help="Operator contact address"
'''
depends = ["setup:initialise"]
run = [
  """COMPARTMENT="${usage_compartment_id:-}" CONTACT="${usage_contact_email:-}" yq -i 'with(select(strenv(COMPARTMENT) != ""); .compartmentId = strenv(COMPARTMENT)) | with(select(strenv(CONTACT) != ""); .contactEmail = strenv(CONTACT))' '{{ vars.ENV_DIR }}/values.yaml'""",
  { task = "setup:discover" },
  """yq -e '(.compartmentId // "") as $c | (.contactEmail // "") as $e | [($c | test("^ocid1[.]compartment[.]")), ($c | test("REPLACE") | not), ($e | test("@")), ($e | test("[.]invalid$") | not)] | all' '{{ vars.ENV_DIR }}/values.yaml' > /dev/null 2>&1 && echo 'Settings are ready in {{ vars.ENV_DIR }}/values.yaml. Review them, then run: mise run up' || echo 'Enter compartmentId and contactEmail in {{ vars.ENV_DIR }}/values.yaml, then run: mise run up'""",
]

[tasks."up"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Create a fresh deployment and wait for public HTTPS"
run = [
  { task = "preflight" },
  { task = "bootstrap:install" },
  { task = "bootstrap:access" },
  { task = "management:stop-kind" },
]

