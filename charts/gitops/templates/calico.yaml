apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: calico, namespace: tamoss-infra}
spec:
  interval: 10m
  timeout: 5m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product, namespace: tamoss-infra}
  path: ./deploy/calico
  healthChecks:
    - {apiVersion: apps/v1, kind: DaemonSet, name: calico-node, namespace: kube-system}
{{- if .Values.retirementId }}
  patches:
{{ include "gitops.retirementBudgetPatch" (dict "field" "maxUnavailable" "value" "100%") | indent 4 }}
{{- end }}
