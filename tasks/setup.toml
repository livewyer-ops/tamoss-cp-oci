["setup:initialise"]
hide = true
skip_if = "test -s '{{ vars.ENV_DIR }}/values.yaml'"
run = [
  "test ! -e '{{ vars.ENV_DIR }}/identity.yaml' || { echo 'Retain the existing deployment directory; use a fresh ENV_DIR for setup.' >&2; exit 1; }",
  "install -d -m 700 '{{ vars.ENV_DIR }}'",
  "install -m 600 environments/example/values.yaml '{{ vars.ENV_DIR }}/'",
  "echo 'Complete {{ vars.ENV_DIR }}/values.yaml and configure your OCI profile, then run mise run up.'",
]

["setup:resolve"]
hide = true
depends = ["assets:fetch"]
run = [
  "install -d -m 700 '{{ vars.ENV_DIR }}/discovery' '{{ vars.ENV_DIR }}/reports' '{{ vars.ENV_DIR }}/access'",
  '''umask 077
OCI_PROFILE={{ env.TASKV_PROFILE | quote }} yq -p=ini '(. * (.[strenv(OCI_PROFILE)] // {})) | {"region": .region, "tenancy": .tenancy, "oci": {"region": .region, "tenancy": .tenancy, "user": .user, "fingerprint": .fingerprint, "privateKey": load_str(.key_file), "privateKeyPassword": .pass_phrase}}' {{ env.TASKV_CONFIG | quote }} > '{{ vars.ENV_DIR }}/discovery/profile.yaml'''',
]
env.TASKV_CONFIG = '''{{ env.OCI_CONFIG | default(value=env.OCI_CLI_CONFIG_FILE | default(value=env.HOME ~ "/.oci/config")) }}'''
env.TASKV_PROFILE = '''{{ env.OCI_PROFILE | default(value=env.OCI_CLI_PROFILE | default(value="DEFAULT")) }}'''

["setup:render"]
hide = true
run = [
  '''umask 077
yq -n '{"oci": (load("{{ vars.ENV_DIR }}/discovery/profile.yaml").oci | pick(["region", "tenancy", "user", "fingerprint"])), "product": load("{{ vars.RELEASE_DIR }}/build.yaml").product, "bundles": {"tamoss": load("{{ vars.RELEASE_DIR }}/deploy/tamoss/release.yaml").bundle, "tadoss": load("{{ vars.RELEASE_DIR }}/deploy/tadoss/release.yaml").bundle}}' > '{{ vars.ENV_DIR }}/discovery/values.yaml'
helm template setup '{{ vars.RELEASE_DIR }}/charts/setup' -f '{{ vars.ENV_DIR }}/values.yaml' -f '{{ vars.ENV_DIR }}/discovery/values.yaml' --output-dir '{{ vars.ENV_DIR }}/setup-render'''',
]

["bootstrap:configuration"]
hide = true
depends = ["setup:resolve"]
run = [
  { task = "setup:render" },
  "cp '{{ vars.ENV_DIR }}/setup-render/setup/templates/'*.yaml '{{ vars.ENV_DIR }}/'",
  "helm template inputs '{{ vars.RELEASE_DIR }}/charts/deployment-inputs' --show-only templates/asset-lock.yaml --set-file files.source='{{ vars.ENV_DIR }}/source.json',files.pins='{{ vars.RELEASE_DIR }}/pins.yaml' > '{{ vars.ENV_DIR }}/assets.lock.yaml'",
  "cp '{{ vars.RELEASE_DIR }}/deploy/tamoss/release.yaml' '{{ vars.ENV_DIR }}/tamoss-release.yaml'",
]
