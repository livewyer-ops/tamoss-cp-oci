  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/oke-connection.json'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get secret oke-connection -o json > '{{ vars.ENV_DIR }}/oke-connection.json'",
  '''yq -p=json -e 'load("{{ vars.ENV_DIR }}/identity.yaml") as $i | select(.metadata.annotations."tamoss.livewyer.io/deployment-id" == $i.deploymentUID) | (.data.clusterID | @base64d) as $id | [.data.complete == "dHJ1ZQ==", .metadata.annotations."tamoss.livewyer.io/cluster-id" == $id, ($i.clusterID == null or $i.clusterID == $id), (load("{{ vars.ENV_DIR }}/owned-current.yaml") | map(.id) | contains([$id])), ($i.remoteUID == null or ($i.remoteUID == (.data.remoteUID | @base64d) and $i.remoteServer == (.data.remoteServer | @base64d)))] | all' '{{ vars.ENV_DIR }}/oke-connection.json' > /dev/null''',
  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/remote.pending.kubeconfig'",
  "yq -p=json -r '.data.kubeconfig | @base64d' '{{ vars.ENV_DIR }}/oke-connection.json' > '{{ vars.ENV_DIR }}/remote.pending.kubeconfig'",
  '''yq -e 'load("{{ vars.ENV_DIR }}/oke-connection.json").data as $d | [.users[0].user.exec.command == "oci", (.users[0].user.exec.args | contains([($d.clusterID | @base64d)])), .clusters[0].cluster.server == ($d.remoteServer | @base64d), .clusters[0].cluster."insecure-skip-tls-verify" != true] | all' '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' > /dev/null''',
  '''yq -i '.users[].user.exec.env = [{"name": "OCI_CLI_CONFIG_FILE", "value": strenv(OCI_CLI_CONFIG_FILE)}, {"name": "OCI_CLI_PROFILE", "value": strenv(OCI_CLI_PROFILE)}]' '{{ vars.ENV_DIR }}/remote.pending.kubeconfig'''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' get namespace kube-system -o json | yq -p=json -e '.metadata.uid == (load("{{ vars.ENV_DIR }}/oke-connection.json").data.remoteUID | @base64d)' > /dev/null''',
  '''yq -i 'load("{{ vars.ENV_DIR }}/oke-connection.json").data as $d | .clusterID = ($d.clusterID | @base64d) | .remoteUID = ($d.remoteUID | @base64d) | .remoteServer = ($d.remoteServer | @base64d)' '{{ vars.ENV_DIR }}/identity.yaml'''',
  "mv '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' '{{ vars.ENV_DIR }}/remote.kubeconfig'",
]
