  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait vault.kms.oci.m.upbound.io/{{ env.TASKV_NAME }} key.kms.oci.m.upbound.io/{{ env.TASKV_NAME }} --for=condition=Synced --timeout=300s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get secretfoundation/{{ env.TASKV_NAME }} -o json > '{{ vars.ENV_DIR }}/foundation-observed.json'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get key.kms.oci.m.upbound.io/{{ env.TASKV_NAME }} -o json > '{{ vars.ENV_DIR }}/foundation-key.json'",
  '''yq -e '[.status.vaultId, .status.keyId, .status.managementEndpoint] | [.[] | (tag == "!!str" and length > 0)] | all' '{{ vars.ENV_DIR }}/foundation-observed.json' > /dev/null''',
