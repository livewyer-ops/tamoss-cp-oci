apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: tamoss-gitops-bootstrap, namespace: tamoss-infra}
spec:
  interval: 5m
  timeout: 10m
  releaseName: tamoss-gitops-bootstrap
  install:
    disableWait: true
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  upgrade:
    disableWait: true
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  chart:
    spec:
      chart: ./charts/gitops-bootstrap
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: tamoss-product, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: tamoss-gitops-values, valuesKey: values.yaml}
  values:
    vaultId: ${VAULT_ID}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform-defaults, namespace: flux-system}
spec:
  interval: 1m
  timeout: 2m
  prune: true
  path: ./deploy/gitops/platform-defaults
  sourceRef: {kind: GitRepository, name: tamoss-product}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: infrastructure, namespace: tamoss-infra}
spec:
  interval: 5m
  timeout: 15m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: environment, namespace: flux-system}
  path: REPLACE
  dependsOn: [{name: adoption-bindings}]
  postBuild:
    substituteFrom: [{kind: Secret, name: adoption-bindings}]
  healthChecks:
    - {apiVersion: tamoss.livewyer.io/v1alpha1, kind: TamossEnvironment, name: REPLACE, namespace: tamoss-infra}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: runtime, namespace: tamoss-infra}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 15m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: environment, namespace: flux-system}
  path: REPLACE
  dependsOn: [{name: infrastructure}, {name: platform-defaults, namespace: flux-system}]
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: tamoss-runtime}]
    substitute:
      VAULT_ID: ${VAULT_ID}
      VALUES_CONFIGMAP: tamoss-gitops-values
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: tamoss-gitops, namespace: tamoss-infra}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: infrastructure-controllers, namespace: flux-system}
spec:
  interval: 1m
  timeout: 10m
  prune: false
  path: ./deploy/gitops/readiness
  sourceRef: {kind: GitRepository, name: tamoss-product}
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: tamoss-environment-api, namespace: crossplane-system}
    - {apiVersion: pkg.crossplane.io/v1, kind: Provider, name: provider-oci-networking}
    - {apiVersion: pkg.crossplane.io/v1, kind: Provider, name: provider-oci-containerengine}
    - {apiVersion: pkg.crossplane.io/v1, kind: Provider, name: provider-oci-psql}
    - {apiVersion: pkg.crossplane.io/v1, kind: Provider, name: provider-oci-objectstorage}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: database-admin, namespace: tamoss-infra}
