passwords: [database-admin, tams-database, authentik-secret-key, authentik-password, authentik-token, authentik-database]
imports:
  - {name: github-app, sourceSecret: github-app-input}
  - {name: ghcr, sourceSecret: ghcr-input}
  - {name: s3, sourceSecret: s3-input}
deliveries:
  - name: database-admin
    template: {passwordType: PLAIN_TEXT}
    data: [{secretKey: password, remoteKey: database-admin}]
  - name: tams-database
    data: [{secretKey: password, remoteKey: tams-database}]
  - name: authentik-secret-key
    data: [{secretKey: password, remoteKey: authentik-secret-key}]
  - name: authentik-password
    data: [{secretKey: password, remoteKey: authentik-password}]
  - name: authentik-token
    data: [{secretKey: password, remoteKey: authentik-token}]
  - name: authentik-database
    data: [{secretKey: password, remoteKey: authentik-database}]
  - name: github-app
    data:
      - {secretKey: githubAppID, remoteKey: github-app, property: githubAppID}
      - {secretKey: githubAppInstallationID, remoteKey: github-app, property: githubAppInstallationID}
      - {secretKey: githubAppPrivateKey, remoteKey: github-app, property: githubAppPrivateKey}
  - name: ghcr
    type: kubernetes.io/dockerconfigjson
    data: [{secretKey: .dockerconfigjson, remoteKey: ghcr, property: dockerconfigjson}]
  - name: s3
    data:
      - {secretKey: accessKey, remoteKey: s3, property: accessKey}
      - {secretKey: secretKey, remoteKey: s3, property: secretKey}
