apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tamoss-infra
secretGenerator:
  - name: github-app-input
    files: [githubAppID=github-app-id, githubAppInstallationID=github-app-installation-id, githubAppPrivateKey=github-app-private-key]
  - name: ghcr-input
    files: [dockerconfigjson=ghcr-dockerconfigjson]
  - name: s3-input
    files: [accessKey=s3-access-key, secretKey=s3-secret-key]
generatorOptions:
  disableNameSuffixHash: true
