apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: interruption-barrier, namespace: oke-check}
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [oke-connection]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: interruption-barrier, namespace: oke-check}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: interruption-barrier}
subjects:
  - {kind: ServiceAccount, name: oke-bootstrap, namespace: oke-check}
