apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: handover-contracts
spec:
  timeouts: {exec: 30s}
  steps:
    - name: render a complete observe-only destination without copied status
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/adoption-render-list.yaml, -f, render.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/adoption-return-render-list.yaml, -f, return.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/workload-identity-list.yaml, -f, workload-identity.yaml]
    - name: refuse incomplete adoption at schema and composition boundaries
      try:
        - command:
            entrypoint: crossplane
            env: &crossplane
              - {name: CROSSPLANE_IMAGE, value: ($values.crossplaneImage)}
            args: [resource, validate, ../../charts/environment/definition.yaml, ../../.local/tmp/check/adoption-missing.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --cache-dir=../../.local/tmp/check/crossplane, --error-on-missing-schemas]
            check:
              ($error != null): true
              (contains($stdout, 'failure cases')): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption-missing.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE]
            check:
              ($error != null): true
              (contains($stderr, 'complete external-name binding set')): true
    - name: reject a wrong deployment or bucket identity
      try:
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption-wrong-identity.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE]
            check:
              ($error != null): true
              (contains($stderr, 'Adoption deployment identity')): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption-wrong-bucket.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE]
            check:
              ($error != null): true
              (contains($stderr, 'Bucket external name')): true
    - name: preserve external identity and creator tags after an interrupted transfer
      try:
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --observed-resources=../../.local/tmp/check/adoption-observed.yaml]
            check:
              ($error == null): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --observed-resources=../../.local/tmp/check/adoption-conflict.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'Observed external name differs')): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --observed-resources=../../.local/tmp/check/adoption-wrong-owner.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'Observed ownership tag differs')): true
    - name: reject an adopted environment in the local lifecycle
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../environments/example/environment.yaml, -f, ../../deploy/contracts/local-owner.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/adoption.yaml, -f, ../../deploy/contracts/local-owner.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'assertion failed')): true
    - name: require complete non-writing inventories with no active operation
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/transfer/management-resources.json, -f, ../../deploy/contracts/quiesced.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/transfer/management-resources.json, -f, ../../deploy/contracts/quiesce-input.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/transfer/ongoing.yaml, -f, ../../deploy/contracts/quiesced.yaml]
            check: {($error != null): true}
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/transfer/writer.yaml, -f, ../../deploy/contracts/quiesced.yaml]
            check: {($error != null): true}
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/transfer/incomplete.yaml, -f, ../../deploy/contracts/quiesced.yaml]
            check: {($error != null): true}
    - name: compare provider configuration as well as external identities
      try:
        - command: &compare
            entrypoint: task
            env:
              - {name: PROJECT_ROOT, value: ($values.root)}
            args: [-d, $PROJECT_ROOT, -t, $PROJECT_ROOT/tasks/transfer.yaml, compare, 'ENV_DIR=$PROJECT_ROOT/.local/tmp/check/transfer']
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PublicIp"); .status.atProvider.ipAddress = "192.0.2.1" | .status.atProvider.state = "AVAILABLE" | .status.atProvider.assignedEntityType = "")', ../../.local/tmp/check/transfer/management-resources.json]
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PublicIp"); .spec.forProvider.privateIpId = "ocid1.privateip.oc1..loadbalancer" | .status.atProvider.ipAddress = "192.0.2.1" | .status.atProvider.state = "ASSIGNED" | .status.atProvider.assignedEntityType = "PRIVATE_IP" | .status.atProvider.assignedEntityId = "ocid1.privateip.oc1..loadbalancer" | .status.atProvider.privateIpId = "ocid1.privateip.oc1..loadbalancer")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command: *compare
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "Bucket"); .status.atProvider.approximateCount = "3" | .status.atProvider.approximateSize = "32000")', ../../.local/tmp/check/transfer/management-resources.json]
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "Bucket"); .status.atProvider.approximateCount = "5" | .status.atProvider.approximateSize = "51364")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command: *compare
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "Bucket"); .spec.forProvider.accessType = "ObjectRead")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            <<: *compare
            check:
              ($error != null): true
              (contains($stderr, 'accessType')): true
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "Bucket"); .spec.forProvider.accessType = "NoPublicAccess")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PublicIp"); .status.atProvider.ipAddress = "192.0.2.2")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            <<: *compare
            check:
              ($error != null): true
              (contains($stderr, 'ipAddress')): true
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PublicIp"); .status.atProvider.ipAddress = "192.0.2.1" | .status.atProvider.id = "ocid1.publicip.oc1..unrelated")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            <<: *compare
            check:
              ($error != null): true
              (contains($stderr, 'atProvider.id')): true
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PublicIp"); .status.atProvider.id = "ocid1.test.oc1..public-ip")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .spec.forProvider.credentials = .spec.initProvider.credentials | del(.spec.initProvider.credentials))', ../../.local/tmp/check/transfer/management-resources.json]
        - command: *compare
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .spec.initProvider.credentials[0].passwordDetails[0].passwordSecretRef.name = "wrong-secret")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            <<: *compare
            check:
              ($error != null): true
              (contains($stderr, 'passwordSecretRef.name')): true
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .spec.initProvider.credentials[0].passwordDetails[0].passwordSecretRef.name = load("../../.local/tmp/check/adoption.yaml").spec.database.credentialsSecret)', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .status.atProvider.adminUsername = "bootstrap_admin" | .status.atProvider.credentials = [{"username": "bootstrap_admin"}])', ../../.local/tmp/check/transfer/management-resources.json]
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .status.atProvider.adminUsername = "bootstrap_admin" | .status.atProvider.credentials = [{"username": ""}])', ../../.local/tmp/check/transfer/remote-resources.json]
        - command: *compare
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .status.atProvider.adminUsername = "wrong-admin")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            <<: *compare
            check:
              ($error != null): true
              (contains($stderr, 'adminUsername')): true
        - command:
            entrypoint: yq
            args: [-i, 'with(.resources[] | select(.kind == "PsqlDbSystem"); .status.atProvider.adminUsername = "bootstrap_admin")', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            entrypoint: yq
            args: [-i, '.resources[0].spec.forProvider.displayName = "unexpected-change"', ../../.local/tmp/check/transfer/remote-resources.json]
        - command:
            <<: *compare
            check:
              ($error != null): true
              (contains($stderr, 'displayName')): true
      finally:
        - command:
            entrypoint: cp
            args: [../../.local/tmp/check/transfer/management-resources.json, ../../.local/tmp/check/transfer/remote-resources.json]
    - name: bind the runtime composite to the original deployment and its own UID
      try:
        - command:
            entrypoint: cp
            args: [../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/transfer/runtime-composite.json]
        - command:
            entrypoint: yq
            args: [-p=yaml, -o=json, -i, '.metadata.uid = "22222222-2222-4222-8222-222222222222"', ../../.local/tmp/check/transfer/runtime-composite.json]
        - command:
            entrypoint: cp
            args: [../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/transfer/identity.yaml]
        - command:
            entrypoint: yq
            args:
              - --inplace
              - >-
                load("../../.local/tmp/check/adoption.yaml") as $xr |
                {"deploymentUID": $xr.spec.adoption.deploymentId,
                "creationCompositeUID": $xr.spec.adoption.creationCompositeUID,
                "compositeUID": $xr.spec.adoption.creationCompositeUID,
                "runtimeCompositeUID": "22222222-2222-4222-8222-222222222222",
                "environment": $xr.spec}
              - ../../.local/tmp/check/transfer/identity.yaml
        - command: &runtimeIdentity
            entrypoint: task
            env:
              - {name: PROJECT_ROOT, value: ($values.root)}
            args: [-d, $PROJECT_ROOT, -t, $PROJECT_ROOT/tasks/identity.yaml, assert-runtime-composite, 'ENV_DIR=$PROJECT_ROOT/.local/tmp/check/transfer']
        - command:
            entrypoint: yq
            args: [-i, '.spec.storage.bucket = "wrong-bucket"', ../../.local/tmp/check/transfer/runtime-composite.json]
        - command:
            <<: *runtimeIdentity
            check: {($error != null): true}
        - command:
            entrypoint: yq
            args: [-i, '.spec.storage.bucket = load("../../.local/tmp/check/adoption.yaml").spec.storage.bucket | .metadata.uid = "33333333-3333-4333-8333-333333333333"', ../../.local/tmp/check/transfer/runtime-composite.json]
        - command:
            <<: *runtimeIdentity
            check: {($error != null): true}
    - name: validate every resource identity in a complete inventory
      try:
        - command:
            entrypoint: cp
            args: [../../.local/tmp/check/transfer/management-resources.json, ../../.local/tmp/check/transfer/identity-inventory.json]
        - command:
            entrypoint: yq
            args: [-i, '.resources[].metadata.ownerReferences[0].uid = "22222222-2222-4222-8222-222222222222"', ../../.local/tmp/check/transfer/identity-inventory.json]
        - command:
            entrypoint: yq
            args: [-i, '.metadata.uid = "22222222-2222-4222-8222-222222222222"', ../../.local/tmp/check/transfer/runtime-composite.json]
        - command: &inventoryIdentity
            entrypoint: task
            env:
              - {name: PROJECT_ROOT, value: ($values.root)}
            args: [-d, $PROJECT_ROOT, -t, $PROJECT_ROOT/tasks/transfer.yaml, assert-inventory, 'ENV_DIR=$PROJECT_ROOT/.local/tmp/check/transfer', 'COMPOSITE=$PROJECT_ROOT/.local/tmp/check/transfer/runtime-composite.json', 'OUTPUT=$PROJECT_ROOT/.local/tmp/check/transfer/identity-inventory.json']
        - command:
            entrypoint: yq
            args: [-i, '.resources[0].status.atProvider.freeformTags."tamoss-deployment-id" = "wrong-deployment"', ../../.local/tmp/check/transfer/identity-inventory.json]
        - command:
            <<: *inventoryIdentity
            check: {($error != null): true}
        - command:
            entrypoint: yq
            args: [-i, '.resources[0].status.atProvider.freeformTags."tamoss-deployment-id" = load("../../.local/tmp/check/transfer/identity.yaml").deploymentUID | .resources[22].metadata.ownerReferences[0].uid = "wrong-owner"', ../../.local/tmp/check/transfer/identity-inventory.json]
        - command:
            <<: *inventoryIdentity
            check: {($error != null): true}
