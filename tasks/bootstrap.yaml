version: '3'
set: [errexit, nounset, pipefail]
vars:
  OCI_CONFIG: '{{env "OCI_CLI_CONFIG_FILE" | default (printf "%s/.oci/config" (env "HOME"))}}'
  OCI_PROFILE: '{{env "OCI_CLI_PROFILE" | default "DEFAULT"}}'
tasks:
  up:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    preconditions:
      - sh: 'test ! -f {{shellQuote .ENV_DIR}}/identity.yaml || yq -e ''.teardownStarted != true and .returnComplete != true'' {{shellQuote .ENV_DIR}}/identity.yaml > /dev/null'
        msg: Teardown has started; resume down rather than recreating this environment
    cmds:
      - task: :lifecycle:time-window
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :gitops:export-inputs
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: provision
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: initialise-runtime
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: handover
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: ready
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: complete-handover
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  initialise-runtime:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      PATH_IN_GIT: {sh: 'yq -r .path {{shellQuote .ENV_DIR}}/gitops.yaml'}
    status:
      - 'yq -e ''.gitopsEstablished == true'' {{.ENV_DIR}}/identity.yaml > /dev/null'
    preconditions:
      - sh: >-
          yq -e '.gitopsEstablished == true' '{{.ENV_DIR}}/identity.yaml' > /dev/null ||
          yq -e '.spec.managementPolicies | join(",") == "Observe"' {{shellQuote .CHECKOUT}}/{{.PATH_IN_GIT}}/infrastructure/environment.yaml > /dev/null
        msg: Initial publication requires observe-only infrastructure; write authority follows verified handover
    cmds:
      - task: runtime
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
  provision:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    status:
      - 'test -s {{shellQuote .ENV_DIR}}/identity.yaml && yq -e ''.gitopsEstablished == true'' {{shellQuote .ENV_DIR}}/identity.yaml > /dev/null'
    preconditions:
      - sh: test -s '{{.ENV_DIR}}/foundation.yaml' && test -s '{{.ENV_DIR}}/gitops.yaml'
        msg: Prepare the retained foundation and GitOps inputs before provisioning
      - sh: >-
          (test -s '{{.ENV_DIR}}/identity.yaml' && yq -e '.gitopsEstablished == true' '{{.ENV_DIR}}/identity.yaml' > /dev/null) ||
          test "$(git -C '{{.ROOT_DIR}}' rev-parse HEAD)" = "$(yq -r .product.commit '{{.ENV_DIR}}/gitops.yaml')"
        msg: Check out the product commit selected for Flux before provisioning
      - sh: >-
          yq -e '[(.product.commit | test("^[a-f0-9]{40}$")),
          (.product.url | test("^https://github.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$")),
          (.bundle.url | test("^oci://ghcr.io/[a-z0-9_.-]+/[a-z0-9_.-]+$")),
          (.bundle.digest | test("^sha256:[a-f0-9]{64}$"))] | all'
          '{{.ENV_DIR}}/gitops.yaml' > /dev/null
        msg: Select the published product commit and private release bundle digest before provisioning
      - sh: >-
          yq -e '(.tadoss == null) or
          ((.tadoss.bundle.url | test("^oci://ghcr.io/[a-z0-9_.-]+/[a-z0-9_.-]+$")) and
          (.tadoss.bundle.digest | test("^sha256:[a-f0-9]{64}$")))'
          '{{.ENV_DIR}}/gitops.yaml' > /dev/null
        msg: Optional TADOSS integration requires its published private bundle URL and digest
    cmds:
      - task: :verify:tools
      - task: :verify:privacy
      - task: :gitops:export-inputs
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: :gitops:write-access
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - for: [github-app-id, github-app-installation-id, github-app-private-key, ghcr-dockerconfigjson]
        cmd: test -s '{{.ENV_DIR}}/secrets/{{.ITEM}}'
      - task: :tamoss:assert-current
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :tamoss:fetch
      - task: :tadoss:fetch
      - task: :tamoss:release
      - crossplane resource validate '{{.ROOT_DIR}}/charts/secret-foundation/definition.yaml' '{{.ENV_DIR}}/foundation.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.ROOT_DIR}}/.local/tmp/check/crossplane' --error-on-missing-schemas
      - task: :lifecycle:prepare
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :gitops:export
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: :gitops:publish
        vars:
          ENV_DIR: '{{.ENV_DIR}}'
          CHECKOUT: '{{.CHECKOUT}}'
          MESSAGE: 'feat: initialise environment GitOps configuration'
          FILES: [values.yaml, sources.yaml, infrastructure/environment.yaml, infrastructure/kustomization.yaml, runtime/release.yaml, runtime/kustomization.yaml, releases.yaml, namespaces.yaml, flux.yaml, sync.yaml, kustomization.yaml, kustomizeconfig.yaml]
      - task: :lifecycle:baseline
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: seed
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: foundation
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: secrets
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait tamossenvironment/$(yq -r .metadata.name '{{.ENV_DIR}}/environment.yaml') --for=create --timeout=300s
      - task: :identity:record-composite
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - defer:
          task: :identity:resources
          vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:bootstrap-ready
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  seed:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
    status:
      - 'yq -e ''.bootstrapUID != null'' {{.ENV_DIR}}/identity.yaml > /dev/null'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get tamossbootstrap/{{.NAME}} -o json | yq -p=json -e '.metadata.uid == load("{{.ENV_DIR}}/identity.yaml").bootstrapUID' > /dev/null
    cmds:
      - task: seed-new
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
  seed-new:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      FLUX_VERSION: {sh: 'yq -r ''.packages[].name | select(test("^fluxcd/flux2@")) | split("@")[1]'' {{.ROOT_DIR}}/aqua.yaml'}
      PATH_IN_GIT: {sh: 'yq -r .path {{shellQuote .ENV_DIR}}/gitops.yaml'}
      CLEANUP_SECONDS: {sh: 'yq -r ".cleanupHours * 3600" {{shellQuote .ENV_DIR}}/cost.yaml'}
      EXPIRY: {sh: 'date -d "$(yq -r .spec.expiresAt {{shellQuote .ENV_DIR}}/environment.yaml)" +%s'}
      DEADLINE: {sh: 'date -u -d "@$(({{.EXPIRY}} - {{.CLEANUP_SECONDS}}))" +%Y-%m-%dT%H:%M:%SZ'}
    preconditions:
      - sh: 'yq -e ''.bootstrapUID == null'' {{.ENV_DIR}}/identity.yaml > /dev/null'
        msg: Existing bootstrap identity is unavailable; restore the original Kind state
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - defer: rm -f '{{.ENV_DIR}}/provider/credentials.json'
      - defer: rm -f '{{.ENV_DIR}}/secrets/oci-private-key' '{{.ENV_DIR}}/secrets/oci-fingerprint'
      - task: :cloud:credentials
        vars: {CREDENTIAL_DIR: '{{.ENV_DIR}}/provider'}
      - task: secret-inputs
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - >-
        yq -n 'load("{{.ENV_DIR}}/environment.yaml") as $e | load("{{.ENV_DIR}}/foundation.yaml") as $f |
        {"apiVersion": "tamoss.livewyer.io/v1alpha1", "kind": "TamossBootstrap",
        "metadata": {"name": $e.metadata.name, "namespace": $e.metadata.namespace},
        "spec": {"deploymentId": load("{{.ENV_DIR}}/identity.yaml").deploymentUID,
        "released": false, "credentialsEstablished": (load("{{.ENV_DIR}}/identity.yaml").credentialsEstablished == true),
        "vaultAuth": (load("{{.ENV_DIR}}/identity.yaml").oci | {"user": .user, "tenancy": .tenancy}),
        "foundationName": $f.metadata.name, "foundation": $f.spec, "environment": $e.spec,
        "remoteBootstrap": {"image": load("{{.ROOT_DIR}}/dependencies.yaml").bootstrapTools.image,
        "fluxVersion": "{{.FLUX_VERSION}}", "seedConfigMap": "oke-bootstrap-input", "deadline": "{{.DEADLINE}}"}}}'
        > '{{.ENV_DIR}}/bootstrap.yaml'
      - task: :management:render
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - >-
        kubectl create configmap oke-bootstrap-input -n tamoss-infra
        --from-file=sync.yaml={{shellQuote .CHECKOUT}}/{{.PATH_IN_GIT}}/sync.yaml
        --dry-run=client -o yaml | yq '.immutable = true' > '{{.ENV_DIR}}/oke-bootstrap-input.yaml'
      - cp deploy/management/kustomization.yaml '{{.ENV_DIR}}/kustomization.yaml'
      - 'yq -i ''.resources += ["provider", "secrets", "oke-bootstrap-input.yaml"]'' {{.ENV_DIR}}/kustomization.yaml'
      - flux --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' install --version='{{.FLUX_VERSION}}' --components=source-controller,helm-controller --timeout=5m
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' apply --server-side -k '{{.ENV_DIR}}'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait helmrelease/tamoss-bootstrap-instance --for=condition=Ready --timeout=1200s
      - task: observe
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :identity:composite
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  observe:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get tamossbootstrap/{{.NAME}} --ignore-not-found -o json > '{{.ENV_DIR}}/bootstrap-observed.json'
      - >-
        yq -e '(length == 0 and load("{{.ENV_DIR}}/identity.yaml").bootstrapUID == null) or
        ([.spec.deploymentId == load("{{.ENV_DIR}}/identity.yaml").deploymentUID,
        (.metadata.uid == load("{{.ENV_DIR}}/identity.yaml").bootstrapUID or load("{{.ENV_DIR}}/identity.yaml").bootstrapUID == null)] | all)'
        '{{.ENV_DIR}}/bootstrap-observed.json' > /dev/null
      - 'yq -i ''.bootstrapUID = (load("{{.ENV_DIR}}/bootstrap-observed.json").metadata.uid // .bootstrapUID)'' {{.ENV_DIR}}/identity.yaml'
  release:
    requires: {vars: [ENV_DIR]}
    status:
      - 'test ! -f {{.ENV_DIR}}/bootstrap.yaml && yq -e ''.bootstrapUID == null'' {{.ENV_DIR}}/identity.yaml > /dev/null'
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: observe
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: release-observed
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  release-observed:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
    status:
      - >-
        (test -f '{{.ENV_DIR}}/bootstrap-observed.json' && test ! -s '{{.ENV_DIR}}/bootstrap-observed.json') ||
        yq -e '[.spec.released == true, .status.released == true,
        .metadata.annotations."crossplane.io/paused" == "true",
        ([.status.conditions[] | select(.type == "Synced") | .reason] | join(",") == "ReconcilePaused")] | all'
        '{{.ENV_DIR}}/bootstrap-observed.json' > /dev/null
    cmds:
      - task: :management:freeze-instance
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra patch tamossbootstrap/{{.NAME}} --type=merge -p '{"spec":{"released":true}}'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra annotate tamossbootstrap/{{.NAME}} crossplane.io/paused- --overwrite
      - 'yq ''.metadata.name = "{{.NAME}}"'' {{.ROOT_DIR}}/deploy/contracts/bootstrap-released.yaml > {{.ENV_DIR}}/bootstrap-release.yaml'
      - KUBECONFIG='{{.ENV_DIR}}/management.kubeconfig' chainsaw assert -f '{{.ENV_DIR}}/bootstrap-release.yaml' --timeout=180s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra annotate tamossbootstrap/{{.NAME}} crossplane.io/paused=true --overwrite
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait tamossbootstrap/{{.NAME}} --for='jsonpath={.status.conditions[?(@.type=="Synced")].reason}=ReconcilePaused' --timeout=180s
  runtime:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      PATH_IN_GIT: {sh: 'yq -r .path {{.ENV_DIR}}/gitops.yaml'}
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
    status:
      - 'yq -e ''.gitopsEstablished == true'' {{.ENV_DIR}}/identity.yaml > /dev/null'
    preconditions:
      - sh: >-
          yq -e '.gitopsEstablished == true' '{{.ENV_DIR}}/identity.yaml' > /dev/null ||
          yq -e '.spec.managementPolicies | join(",") == "Observe"' {{shellQuote .CHECKOUT}}/{{.PATH_IN_GIT}}/infrastructure/environment.yaml > /dev/null
        msg: Bootstrap must begin with observe-only infrastructure in Git
    cmds:
      - task: :gitops:current-checkout
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: remote-bootstrap
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: connection
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:infrastructure-ready
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :identity:resources
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: bindings
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: ready
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' api-resources --cached=false > /dev/null
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n tamoss-infra wait managed -l 'tamoss.livewyer.io/environment={{.NAME}}' --for=condition=Ready --timeout=300s
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n tamoss-infra wait managed -l 'tamoss.livewyer.io/environment={{.NAME}}' --for=condition=Synced --timeout=300s
      - task: :identity:runtime-composite
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - 'yq -i ''.gitopsEstablished = true'' {{.ENV_DIR}}/identity.yaml'
  handover:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    status:
      - 'yq -e ''.handoverComplete == true'' {{.ENV_DIR}}/identity.yaml > /dev/null'
    cmds:
      - task: :transfer:start-kind
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :transfer:prepare-promotion
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: :transfer:runtime-writes
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :gitops:publish
        vars:
          ENV_DIR: '{{.ENV_DIR}}'
          CHECKOUT: '{{.CHECKOUT}}'
          MESSAGE: 'feat: transfer infrastructure ownership to OKE'
          FILES: [infrastructure/environment.yaml]
  complete-handover:
    requires: {vars: [ENV_DIR]}
    status:
      - 'yq -e ''.handoverComplete == true'' {{.ENV_DIR}}/identity.yaml > /dev/null'
    cmds:
      - task: :transfer:stop-kind
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - 'yq -i ''.handoverComplete = true'' {{.ENV_DIR}}/identity.yaml'
  remote-bootstrap:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
      DEPLOYMENT: {sh: 'yq -r .deploymentUID {{.ENV_DIR}}/identity.yaml'}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: observe
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get jobs -l 'tamoss.livewyer.io/bootstrap=oke,tamoss.livewyer.io/deployment-id={{.DEPLOYMENT}}' -o json > '{{.ENV_DIR}}/bootstrap-jobs.json'
      - task: retry-remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait tamossbootstrap/{{.NAME}} --for=jsonpath='{.status.remoteBootstrapReady}=true' --timeout=1800s
  retry-remote:
    requires: {vars: [ENV_DIR]}
    status:
      - 'yq -e ''load("{{.ENV_DIR}}/bootstrap-observed.json").status.remoteBootstrapCompleted == true or ([.items[].status.conditions[] | select(.type == "Failed" and .status == "True")] | length == 0)'' {{.ENV_DIR}}/bootstrap-jobs.json > /dev/null'
    cmds:
      - task: replace-remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  replace-remote:
    requires: {vars: [ENV_DIR]}
    vars:
      REPORT: '{{.ENV_DIR}}/reports/bootstrap-{{now | unixEpoch}}'
    preconditions:
      - sh: 'yq -e ''.spec.released != true and .status.remoteBootstrapCompleted != true'' {{.ENV_DIR}}/bootstrap-observed.json > /dev/null'
        msg: A released or completed bootstrap cannot be retried
      - sh: >-
          yq -e 'load("{{.ENV_DIR}}/bootstrap-observed.json").metadata.uid as $uid |
          [.items | length == 1, (.items[0].metadata.ownerReferences | map(.uid) | contains([$uid]))] | all'
          '{{.ENV_DIR}}/bootstrap-jobs.json' > /dev/null
        msg: Retry requires the original bootstrap Job ownership
      - sh: test "$(date -d "$(yq -r .spec.remoteBootstrap.deadline '{{.ENV_DIR}}/bootstrap-observed.json')" +%s)" -gt "$(date -u +%s)"
        msg: The original bootstrap deadline has passed; proceed with teardown
      - sh: >-
          kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get secret oke-connection -o json |
          yq -p=json -e '.data.complete != "dHJ1ZQ=="' > /dev/null
        msg: A recorded successful seed must not be replayed
    cmds:
      - task: :lifecycle:time-window
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - mkdir -p -m 700 '{{.REPORT}}'
      - cp '{{.ENV_DIR}}/bootstrap-jobs.json' '{{.REPORT}}/jobs.json'
      - cmd: kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra logs -l job-name=oke-bootstrap --all-containers=true --prefix=true --max-log-requests=7 > '{{.REPORT}}/pods.log' 2>&1
        ignore_error: true
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get events -o json > '{{.REPORT}}/events.json'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra delete job oke-bootstrap --cascade=foreground --wait=true --timeout=180s
  connection:
    silent: true
    requires: {vars: [ENV_DIR]}
    env:
      OCI_CLI_CONFIG_FILE: '{{.OCI_CONFIG}}'
      OCI_CLI_PROFILE: '{{.OCI_PROFILE}}'
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - install -m 600 /dev/null '{{.ENV_DIR}}/oke-connection.json'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get secret oke-connection -o json > '{{.ENV_DIR}}/oke-connection.json'
      - >-
        yq -p=json -e 'load("{{.ENV_DIR}}/identity.yaml") as $i |
        select(.metadata.annotations."tamoss.livewyer.io/deployment-id" == $i.deploymentUID) |
        (.data.clusterID | @base64d) as $id |
        [.data.complete == "dHJ1ZQ==", .metadata.annotations."tamoss.livewyer.io/cluster-id" == $id,
        ($i.clusterID == null or $i.clusterID == $id),
        (load("{{.ENV_DIR}}/owned-current.yaml") | map(.id) | contains([$id])),
        ($i.remoteUID == null or ($i.remoteUID == (.data.remoteUID | @base64d) and $i.remoteServer == (.data.remoteServer | @base64d)))] | all'
        '{{.ENV_DIR}}/oke-connection.json' > /dev/null
      - install -m 600 /dev/null '{{.ENV_DIR}}/remote.pending.kubeconfig'
      - yq -p=json -r '.data.kubeconfig | @base64d' '{{.ENV_DIR}}/oke-connection.json' > '{{.ENV_DIR}}/remote.pending.kubeconfig'
      - >-
        yq -e 'load("{{.ENV_DIR}}/oke-connection.json").data as $d |
        [.users[0].user.exec.command == "oci", (.users[0].user.exec.args | contains([($d.clusterID | @base64d)])),
        .clusters[0].cluster.server == ($d.remoteServer | @base64d),
        .clusters[0].cluster."insecure-skip-tls-verify" != true] | all'
        '{{.ENV_DIR}}/remote.pending.kubeconfig' > /dev/null
      - >-
        yq -i '.users[].user.exec.env = [{"name": "OCI_CLI_CONFIG_FILE", "value": strenv(OCI_CLI_CONFIG_FILE)},
        {"name": "OCI_CLI_PROFILE", "value": strenv(OCI_CLI_PROFILE)}]' '{{.ENV_DIR}}/remote.pending.kubeconfig'
      - >-
        kubectl --kubeconfig '{{.ENV_DIR}}/remote.pending.kubeconfig' get namespace kube-system -o json |
        yq -p=json -e '.metadata.uid == (load("{{.ENV_DIR}}/oke-connection.json").data.remoteUID | @base64d)' > /dev/null
      - >-
        yq -i 'load("{{.ENV_DIR}}/oke-connection.json").data as $d |
        .clusterID = ($d.clusterID | @base64d) | .remoteUID = ($d.remoteUID | @base64d) |
        .remoteServer = ($d.remoteServer | @base64d)' '{{.ENV_DIR}}/identity.yaml'
      - mv '{{.ENV_DIR}}/remote.pending.kubeconfig' '{{.ENV_DIR}}/remote.kubeconfig'
  foundation:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .metadata.name {{shellQuote .ENV_DIR}}/foundation.yaml'}
    preconditions:
      - sh: >-
          yq -e '[.metadata.namespace == "tamoss-infra", .spec.providerConfigName == "oci",
          .spec.region == load("{{.ENV_DIR}}/identity.yaml").environment.region,
          .spec.compartmentId == load("{{.ENV_DIR}}/identity.yaml").environment.compartmentId] | all'
          '{{.ENV_DIR}}/foundation.yaml' > /dev/null
        msg: Foundation must use the verified bootstrap region, compartment and provider
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait secretfoundation/{{.NAME}} --for=create --timeout=180s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait secretfoundation/{{.NAME}} --for=condition=Ready --timeout=1800s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait vault.kms.oci.m.upbound.io/{{.NAME}} key.kms.oci.m.upbound.io/{{.NAME}} --for=condition=Synced --timeout=300s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get secretfoundation/{{.NAME}} -o json > '{{.ENV_DIR}}/foundation-observed.json'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get key.kms.oci.m.upbound.io/{{.NAME}} -o json > '{{.ENV_DIR}}/foundation-key.json'
      - >-
        yq -e '[.status.vaultId, .status.keyId, .status.managementEndpoint] |
        [.[] | (tag == "!!str" and length > 0)] | all'
        '{{.ENV_DIR}}/foundation-observed.json' > /dev/null
      - >-
        yq -p=json '{"name": .metadata.name, "owner": .spec.owner, "region": .spec.region,
        "compartmentId": .spec.compartmentId, "creationCompositeUID": (.spec.adoption.creationCompositeUID // .metadata.uid),
        "vaultId": .status.vaultId, "keyId": .status.keyId, "managementEndpoint": .status.managementEndpoint,
        "keyExternalName": load("{{.ENV_DIR}}/foundation-key.json").metadata.annotations."crossplane.io/external-name"}'
        '{{.ENV_DIR}}/foundation-observed.json' > '{{.ENV_DIR}}/foundation-record.pending.yaml'
      - >-
        test ! -e '{{.ENV_DIR}}/foundation-record.yaml' ||
        diff -u '{{.ENV_DIR}}/foundation-record.yaml' '{{.ENV_DIR}}/foundation-record.pending.yaml'
      - mv '{{.ENV_DIR}}/foundation-record.pending.yaml' '{{.ENV_DIR}}/foundation-record.yaml'
  secret-inputs:
    silent: true
    requires: {vars: [ENV_DIR]}
    env:
      OCI_PROFILE: '{{.OCI_PROFILE}}'
    vars:
      KEY_FILE: {sh: 'OCI_PROFILE={{shellQuote .OCI_PROFILE}} yq -p=ini -oy -r ''(. * (.[strenv(OCI_PROFILE)] // {})).key_file'' {{shellQuote .OCI_CONFIG}}'}
    preconditions:
      - sh: test -z "$(find '{{.ENV_DIR}}/secrets' -type f -perm /077 -print)"
        msg: Bootstrap secret files must have owner-only permissions
      - sh: test -z "$(find {{shellQuote .KEY_FILE}} -perm /077 -print)"
        msg: OCI signing key must have owner-only permissions
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - install -m 600 {{shellQuote .KEY_FILE}} '{{.ENV_DIR}}/secrets/oci-private-key'
      - install -m 600 /dev/null '{{.ENV_DIR}}/secrets/oci-fingerprint'
      - yq -p=ini -r '(. * (.[strenv(OCI_PROFILE)] // {})).fingerprint' {{shellQuote .OCI_CONFIG}} | tr -d '\n' > '{{.ENV_DIR}}/secrets/oci-fingerprint'
      - install -m 600 deploy/secrets/bootstrap/kustomization.yaml '{{.ENV_DIR}}/secrets/kustomization.yaml'
      - >-
        yq -i 'with(select(load("{{.ENV_DIR}}/identity.yaml").credentialsEstablished != true);
        .secretGenerator += load("{{.ROOT_DIR}}/deploy/secrets/imports/kustomization.yaml").secretGenerator)'
        '{{.ENV_DIR}}/secrets/kustomization.yaml'
  secrets:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait helmrelease/tamoss-secrets --for=create --timeout=300s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait helmrelease/tamoss-secrets --for=condition=Ready --timeout=600s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait externalsecret -l tamoss.livewyer.io/credential=true --for=condition=Ready --timeout=300s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get externalsecret -l tamoss.livewyer.io/credential=true -o json > '{{.ENV_DIR}}/credentials-observed.json'
      - 'yq -e ''.items | length == 11'' {{.ENV_DIR}}/credentials-observed.json > /dev/null'
      - 'yq -i ''.credentialsEstablished = true'' {{.ENV_DIR}}/identity.yaml'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get configmap/tamoss-bootstrap-instance -o yaml > '{{.ENV_DIR}}/credential-retirement.yaml'
      - >-
        yq -i 'del(.metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.managedFields) |
        .data."values.yaml" |= (from_yaml | .bootstrap.spec.credentialsEstablished = true | to_yaml)'
        '{{.ENV_DIR}}/credential-retirement.yaml'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get gitrepository/tamoss-bootstrap-product -o yaml > '{{.ENV_DIR}}/credential-retirement-source.yaml'
      - >-
        yq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.managedFields) |
        .spec.secretRef.name = "github-app"' '{{.ENV_DIR}}/credential-retirement-source.yaml'
        > '{{.ENV_DIR}}/credential-source.yaml'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' apply --server-side -f '{{.ENV_DIR}}/credential-retirement.yaml' -f '{{.ENV_DIR}}/credential-source.yaml'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait tamossbootstrap/{{.NAME}} --for=jsonpath='{.spec.credentialsEstablished}=true' --timeout=300s
      - KUBECONFIG='{{.ENV_DIR}}/management.kubeconfig' chainsaw assert -f '{{.ROOT_DIR}}/deploy/contracts/credentials-established.yaml' --timeout=600s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait pushsecret -l tamoss.livewyer.io/credential-staging=true --for=delete --timeout=120s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait password.generators.external-secrets.io --all --for=delete --timeout=120s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra delete secret github-app-input ghcr-input s3-input --ignore-not-found
  bindings:
    requires: {vars: [ENV_DIR]}
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get secret/adoption-bindings -o json > '{{.ENV_DIR}}/bindings-observed.json'
      - >-
        yq -p=json -e 'select(.data.SCHEMA_VERSION == "MQ==") | .data.ADOPTION_YAML | @base64d | from_yaml |
        select(.deploymentId == load("{{.ENV_DIR}}/identity.yaml").deploymentUID and
        .creationCompositeUID == load("{{.ENV_DIR}}/identity.yaml").creationCompositeUID and (.externalNames | length == 23))'
        '{{.ENV_DIR}}/bindings-observed.json' > '{{.ENV_DIR}}/adoption.yaml'
  remove-application:
    requires: {vars: [ENV_DIR]}
    status:
      - >-
        yq -e '.applicationRemoved == true' '{{.ENV_DIR}}/identity.yaml' > /dev/null ||
        yq -e '[(tag == "!!seq"), ([.[] | select(.id | test("^ocid1[.]cluster[.]"))] | length == 0)] | all' '{{.ENV_DIR}}/owned-current.yaml' > /dev/null ||
        (CRD="$(kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' get crd helmreleases.helm.toolkit.fluxcd.io --ignore-not-found -o name)" && test -z "$CRD") ||
        (ROOT="$(kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n flux-system get kustomization/environment --ignore-not-found -o name)" && test -z "$ROOT")
    cmds:
      - task: :identity:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :transfer:freeze-runtime
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :tadoss:remove-instance
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: remove-operator
        vars: {ENV_DIR: '{{.ENV_DIR}}', NAME: tadoss-operator}
      - task: :application:remove-instance
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: remove-operator
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - for: [tamoss-platform/tamoss-platform-config, auth/authentik, auth/tadoss-config, tads/tadoss-secrets, auth/tamoss-database-init, auth/authentik-bootstrap, auth/tamoss-database-connection, traefik/traefik, cert-manager/cert-manager]
        task: remove-release
        vars:
          KUBECONFIG: '{{.ENV_DIR}}/remote.kubeconfig'
          NAMESPACE: '{{splitList "/" .ITEM | first}}'
          NAME: '{{splitList "/" .ITEM | last}}'
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth delete job/tamoss-database-init --ignore-not-found --wait=true --timeout=300s
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth delete job/tadoss-database-init job/tadoss-authentik-blueprint --ignore-not-found --wait=true --timeout=300s
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n traefik delete service/traefik --ignore-not-found --wait=true --timeout=600s
      - 'yq -i ''.applicationRemoved = true'' {{.ENV_DIR}}/identity.yaml'
  remove-operator:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: '{{.NAME | default "tamoss-operator"}}'
    status:
      - RESOURCE="$(kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth get kustomization/{{.NAME}} --ignore-not-found -o name)" && test -z "$RESOURCE"
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth patch kustomization/{{.NAME}} --type=merge -p '{"spec":{"suspend":false,"prune":true,"deletionPolicy":"WaitForTermination"}}'
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth delete kustomization/{{.NAME}} --wait=true --timeout=300s
  remove-release:
    requires: {vars: [KUBECONFIG, NAMESPACE, NAME]}
    status:
      - RESOURCE="$(kubectl --kubeconfig {{shellQuote .KUBECONFIG}} -n '{{.NAMESPACE}}' get helmrelease/{{.NAME}} --ignore-not-found -o name)" && test -z "$RESOURCE"
    cmds:
      - kubectl --kubeconfig {{shellQuote .KUBECONFIG}} -n '{{.NAMESPACE}}' patch helmrelease/{{.NAME}} --type=merge -p '{"spec":{"suspend":false}}'
      - kubectl --kubeconfig {{shellQuote .KUBECONFIG}} -n '{{.NAMESPACE}}' delete helmrelease/{{.NAME}} --wait=true --timeout=600s
  down:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      NAME: {sh: 'yq -r .environment.name {{.ENV_DIR}}/identity.yaml'}
    preconditions:
      - sh: test -f '{{.ENV_DIR}}/inventory-before/.complete' && test -s '{{.ENV_DIR}}/foundation-record.yaml'
        msg: Restore the baseline and retained foundation record before teardown
    cmds:
      - task: :transfer:start-kind
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - 'yq -i ''.teardownStarted = true'' {{.ENV_DIR}}/identity.yaml'
      - task: release
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :identity:composite
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :identity:record-observed-composite
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :transfer:return-ownership
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - task: :identity:resources
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:observe-owned
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: remove-application
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:prepare-deletion
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra delete tamossenvironment/{{.NAME}} --ignore-not-found --cascade=foreground --wait=true --timeout=1800s
      - task: :cloud:delete-backups
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:audit
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra delete pushsecret/adoption-bindings --ignore-not-found --wait=true --timeout=120s
      - task: remove-access
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait policy.identity.oci.m.upbound.io --all --for=delete --timeout=300s
      - task: :cloud:secret-inventory
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:retire-secrets
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :cloud:retained-foundation
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - kind delete cluster --name 'tamoss-cp-{{.NAME}}'
      - rm -f '{{.ENV_DIR}}/management.kubeconfig' '{{.ENV_DIR}}/remote.kubeconfig' '{{.ENV_DIR}}/remote.pending.kubeconfig' '{{.ENV_DIR}}/oke-connection.json'
      - echo 'Environment removed; vault/key ownership and scheduled secret deletions are recorded in {{.ENV_DIR}}/retained-foundation.yaml'
  remove-access:
    requires: {vars: [ENV_DIR]}
    status:
      - test -s '{{.ENV_DIR}}/management.kubeconfig'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get helmrelease/runtime-access --ignore-not-found -o json | yq -p=json -e 'length == 0'
    preconditions:
      - sh: test -s '{{.ENV_DIR}}/management.kubeconfig'
        msg: The original management kubeconfig is required to remove runtime access
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra delete helmrelease/runtime-access --ignore-not-found --wait=true --timeout=600s
  ready:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      PATH_IN_GIT: {sh: 'yq -r .path {{.ENV_DIR}}/gitops.yaml'}
    preconditions:
      - sh: >-
          kubectl kustomize '{{.CHECKOUT}}/{{.PATH_IN_GIT}}' |
          yq -e 'select(.kind == "Kustomization" and .metadata.name == "runtime") |
          .spec.postBuild.substitute.VALUES_CONFIGMAP | test("^tamoss-gitops-values-[a-z0-9]+$")' > /dev/null
        msg: Update the environment starter to use content-hashed values references before checking this product revision
    cmds:
      - task: :identity:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: :gitops:current-checkout
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - >-
        KUBECONFIG='{{.ENV_DIR}}/remote.kubeconfig' chainsaw test --skip-delete --namespace flux-system
        --test-dir deploy/gitops/readiness-check --assert-timeout 1800s
        --set-string revision="$(git -C {{shellQuote .CHECKOUT}} rev-parse HEAD)"
        --report-format JUNIT-TEST --report-path '{{.ENV_DIR}}/reports' --report-name deployment-ready
      - >-
        kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n tams get tamoss/tamoss -o json |
        yq -p=json -e '.spec.version == load("{{.CHECKOUT}}/{{.PATH_IN_GIT}}/values.yaml").release.tag' > /dev/null
  qualify:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      PATH_IN_GIT: {sh: 'yq -r .path {{.ENV_DIR}}/gitops.yaml'}
    cmds:
      - task: ready
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - >-
        yq '.release | {"tag": .tag, "releaseSha256": .releaseSha256, "sourceSha256": .sourceSha256}'
        '{{.CHECKOUT}}/{{.PATH_IN_GIT}}/values.yaml' > '{{.ENV_DIR}}/tamoss-release.current.yaml'
      - task: :tamoss:fetch
        vars: {RELEASE_LOCK: '{{.ENV_DIR}}/tamoss-release.current.yaml'}
      - task: :tamoss:release
        vars: {RELEASE_LOCK: '{{.ENV_DIR}}/tamoss-release.current.yaml'}
      - task: record-release
        vars: {ENV_DIR: '{{.ENV_DIR}}', CHECKOUT: '{{.CHECKOUT}}'}
      - >-
        kubectl --kubeconfig '{{.ENV_DIR}}/remote.kubeconfig' -n auth get configmap/database-connection -o json |
        yq -p=json -o=json -e 'select(.data.DATABASE_ID == load("{{.ENV_DIR}}/outputs.json").databaseId) |
        {"data": {"primary-db-endpoint": {"fqdn": .data.DATABASE_HOST}, "ca-certificate": (.data.DATABASE_CA_BASE64 | @base64d)}}'
        > '{{.ENV_DIR}}/database-connection.json'
      - task: :qualification:run
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  record-release:
    requires: {vars: [ENV_DIR, CHECKOUT]}
    vars:
      PATH_IN_GIT: {sh: 'yq -r .path {{.ENV_DIR}}/gitops.yaml'}
      KEY: {sh: 'yq -r .releaseSha256 {{.ENV_DIR}}/tamoss-release.current.yaml'}
    cmds:
      - >-
        yq -e 'select(.metadata.name == "tamoss-upstream") |
        .spec.ref.commit == load("{{.ROOT_DIR}}/.local/tmp/tamoss/{{.KEY}}/release.json").sourceCommit'
        '{{.CHECKOUT}}/{{.PATH_IN_GIT}}/sources.yaml' > /dev/null
      - cp --no-clobber '{{.ENV_DIR}}/tamoss-release.yaml' '{{.ENV_DIR}}/tamoss-release.bootstrap.yaml'
      - mv '{{.ENV_DIR}}/tamoss-release.current.yaml' '{{.ENV_DIR}}/tamoss-release.yaml'
