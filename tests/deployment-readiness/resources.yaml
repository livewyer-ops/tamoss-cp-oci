apiVersion: v1
kind: Namespace
metadata: {name: flux-system}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: environment, namespace: flux-system}
spec:
  interval: 1m
  url: https://example.invalid/environment
  ref: {branch: main}
status:
  observedGeneration: 1
  artifact:
    path: fixture
    url: http://fixture.invalid/artifact.tar.gz
    revision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    lastUpdateTime: '2026-11-04T11:00:00Z'
  conditions:
    - {type: Ready, status: 'True', reason: Fixture, message: fixture, lastTransitionTime: '2026-11-04T11:00:00Z'}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: environment, namespace: flux-system}
spec:
  interval: 1m
  prune: false
  path: ./
  sourceRef: {kind: GitRepository, name: environment}
status:
  observedGeneration: 1
  lastAppliedRevision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  conditions:
    - {type: Ready, status: 'True', reason: Fixture, message: fixture, lastTransitionTime: '2026-11-04T11:00:00Z'}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: tamoss-product, namespace: flux-system}
spec:
  interval: 1m
  url: https://example.invalid/product
  ref: {commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
status:
  observedGeneration: 1
  artifact:
    path: fixture
    url: http://fixture.invalid/artifact.tar.gz
    revision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    lastUpdateTime: '2026-11-04T11:00:00Z'
  conditions:
    - {type: Ready, status: 'True', reason: Fixture, message: fixture, lastTransitionTime: '2026-11-04T11:00:00Z'}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata: {name: flux-system-tamoss-gitops, namespace: flux-system}
spec:
  interval: 1m
  chart: ./charts/gitops
  sourceRef: {kind: GitRepository, name: tamoss-product}
status:
  observedGeneration: 1
  artifact:
    path: fixture
    url: http://fixture.invalid/artifact.tar.gz
    revision: 0.1.0+fixture
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    lastUpdateTime: '2026-11-04T11:00:00Z'
  observedSourceArtifactRevision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  conditions:
    - {type: Ready, status: 'True', reason: Fixture, message: fixture, lastTransitionTime: '2026-11-04T11:00:00Z'}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: tamoss-gitops, namespace: flux-system}
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/gitops
      sourceRef: {kind: GitRepository, name: tamoss-product}
status:
  observedGeneration: 1
  lastAttemptedRevision: 0.1.0+fixture
  conditions:
    - {type: Ready, status: 'True', reason: Fixture, message: fixture, lastTransitionTime: '2026-11-04T11:00:00Z'}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: deployment-ready, namespace: flux-system}
spec:
  interval: 1m
  prune: false
  path: ./deploy/gitops/readiness
  sourceRef: {kind: GitRepository, name: tamoss-product}
status:
  observedGeneration: 1
  lastAppliedRevision: main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  conditions:
    - {type: Ready, status: 'True', reason: Fixture, message: fixture, lastTransitionTime: '2026-11-04T11:00:00Z'}
