
["test:flux-bootstrap:restart:protected:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "kubectl config view --raw --flatten > '{{ env.TASKV_DIRECTORY }}/restart-input.kubeconfig'",
  '''kubectl --kubeconfig '{{ env.TASKV_DIRECTORY }}/restart-input.kubeconfig' config rename-context "$(kubectl config current-context)" 'kind-tamoss-cp-{{ env.TASKV_NAME }}'''',
  "mise run test:kind-restart:prepare",
  "mise run test:kind-restart:restart",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/flux-bootstrap{% endif %}"
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "kubectl get nodes -o json | yq -p=json -r '.items | select(length == 1) | .[0].metadata.name | sub(\"^tamoss-cp-\"; \"\") | sub(\"-control-plane$\"; \"\")'") }}{% endif %}'''
env.PROJECT_ROOT = "{{ vars.ROOT }}"
env.DIRECTORY = "{{ env.TASKV_DIRECTORY }}/restart-{{ env.TASKV_NAME }}"
env.MANAGEMENT_KUBECONFIG = "{{ env.TASKV_DIRECTORY }}/restart-input.kubeconfig"
depends_post = ["test:flux-bootstrap:restart:protected:cleanup"]

["test:flux-bootstrap:restart:protected:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "rm -f '{{ env.TASKV_DIRECTORY }}/restart-{{ env.TASKV_NAME }}/management.kubeconfig'",
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/flux-bootstrap{% endif %}"
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "kubectl get nodes -o json | yq -p=json -r '.items | select(length == 1) | .[0].metadata.name | sub(\"^tamoss-cp-\"; \"\") | sub(\"-control-plane$\"; \"\")'") }}{% endif %}'''
env.PROJECT_ROOT = "{{ vars.ROOT }}"
env.DIRECTORY = "{{ env.TASKV_DIRECTORY }}/restart-{{ env.TASKV_NAME }}"
env.MANAGEMENT_KUBECONFIG = "{{ env.TASKV_DIRECTORY }}/restart-input.kubeconfig"

["test:flux-bootstrap:restart:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "DIRECTORY={{ env.TASKV_DIRECTORY | quote }} FLUX_VERSION={{ env.TASKV_FLUX_VERSION | quote }} NAME={{ env.TASKV_NAME | quote }} mise run test:flux-bootstrap:restart:protected:protected",
