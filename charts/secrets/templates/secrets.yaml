{{- $id := required "deploymentId is required" .Values.deploymentId -}}
{{- if and .Values.initialise (ne .Values.oracle.principalType "UserPrincipal") -}}
{{- fail "Secret creation requires the Kind user principal" -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tamoss-vault
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    oracle:
{{ omit .Values.oracle "auth" "serviceAccountRef" | toYaml | indent 6 }}
{{ if eq .Values.oracle.principalType "UserPrincipal" }}
      auth:
{{ .Values.oracle.auth | toYaml | indent 8 }}
{{ else }}
      serviceAccountRef:
{{ .Values.oracle.serviceAccountRef | toYaml | indent 8 }}
{{ end }}
{{ if eq .Values.oracle.principalType "Workload" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.oracle.serviceAccountRef.name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-vault-token
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [{{ .Values.oracle.serviceAccountRef.name | quote }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-vault-token
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-vault-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
{{ end }}
{{ if .Values.initialise }}
{{ range .Values.passwords }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  length: 48
  digits: 12
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    tamoss.livewyer.io/credential-staging: 'true'
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: tamoss-vault
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: {{ . }}
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: {{ printf "%s-%s" $id . }}
{{ end }}
{{ range .Values.imports }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    tamoss.livewyer.io/credential-staging: 'true'
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: tamoss-vault
      kind: SecretStore
  selector:
    secret:
      name: {{ .sourceSecret }}
  data:
    - match:
{{ if and $.Values.s3 (eq .sourceSecret "s3-input") }}
        secretKey: credentials
{{ end }}
        remoteRef:
          remoteKey: {{ printf "%s-%s" $id .name }}
{{ end }}
{{ end }}
{{ range .Values.deliveries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    tamoss.livewyer.io/credential: 'true'
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: tamoss-vault
    kind: SecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: {{ .type | default "Opaque" }}
      mergePolicy: Merge
{{ with .template }}
      data:
{{ . | toYaml | indent 8 }}
{{ end }}
  data:
{{ range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ printf "%s-%s" $id .remoteKey }}
{{ with .property }}
        property: {{ . | quote }}
{{ end }}
{{ end }}
{{ end }}
