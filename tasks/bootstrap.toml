["bootstrap:install"]
hide = true
run = [
  "test ! -e '{{ vars.ENV_DIR }}/identity.yaml' || { echo 'up requires a fresh deployment. Retain these records for cleanup; use a fresh ENV_DIR after teardown.' >&2; exit 1; }",
  { task = "bootstrap:finish" },
]

["bootstrap:seed"]
hide = true
depends = ["bootstrap:configuration"]
run = [
  "kind create cluster --name 'tamoss-cp-{{ env.TASKV_NAME }}' --config '{{ vars.ROOT_DIR }}/deploy/management/kind.yaml' --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' --wait 120s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' get namespace kube-system -o jsonpath='{.metadata.uid}' > '{{ vars.ENV_DIR }}/management-uid'",
  '''yq -i '.managementUID = load_str("{{ vars.ENV_DIR }}/management-uid")' '{{ vars.ENV_DIR }}/identity.yaml'''',
  "flux --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' install --components=source-controller,helm-controller,kustomize-controller --timeout=5m",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' create namespace tamoss-infra",
  "mise run source:authenticate",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' apply --server-side -k '{{ vars.ENV_DIR }}'",
]
depends_post = ["bootstrap:seed:cleanup"]
env.TASKV_NAME = '''{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="environment") | get(key="name") }}'''

["bootstrap:seed:cleanup"]
hide = true
run = ["rm -f '{{ vars.ENV_DIR }}/discovery/credentials.json' '{{ vars.ENV_DIR }}/discovery/privatekey' '{{ vars.ENV_DIR }}/discovery/vault.env'"]

["bootstrap:connect"]
hide = true
depends = ["bootstrap:seed"]
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait helmrelease/tamoss-management --for=condition=Ready --timeout=600s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait kustomization/bootstrap-ready --for=condition=Ready --timeout=3600s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get tamossbootstrap/{{ env.TASKV_NAME }} tamossenvironment/{{ env.TASKV_NAME }} secretfoundation/{{ env.TASKV_FOUNDATION }} key.kms.oci.m.upbound.io/{{ env.TASKV_FOUNDATION }} namespace/kube-system -o json > '{{ vars.ENV_DIR }}/bootstrap-state.json'",
  '''yq -i 'load("{{ vars.ENV_DIR }}/bootstrap-state.json").items as $objects | .bootstrapUID = ($objects[] | select(.kind == "TamossBootstrap") | .metadata.uid) | .compositeUID = ($objects[] | select(.kind == "TamossEnvironment") | .metadata.uid) | .creationCompositeUID = .compositeUID | .clusterID = ($objects[] | select(.kind == "TamossEnvironment") | .status.outputs.clusterId) | .managementUID = ($objects[] | select(.kind == "Namespace") | .metadata.uid)' '{{ vars.ENV_DIR }}/identity.yaml'''',
  '''yq '(.items[] | select(.kind == "Key")) as $key | .items[] | select(.kind == "SecretFoundation") | {"name": .metadata.name, "owner": .spec.owner, "region": .spec.region, "compartmentId": .spec.compartmentId, "creationCompositeUID": (.spec.adoption.creationCompositeUID // .metadata.uid), "vaultId": .status.vaultId, "keyId": .status.keyId, "managementEndpoint": .status.managementEndpoint, "keyExternalName": $key.metadata.annotations."crossplane.io/external-name"}' '{{ vars.ENV_DIR }}/bootstrap-state.json' > '{{ vars.ENV_DIR }}/foundation-record.yaml'''',
]
env.TASKV_NAME = '''{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="environment") | get(key="name") }}'''
env.TASKV_FOUNDATION = '''{{ read_yaml(path=vars.ENV_DIR ~ "/foundation.yaml") | get(key="metadata") | get(key="name") }}'''

["bootstrap:remote-access"]
hide = true
depends = ["bootstrap:connect"]
run = [
  '''umask 077
oci ce cluster create-kubeconfig --cluster-id {{ env.TASKV_CLUSTER | quote }} --file '{{ vars.ENV_DIR }}/remote.kubeconfig' --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT --overwrite''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' get namespace kube-system -o jsonpath='{.metadata.uid}' > '{{ vars.ENV_DIR }}/remote-uid'",
  '''yq -i '.users[].user.exec |= (.command = "oci" | .env = [{"name":"OCI_CLI_CONFIG_FILE","value":strenv(OCI_CLI_CONFIG_FILE)},{"name":"OCI_CLI_PROFILE","value":strenv(OCI_CLI_PROFILE)}])' '{{ vars.ENV_DIR }}/remote.kubeconfig'''',
  '''yq -i '.remoteUID = load_str("{{ vars.ENV_DIR }}/remote-uid") | .remoteServer = load("{{ vars.ENV_DIR }}/remote.kubeconfig").clusters[0].cluster.server' '{{ vars.ENV_DIR }}/identity.yaml'''',
  "mise run bootstrap:remote-rbac",
  "mise run bootstrap:remote-access:issue",
]
env.TASKV_CLUSTER = '''{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="clusterID") }}'''

["bootstrap:finish"]
hide = true
depends = ["bootstrap:converged"]
run = [
  "yq -i '.deploymentReady = true' '{{ vars.ENV_DIR }}/identity.yaml'",
]

["bootstrap:local-ready"]
hide = true
run = ["KUBECONFIG='{{ vars.ENV_DIR }}/management.kubeconfig' chainsaw test --skip-delete --namespace tamoss-infra --test-dir deploy/gitops/readiness-check --assert-timeout=1800s --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name deployment-ready"]

["bootstrap:access"]
hide = true
quiet = true
run = [
  '''umask 077
kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n auth get secret authentik -o json | yq -p=json -o=json '.data | {"username": (.AUTHENTIK_BOOTSTRAP_USERNAME | @base64d), "password": (.AUTHENTIK_BOOTSTRAP_PASSWORD | @base64d)}' > '{{ vars.ENV_DIR }}/access/ui-login.json'''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get tamoss/tamoss -o json | yq -p=json '.spec | {"api": ("https://api." + .publicEndpoint.baseDomain), "ui": .publicEndpoint.uiURL, "auth": .auth.authentikBlueprints.issuerURL}'''',
  "printf 'OKE kubeconfig: %s/remote.kubeconfig\nPrivate initial login: %s/access/ui-login.json\nKeep this workstation and its Kind cluster running. Remove the deployment with: ENV_DIR=%s mise run down\n' '{{ vars.ENV_DIR }}' '{{ vars.ENV_DIR }}' '{{ vars.ENV_DIR }}'",
]


["bootstrap:observe"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get tamossbootstrap/{{ env.TASKV_NAME }} --ignore-not-found -o json > '{{ vars.ENV_DIR }}/bootstrap-observed.json'",
  '''yq -e '(length == 0 and load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID == null) or ([.spec.deploymentId == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID, (.metadata.uid == load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID or load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID == null)] | all)' '{{ vars.ENV_DIR }}/bootstrap-observed.json' > /dev/null''',
  '''yq -i '.bootstrapUID = (load("{{ vars.ENV_DIR }}/bootstrap-observed.json").metadata.uid // .bootstrapUID)' {{ vars.ENV_DIR }}/identity.yaml''',
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:release:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(test ! -f {{ vars.ENV_DIR }}/bootstrap.yaml && yq -e '.bootstrapUID == null' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:observe",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:release-observed",
]

["bootstrap:release"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:release:apply",
]

["bootstrap:release-observed:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''((test -f '{{ vars.ENV_DIR }}/bootstrap-observed.json' && test ! -s '{{ vars.ENV_DIR }}/bootstrap-observed.json') || yq -e '[.spec.released == true, .status.released == true, .metadata.annotations."crossplane.io/paused" == "true", ([.status.conditions[] | select(.type == "Synced") | .reason] | join(",") == "ReconcilePaused")] | all' '{{ vars.ENV_DIR }}/bootstrap-observed.json' > /dev/null)'''
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run management:freeze-instance",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra patch tamossbootstrap/{{ env.TASKV_NAME }} --type=merge -p '{"spec":{"released":true}}'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra annotate tamossbootstrap/{{ env.TASKV_NAME }} crossplane.io/paused- --overwrite",
  '''yq '.metadata.name = "{{ env.TASKV_NAME }}"' {{ vars.ROOT_DIR }}/deploy/contracts/bootstrap-released.yaml > {{ vars.ENV_DIR }}/bootstrap-release.yaml''',
  "KUBECONFIG='{{ vars.ENV_DIR }}/management.kubeconfig' chainsaw assert -f '{{ vars.ENV_DIR }}/bootstrap-release.yaml' --timeout=180s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra annotate tamossbootstrap/{{ env.TASKV_NAME }} crossplane.io/paused=true --overwrite",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait tamossbootstrap/{{ env.TASKV_NAME }} --for='jsonpath={.status.conditions[?(@.type=="Synced")].reason}=ReconcilePaused' --timeout=180s''',
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:release-observed"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:release-observed:apply",
]

["bootstrap:remove-application:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(yq -e '.applicationRemoved == true' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null || yq -e '[(tag == "!!seq"), ([.[] | select(.id | test("^ocid1[.]cluster[.]"))] | length == 0)] | all' '{{ vars.ENV_DIR }}/owned-current.yaml' > /dev/null || (CRD="$(kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' get crd helmreleases.helm.toolkit.fluxcd.io --ignore-not-found -o name)" && test -z "$CRD"))'''
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run tadoss:remove-instance",
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} NAME={{ ("tadoss-operator") | quote }} mise run bootstrap:remove-operator''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run application:remove-instance",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:remove-operator",
  '''{% for item in ["tamoss-platform-config", "authentik", "tadoss-config", "tadoss-secrets", "tamoss-database-init", "authentik-bootstrap", "tamoss-database-connection", "traefik", "cert-manager", "tamoss-secrets-auth", "tamoss-secrets-tams", "oke-external-secrets"] %}
KUBECONFIG={{ (vars.ENV_DIR ~ "/management.kubeconfig") | quote }} NAMESPACE=tamoss-infra NAME={{ item | quote }} mise run bootstrap:remove-release
{% endfor %}''',
  "yq -i '.applicationRemoved = true' {{ vars.ENV_DIR }}/identity.yaml",
]

["bootstrap:remove-application"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:remove-application:apply",
]

["bootstrap:remove-operator:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(RESOURCE="$(kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get kustomization/"$TASKV_NAME" --ignore-not-found -o name)" && test -z "$RESOURCE")'''
run = [
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra patch kustomization/{{ env.TASKV_NAME }} --type=merge -p '{"spec":{"suspend":false,"prune":true,"deletionPolicy":"WaitForTermination"}}'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete kustomization/{{ env.TASKV_NAME }} --wait=true --timeout=300s",
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ env.NAME | default(value="tamoss-operator") }}{% endif %}'''

["bootstrap:remove-operator"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:remove-operator:apply",
]

["bootstrap:remove-release:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(RESOURCE="$(kubectl --kubeconfig "$TASKV_KUBECONFIG" -n "${TASKV_NAMESPACE}" get helmrelease/"$TASKV_NAME" --ignore-not-found -o name)" && test -z "$RESOURCE")'''
run = [
  '''kubectl --kubeconfig {{ (env.TASKV_KUBECONFIG) | quote }} -n '{{ env.TASKV_NAMESPACE }}' patch helmrelease/{{ env.TASKV_NAME }} --type=merge -p '{"spec":{"suspend":false}}'''',
  "kubectl --kubeconfig {{ (env.TASKV_KUBECONFIG) | quote }} -n '{{ env.TASKV_NAMESPACE }}' delete helmrelease/{{ env.TASKV_NAME }} --wait=true --timeout=600s",
]
env.TASKV_KUBECONFIG = '''{{ env.KUBECONFIG | default(value="") }}'''
env.TASKV_NAME = '''{{ env.NAME | default(value="") }}'''
env.TASKV_NAMESPACE = '''{{ env.NAMESPACE | default(value="") }}'''

["bootstrap:remove-release"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ env.TASKV_KUBECONFIG | quote }} || { printf '%s\n' "Missing required input: KUBECONFIG" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_NAMESPACE | quote }} || { printf '%s\n' "Missing required input: NAMESPACE" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_NAME | quote }} || { printf '%s\n' "Missing required input: NAME" >&2; exit 1; }''',
  "mise run bootstrap:remove-release:apply",
]
env.TASKV_KUBECONFIG = '''{{ env.KUBECONFIG | default(value="") }}'''
env.TASKV_NAME = '''{{ env.NAME | default(value="") }}'''
env.TASKV_NAMESPACE = '''{{ env.NAMESPACE | default(value="") }}'''

["bootstrap:down:managed"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -s '{{ vars.ENV_DIR }}/foundation-record.yaml' || { printf '%s\n' "Restore the retained foundation record before teardown" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run management:start-kind",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "yq -i '.teardownStarted = true' {{ vars.ENV_DIR }}/identity.yaml",
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run bootstrap:remote-stop",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:release",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:composite",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:record-observed-composite",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:resources",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:observe-owned",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:remote",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:remove-application",
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run bootstrap:remote-revoke",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:prepare-deletion",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete tamossenvironment/{{ env.TASKV_NAME }} --ignore-not-found --cascade=foreground --wait=true --timeout=1800s",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:delete-backups",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:audit",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:remove-access",
  "mise run storage:retire",
  "mise run storage:delete-identity",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:secret-inventory",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:retire-secrets",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:retained-foundation",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "mise run source:revoke",
  "kind delete cluster --name 'tamoss-cp-{{ env.TASKV_NAME }}'",
  "rm -f '{{ vars.ENV_DIR }}/management.kubeconfig' '{{ vars.ENV_DIR }}/remote.kubeconfig' '{{ vars.ENV_DIR }}/remote.pending.kubeconfig'",
  "yq -i '.teardownComplete = true' '{{ vars.ENV_DIR }}/identity.yaml'",
  "echo 'Environment removed; vault/key ownership and scheduled secret deletions are recorded in {{ vars.ENV_DIR }}/retained-foundation.yaml'",
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:remove-access:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(test -s '{{ vars.ENV_DIR }}/management.kubeconfig') && (kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get policy.identity.oci.m.upbound.io -l tamoss.livewyer.io/iam-role=runtime -o json | yq -p=json -e '.items | length == 0')"
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete policy.identity.oci.m.upbound.io -l tamoss.livewyer.io/iam-role=runtime --ignore-not-found --wait=true --timeout=600s",
]

["bootstrap:remove-access"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -s '{{ vars.ENV_DIR }}/management.kubeconfig' || { printf '%s\n' "The original management kubeconfig is required to remove runtime access" >&2; exit 1; }''',
  "mise run bootstrap:remove-access:apply",
]

["bootstrap:ready"]
hide = true
run = [
  { task = "bootstrap:remote-guard" },
  { task = "bootstrap:local-ready" },
]

["bootstrap:qualify"]
hide = true
run = [
  { task = "bootstrap:ready" },
  { task = "assets:restore-runtime" },
  "RELEASE_LOCK='{{ vars.ENV_DIR }}/tamoss-release.current.yaml' mise run tamoss:release",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get tamossenvironment/{{ env.TASKV_NAME }} -o jsonpath='{.status.outputs}' > '{{ vars.ENV_DIR }}/outputs.json'''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get configmap/database-connection -o json | yq -p=json -o=json -e 'select(.data.DATABASE_ID == load("{{ vars.ENV_DIR }}/outputs.json").databaseId) | {"data": {"primary-db-endpoint": {"fqdn": .data.DATABASE_HOST}, "ca-certificate": (.data.DATABASE_CA_BASE64 | @base64d)}}' > '{{ vars.ENV_DIR }}/database-connection.json'''',
  { task = "qualification:run" },
]
env.TASKV_NAME = '{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="environment") | get(key="name") }}'

["bootstrap:down"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "test -s '{{ vars.ENV_DIR }}/identity.yaml' || { printf '%s\\n' 'No deployment identity; no deletion attempted' >&2; exit 1; }",
  "mise run identity:inputs",
  "mise run bootstrap:down:dispatch"
]

["bootstrap:down:dispatch"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "yq -e '.teardownComplete == true' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null"
run = [
  "yq -i '.teardownStarted = true' '{{ vars.ENV_DIR }}/identity.yaml'",
  "mise run bootstrap:down:{% if env.TASKV_FOUNDATION == \"true\" %}managed{% else %}early{% endif %}"
]
env.TASKV_FOUNDATION = '''{{ exec(command="test ! -s " ~ ((vars.ENV_DIR ~ "/foundation-record.yaml") | quote) ~ " && echo false || echo true") }}'''

["bootstrap:down:early"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "yq -e '.bootstrapUID == null and .compositeUID == null and .remoteUID == null and .credentialsEstablished != true' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null || { printf '%s\\n' 'Restore the retained foundation record before managed teardown' >&2; exit 1; }",
  "mise run bootstrap:down:early-management",
  "INVENTORY_DIR='{{ vars.ENV_DIR }}/inventory-early-down' mise run cloud:inventory",
  "yq eval-all -e '[.data | (select(tag == \"!!seq\"), (select(tag == \"!!map\") | .items)) | .[] | select(.\"lifecycle-state\" != \"DELETED\" and .\"lifecycle-state\" != \"TERMINATED\") | select(.\"freeform-tags\".\"tamoss-deployment-id\" == load(\"{{ vars.ENV_DIR }}/identity.yaml\").deploymentUID or .\"freeform-tags\".\"tamoss-environment\" == load(\"{{ vars.ENV_DIR }}/identity.yaml\").environment.name or .name == load(\"{{ vars.ENV_DIR }}/identity.yaml\").environment.storage.bucket)] | length == 0' '{{ vars.ENV_DIR }}/inventory-early-down/'*.json > /dev/null",
  "mise run bootstrap:down:early-kind",
  "yq -i '.teardownComplete = true' '{{ vars.ENV_DIR }}/identity.yaml'",
  "printf '%s\\n' 'Partial deployment removed.'"
]

["bootstrap:down:early-management"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "yq -e '.managementUID == null' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null"
run = [
  "mise run management:start-kind",
  "mise run identity:management",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' get customresourcedefinitions -o json > '{{ vars.ENV_DIR }}/early-crds.json'",
  "yq -p=json -e '[.items[] | select(.metadata.name | test(\"[.]oci[.]|[.]tamoss[.]livewyer[.]io$\"))] | length == 0' '{{ vars.ENV_DIR }}/early-crds.json' > /dev/null || { printf '%s\\n' 'Cloud controllers may have started; recover the foundation record before teardown' >&2; exit 1; }"
]

["bootstrap:down:early-kind"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "yq -e '.managementUID == null' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null"
run = [
  "mise run identity:management",
  "mise run source:revoke",
  "kind delete cluster --name 'tamoss-cp-{{ env.TASKV_NAME }}'",
  "rm -f '{{ vars.ENV_DIR }}/management.kubeconfig'"
]
env.TASKV_NAME = '''{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="environment") | get(key="name") }}'''

["bootstrap:converged"]
