{{- $compartment := .Values.compartmentId -}}
{{- $cluster := .Values.clusterId -}}
{{- $verb := ternary "manage" "read" .Values.providerWrites -}}
{{- $services := dict "networking" (list "virtual-network-family") "containerengine" (list "cluster-family" "instance-family" "volume-family" "virtual-network-family") "psql" (list "postgres-db-systems" "postgres-backups") "objectstorage" (list "buckets") -}}
{{- range $service, $types := $services }}
---
apiVersion: identity.oci.m.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ $.Values.deploymentId }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    tamoss.livewyer.io/iam-role: runtime
    tamoss.livewyer.io/deployment-id: {{ $.Values.deploymentId | quote }}
spec:
  providerConfigRef: {kind: ProviderConfig, name: {{ $.Values.providerConfigName }}}
  forProvider:
    compartmentId: {{ $compartment }}
    name: {{ $.Values.deploymentId }}-{{ $service }}
    description: {{ printf "OCI %s provider for deployment %s" $service $.Values.deploymentId | quote }}
    freeformTags: {tamoss-deployment: {{ $.Values.deploymentId | quote }}}
    statements:
{{ range $types }}
      - {{ printf "Allow any-user to %s %s in compartment id %s where all {request.principal.type = 'workload', request.principal.cluster_id = '%s', request.principal.namespace = 'crossplane-system', request.principal.service_account = 'provider-oci-%s'%s}" $verb . $compartment $cluster $service (ternary (printf ", target.bucket.name = '%s'" $.Values.bucket) "" (eq $service "objectstorage")) | quote }}
{{ end }}
{{ if eq $service "psql" }}
{{ range list "postgres-configurations" "postgres-work-requests" }}
      - {{ printf "Allow any-user to read %s in compartment id %s where all {request.principal.type = 'workload', request.principal.cluster_id = '%s', request.principal.namespace = 'crossplane-system', request.principal.service_account = 'provider-oci-psql'}" . $compartment $cluster | quote }}
{{ end }}
{{ end }}
{{ end }}
---
apiVersion: identity.oci.m.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ .Values.deploymentId }}-database-connection
  namespace: {{ .Release.Namespace }}
  labels:
    tamoss.livewyer.io/iam-role: runtime
    tamoss.livewyer.io/deployment-id: {{ .Values.deploymentId | quote }}
spec:
  providerConfigRef: {kind: ProviderConfig, name: {{ .Values.providerConfigName }}}
  forProvider:
    compartmentId: {{ $compartment }}
    name: {{ .Values.deploymentId }}-database-connection
    description: Read PostgreSQL connection metadata for this environment
    freeformTags: {tamoss-deployment: {{ .Values.deploymentId | quote }}}
    statements:
      - {{ printf "Allow any-user to read postgres-db-systems in compartment id %s where all {request.principal.type = 'workload', request.principal.cluster_id = '%s', request.principal.namespace = 'auth', request.principal.service_account = 'database-connection', request.permission = 'POSTGRES_DB_SYSTEM_READ', request.operation = 'GetConnectionDetails'}" $compartment $cluster | quote }}
{{- $deliveries := dict "tamoss-infra" (list "database-admin" "adoption-bindings") "flux-system" (list "gitops" "asset-reader") "auth" (list "database-admin" "tams-database" "authentik-secret-key" "authentik-password" "authentik-token" "authentik-database" "tadoss-database" "tadoss-oauth") "tams" (list "tams-database" "s3") "tads" (list "tadoss-database") -}}
{{ range $namespace, $names := $deliveries }}
---
apiVersion: identity.oci.m.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ $.Values.deploymentId }}-secrets-{{ $namespace }}
  namespace: {{ $.Release.Namespace }}
  labels:
    tamoss.livewyer.io/iam-role: runtime
    tamoss.livewyer.io/deployment-id: {{ $.Values.deploymentId | quote }}
spec:
  providerConfigRef: {kind: ProviderConfig, name: {{ $.Values.providerConfigName }}}
  forProvider:
    compartmentId: {{ $compartment }}
    name: {{ $.Values.deploymentId }}-secrets-{{ $namespace }}
    description: {{ printf "Read persisted credentials for %s" $namespace | quote }}
    freeformTags: {tamoss-deployment: {{ $.Values.deploymentId | quote }}}
    statements:
{{ range $names }}
      - {{ printf "Allow any-user to read secret-bundles in compartment id %s where all {request.principal.type = 'workload', request.principal.cluster_id = '%s', request.principal.namespace = '%s', request.principal.service_account = '%s', target.vault.id = '%s', target.secret.name = '%s-%s'}" $compartment $cluster $namespace (ternary "asset-vault" "tamoss-vault" (eq . "asset-reader")) $.Values.vaultId $.Values.deploymentId . | quote }}
{{ end }}
{{ end }}
