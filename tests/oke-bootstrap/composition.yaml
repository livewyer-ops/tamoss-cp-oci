apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata: {name: oke-bootstrap-check}
spec:
  compositeTypeRef: {apiVersion: tamoss.livewyer.io/v1alpha1, kind: TamossBootstrap}
  mode: Pipeline
  pipeline:
    - step: remote-bootstrap
      functionRef: {name: function-go-templating}
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $_ := set . "extraResources" (.extraResources | default dict) -}}
            {{- $p := $xr.spec -}}
            {{- $prerequisite := dict -}}
            {{- range (dig "prerequisite" "items" (list) (.extraResources | default dict)) -}}{{- $prerequisite = .resource -}}{{- end -}}
            {{- $accessReady := eq (dig "data" "ready" "" $prerequisite) "true" -}}
            {{- $environment := dict "status" (dict "bootstrapReady" true "outputs" (dict "clusterId" "ocid1.cluster.oc1.fixture")) -}}
            {{- $foundation := dict "status" (dict "vaultId" "ocid1.vault.oc1.fixture") -}}
            {{- $accessRelease := dict -}}
            {{- $secretRelease := dict "metadata" (dict "generation" 1) "spec" (dict "values" (dict "initialise" false)) "status" (dict "observedGeneration" 1 "conditions" (list (dict "type" "Ready" "status" "True"))) -}}
            {{- $deliveries := list -}}
            {{- $secretDefaults := fromJson __SECRET_VALUES__ -}}
            {{- range $secretDefaults.deliveries -}}{{- $deliveries = append $deliveries (dict "resource" (dict "metadata" (dict "name" .name) "status" (dict "conditions" (list (dict "type" "Ready" "status" "True"))))) -}}{{- end -}}
            {{- $_ := set .extraResources "remoteCredentials" (dict "items" $deliveries) -}}
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              prerequisite:
                apiVersion: v1
                kind: ConfigMap
                namespace: {{ $xr.metadata.namespace }}
                matchName: prerequisites
              remotePods:
                apiVersion: v1
                kind: Pod
                namespace: {{ $xr.metadata.namespace }}
                matchLabels:
                  tamoss.livewyer.io/bootstrap: oke
                  tamoss.livewyer.io/deployment-id: {{ $p.deploymentId | quote }}
            __REMOTE_BOOTSTRAP__
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              remoteBootstrapReady: {{ $remoteReady }}
              remoteBootstrapCompleted: {{ $remoteCompleted }}
              remoteBootstrapPhase: {{ $remotePhase }}
              released: {{ and $p.released (eq (len $remotePods) 0) (empty $remoteJob) }}
