{{- if .Values.discovery }}
url: {{ .Values.git.url | quote }}
branch: {{ .Values.git.branch | quote }}
path: {{ .Values.git.path | default (printf "clusters/%s" .Values.name) | quote }}
product:
{{ .Values.product | toYaml | indent 2 }}
bundle:
{{ .Values.bundles.tamoss | toYaml | indent 2 }}
tadoss:
  bundle:
{{ .Values.bundles.tadoss | toYaml | indent 4 }}
{{- end }}
