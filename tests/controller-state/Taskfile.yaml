version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT: '{{.ROOT}}'
  CACHE: '{{.ROOT}}/.local/tmp/check'
  DIRECTORY: '{{.CACHE}}/controller-state'
  CORE: {sh: 'yq -r ''"xpkg.crossplane.io/crossplane/crossplane:v" + .crossplane.version'' {{.ROOT}}/dependencies.yaml'}
tasks:
  prepare-management:
    cmds:
      - mkdir -p '{{.DIRECTORY}}/artifact/environment' '{{.DIRECTORY}}/artifact/bindings'
      - >-
        yq 'select(.kind != "Secret") |
        with(select(.metadata.name == "secret-check"); .metadata.name = "binding-check") |
        with(select(.metadata.name == "secret-backend"); .metadata.name = "binding-backend") |
        with(select(.metadata.namespace == "secret-check"); .metadata.namespace = "binding-check") |
        with(select(.metadata.namespace == "secret-backend"); .metadata.namespace = "binding-backend") |
        with(select(.kind == "RoleBinding" and .metadata.namespace == "binding-backend"); .subjects[0].namespace = "binding-check")'
        '{{.ROOT}}/tests/secret-persistence/backend.yaml' > '{{.DIRECTORY}}/backend.yaml'
      - >-
        yq -n '{"apiVersion": "external-secrets.io/v1", "kind": "SecretStore",
        "metadata": {"name": "tamoss-vault", "namespace": "binding-check"},
        "spec": {"provider": load("{{.ROOT}}/tests/secret-persistence/provider.yaml")}} |
        .spec.provider.kubernetes.remoteNamespace = "binding-backend"' > '{{.DIRECTORY}}/store.yaml'
      - 'yq ''select(.kind == "PushSecret") | .metadata.namespace = "binding-check" | del(.metadata.ownerReferences, .metadata.annotations) | .spec.refreshInterval = "1s"'' {{.DIRECTORY}}/persisted.yaml > {{.DIRECTORY}}/push.yaml'
      - 'yq ''.metadata.namespace = "binding-check" | del(.metadata.ownerReferences, .metadata.annotations)'' {{.DIRECTORY}}/snapshot.yaml > {{.DIRECTORY}}/input.yaml'
      - cp '{{.ROOT}}/deploy/gitops/bindings/kustomization.yaml' '{{.DIRECTORY}}/artifact/bindings/'
      - 'yq ''.metadata.namespace = "binding-check" | .spec.refreshInterval = "1s"'' {{.ROOT}}/deploy/gitops/bindings/secret.yaml > {{.DIRECTORY}}/artifact/bindings/secret.yaml'
      - >-
        yq '.metadata.namespace = "binding-check" | .spec.crossplane.compositionRef.name = "binding-observer" |
        .spec.adoption.creationCompositeUID = "${CREATION_COMPOSITE_UID}" | .spec.adoption.deploymentId = "${DEPLOYMENT_ID}" |
        .spec.adoption.externalNames |= with_entries(.value = ("${" + (.key | upcase | sub("-"; "_")) + "}"))'
        '{{.CACHE}}/adoption.yaml' > '{{.DIRECTORY}}/artifact/environment/environment.yaml'
      - cp '{{.ROOT}}/deploy/gitops/starter/infrastructure.yaml' '{{.DIRECTORY}}/artifact/environment/kustomization.yaml'
      - >-
        helm template bootstrap '{{.ROOT}}/charts/gitops-bootstrap' -f '{{.ROOT}}/tests/gitops/values.yaml' -f '{{.CACHE}}/gitops-pins.yaml' |
        yq 'select(.metadata.name == "adoption-bindings") | .metadata.namespace = "binding-check" |
        .spec.sourceRef = {"kind": "GitRepository", "name": "binding-fixture"} | .spec.path = "./bindings" |
        .spec.dependsOn = [] | .spec.interval = "5s" | .spec.retryInterval = "5s" | .spec.timeout = "5s" |
        .spec.healthChecks[].namespace = "binding-check"' > '{{.DIRECTORY}}/binding-kustomization.yaml'
      - >-
        yq 'select(.metadata.name == "infrastructure") | .metadata.namespace = "binding-check" |
        .spec.sourceRef = {"kind": "GitRepository", "name": "binding-fixture"} | .spec.path = "./environment" |
        .spec.interval = "5s" | .spec.retryInterval = "5s" | .spec.timeout = "5s" |
        .spec.healthChecks[0].namespace = "binding-check" | .spec.healthChecks[0].name = load("{{.CACHE}}/adoption.yaml").metadata.name'
        '{{.ROOT}}/deploy/gitops/starter/releases.yaml' > '{{.DIRECTORY}}/infrastructure-kustomization.yaml'
      - tar -czf '{{.DIRECTORY}}/bindings.tar.gz' -C '{{.DIRECTORY}}/artifact' .
      - kubectl -n flux-system cp '{{.DIRECTORY}}/bindings.tar.gz' "$(kubectl -n flux-system get pod -l app=source-controller -o jsonpath='{.items[0].metadata.name}'):/data/bindings-fixture.tar.gz"
      - >-
        ARTIFACT_DIGEST="$(sha256sum '{{.DIRECTORY}}/bindings.tar.gz' | cut -d ' ' -f 1)"
        yq -n '{"apiVersion": "source.toolkit.fluxcd.io/v1", "kind": "GitRepository",
        "metadata": {"name": "binding-fixture", "namespace": "binding-check"},
        "spec": {"interval": "1m", "suspend": true, "url": "https://example.invalid/fixture"},
        "status": {"observedGeneration": 1,
        "conditions": [{"type": "Ready", "status": "True", "reason": "Fixture", "message": "Local bindings artifact", "lastTransitionTime": "2026-01-01T00:00:00Z"}],
        "artifact": {"path": "bindings-fixture.tar.gz", "url": "http://source-controller.flux-system.svc.cluster.local./bindings-fixture.tar.gz",
        "revision": "main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "digest": ("sha256:" + strenv(ARTIFACT_DIGEST)), "lastUpdateTime": "2026-01-01T00:00:00Z"}}}'
        > '{{.DIRECTORY}}/source.yaml'
  render:
    cmds:
      - mkdir -p '{{.DIRECTORY}}'
      - >-
        yq '.metadata.uid = .spec.adoption.creationCompositeUID | del(.spec.adoption) | .spec.managementPolicies = ["*"]'
        '{{.CACHE}}/adoption.yaml' > '{{.DIRECTORY}}/creation.yaml'
      - >-
        yq 'select(.spec.forProvider != null) | del(.metadata.ownerReferences) |
        .status = {"conditions": [{"type": "Ready", "status": "True"}],
        "atProvider": {"id": .metadata.annotations."crossplane.io/external-name"}} |
        with(select(.kind == "PublicIp"); .status.atProvider.ipAddress = "203.0.113.10")'
        '{{.CACHE}}/adoption-render.yaml' > '{{.DIRECTORY}}/observed.yaml'
      - crossplane composition render '{{.DIRECTORY}}/creation.yaml' '{{.CACHE}}/composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/observed.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/complete.yaml'
      - 'yq -e ''select(.kind == "Secret")'' {{.DIRECTORY}}/complete.yaml > {{.DIRECTORY}}/snapshot.yaml'
      - >-
        yq -e '.immutable == true and
        ((.data.ADOPTION_YAML | @base64d | from_yaml | to_json) == (load("{{.CACHE}}/adoption.yaml").spec.adoption | to_json))'
        '{{.DIRECTORY}}/snapshot.yaml'
      - 'yq ''with(select(.kind == "PsqlDbSystem"); .status.conditions[0].status = "False")'' {{.DIRECTORY}}/observed.yaml > {{.DIRECTORY}}/pending.yaml'
      - crossplane composition render '{{.DIRECTORY}}/creation.yaml' '{{.CACHE}}/composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/pending.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/pending-render.yaml'
      - 'yq eval-all -e ''[select(.kind == "Secret")] | length == 0'' {{.DIRECTORY}}/pending-render.yaml'
      - 'yq -e ''select(.kind == "TamossEnvironment") | .status.bootstrapReady == true and .status.bindingsReady == false'' {{.DIRECTORY}}/pending-render.yaml'
      - 'yq eval-all ''del(.status)'' {{.DIRECTORY}}/observed.yaml {{.DIRECTORY}}/snapshot.yaml > {{.DIRECTORY}}/lost-status.yaml'
      - crossplane composition render '{{.DIRECTORY}}/creation.yaml' '{{.CACHE}}/composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/lost-status.yaml' --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/retained.yaml'
      - 'yq -e ''select(.kind == "Secret") | (.data | to_json) == (load("{{.DIRECTORY}}/snapshot.yaml").data | to_json)'' {{.DIRECTORY}}/retained.yaml'
      - 'yq eval-all ''.'' {{.DIRECTORY}}/observed.yaml {{.DIRECTORY}}/snapshot.yaml > {{.DIRECTORY}}/changed.yaml'
      - 'yq -i ''with(select(.kind == "Vcn"); .metadata.annotations."crossplane.io/external-name" = "ocid1.vcn.oc1.changed")'' {{.DIRECTORY}}/changed.yaml'
      - crossplane composition render '{{.CACHE}}/adoption.yaml' '{{.CACHE}}/composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/observed.yaml' --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/runtime.yaml'
      - 'yq -e ''select(.kind == "ConfigMap") | .data.PUBLIC_IP == "203.0.113.10" and .data.DATABASE_ID == load("{{.CACHE}}/adoption.yaml").spec.adoption.externalNames.database'' {{.DIRECTORY}}/runtime.yaml'
      - 'yq eval-all -e ''[select(.kind == "Secret")] | length == 0'' {{.DIRECTORY}}/runtime.yaml'
      - 'yq ''.metadata.name = "adoption-bindings"'' {{.DIRECTORY}}/snapshot.yaml > {{.DIRECTORY}}/readback-secret.yaml'
      - 'yq eval-all ''del(.metadata.ownerReferences, .metadata.annotations)'' {{.DIRECTORY}}/snapshot.yaml {{.DIRECTORY}}/readback-secret.yaml > {{.DIRECTORY}}/readback.yaml'
      - 'yq ''with(select(.kind == "TamossEnvironment"); .metadata.uid = load("{{.CACHE}}/adoption.yaml").spec.adoption.creationCompositeUID)'' {{.CACHE}}/bootstrap/native-observed.yaml > {{.DIRECTORY}}/bootstrap-observed.yaml'
      - crossplane composition render '{{.CACHE}}/bootstrap/native-root.yaml' '{{.CACHE}}/bootstrap/native-composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/bootstrap-observed.yaml' --required-resources='{{.DIRECTORY}}/readback.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/persisted.yaml'
      - 'yq -e ''select(.kind == "TamossBootstrap") | .status.bindingsReady == true'' {{.DIRECTORY}}/persisted.yaml'
      - 'yq -e ''select(.kind == "PushSecret") | .spec.updatePolicy == "IfNotExists" and .spec.deletionPolicy == "None"'' {{.DIRECTORY}}/persisted.yaml'
      - 'yq ''with(select(.metadata.name == "adoption-bindings"); .data.VCN = "bWlzbWF0Y2g=")'' {{.DIRECTORY}}/readback.yaml > {{.DIRECTORY}}/wrong-readback.yaml'
      - >-
        yq eval-all 'select(.kind == "SecretFoundation" or .kind == "TamossEnvironment" or
        (.kind == "HelmRelease" and .metadata.name == "runtime-access")) |
        with(select(.kind == "TamossEnvironment"); .status.bootstrapReady = true) |
        with(select(.kind == "HelmRelease"); .metadata.generation = 2 | .status = {"observedGeneration": 2,
        "conditions": [{"type": "Ready", "status": "True"}]})'
        '{{.DIRECTORY}}/persisted.yaml' > '{{.DIRECTORY}}/access-observed.yaml'
      - >-
        helm template access '{{.ROOT}}/charts/runtime-access' -n tamoss-infra -f '{{.ROOT}}/tests/secrets/access-values.yaml' |
        yq '.status.conditions = [{"type": "Ready", "status": "True"}, {"type": "Synced", "status": "True"}]'
        > '{{.DIRECTORY}}/policies.yaml'
      - 'yq ''with(select(.metadata.name | test("-networking$")); .status.conditions[1].status = "False")'' {{.DIRECTORY}}/policies.yaml > {{.DIRECTORY}}/unsynced-policies.yaml'
      - 'yq ''select(.metadata.name | test("-networking$") | not)'' {{.DIRECTORY}}/policies.yaml > {{.DIRECTORY}}/missing-policy.yaml'
      - for: [policies, unsynced-policies, missing-policy]
        cmd: crossplane composition render '{{.CACHE}}/bootstrap/native-retired-root.yaml' '{{.CACHE}}/bootstrap/native-composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/access-observed.yaml' --required-resources='{{.DIRECTORY}}/{{.ITEM}}.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/{{.ITEM}}-render.yaml'
      - 'yq -e ''select(.kind == "TamossBootstrap") | .status.runtimeAccessReady == true and .status.bootstrapReady == true and .status.bindingsReady == false'' {{.DIRECTORY}}/policies-render.yaml'
      - for: [unsynced-policies, missing-policy]
        cmd: 'yq -e ''select(.kind == "TamossBootstrap") | .status.runtimeAccessReady == false and .status.bootstrapReady == false'' {{.DIRECTORY}}/{{.ITEM}}-render.yaml'
      - 'yq ''with(select(.kind == "HelmRelease"); .status.observedGeneration = 1)'' {{.DIRECTORY}}/access-observed.yaml > {{.DIRECTORY}}/stale-access.yaml'
      - crossplane composition render '{{.CACHE}}/bootstrap/native-retired-root.yaml' '{{.CACHE}}/bootstrap/native-composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.DIRECTORY}}/stale-access.yaml' --required-resources='{{.DIRECTORY}}/policies.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.DIRECTORY}}/stale-access-render.yaml'
      - 'yq -e ''select(.kind == "TamossBootstrap") | .status.bootstrapReady == false'' {{.DIRECTORY}}/stale-access-render.yaml'
      - chainsaw test --no-cluster --test-dir '{{.ROOT}}/tests/controller-state/render' --set-string directory='{{.DIRECTORY}}' --set-string root='{{.ROOT}}' --set-string core='{{.CORE}}' --report-format JUNIT-TEST --report-path '{{.ROOT}}/.local/reports' --report-name controller-state-render
