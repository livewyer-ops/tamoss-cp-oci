apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: management-admission
spec:
  steps:
    - name: schema admission without cloud credentials
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: tamoss-infra
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -k, ../../environments/example]
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -f, ../../.local/tmp/check/partial.yaml]
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -k, name-boundary]
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -k, ../invalid/name-length]
            check:
              ($error != null): true
              (contains($stderr, 'Environment names must use 3-23')): true
    - name: retain cluster configuration when resolved references are applied
      try:
        - command: &applyCluster
            entrypoint: kubectl
            args: [apply, --server-side, --force-conflicts, --field-manager=composition-check, -f, ../../.local/tmp/check/cluster-reference.yaml]
        - command: &resolveCluster
            entrypoint: kubectl
            args: [apply, --server-side, --force-conflicts, --field-manager=reference-check, -f, cluster-reference-resolution.yaml]
        - command: *applyCluster
        - command: *resolveCluster
        - assert:
            resource:
              apiVersion: containerengine.oci.m.upbound.io/v1alpha1
              kind: Cluster
              metadata: {name: qualification-cluster, namespace: tamoss-infra}
              spec:
                forProvider:
                  vcnId: ocid1.test.oc1..vcn
                  (endpointConfig[0].subnetId): ocid1.test.oc1..api-subnet
                  (endpointConfig[0].isPublicIpEnabled): true
                  (options[0].serviceLbSubnetIds[0]): ocid1.test.oc1..loadBalancer-subnet
      finally:
        - command:
            entrypoint: kubectl
            args: [delete, clusters.containerengine.oci.m.upbound.io, qualification-cluster, -n, tamoss-infra, --ignore-not-found, --wait=false]
    - name: database TLS schema admission
      try:
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, -f, ../../.local/tmp/check/schemas/operator.yaml]
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata: {name: tamosses.tamoss.livewyer.io}
              status:
                (conditions[?type == 'Established'] | [0].status): 'True'
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata: {name: tams}
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -f, ../../.local/tmp/check/tamoss.yaml]
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -f, ../../.local/tmp/check/ha-pods.yaml]
        - command:
            entrypoint: kubectl
            args: [apply, --server-side, --dry-run=server, -f, invalid-database-tls.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'missing-ca-name')): true
              (contains($stderr, 'missing-ca-key')): true
              (contains($stderr, 'optional-ca')): true
              (contains($stderr, 'database TLS requires a non-optional CA ConfigMap name and key')): true
