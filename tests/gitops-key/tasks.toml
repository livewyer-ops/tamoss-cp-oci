
["test:gitops-key:prepare"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}'",
  '''yq 'select(.kind != "Secret") | with(select(.kind == "Namespace"); .metadata.name |= sub("secret-"; "gitops-key-")) | with(select(.metadata.namespace != null); .metadata.namespace |= sub("secret-"; "gitops-key-")) | with(select(.kind == "RoleBinding"); (.subjects[] | select(.namespace == "secret-check")).namespace = "gitops-key-check")' '{{ vars.PROJECT_ROOT }}/tests/secret-persistence/backend.yaml' > '{{ env.TASKV_DIRECTORY }}/backend.yaml'''',
  '''yq -n '{"apiVersion": "external-secrets.io/v1", "kind": "SecretStore", "metadata": {"name": "tamoss-vault", "namespace": "gitops-key-check"}, "spec": {"provider": load("{{ vars.PROJECT_ROOT }}/tests/secret-persistence/provider.yaml")}} | .spec.provider.kubernetes.remoteNamespace = "gitops-key-backend"' > '{{ env.TASKV_DIRECTORY }}/store.yaml'''',
  "helm template gitops-auth '{{ vars.PROJECT_ROOT }}/charts/gitops-auth' -n gitops-key-check --set deploymentId=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > '{{ env.TASKV_DIRECTORY }}/initial.yaml'",
  "helm template gitops-auth '{{ vars.PROJECT_ROOT }}/charts/gitops-auth' -n gitops-key-check --set deploymentId=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set initialise=false > '{{ env.TASKV_DIRECTORY }}/retired.yaml'",
  '''yq eval-all -e '[select(.kind == "PushSecret")] | length == 0' {{ env.TASKV_DIRECTORY }}/retired.yaml''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.PROJECT_ROOT }}/.local/tmp/check/gitops-key{% endif %}"
