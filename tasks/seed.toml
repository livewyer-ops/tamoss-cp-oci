["bootstrap:remote-observe"]
hide = true
run = [
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run identity:management",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get kustomizations,helmreleases -l 'tamoss.livewyer.io/deployment-id={{ env.TASKV_DEPLOYMENT }}' -o json > '{{ vars.ENV_DIR }}/remote-bootstrap-observed.json'",
  '''yq -e '[.items[] | .metadata.labels."tamoss.livewyer.io/deployment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID] | all' '{{ vars.ENV_DIR }}/remote-bootstrap-observed.json' > /dev/null''',
]
env.TASKV_DEPLOYMENT = '{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="deploymentUID") }}'

["bootstrap:remote-guard"]
hide = true
run = [
  '''yq -e '.teardownComplete != true and .remoteAccessRetired != true' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null''',
  { task = "identity:management" },
  { task = "bootstrap:remote-rbac" },
]

["bootstrap:remote-rbac"]
hide = true
quiet = true
run = [
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run identity:remote",
  '''yq '.metadata.labels."tamoss.livewyer.io/deployment-id" = load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID' '{{ vars.ROOT_DIR }}/deploy/management/remote-rbac.yaml' > '{{ vars.ENV_DIR }}/remote-rbac.yaml'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' --request-timeout=30s get -f '{{ vars.ENV_DIR }}/remote-rbac.yaml' --ignore-not-found -o json > '{{ vars.ENV_DIR }}/remote-rbac-observed.json'",
  '''yq -e '[.items[] | .metadata.labels."tamoss.livewyer.io/deployment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID] | all' '{{ vars.ENV_DIR }}/remote-rbac-observed.json' > /dev/null || { printf '%s\n' "Bootstrap access belongs to another deployment" >&2; exit 1; }''',
]

["bootstrap:remote-access:issue"]
hide = true
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' apply --server-side -f '{{ vars.ENV_DIR }}/remote-rbac.yaml'",
  """umask 077
kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' apply --server-side -f '{{ vars.ROOT_DIR }}/deploy/management/remote-token.yaml'
kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tamoss-bootstrap wait secret/oke-bootstrap-token --for=jsonpath='{.data.token}' --timeout=60s > /dev/null
kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tamoss-bootstrap get secret oke-bootstrap-token -o json > '{{ vars.ENV_DIR }}/remote-token.json'
mise run bootstrap:remote-access:render
kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' apply --server-side -f '{{ vars.ENV_DIR }}/remote-access.yaml'""",
  # The root release failed while this access was missing; request it now rather than wait out its retry delay.
  """kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra annotate helmrelease -l tamoss.livewyer.io/deployment-id --overwrite reconcile.fluxcd.io/requestedAt="$(date +%s)" > /dev/null""",
]
depends_post = ["bootstrap:remote-access:cleanup"]

["bootstrap:remote-access:render"]
hide = true
quiet = true
run = [
  '''umask 077
yq -n -e 'load("{{ vars.ENV_DIR }}/identity.yaml") as $i | (load("{{ vars.ENV_DIR }}/remote-token.json").data.token | select(. != null) | @base64d) as $t | {"apiVersion": "v1", "kind": "Secret", "type": "Opaque", "metadata": {"name": "oke-bootstrap-access", "namespace": "tamoss-infra", "labels": {"tamoss.livewyer.io/deployment-id": $i.deploymentUID}, "annotations": {"tamoss.livewyer.io/cluster-id": $i.clusterID, "tamoss.livewyer.io/cluster-uid": $i.remoteUID}}, "stringData": {"value.yaml": ({"apiVersion": "v1", "kind": "Config", "clusters": [{"name": "oke", "cluster": {"server": $i.remoteServer, "certificate-authority-data": (load("{{ vars.ENV_DIR }}/remote.kubeconfig").clusters[0].cluster."certificate-authority-data" | select(. != null))}}], "users": [{"name": "bootstrap", "user": {"token": $t}}], "contexts": [{"name": "oke", "context": {"cluster": "oke", "user": "bootstrap"}}], "current-context": "oke"} | to_yaml)}}' > '{{ vars.ENV_DIR }}/remote-access.yaml'''',
]

["bootstrap:remote-access:cleanup"]
hide = true
quiet = true
run = [
  "rm -f '{{ vars.ENV_DIR }}/remote-token.json' '{{ vars.ENV_DIR }}/remote-access.yaml' '{{ vars.ENV_DIR }}/remote-access-observed.json'",
]

["bootstrap:remote-stop"]
hide = true
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get helmrelease/tamoss-management --ignore-not-found -o name | xargs -r kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra patch --type=merge -p '{\"spec\":{\"suspend\":true}}'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n flux-system scale deployment/kustomize-controller deployment/helm-controller --replicas=0",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n flux-system wait pod -l 'app in (kustomize-controller,helm-controller)' --for=delete --timeout=180s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get kustomizations,helmreleases -l 'tamoss.livewyer.io/deployment-id={{ env.TASKV_DEPLOYMENT }}' -o json > '{{ vars.ENV_DIR }}/remote-bootstrap-observed.json'",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' patch -f '{{ vars.ENV_DIR }}/remote-bootstrap-observed.json' --type=merge -p '{"spec":{"suspend":true}}' ''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n flux-system scale deployment/kustomize-controller deployment/helm-controller --replicas=1",
]
env.TASKV_DEPLOYMENT = '{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="deploymentUID") }}'

["bootstrap:remote-suspend"]
hide = true
# Stop OKE's own Flux from restoring releases while teardown removes them.
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system scale deployment/kustomize-controller deployment/helm-controller --replicas=0",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system wait pod -l 'app in (kustomize-controller,helm-controller)' --for=delete --timeout=180s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tamoss-infra get kustomizations,helmreleases -l 'tamoss.livewyer.io/deployment-id={{ env.TASKV_DEPLOYMENT }}' -o json > '{{ vars.ENV_DIR }}/remote-flux-observed.json'",
  '''yq -e '.items | length == 0' '{{ vars.ENV_DIR }}/remote-flux-observed.json' > /dev/null || kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' patch -f '{{ vars.ENV_DIR }}/remote-flux-observed.json' --type=merge -p '{"spec":{"suspend":true}}' ''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system scale deployment/kustomize-controller deployment/helm-controller --replicas=1",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system rollout status deployment/helm-controller --timeout=180s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n flux-system rollout status deployment/kustomize-controller --timeout=180s",
]
env.TASKV_DEPLOYMENT = '{{ read_yaml(path=vars.ENV_DIR ~ "/identity.yaml") | get(key="deploymentUID") }}'

["bootstrap:remote-revoke:apply"]
hide = true
skip_if = '''yq -e '.remoteUID == null' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null || (yq -e '.teardownStarted == true' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null && yq -e '[(tag == "!!seq"), ([.[] | select(.id | test("^ocid1[.]cluster[.]"))] | length == 0)] | all' '{{ vars.ENV_DIR }}/owned-current.yaml' > /dev/null)'''
run = [
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run bootstrap:remote-rbac",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' --request-timeout=30s delete -f '{{ vars.ENV_DIR }}/remote-rbac.yaml' --ignore-not-found --wait=true --timeout=180s",
]

["bootstrap:remote-revoke"]
hide = true
run = [
  "yq -i '.remoteAccessRetired = true' '{{ vars.ENV_DIR }}/identity.yaml'",
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run bootstrap:remote-observe",
  '''yq -e '[.items[] | .spec.suspend == true] | all' '{{ vars.ENV_DIR }}/remote-bootstrap-observed.json' > /dev/null || { printf '%s\n' "Suspend remote bootstrap before revoking its access" >&2; exit 1; }''',
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run bootstrap:remote-revoke:apply",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra delete secret oke-bootstrap-access --ignore-not-found",
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run bootstrap:remote-access:cleanup",
]


["settings:render"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  # The management chart derives the OKE settings from the same private values Kind was seeded with.
  '''umask 077
helm template management charts/management -f pins.yaml -f '{{ vars.ENV_DIR }}/values.yaml' -f '{{ vars.ENV_DIR }}/deployment.yaml' --set renderSettings=true --show-only templates/settings.yaml > '{{ vars.ENV_DIR }}/oke-settings.yaml'''',
]

["settings:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  { task = "settings:render" },
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' apply --server-side -f '{{ vars.ENV_DIR }}/oke-settings.yaml'",
]

["settings:guard"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  # Kind owns the base and is stopped, so a change there cannot be applied from here.
  '''helm template management charts/management -f pins.yaml -f '{{ vars.ENV_DIR }}/values.yaml' -f '{{ vars.ENV_DIR }}/deployment.yaml' --show-only templates/instance.yaml | yq 'select(.kind == "ConfigMap") | .data."values.yaml" | from_yaml | .bootstrap' | diff -q - '{{ vars.ENV_DIR }}/bootstrap.yaml' > /dev/null || { echo 'These values change the network, cluster, identity or Vault that up created. apply changes only the settings OKE reconciles; restore the other values, or remove the deployment and create a fresh one.' >&2; exit 1; }''',
  '''yq -e '(.tadoss.enabled // false) == load("{{ vars.ENV_DIR }}/settings.yaml").tadoss.enabled' '{{ vars.ENV_DIR }}/values.yaml' > /dev/null || { echo 'TADOSS is selected before a fresh deployment and cannot be changed by apply.' >&2; exit 1; }''',
]

["settings:update"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  { task = "environment:local" },
  { task = "assets:verify" },
  "ENV_DIR={{ vars.ENV_DIR | quote }} mise run identity:remote",
  { task = "settings:guard" },
  { task = "settings:render" },
  # Flux in OKE reconciles the release when these ConfigMaps change; wait for it to take the new values before judging readiness.
  '''export KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig'
if kubectl diff --server-side -f '{{ vars.ENV_DIR }}/oke-settings.yaml' > /dev/null; then echo 'OKE already has these settings.'; exit 0; fi
BEFORE="$(kubectl -n tamoss-infra get helmrelease/tamoss-gitops -o jsonpath='{.status.lastAttemptedConfigDigest}')"
kubectl apply --server-side -f '{{ vars.ENV_DIR }}/oke-settings.yaml'
BEFORE="$BEFORE" timeout 600 sh -c 'until test "$(kubectl -n tamoss-infra get helmrelease/tamoss-gitops -o jsonpath="{.status.lastAttemptedConfigDigest}")" != "$BEFORE"; do sleep 5; done' || { echo 'OKE did not take the new settings within ten minutes; inspect HelmRelease tamoss-infra/tamoss-gitops.' >&2; exit 1; }''',
  "KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig' chainsaw test --skip-delete --namespace tamoss-infra --test-dir deploy/gitops/readiness-check --assert-timeout=1800s --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name settings-ready",
]
