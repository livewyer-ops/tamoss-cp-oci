["test:oke-bootstrap:render"]
hide = true
run = [
  "mkdir -p .local/tmp/check/remote-render/flux-manifests",
  "helm template inputs charts/deployment-inputs -f tests/oke-bootstrap/inputs.yaml --show-only templates/remote.yaml --set-file files.environment=environments/example/environment.yaml,files.seedEnvironment=environments/example/environment.yaml,files.assets=tests/assets/lock.yaml,files.externalSecrets=deploy/secrets/controller-values.yaml,files.dependencies=dependencies.yaml > .local/tmp/check/remote-render/controllers.yaml",
  '''yq 'select(.kind == "Kustomization" and .metadata.name == "oke-flux")' .local/tmp/check/remote-render/controllers.yaml > .local/tmp/check/remote-render/flux.yaml''',
  '''flux pull artifact "oci://ghcr.io/fluxcd/flux-manifests@$(yq -r .flux.manifestsDigest dependencies.yaml)" --output .local/tmp/check/remote-render/flux-manifests --timeout=60s''',
  "flux build kustomization oke-flux -n tamoss-infra --dry-run --in-memory-build --path .local/tmp/check/remote-render/flux-manifests --kustomization-file .local/tmp/check/remote-render/flux.yaml > .local/tmp/check/remote-render/installed.yaml",
  '''yq eval-all -e '[select(.kind == "Deployment") | .metadata.name] | sort | join(",") == "helm-controller,kustomize-controller,notification-controller,source-controller"' .local/tmp/check/remote-render/installed.yaml''',
  '''yq eval-all -e '[select(.kind == "Deployment") | .metadata.labels."app.kubernetes.io/version" == strenv(TASKV_FLUX_VERSION)] | all' .local/tmp/check/remote-render/installed.yaml''',
  '''yq eval-all -e '[select(.kind == "Job" and .metadata.name == "oke-bootstrap")] | length == 0' '{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap/native.yaml'''',
  '''yq -e 'select(.kind == "CompositeResourceDefinition") | .spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.remoteBootstrap == null' '{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap/api.yaml'''',
]

env.TASKV_FLUX_VERSION = '''{{ exec(command="yq -p=toml -r '.tools.\"aqua:fluxcd/flux2\"' " ~ (vars.ROOT_DIR | quote) ~ "/mise.toml") }}'''

["test:oke-bootstrap:retirement"]
hide = true
run = [
  "install -d -m 700 '{{ env.ENV_DIR }}'",
  '''yq -n '{"teardownStarted": false}' > '{{ env.ENV_DIR }}/identity.yaml'''',
  '''yq -n '[]' > '{{ env.ENV_DIR }}/owned-current.yaml'''',
  "chainsaw test --no-cluster --test-dir tests/oke-bootstrap/retirement --set-string root='{{ vars.ROOT_DIR }}' --set-string directory='{{ env.ENV_DIR }}' --exec-timeout=30s --report-format JUNIT-TEST --report-path .local/reports --report-name remote-retirement",
]
env.ENV_DIR = "{{ vars.ROOT_DIR }}/.local/tmp/check/remote-retirement"

["test:oke-bootstrap:check"]
hide = true
run = [
  "install -d -m 700 '{{ env.DIRECTORY }}'",
  "TARGET={{ env.TARGET | quote }} DIRECTORY={{ env.DIRECTORY | quote }} mise run test:oke-bootstrap:run",
]
env.DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/check/oke-bootstrap"
env.TARGET = 'tamoss-remote-seed-{{ now() | date(format="%s") }}'

["test:oke-bootstrap:run"]
hide = true
run = [
  "kind create cluster --name '{{ env.TARGET }}' --config deploy/management/kind.yaml --kubeconfig '{{ env.DIRECTORY }}/target.kubeconfig' --wait 120s",
  "mise run test:oke-bootstrap:prepare",
  "chainsaw test --skip-delete --test-dir tests/oke-bootstrap/management --cluster remote='{{ env.DIRECTORY }}/target.kubeconfig' --set-string root='{{ vars.ROOT_DIR }}' --set-string directory='{{ env.DIRECTORY }}' --exec-timeout 180s --assert-timeout 600s --report-format JUNIT-TEST --report-path .local/reports --report-name oke-bootstrap",
]
depends_post = ["test:oke-bootstrap:cleanup"]

["test:oke-bootstrap:cleanup"]
hide = true
run = [
  "kind delete cluster --name '{{ env.TARGET }}'",
  "kubectl -n tamoss-infra delete secret oke-bootstrap-access --ignore-not-found",
  "kubectl -n flux-system scale deployment/kustomize-controller --replicas=1",
  "kubectl -n tamoss-infra delete kustomization oke-flux oke-eso oke-asset-access oke-seed --ignore-not-found --timeout=60s",
  "rm -f '{{ env.DIRECTORY }}/target.kubeconfig' '{{ env.DIRECTORY }}/management.kubeconfig' '{{ env.DIRECTORY }}/remote.kubeconfig' '{{ env.DIRECTORY }}/remote.pending.kubeconfig' '{{ env.DIRECTORY }}/remote.saved.kubeconfig' '{{ env.DIRECTORY }}/bootstrap-token.kubeconfig' '{{ env.DIRECTORY }}/remote-token.json' '{{ env.DIRECTORY }}/remote-access.yaml' '{{ env.DIRECTORY }}/expired-access.yaml'",
]

["test:oke-bootstrap:prepare"]
hide = true
run = [
  '''cp "$KUBECONFIG" '{{ env.DIRECTORY }}/management.kubeconfig'''',
  '''yq '.metadata.name = "host-seed" | .metadata.namespace = "tamoss-infra" | .metadata.annotations."crossplane.io/paused" = "true" | .spec.credentialsEstablished = true' '.local/tmp/check/bootstrap/native-root.yaml' > '{{ env.DIRECTORY }}/bootstrap.yaml'''',
  '''yq '{"apiVersion": .apiVersion, "kind": "TamossEnvironment", "metadata": {"name": .metadata.name, "namespace": .metadata.namespace}, "spec": .spec.environment}' '{{ env.DIRECTORY }}/bootstrap.yaml' > '{{ env.DIRECTORY }}/environment.yaml'''',
  "ENV_DIR={{ env.DIRECTORY | quote }} mise run identity:observe-inputs",
  "kubectl get namespace kube-system -o jsonpath='{.metadata.uid}' > '{{ env.DIRECTORY }}/management-uid'",
  '''yq '.deploymentUID = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" | .managementUID = load_str("{{ env.DIRECTORY }}/management-uid")' '{{ env.DIRECTORY }}/identity-inputs.yaml' > '{{ env.DIRECTORY }}/identity.yaml'''',
  '''yq '.users[0].user.exec = {"apiVersion": "client.authentication.k8s.io/v1beta1", "command": "oci", "args": ["ce", "cluster", "generate-token", "--cluster-id", "ocid1.cluster.oc1.fixture"], "interactiveMode": "Never"}' '{{ env.DIRECTORY }}/target.kubeconfig' > '{{ env.DIRECTORY }}/remote.pending.kubeconfig'''',
  '''docker inspect '{{ env.TARGET }}-control-plane' --format '{{"{{"}}(index .NetworkSettings.Networks "kind").IPAddress{{"}}"}}' > '{{ env.DIRECTORY }}/target-address'''',
  '''yq -i '.clusters[0].cluster.server = ("https://" + (load_str("{{ env.DIRECTORY }}/target-address") | trim) + ":6443")' '{{ env.DIRECTORY }}/remote.pending.kubeconfig'''',
  "ENV_DIR={{ env.DIRECTORY | quote }} CLUSTER_ID=ocid1.cluster.oc1.fixture mise run cloud:remote:record",
  "cp '{{ env.DIRECTORY }}/remote.kubeconfig' '{{ env.DIRECTORY }}/remote.saved.kubeconfig'",
  "mkdir -p '{{ env.DIRECTORY }}/product/deploy/bootstrap/remote'",
  "cp deploy/bootstrap/remote/*.yaml '{{ env.DIRECTORY }}/product/deploy/bootstrap/remote/'",
  "cp -a deploy/bootstrap/eso deploy/bootstrap/asset-access '{{ env.DIRECTORY }}/product/deploy/bootstrap/'",
  '''yq 'select((.kind == "Namespace" and .metadata.name == "secret-backend") or .metadata.namespace == "secret-backend") | with(select(.kind == "RoleBinding"); .subjects = [{"kind": "ServiceAccount", "name": "asset-vault", "namespace": "flux-system"}])' tests/secret-persistence/backend.yaml > '{{ env.DIRECTORY }}/backend.yaml' ''',
  '''yq '.data.prefix = "" | .data.root = "." | .data.externalSecretsVersion = load("dependencies.yaml").externalSecrets.version | .data.externalSecretsValues = load_str("deploy/secrets/controller-values.yaml")' tests/assets/lock.yaml > '{{ env.DIRECTORY }}/assets.lock.yaml' ''',
  "cp tests/oke-bootstrap/deployment.yaml '{{ env.DIRECTORY }}/product/deploy/bootstrap/remote/proof.yaml'",
  '''yq -i '.resources += ["proof.yaml"]' '{{ env.DIRECTORY }}/product/deploy/bootstrap/remote/kustomization.yaml'''',
  "tar -czf '{{ env.DIRECTORY }}/product.tar.gz' -C '{{ env.DIRECTORY }}/product' .",
  "helm template inputs charts/deployment-inputs -f tests/oke-bootstrap/inputs.yaml --show-only templates/remote.yaml --set-file files.identity='{{ env.DIRECTORY }}/identity.yaml',files.environment='{{ env.DIRECTORY }}/environment.yaml',files.seedEnvironment='{{ env.DIRECTORY }}/environment.yaml',files.assets='{{ env.DIRECTORY }}/assets.lock.yaml',files.externalSecrets=deploy/secrets/controller-values.yaml,files.dependencies=dependencies.yaml > '{{ env.DIRECTORY }}/remote-bootstrap.yaml'",
  '''yq -i 'with(select(.kind == "Kustomization" and .metadata.name != "oke-flux"); .spec.sourceRef.name = "oke-bootstrap-fixture") | with(select(.metadata.name == "oke-seed"); .spec.patches += [{"target": {"kind": "HelmRelease|Kustomization", "name": "tamoss-gitops-bootstrap|platform-defaults|infrastructure|runtime|infrastructure-controllers"}, "patch": "- op: add\n  path: /spec/suspend\n  value: true"}, {"target": {"kind": "Bucket"}, "patch": "- op: add\n  path: /spec/suspend\n  value: true"}])' '{{ env.DIRECTORY }}/remote-bootstrap.yaml'''',
  "yq -i 'with(select(.metadata.name == \"oke-asset-access\"); .spec.patches += [{\"target\": {\"kind\": \"SecretStore\", \"name\": \"asset-vault\"}, \"patch\": ([{\"op\": \"replace\", \"path\": \"/spec/provider\", \"value\": (load(\"tests/secret-persistence/provider.yaml\") | .kubernetes.auth.serviceAccount.name = \"asset-vault\")} ] | to_yaml)}])' '{{ env.DIRECTORY }}/remote-bootstrap.yaml' ",
  "tar -czf '{{ env.DIRECTORY }}/seed-proof.tar.gz' -C tests/oke-bootstrap chart handover",
  '''yq -n '{"vaultId": "ocid1.vault.oc1.fixture"}' > '{{ env.DIRECTORY }}/foundation-record.yaml'''',
]
env.OCI_CLI_CONFIG_FILE = "{{ vars.ROOT_DIR }}/tests/lifecycle/oci-config"

["test:oke-bootstrap:reject-identity"]
hide = true
run = [
  '''yq '.remoteUID = "different-cluster"' '{{ env.DIRECTORY }}/identity.yaml' > '{{ env.DIRECTORY }}/identity.wrong.yaml'''',
  "cp '{{ env.DIRECTORY }}/identity.yaml' '{{ env.DIRECTORY }}/identity.saved.yaml'",
  "mv '{{ env.DIRECTORY }}/identity.wrong.yaml' '{{ env.DIRECTORY }}/identity.yaml'",
  "ENV_DIR={{ env.DIRECTORY | quote }} mise run test:oke-bootstrap:seed",
]
depends_post = ["test:oke-bootstrap:restore-identity"]

["test:oke-bootstrap:restore-identity"]
hide = true
run = ["mv '{{ env.DIRECTORY }}/identity.saved.yaml' '{{ env.DIRECTORY }}/identity.yaml'"]

["test:oke-bootstrap:seed"]
hide = true
run = [
  "mise run bootstrap:remote-guard",
  "mise run identity:remote",
  "mise run bootstrap:remote-access:issue",
]

["test:oke-bootstrap:capture-access"]
hide = true
quiet = true
run = [
  "install -m 600 /dev/null '{{ env.DIRECTORY }}/bootstrap-token.kubeconfig'",
  '''kubectl --kubeconfig '{{ env.DIRECTORY }}/management.kubeconfig' -n tamoss-infra get secret oke-bootstrap-access -o json | yq -p=json -r '.data."value.yaml" | @base64d' > '{{ env.DIRECTORY }}/bootstrap-token.kubeconfig' ''',
  "kubectl --kubeconfig '{{ env.DIRECTORY }}/bootstrap-token.kubeconfig' --request-timeout=10s get namespace kube-system -o name",
]

["test:oke-bootstrap:retired-access"]
hide = true
quiet = true
run = [
  "kubectl --kubeconfig '{{ env.DIRECTORY }}/bootstrap-token.kubeconfig' --request-timeout=10s get namespace kube-system -o name",
]

["test:oke-bootstrap:short-access"]
hide = true
quiet = true
run = [
  "install -m 600 /dev/null '{{ env.DIRECTORY }}/remote-token.json'",
  "install -m 600 /dev/null '{{ env.DIRECTORY }}/remote-access.yaml'",
  "kubectl --kubeconfig '{{ env.DIRECTORY }}/remote.kubeconfig' -n tamoss-bootstrap create token oke-bootstrap --duration=10m -o json > '{{ env.DIRECTORY }}/remote-token.json'",
  "helm template inputs charts/deployment-inputs --show-only templates/remote-access.yaml --set-file files.identity='{{ env.DIRECTORY }}/identity.yaml',files.remoteConfig='{{ env.DIRECTORY }}/remote.kubeconfig',files.remoteToken='{{ env.DIRECTORY }}/remote-token.json' > '{{ env.DIRECTORY }}/remote-access.yaml'",
  "kubectl --kubeconfig '{{ env.DIRECTORY }}/management.kubeconfig' apply --server-side -f '{{ env.DIRECTORY }}/remote-access.yaml'",
  "install -m 600 '{{ env.DIRECTORY }}/remote-access.yaml' '{{ env.DIRECTORY }}/expired-access.yaml'",
  "mise run test:oke-bootstrap:capture-access",
]
depends_post = ["bootstrap:remote-access:cleanup"]
