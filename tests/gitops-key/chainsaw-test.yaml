apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: gitops-deploy-key}
spec:
  steps:
    - name: prepare the native secret backend and generated deploy key
      try:
        - command:
            entrypoint: env
            env: [{name: PROJECT_ROOT, value: ($values.root)}]
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:gitops-key:prepare"]
        - apply: {file: ../../.local/tmp/check/gitops-key/backend.yaml}
        - apply: {file: ../../.local/tmp/check/gitops-key/store.yaml}
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: gitops-input, namespace: gitops-key-check}
              stringData: {identity: fixture-private, publicKey: fixture-public, known_hosts: fixture-host}
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: gitops, namespace: gitops-key-check}
              stringData: {identity: fixture-private, identity.pub: fixture-public, known_hosts: fixture-host}
    - name: adopt the existing SSH secret without changing its identity or bytes
      bindings:
        - name: secretUID
          value: (x_k8s_get($client, 'v1', 'Secret', 'gitops-key-check', 'gitops').metadata.uid)
      try:
        - apply: {file: ../../.local/tmp/check/gitops-key/initial.yaml}
        - assert:
            resource:
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              metadata: {name: gitops, namespace: gitops-key-check}
              status:
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitops
                namespace: gitops-key-check
                uid: ($secretUID)
                ownerReferences: [{kind: ExternalSecret, name: gitops, controller: true}]
              data: &key {identity: Zml4dHVyZS1wcml2YXRl, identity.pub: Zml4dHVyZS1wdWJsaWM=, known_hosts: Zml4dHVyZS1ob3N0}
    - name: preserve the established key when bootstrap input changes
      bindings:
        - name: refreshed
          value: (x_k8s_get($client, 'external-secrets.io/v1alpha1', 'PushSecret', 'gitops-key-check', 'gitops').status.refreshTime)
      try:
        - patch:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: gitops-input, namespace: gitops-key-check}
              stringData: {identity: replacement}
        - patch:
            resource:
              apiVersion: external-secrets.io/v1alpha1
              kind: PushSecret
              metadata: {name: gitops, namespace: gitops-key-check}
              spec: {refreshInterval: 1s}
        - assert:
            resource:
              apiVersion: external-secrets.io/v1alpha1
              kind: PushSecret
              metadata: {name: gitops, namespace: gitops-key-check}
              status:
                (refreshTime != $refreshed): true
                (conditions[?type == 'Ready'] | [0].status): 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: gitops, namespace: gitops-key-check}
              data: *key
    - name: retain readback after retiring creation and deleting the local input
      try:
        - apply: {file: ../../.local/tmp/check/gitops-key/retired.yaml}
        - delete:
            ref: {apiVersion: external-secrets.io/v1alpha1, kind: PushSecret, name: gitops, namespace: gitops-key-check}
        - delete:
            ref: {apiVersion: v1, kind: Secret, name: gitops-input, namespace: gitops-key-check}
        - delete:
            ref: {apiVersion: v1, kind: Secret, name: gitops, namespace: gitops-key-check}
        - patch:
            resource:
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              metadata: {name: gitops, namespace: gitops-key-check}
              spec: {refreshInterval: 1s}
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata: {name: gitops, namespace: gitops-key-check}
              data: *key
