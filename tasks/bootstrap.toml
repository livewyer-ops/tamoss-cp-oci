
["bootstrap:up"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test ! -f {{ (vars.ENV_DIR) | quote }}/identity.yaml || yq -e '.teardownStarted != true and .returnComplete != true' {{ (vars.ENV_DIR) | quote }}/identity.yaml > /dev/null || { printf '%s\n' "Teardown has started; resume down rather than recreating this environment" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:provision",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:runtime",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:ready",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:record-runtime",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:access",
]

["bootstrap:access"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "install -d -m 700 '{{ vars.ENV_DIR }}/access'",
  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/access/ui-login.json'",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n auth get secret authentik -o json | yq -p=json -o=json -e '.data | {"username": (.AUTHENTIK_BOOTSTRAP_USERNAME | @base64d), "password": (.AUTHENTIK_BOOTSTRAP_PASSWORD | @base64d)} | select(.username != "" and .password != "")' > '{{ vars.ENV_DIR }}/access/ui-login.json'''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get tamoss tamoss -o json | yq -p=json '.spec | {"api": ("https://api." + .publicEndpoint.baseDomain), "ui": .publicEndpoint.uiURL, "auth": .auth.authentikBlueprints.issuerURL}'''',
  '''echo "OKE kubeconfig: {{ vars.ENV_DIR }}/remote.kubeconfig"''',
  '''echo "Private initial login: {{ vars.ENV_DIR }}/access/ui-login.json (remove after use; use the current password if changed)"''',
]

["bootstrap:provision:apply:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:bootstrap-ready",
]
depends_post = ["bootstrap:provision:apply:cleanup"]

["bootstrap:provision:apply:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:resources",
]

["bootstrap:provision:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(test -s {{ (vars.ENV_DIR) | quote }}/identity.yaml && yq -e '.deploymentReady == true' {{ (vars.ENV_DIR) | quote }}/identity.yaml > /dev/null)"
run = [
  "mise run verify:tools",
  "mise run verify:privacy",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run tamoss:assert-current",
  "mise run tamoss:fetch",
  "mise run tadoss:fetch",
  "mise run tamoss:release",
  "crossplane resource validate '{{ vars.ROOT_DIR }}/charts/secret-foundation/definition.yaml' '{{ vars.ENV_DIR }}/foundation.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ vars.ROOT_DIR }}/.local/tmp/check/crossplane' --error-on-missing-schemas",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run lifecycle:prepare",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run gitops:render",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run lifecycle:baseline",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:seed",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:foundation",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:secrets",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait tamossenvironment/$(yq -r .metadata.name '{{ vars.ENV_DIR }}/environment.yaml') --for=create --timeout=300s",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:record-composite",
  "OCI_CONFIG={{ env.TASKV_OCI_CONFIG | quote }} OCI_PROFILE={{ env.TASKV_OCI_PROFILE | quote }} mise run bootstrap:provision:apply:protected",
]
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''

["bootstrap:provision"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -s '{{ vars.ENV_DIR }}/foundation.yaml' && test -s '{{ vars.ENV_DIR }}/product.yaml' || { printf '%s\n' "Prepare the retained foundation and product inputs before provisioning" >&2; exit 1; }''',
  '''(test -s '{{ vars.ENV_DIR }}/identity.yaml' && yq -e '.deploymentReady == true' '{{ vars.ENV_DIR }}/identity.yaml' > /dev/null) || test "$(git -C '{{ vars.ROOT_DIR }}' rev-parse HEAD)" = "$(yq -r .product.commit '{{ vars.ENV_DIR }}/product.yaml')" || { printf '%s\n' "Check out the product commit selected for Flux before provisioning" >&2; exit 1; }''',
  '''yq -e '[(.product.commit | test("^[a-f0-9]{40}$")), (.product.url | test("^https://github.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$")), (.bundle.url | test("^oci://ghcr.io/[a-z0-9_.-]+/[a-z0-9_.-]+$")), (.bundle.digest | test("^sha256:[a-f0-9]{64}$"))] | all' '{{ vars.ENV_DIR }}/product.yaml' > /dev/null || { printf '%s\n' "Select the published product commit and public release bundle digest before provisioning" >&2; exit 1; }''',
  '''yq -e '(.tadoss == null) or ((.tadoss.bundle.url | test("^oci://ghcr.io/[a-z0-9_.-]+/[a-z0-9_.-]+$")) and (.tadoss.bundle.digest | test("^sha256:[a-f0-9]{64}$")))' '{{ vars.ENV_DIR }}/product.yaml' > /dev/null || { printf '%s\n' "Optional TADOSS integration requires its published public bundle URL and digest" >&2; exit 1; }''',
  "mise run bootstrap:provision:apply",
]

["bootstrap:seed:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''(yq -e '.bootstrapUID != null' {{ vars.ENV_DIR }}/identity.yaml > /dev/null) && (kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get tamossbootstrap/"$TASKV_NAME" -o json | yq -p=json -e '.metadata.uid == load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID' > /dev/null)'''
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:seed-new",
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:seed"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:seed:apply",
]

["bootstrap:seed-new:protected:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''CREDENTIAL_DIR={{ ((vars.ENV_DIR) ~ "/provider") | quote }} mise run cloud:credentials''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:secret-inputs",
  '''yq -n 'load("{{ vars.ENV_DIR }}/environment.yaml") as $e | load("{{ vars.ENV_DIR }}/foundation.yaml") as $f | {"apiVersion": "tamoss.livewyer.io/v1alpha1", "kind": "TamossBootstrap", "metadata": {"name": $e.metadata.name, "namespace": $e.metadata.namespace}, "spec": {"deploymentId": load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID, "released": false, "credentialsEstablished": (load("{{ vars.ENV_DIR }}/identity.yaml").credentialsEstablished == true), "storageCredentials": {"userId": load("{{ vars.ENV_DIR }}/settings.yaml").storageUserId, "image": load("{{ vars.ROOT_DIR }}/dependencies.yaml").bootstrapTools.image}, "vaultAuth": (load("{{ vars.ENV_DIR }}/identity.yaml").oci | {"user": .user, "tenancy": .tenancy}), "foundationName": $f.metadata.name, "foundation": $f.spec, "environment": $e.spec, "remoteBootstrap": {"image": load("{{ vars.ROOT_DIR }}/dependencies.yaml").bootstrapTools.image, "fluxVersion": "{{ env.TASKV_FLUX_VERSION }}", "seedConfigMap": "oke-bootstrap-input"}}}' > '{{ vars.ENV_DIR }}/bootstrap.yaml'''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run management:render",
  "kubectl create configmap oke-bootstrap-input -n tamoss-infra --from-file=deployment.yaml='{{ vars.ENV_DIR }}/deployment.yaml' --dry-run=client -o yaml | yq '.immutable = true' > '{{ vars.ENV_DIR }}/oke-bootstrap-input.yaml'",
  "cp deploy/management/kustomization.yaml '{{ vars.ENV_DIR }}/kustomization.yaml'",
  '''yq -i '.resources += ["provider", "secrets", "oke-bootstrap-input.yaml"]' {{ vars.ENV_DIR }}/kustomization.yaml''',
  "flux --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' install --version='{{ env.TASKV_FLUX_VERSION }}' --components=source-controller,helm-controller --timeout=5m",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' apply --server-side -k '{{ vars.ENV_DIR }}'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait helmrelease/tamoss-bootstrap-instance --for=condition=Ready --timeout=1200s",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:observe",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:composite",
]
env.TASKV_FLUX_VERSION = '''{% if env.FLUX_VERSION is defined %}{{ env.FLUX_VERSION }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -p=toml -r '.tools.\"aqua:fluxcd/flux2\"' " ~ (vars.ROOT_DIR) ~ "/mise.toml") }}{% endif %}'''
depends_post = ["bootstrap:seed-new:protected:cleanup"]

["bootstrap:seed-new:protected:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "rm -f '{{ vars.ENV_DIR }}/secrets/oci-private-key' '{{ vars.ENV_DIR }}/secrets/oci-fingerprint'",
]

["bootstrap:seed-new:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "OCI_CONFIG={{ env.TASKV_OCI_CONFIG | quote }} OCI_PROFILE={{ env.TASKV_OCI_PROFILE | quote }} FLUX_VERSION={{ env.TASKV_FLUX_VERSION | quote }} mise run bootstrap:seed-new:protected:protected",
]
env.TASKV_FLUX_VERSION = '''{% if env.FLUX_VERSION is defined %}{{ env.FLUX_VERSION }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -p=toml -r '.tools.\"aqua:fluxcd/flux2\"' " ~ (vars.ROOT_DIR) ~ "/mise.toml") }}{% endif %}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''
depends_post = ["bootstrap:seed-new:cleanup"]

["bootstrap:seed-new:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "rm -f '{{ vars.ENV_DIR }}/provider/credentials.json'",
]

["bootstrap:seed-new"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''yq -e '.bootstrapUID == null' {{ vars.ENV_DIR }}/identity.yaml > /dev/null || { printf '%s\n' "Existing bootstrap identity is unavailable; restore the original Kind state" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "OCI_CONFIG={{ env.TASKV_OCI_CONFIG | quote }} OCI_PROFILE={{ env.TASKV_OCI_PROFILE | quote }} FLUX_VERSION={{ env.TASKV_FLUX_VERSION | quote }} mise run bootstrap:seed-new:protected",
]
env.TASKV_FLUX_VERSION = '''{% if env.FLUX_VERSION is defined %}{{ env.FLUX_VERSION }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -p=toml -r '.tools.\"aqua:fluxcd/flux2\"' " ~ (vars.ROOT_DIR) ~ "/mise.toml") }}{% endif %}'''
env.TASKV_OCI_CONFIG = '''{% if env.OCI_CONFIG is defined %}{{ env.OCI_CONFIG }}{% else %}{{ env.OCI_CLI_CONFIG_FILE | default(value=(env.HOME) ~ "/.oci/config") }}{% endif %}'''
env.TASKV_OCI_PROFILE = '''{% if env.OCI_PROFILE is defined %}{{ env.OCI_PROFILE }}{% else %}{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}{% endif %}'''

["bootstrap:observe"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get tamossbootstrap/{{ env.TASKV_NAME }} --ignore-not-found -o json > '{{ vars.ENV_DIR }}/bootstrap-observed.json'",
  '''yq -e '(length == 0 and load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID == null) or ([.spec.deploymentId == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID, (.metadata.uid == load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID or load("{{ vars.ENV_DIR }}/identity.yaml").bootstrapUID == null)] | all)' '{{ vars.ENV_DIR }}/bootstrap-observed.json' > /dev/null''',
  '''yq -i '.bootstrapUID = (load("{{ vars.ENV_DIR }}/bootstrap-observed.json").metadata.uid // .bootstrapUID)' {{ vars.ENV_DIR }}/identity.yaml''',
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:release:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(test ! -f {{ vars.ENV_DIR }}/bootstrap.yaml && yq -e '.bootstrapUID == null' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:observe",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:release-observed",
]

["bootstrap:release"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:release:apply",
]

["bootstrap:release-observed:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = '''((test -f '{{ vars.ENV_DIR }}/bootstrap-observed.json' && test ! -s '{{ vars.ENV_DIR }}/bootstrap-observed.json') || yq -e '[.spec.released == true, .status.released == true, .metadata.annotations."crossplane.io/paused" == "true", ([.status.conditions[] | select(.type == "Synced") | .reason] | join(",") == "ReconcilePaused")] | all' '{{ vars.ENV_DIR }}/bootstrap-observed.json' > /dev/null)'''
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run management:freeze-instance",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra patch tamossbootstrap/{{ env.TASKV_NAME }} --type=merge -p '{"spec":{"released":true}}'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra annotate tamossbootstrap/{{ env.TASKV_NAME }} crossplane.io/paused- --overwrite",
  '''yq '.metadata.name = "{{ env.TASKV_NAME }}"' {{ vars.ROOT_DIR }}/deploy/contracts/bootstrap-released.yaml > {{ vars.ENV_DIR }}/bootstrap-release.yaml''',
  "KUBECONFIG='{{ vars.ENV_DIR }}/management.kubeconfig' chainsaw assert -f '{{ vars.ENV_DIR }}/bootstrap-release.yaml' --timeout=180s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra annotate tamossbootstrap/{{ env.TASKV_NAME }} crossplane.io/paused=true --overwrite",
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra wait tamossbootstrap/{{ env.TASKV_NAME }} --for='jsonpath={.status.conditions[?(@.type=="Synced")].reason}=ReconcilePaused' --timeout=180s''',
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:release-observed"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:release-observed:apply",
]

["bootstrap:runtime:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(yq -e '.deploymentReady == true' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:remote-bootstrap",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:connection",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:infrastructure-ready",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:resources",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:bindings",
]

["bootstrap:runtime"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:runtime:apply",
]

["bootstrap:record-runtime:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(yq -e '.deploymentReady == true' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' api-resources --cached=false > /dev/null",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tamoss-infra wait managed -l 'tamoss.livewyer.io/environment={{ env.TASKV_NAME }}' --for=condition=Ready --timeout=300s",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tamoss-infra wait managed -l 'tamoss.livewyer.io/environment={{ env.TASKV_NAME }}' --for=condition=Synced --timeout=300s",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:runtime-composite",
  "yq -i '.deploymentReady = true' {{ vars.ENV_DIR }}/identity.yaml",
]
env.TASKV_NAME = '''{% if env.NAME is defined %}{{ env.NAME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.name " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["bootstrap:record-runtime"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run bootstrap:record-runtime:apply",
]

["bootstrap:handover"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test -s {{ (vars.ENV_DIR) | quote }}/identity.yaml && yq -e '.deploymentReady == true' {{ (vars.ENV_DIR) | quote }}/identity.yaml > /dev/null || { printf '%s\n' "Complete up before handing over this environment" >&2; exit 1; }''',
  '''yq -e '.teardownStarted != true and .returnComplete != true' {{ (vars.ENV_DIR) | quote }}/identity.yaml > /dev/null || { printf '%s\n' "Teardown has started; resume down instead of handover" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:attach",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:promote",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run bootstrap:ready",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run bootstrap:complete-handover",
]

["bootstrap:promote:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(yq -e '.handoverComplete == true' {{ vars.ENV_DIR }}/identity.yaml > /dev/null)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run gitops:promotion-checkout",
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} DEPLOYMENT_DIR={{ ((vars.CHECKOUT) ~ "/" ~ (env.TASKV_PATH_IN_GIT)) | quote }} REVISION="$(git -C {{ (vars.CHECKOUT) | quote }} rev-parse FETCH_HEAD)" mise run bootstrap:observe-ready''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run transfer:start-kind",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} mise run transfer:prepare-promotion",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run transfer:runtime-writes",
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} CHECKOUT={{ ((vars.CHECKOUT)) | quote }} MESSAGE={{ ("feat: transfer infrastructure ownership to OKE") | quote }} FILES={{ ("infrastructure/environment.yaml") | quote }} mise run gitops:publish''',
]
env.TASKV_PATH_IN_GIT = '''{% if env.PATH_IN_GIT is defined %}{{ env.PATH_IN_GIT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .path " ~ ((vars.ENV_DIR) | quote) ~ "/gitops.yaml") }}{% endif %}'''

["bootstrap:promote"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ vars.CHECKOUT | quote }} || { printf '%s\n' "Missing required input: CHECKOUT" >&2; exit 1; }''',
  '''test "$(git -C '{{ vars.ROOT_DIR }}' rev-parse HEAD)" = "$(yq -r 'select(.metadata.name == "tamoss-product") | .spec.ref.commit' {{ (vars.CHECKOUT) | quote }}/{{ env.TASKV_PATH_IN_GIT }}/sources.yaml)" || { printf '%s\n' "Check out the product commit selected in environment Git before handover" >&2; exit 1; }''',
  "mise run bootstrap:promote:apply",
]
