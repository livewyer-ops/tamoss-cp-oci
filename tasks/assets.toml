["assets:fetch"]
hide = true
run = [
  "test -z \"$(git status --porcelain)\" || { echo 'Deploy a clean, committed and pushed checkout.' >&2; exit 1; }",
  "install -d -m 700 '{{ vars.ENV_DIR }}' '{{ vars.RELEASE_DIR }}'",
  '''ORIGIN="$(git remote get-url origin)" COMMIT="$(git rev-parse HEAD)" yq -n -e -o=json 'select(strenv(ORIGIN) | test("^(git@github.com:|https://github.com/|ssh://git@github.com/)")) | {"repository": (strenv(ORIGIN) | sub("^git@github.com:"; "") | sub("^https://github.com/"; "") | sub("^ssh://git@github.com/"; "") | sub("[.]git$"; "")), "commit": strenv(COMMIT), "private": (load("{{ vars.ENV_DIR }}/values.yaml").source.private != false)} | select(.repository | test("^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$")) | .url = ((select(.private) | "ssh://git@github.com/" + .repository + ".git") // ("https://github.com/" + .repository + ".git"))' > '{{ vars.ENV_DIR }}/source.json'''',
  '''git fetch --no-tags origin "$(yq -r .commit '{{ vars.ENV_DIR }}/source.json')"''',
  "git archive --format=tar HEAD | tar --extract --no-same-owner --directory '{{ vars.RELEASE_DIR }}'",
  '''yq -n '{"product": {"commit": load("{{ vars.ENV_DIR }}/source.json").commit, "url": ("https://github.com/" + load("{{ vars.ENV_DIR }}/source.json").repository)}}' > '{{ vars.RELEASE_DIR }}/build.yaml'''',
]

["assets:verify"]
hide = true
run = [
  '''yq -e '.kind == "ConfigMap" and .metadata.name == "tamoss-assets" and .data.schemaVersion == "4" and (.data.productCommit | test("^[a-f0-9]{40}$")) and (.data."values.yaml" | from_yaml | .assets.commit) == .data.productCommit and .data.productCommit == load("{{ vars.ENV_DIR }}/source.json").commit and (.data."values.yaml" | from_yaml | .assets.url) == load("{{ vars.ENV_DIR }}/source.json").url and (.data."values.yaml" | from_yaml | del(.assets) | sort_keys(..) | to_json) == (load("{{ vars.RELEASE_DIR }}/pins.yaml") | del(.tadoss.enabled) | sort_keys(..) | to_json)' '{{ vars.ENV_DIR }}/assets.lock.yaml' > /dev/null''',
  '''test "$(git rev-parse HEAD)" = "$(yq -r .data.productCommit '{{ vars.ENV_DIR }}/assets.lock.yaml')" || { echo 'Use the recorded deployment revision for this environment.' >&2; exit 1; }''',
]

["assets:restore-runtime"]
hide = true
run = [
  { task = "assets:verify" },
  "cp '{{ vars.RELEASE_DIR }}/deploy/tamoss/release.yaml' '{{ vars.ENV_DIR }}/tamoss-release.current.yaml'",
  "RELEASE_LOCK='{{ vars.ENV_DIR }}/tamoss-release.current.yaml' mise run tamoss:fetch",
]
