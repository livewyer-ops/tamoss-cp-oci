
["test:storage-cleanup:prepare"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.STORAGE_DIR | quote }} || { printf '%s\n' "Missing required input: STORAGE_DIR" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_MANAGEMENT_KUBECONFIG | quote }} || { printf '%s\n' "Missing required input: MANAGEMENT_KUBECONFIG" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_CHECK_NAME | quote }} || { printf '%s\n' "Missing required input: CHECK_NAME" >&2; exit 1; }''',
  "install -d -m 700 '{{ vars.STORAGE_DIR }}'",
  "cp '{{ env.TASKV_MANAGEMENT_KUBECONFIG }}' '{{ vars.STORAGE_DIR }}/management.kubeconfig'",
  '''yq -n '{"compartmentId": "ocid1.compartment.fixture", "objectNamespace": "fixture", "bucketName": "{{ env.TASKV_CHECK_NAME }}", "oci": {"tenancy": "ocid1.tenancy.fixture", "user": "ocid1.user.fixture", "fingerprint": "fixture", "region": "eu-frankfurt-1"}}' > '{{ vars.STORAGE_DIR }}/values.yaml'''',
  '''yq -n -o=json '{"data":[]}' > '{{ vars.STORAGE_DIR }}/baseline.json'''',
]
env.TASKV_CHECK_NAME = '''{{ env.CHECK_NAME | default(value="") }}'''
env.TASKV_MANAGEMENT_KUBECONFIG = '''{{ env.MANAGEMENT_KUBECONFIG | default(value="") }}'''

["test:storage-cleanup:remove"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run cloud:storage-remove-bucket",
]

["test:storage-cleanup:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''OCI={{ ("false") | quote }} mise run cloud:storage-cleanup''',
]

["test:storage-cleanup:audit"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run cloud:storage-audit",
]
