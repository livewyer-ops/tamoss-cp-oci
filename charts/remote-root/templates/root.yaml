{{- $source := .Values.source -}}
{{- $label := dict "tamoss.livewyer.io/deployment-id" (required "deploymentId is required" .Values.deploymentId) -}}
{{- range $key, $value := .Values.facts }}{{ $_ := required (printf "facts.%s is required" $key) $value }}{{ end -}}
{{- if $source.identity }}
apiVersion: v1
kind: Secret
metadata:
  name: deployment-git
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  identity: {{ $source.identity | quote }}
  identity.pub: {{ $source.identityPub | quote }}
  known_hosts: {{ $source.knownHosts | quote }}
---
{{- end }}
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tamoss-bootstrap-product
  namespace: {{ .Release.Namespace }}
spec:
  interval: 1m
  url: {{ required "source.url is required" $source.url | quote }}
  ref: {commit: {{ required "source.commit is required" $source.commit | quote }}}
{{- if $source.identity }}
  secretRef: {name: deployment-git}
{{- end }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform-defaults, namespace: {{ .Release.Namespace }}}
spec:
  interval: 1m
  timeout: 2m
  prune: true
  path: ./deploy/gitops/platform-defaults
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
---
{{- if .Values.retirementId }}
{{- $retained := deepCopy (required "Kind must supply its retained deployment values for retirement" .Values.retirementValues) }}
{{- /* A Git-enabled operator must finalise its instance even if the original seed disabled TADOSS. */}}
{{- with lookup "kustomize.toolkit.fluxcd.io/v1" "Kustomization" .Release.Namespace "tadoss-operator" }}
{{- if ne (index (.metadata.labels | default dict) "tamoss.livewyer.io/deployment-id") $.Values.deploymentId }}
{{- fail "TADOSS operator belongs to a different deployment" }}
{{- end }}
{{- $_ := set $retained.tadoss "enabled" true }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: {name: tamoss-retirement-values, namespace: {{ .Release.Namespace }}}
data:
  values.yaml: |
{{ $retained | toYaml | indent 4 }}
---
{{- end }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tamoss-gitops
  namespace: {{ .Release.Namespace }}
  labels: {{ $label | toJson }}
spec:
  commonMetadata:
    labels: {{ $label | toJson }}
  interval: 5m
  timeout: 10m
  releaseName: tamoss-gitops
  install:
    disableWait: true
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  upgrade:
    disableWait: true
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  chart:
    spec:
      chart: ./charts/gitops
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
  valuesFrom:
    - {kind: ConfigMap, name: tamoss-platform-defaults, valuesKey: values.yaml}
{{- if .Values.retirementId }}
    - {kind: ConfigMap, name: tamoss-retirement-values, valuesKey: values.yaml}
{{- else }}
    - {kind: ConfigMap, name: tamoss-gitops-values, valuesKey: values.yaml}
    - {kind: ConfigMap, name: tamoss-assets, valuesKey: values.yaml}
{{- end }}
  values:
    deploymentId: {{ .Values.deploymentId | quote }}
    {{- with .Values.connectionImages }}
    connectionImages: {{ . | toJson }}
    {{- end }}
    retirementId: {{ .Values.retirementId | quote }}
    vaultId: {{ .Values.facts.vaultId | quote }}
    services:
      ownerUid: {{ .Values.facts.environmentUid | quote }}
      databaseSubnetId: {{ .Values.facts.databaseSubnetId | quote }}
    runtime:
      publicIp: {{ .Values.facts.publicIp | quote }}
      loadBalancerSubnetId: {{ .Values.facts.loadBalancerSubnetId | quote }}
