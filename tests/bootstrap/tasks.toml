
["test:bootstrap:render-native"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''helm template bootstrap '{{ vars.ROOT }}/charts/bootstrap' --set-file environmentDefinition='{{ vars.ROOT }}/charts/environment/definition.yaml' --set-file foundationDefinition='{{ vars.ROOT }}/charts/secret-foundation/definition.yaml' --set-file secretBootstrapFile='{{ vars.ROOT }}/deploy/secrets/bootstrap-values.yaml' | yq 'select(.kind == "Composition")' > '{{ env.TASKV_DIRECTORY }}/native-composition.yaml'''',
  '''yq '.spec.vaultAuth = {"user": "ocid1.user.oc1.fixture", "tenancy": "ocid1.tenancy.oc1.fixture"}' {{ env.TASKV_DIRECTORY }}/root.yaml > {{ env.TASKV_DIRECTORY }}/native-root.yaml''',
  '''yq 'with(select(.kind == "TamossEnvironment"); .status.outputs.clusterId = "ocid1.cluster.oc1.fixture")' '{{ env.TASKV_DIRECTORY }}/ready-observed.yaml' > '{{ env.TASKV_DIRECTORY }}/native-observed.yaml'''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-observed.yaml' --required-resources='{{ vars.ROOT }}/tests/bootstrap/credentials.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native.yaml'",
  '''yq -e 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | [.spec.values.initialise == true, (.spec.values.deliveries | length == 9), .spec.values.oracle.vault == "ocid1.vault.oc1.fixture", .spec.values.oracle.encryptionKey == "ocid1.key.oc1.fixture"] | all' '{{ env.TASKV_DIRECTORY }}/native.yaml'''',
  '''yq -e 'select(.kind == "HelmRelease" and .metadata.name == "runtime-access") | [.spec.values.providerWrites == false, .spec.values.clusterId == "ocid1.cluster.oc1.fixture", .spec.values.vaultId == "ocid1.vault.oc1.fixture"] | all' '{{ env.TASKV_DIRECTORY }}/native.yaml'''',
  '''yq 'select(.kind != "TamossBootstrap") | del(.status)' {{ env.TASKV_DIRECTORY }}/native.yaml > {{ env.TASKV_DIRECTORY }}/native-lost-status.yaml''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-lost-status.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native-recovering.yaml'",
  '''yq 'select(.kind == "HelmRelease")' {{ env.TASKV_DIRECTORY }}/native.yaml > {{ env.TASKV_DIRECTORY }}/native-releases.yaml''',
  '''yq 'select(.kind == "HelmRelease")' {{ env.TASKV_DIRECTORY }}/native-recovering.yaml > {{ env.TASKV_DIRECTORY }}/native-recovering-releases.yaml''',
  '''{% for item in ["native-releases", "native-recovering-releases"] %}
yq -i 'del(.metadata.annotations."gotemplating.fn.crossplane.io/ready")' {{ env.TASKV_DIRECTORY }}/{{ item }}.yaml
{% endfor %}''',
  "diff -u '{{ env.TASKV_DIRECTORY }}/native-releases.yaml' '{{ env.TASKV_DIRECTORY }}/native-recovering-releases.yaml'",
  "yq '.spec.credentialsEstablished = true' {{ env.TASKV_DIRECTORY }}/native-root.yaml > {{ env.TASKV_DIRECTORY }}/native-retired-root.yaml",
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-retired-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-lost-status.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native-retired.yaml'",
  '''yq -e 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | .spec.values.initialise == false' {{ env.TASKV_DIRECTORY }}/native-retired.yaml''',
  '''yq 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | .spec.values' {{ env.TASKV_DIRECTORY }}/native-retired.yaml > {{ env.TASKV_DIRECTORY }}/native-secret-values.yaml''',
  "helm template tamoss-secrets '{{ vars.ROOT }}/charts/secrets' -n tamoss-infra -f '{{ env.TASKV_DIRECTORY }}/native-secret-values.yaml' > '{{ env.TASKV_DIRECTORY }}/native-deliveries.yaml'",
  '''yq eval-all -e '[select(.kind == "PushSecret" or .kind == "Password")] | length == 0' {{ env.TASKV_DIRECTORY }}/native-deliveries.yaml''',
  '''yq eval-all -e '[select(.kind == "ExternalSecret")] | length == 9' {{ env.TASKV_DIRECTORY }}/native-deliveries.yaml''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/bootstrap{% endif %}"

["test:bootstrap:credential-completion"]
hide = true
run = [
  '''yq 'select(.kind == "ExternalSecret") | .status.conditions = [{"type":"Ready","status":"True"}]' '{{ env.TASKV_DIRECTORY }}/native-deliveries.yaml' > '{{ env.TASKV_DIRECTORY }}/all-deliveries.yaml' ''',
  '''yq 'select(.metadata.name != "database-admin")' '{{ env.TASKV_DIRECTORY }}/all-deliveries.yaml' > '{{ env.TASKV_DIRECTORY }}/missing-delivery.yaml' ''',
  '''yq 'with(select(.metadata.name == "s3"); .spec.data[0].remoteRef.key = "another-deployment-s3")' '{{ env.TASKV_DIRECTORY }}/all-deliveries.yaml' > '{{ env.TASKV_DIRECTORY }}/wrong-delivery.yaml' ''',
  '''{% for item in ["all-deliveries", "missing-delivery", "wrong-delivery"] %}
crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-observed.yaml' --required-resources='{{ env.TASKV_DIRECTORY }}/{{ item }}.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/{{ item }}-result.yaml'
yq -e 'select(.kind == "TamossBootstrap") | .status.credentialsEstablished == {{ item == "all-deliveries" }}' '{{ env.TASKV_DIRECTORY }}/{{ item }}-result.yaml'
yq -e 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | .spec.values.initialise == {{ item != "all-deliveries" }}' '{{ env.TASKV_DIRECTORY }}/{{ item }}-result.yaml'
{% endfor %}''',
  '''yq 'select(.kind == "TamossBootstrap") | del(.spec.credentialsEstablished)' '{{ env.TASKV_DIRECTORY }}/all-deliveries-result.yaml' > '{{ env.TASKV_DIRECTORY }}/established-root.yaml' ''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/established-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-lost-status.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/established-without-deliveries.yaml'",
  '''yq -e 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | .spec.values.initialise == false' '{{ env.TASKV_DIRECTORY }}/established-without-deliveries.yaml' ''',
]
env.TASKV_DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap"

["test:bootstrap:prepare-management"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p -m 700 '{{ env.TASKV_DIRECTORY }}/management'",
  "cp '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/management/bootstrap.yaml'",
  '''yq -n '{"path": "unused"}' > {{ env.TASKV_DIRECTORY }}/management/gitops.yaml''',
  '''yq '{"apiVersion": .apiVersion, "kind": "TamossEnvironment", "metadata": .metadata, "spec": .spec.environment}' {{ env.TASKV_DIRECTORY }}/root.yaml > {{ env.TASKV_DIRECTORY }}/management/environment.yaml''',
  '''cp "$KUBECONFIG" '{{ env.TASKV_DIRECTORY }}/management/management.kubeconfig'''',
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/management") | quote }} mise run identity:observe-inputs''',
  "cp '{{ env.TASKV_DIRECTORY }}/management/identity-inputs.yaml' '{{ env.TASKV_DIRECTORY }}/management/identity.yaml'",
  "kubectl get namespace kube-system -o json > '{{ env.TASKV_DIRECTORY }}/management/namespace.json'",
  '''yq -i '.deploymentUID = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" | .managementUID = load("{{ env.TASKV_DIRECTORY }}/management/namespace.json").metadata.uid' {{ env.TASKV_DIRECTORY }}/management/identity.yaml''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT }}/.local/tmp/check/bootstrap{% endif %}"

["test:bootstrap:deliver-all"]
hide = true
run = [
  '''yq '.deliveries | map({"key": ("aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-" + .name), "value": ({"accesskey": "fixture-only", "secretkey": "fixture-only", "accessKey": "fixture-only", "secretKey": "fixture-only"} | to_json(0))}) | {"apiVersion": "external-secrets.io/v1", "kind": "SecretStore", "metadata": {"name": "tamoss-vault", "namespace": "tamoss-infra"}, "spec": {"provider": {"fake": {"data": .}}}}' deploy/secrets/bootstrap-values.yaml > .local/tmp/check/bootstrap/fake-store.yaml''',
  "kubectl apply -f .local/tmp/check/bootstrap/fake-store.yaml",
  '''yq 'select(.kind == "ExternalSecret")' .local/tmp/check/bootstrap/native-deliveries.yaml | kubectl apply -f -''',
]

