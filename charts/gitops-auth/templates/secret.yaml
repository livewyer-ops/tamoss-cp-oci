{{- $id := required "deploymentId is required" .Values.deploymentId -}}
{{ if .Values.initialise }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata: {name: gitops, namespace: {{ .Release.Namespace }}}
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs: [{name: tamoss-vault, kind: SecretStore}]
  selector:
    secret: {name: gitops-input}
  data:
    - match:
        remoteRef: {remoteKey: {{ printf "%s-gitops" $id | quote }}}
---
{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: gitops, namespace: {{ .Release.Namespace }}}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef: {name: tamoss-vault, kind: SecretStore}
  target: {name: gitops, creationPolicy: Owner, deletionPolicy: Retain}
  data:
{{ range $key, $property := dict "identity" "identity" "identity.pub" "publicKey" "known_hosts" "known_hosts" }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ printf "%s-gitops" $id | quote }}
        property: {{ $property | quote }}
{{ end }}
