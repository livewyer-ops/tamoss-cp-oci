apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tams
resources: [namespace.yaml]
secretGenerator:
  - name: tams-database
    literals: [username=tams]
    files: [password=tams-database-password]
  - name: tams-s3
    files: [accessKey=s3-access-key, secretKey=s3-secret-key]
  - name: qualification-source
    files: [AWS_ACCESS_KEY_ID=s3-access-key, AWS_SECRET_ACCESS_KEY=s3-secret-key]
configMapGenerator:
  - name: database-ca
    files: [ca.pem=database-ca.pem]
generatorOptions:
  disableNameSuffixHash: true
