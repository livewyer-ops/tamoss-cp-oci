
["test:gitops:check"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run verify:gitops",
]

["test:gitops:export"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/inputs") | quote }} mise run gitops:render''',
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/inputs") | quote }} CHECKOUT={{ ((env.TASKV_DIRECTORY) ~ "/checkout") | quote }} mise run gitops:export''',
]
env.TASKV_DIRECTORY = '''{{ env.DIRECTORY | default(value="") }}'''

["test:gitops:publication-fixture"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run test:gitops:fixture",
  "mise run test:gitops:export",
  "git init --bare --initial-branch=main '{{ env.TASKV_DIRECTORY }}/origin.git'",
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' remote set-url origin '{{ env.TASKV_DIRECTORY }}/origin.git'",
  '''yq -i '.url = "{{ env.TASKV_DIRECTORY }}/origin.git"' {{ env.TASKV_DIRECTORY }}/inputs/gitops.yaml''',
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' config user.name 'GitOps fixture'",
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' config user.email 'fixture@example.invalid'",
  "touch '{{ env.TASKV_DIRECTORY }}/checkout/unrelated.txt'",
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' add unrelated.txt",
]
env.TASKV_DIRECTORY = '''{{ env.DIRECTORY | default(value="") }}'''

["test:gitops:shared-configuration"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "cmp '{{ env.TASKV_DIRECTORY }}/inputs/deployment/values.yaml' '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/values.yaml'",
  "cmp '{{ env.TASKV_DIRECTORY }}/inputs/deployment/infrastructure/environment.yaml' '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/infrastructure/environment.yaml'",
  '''kubectl kustomize '{{ env.TASKV_DIRECTORY }}/inputs/deployment' | yq 'with(select(.kind == "HelmRelease" and .metadata.name == "tamoss-gitops-bootstrap"); .spec.values.vaultId = load("{{ env.TASKV_DIRECTORY }}/inputs/foundation-record.yaml").vaultId) | with(select(.kind == "Kustomization" and .metadata.name == "runtime"); .spec.postBuild.substitute.VAULT_ID = load("{{ env.TASKV_DIRECTORY }}/inputs/foundation-record.yaml").vaultId)' > '{{ env.TASKV_DIRECTORY }}/seed-resolved.yaml'''',
  "kubectl kustomize '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev' | yq '.' > '{{ env.TASKV_DIRECTORY }}/exported.yaml'",
  "diff -u '{{ env.TASKV_DIRECTORY }}/seed-resolved.yaml' '{{ env.TASKV_DIRECTORY }}/exported.yaml'",
  '''yq 'select(.kind == "Kustomization" and .metadata.name == "infrastructure") | .spec.postBuild.substitute *= (load("{{ vars.ROOT_DIR }}/.local/tmp/check/adoption.yaml").spec.adoption | {"DEPLOYMENT_ID": .deploymentId, "CREATION_COMPOSITE_UID": .creationCompositeUID} * (.externalNames | with_entries(.key |= upcase | .key |= sub("-"; "_"))))' '{{ env.TASKV_DIRECTORY }}/exported.yaml' > '{{ env.TASKV_DIRECTORY }}/infrastructure-kustomization.yaml'''',
  "flux build kustomization infrastructure -n tamoss-infra --dry-run --strict-substitute --kustomization-file '{{ env.TASKV_DIRECTORY }}/infrastructure-kustomization.yaml' --path '{{ vars.ROOT_DIR }}/deploy/gitops/infrastructure' > '{{ env.TASKV_DIRECTORY }}/infrastructure-rendered.yaml'",
  '''yq -e 'select(.kind == "TamossEnvironment") | . as $xr | [$xr.metadata.name == load("{{ env.TASKV_DIRECTORY }}/inputs/environment.yaml").metadata.name, ($xr.spec.managementPolicies | join(",")) == "Observe", ($xr.spec.adoption | sort_keys(..) | to_json(0)) == (load("{{ vars.ROOT_DIR }}/.local/tmp/check/adoption.yaml").spec.adoption | sort_keys(..) | to_json(0)), ($xr.spec.database | sort_keys(..) | to_json(0)) == (load("{{ env.TASKV_DIRECTORY }}/inputs/environment.yaml").spec.database | sort_keys(..) | to_json(0))] | all' '{{ env.TASKV_DIRECTORY }}/infrastructure-rendered.yaml'''',
]
env.TASKV_DIRECTORY = '''{{ env.DIRECTORY | default(value="") }}'''

["test:gitops:native-git-fixture"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/flux-system'",
  "flux create source git flux-system --url=ssh://git@github.com/example/tamoss-environments --branch=main --secret-ref=flux-system --export > '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/flux-system/gotk-sync.yaml'",
  "echo '---' >> '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/flux-system/gotk-sync.yaml'",
  "flux create kustomization flux-system --source=GitRepository/flux-system --path=./clusters/oci-dev --prune=true --export >> '{{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/flux-system/gotk-sync.yaml'",
  '''yq -n '{"apiVersion": "kustomize.config.k8s.io/v1beta1", "kind": "Kustomization", "resources": ["gotk-sync.yaml"]}' > {{ env.TASKV_DIRECTORY }}/checkout/clusters/oci-dev/flux-system/kustomization.yaml''',
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' add clusters/oci-dev/flux-system",
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' commit --only -m 'feat: bootstrap Flux fixture' -- clusters/oci-dev/flux-system",
  "git -C '{{ env.TASKV_DIRECTORY }}/checkout' push origin HEAD:main",
]
env.TASKV_DIRECTORY = '''{{ env.DIRECTORY | default(value="") }}'''

