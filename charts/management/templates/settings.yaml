{{- /* Rendered by the host and applied to OKE; Kind does not hold these objects. */ -}}
{{- if .Values.renderSettings }}
{{- $inputs := include "management.settingsInputs" . | fromYaml }}
apiVersion: v1
kind: Namespace
metadata:
  name: tamoss-infra
{{- range $name, $values := $inputs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: tamoss-infra
  labels: {reconcile.fluxcd.io/watch: Enabled}
data:
  values.yaml: |
{{ $values | toYaml | indent 4 }}
{{- end }}
{{- end }}
