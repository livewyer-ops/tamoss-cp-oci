apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [namespaces.yaml, sources.yaml, releases.yaml]
configurations: [kustomizeconfig.yaml]
configMapGenerator:
  - name: tamoss-gitops-values
    namespace: flux-system
    files: [values.yaml]
generatorOptions:
  labels:
    reconcile.fluxcd.io/watch: Enabled
