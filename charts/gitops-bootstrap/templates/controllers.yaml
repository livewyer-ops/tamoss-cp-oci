{{- $controllers := list
  (dict "name" "crossplane" "namespace" "crossplane-system" "source" "crossplane" "chart" "crossplane" "version" .Values.dependencies.crossplane.version "values" (dict "image" (dict "repository" .Values.dependencies.crossplane.imageRepository)) "needs" list)
  (dict "name" "oci-family" "namespace" "crossplane-system" "chart" "./charts/packages" "values" (mergeOverwrite (deepCopy .Values.packages) (dict "family" true)) "needs" (list "crossplane"))
  (dict "name" "oci-services" "namespace" "crossplane-system" "chart" "./charts/packages" "values" (mergeOverwrite (deepCopy .Values.packages) (dict "services" true "foundation" false "okeWorkloadIdentity" (dict "region" .Values.region))) "needs" (list "oci-family"))
  (dict "name" "tamoss-environment-api" "namespace" "crossplane-system" "chart" "./charts/environment" "values" dict "needs" (list "oci-services")) -}}
{{- range $controllers }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  interval: 10m
  timeout: 10m
  releaseName: {{ .name }}
  install:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 30s}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
{{ with .needs }}
  dependsOn:
{{ range . }}
    - name: {{ . }}
      namespace: crossplane-system
{{ end }}
{{ end }}
  chart:
    spec:
      chart: {{ if .source }}{{ .chart }}{{ else }}{{ printf "./%s%s" $.Values.assets.prefix (trimPrefix "./" .chart) | quote }}{{ end }}
{{ if .source }}
      version: {{ .version | quote }}
      sourceRef: {kind: HelmRepository, name: {{ .source }}, namespace: flux-system}
{{ else }}
      reconcileStrategy: Revision
      sourceRef: {kind: Bucket, name: tamoss-product, namespace: flux-system}
{{ end }}
  values:
{{ .values | toYaml | indent 4 }}
{{ end }}
