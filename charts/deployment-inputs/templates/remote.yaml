{{- if and .Values.files.foundation .Values.files.pins }}
{{- $identity := .Values.files.identity | fromYaml }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tamoss-gitops-values
  namespace: tamoss-infra
  labels: {reconcile.fluxcd.io/watch: Enabled}
data:
  values.yaml: |
{{ include (print .Template.BasePath "/values.yaml") . | indent 4 }}
---
{{ .Values.files.assets }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform-defaults, namespace: tamoss-infra}
spec:
  interval: 1m
  timeout: 2m
  prune: true
  path: ./deploy/gitops/platform-defaults
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runtime
  namespace: tamoss-infra
  labels: {tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}}
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 15m
  prune: false
  deletionPolicy: Orphan
  sourceRef: {kind: GitRepository, name: tamoss-bootstrap-product}
  path: ./deploy/gitops/runtime
  dependsOn: [{name: bootstrap-ready}, {name: platform-defaults}]
  postBuild:
    substituteFrom:
      - {kind: ConfigMap, name: tamoss-runtime}
      - {kind: ConfigMap, name: oke-bootstrap-facts}
  commonMetadata:
    labels: {tamoss.livewyer.io/deployment-id: {{ $identity.deploymentUID | quote }}}
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: tamoss-gitops, namespace: tamoss-infra}
{{- end }}
