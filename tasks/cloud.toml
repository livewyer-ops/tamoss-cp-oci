

["cloud:inventory"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_INVENTORY_DIR | quote }} || { printf '%s\n' "Missing required input: INVENTORY_DIR" >&2; exit 1; }''',
  "mkdir -p -m 700 '{{ env.TASKV_INVENTORY_DIR }}'",
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/deploy/oci/inventory.yaml") %}
{{ vars.OCI }} {{ item.command }} --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --all > {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ENV_DIR ~ "/environment.yaml") | get(key="spec") | get(key="oke") | get(key="placements") | map(attribute="availabilityDomain") | unique %}
{{ vars.OCI }} bv boot-volume list --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --availability-domain {{ (item) | quote }} --all > {{ env.TASKV_INVENTORY_DIR }}/boot-volumes-{{ (item) | hash }}.json
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/deploy/oci/inventory.yaml") %}
yq -i '. // {"data": []}' {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ROOT_DIR ~ "/deploy/oci/inventory.yaml") %}
yq -r '(.data | (select(tag == "!!seq"), (select(tag == "!!map") | .items))) // [] | .[] | select(."lifecycle-state" != "DELETED" and ."lifecycle-state" != "TERMINATED") | .id // .name' {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json | sort > {{ env.TASKV_INVENTORY_DIR }}/{{ item.name }}.json.ids
{% endfor %}''',
  '''{% for item in read_yaml(path=vars.ENV_DIR ~ "/environment.yaml") | get(key="spec") | get(key="oke") | get(key="placements") | map(attribute="availabilityDomain") | unique %}
yq -r '(.data // [])[] | select(."lifecycle-state" != "TERMINATED") | .id' {{ env.TASKV_INVENTORY_DIR }}/boot-volumes-{{ (item) | hash }}.json | sort > {{ env.TASKV_INVENTORY_DIR }}/boot-volumes-{{ (item) | hash }}.json.ids
{% endfor %}''',
  "touch '{{ env.TASKV_INVENTORY_DIR }}/.complete'",
]
env.TASKV_COMPARTMENT = '''{% if env.COMPARTMENT is defined %}{{ env.COMPARTMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.compartmentId " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''
env.TASKV_INVENTORY_DIR = '''{{ env.INVENTORY_DIR | default(value="") }}'''

["cloud:audit"]
hide = true
run = [
  "INVENTORY_DIR='{{ vars.ENV_DIR }}/inventory-after' mise run cloud:inventory",
  '''yq eval-all -e '[.data | (select(tag == "!!seq"), (select(tag == "!!map") | .items)) | .[] | select(."lifecycle-state" != "DELETED" and ."lifecycle-state" != "TERMINATED")] | length == 0' '{{ vars.ENV_DIR }}/inventory-after/'*.json > /dev/null || { echo 'Resources remain in the dedicated compartment; retain Kind and inspect inventory-after.' >&2; exit 1; }''',
]

["cloud:prepare-deletion"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "{{ vars.OCI }} lb load-balancer list --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --all > {{ vars.ENV_DIR }}/load-balancers.json",
  '''yq -r '.data[] | select(."lifecycle-state" != "DELETED") | .id' {{ vars.ENV_DIR }}/load-balancers.json | sort > {{ vars.ENV_DIR }}/load-balancers.json.ids''',
  '''yq -e '[.data[] | select(."lifecycle-state" != "DELETED")] | length == 0' '{{ vars.ENV_DIR }}/load-balancers.json' > /dev/null''',
  "{{ vars.OCI }} psql db-system-collection list-db-systems --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --all > {{ vars.ENV_DIR }}/database-systems.json",
  '''yq -r '.data.items[] | select(."freeform-tags"."tamoss-deployment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID and ."freeform-tags"."tamoss-composite-uid" == (load("{{ vars.ENV_DIR }}/identity.yaml").creationCompositeUID // load("{{ vars.ENV_DIR }}/identity.yaml").compositeUID)) | .id' {{ vars.ENV_DIR }}/database-systems.json >> {{ vars.ENV_DIR }}/database-ids.txt''',
  "{{ vars.OCI }} os bucket list --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --all > {{ vars.ENV_DIR }}/buckets.json",
  '''yq -i '. // {"data": []}' {{ vars.ENV_DIR }}/buckets.json''',
  '''yq -r '.[] | select(.kind == "PsqlDbSystem" and .id != null) | .id' {{ vars.ENV_DIR }}/resources.yaml >> {{ vars.ENV_DIR }}/database-ids.txt''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:empty-bucket",
]
env.TASKV_COMPARTMENT = '''{% if env.COMPARTMENT is defined %}{{ env.COMPARTMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.compartmentId " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''
env.TASKV_NAMESPACE = '''{% if env.NAMESPACE is defined %}{{ env.NAMESPACE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.storage.namespace " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''

["cloud:empty-bucket:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
skip_if = "(yq -e '[.data[] | select(.name == strenv(BUCKET_NAME))] | length == 0' {{ vars.ENV_DIR }}/buckets.json)"
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "{{ vars.OCI }} os bucket get --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --name {{ (env.TASKV_BUCKET) | quote }} > {{ vars.ENV_DIR }}/bucket.json",
  '''yq -e '.data."freeform-tags"."tamoss-deployment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID and .data."freeform-tags"."tamoss-composite-uid" == (load("{{ vars.ENV_DIR }}/identity.yaml").creationCompositeUID // load("{{ vars.ENV_DIR }}/identity.yaml").compositeUID) and .data."compartment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").environment.compartmentId' {{ vars.ENV_DIR }}/bucket.json''',
  "{{ vars.OCI }} os multipart list --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --bucket-name {{ (env.TASKV_BUCKET) | quote }} --all > {{ vars.ENV_DIR }}/uploads.json",
  "{{ vars.OCI }} os object list-object-versions --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --bucket-name {{ (env.TASKV_BUCKET) | quote }} --all > {{ vars.ENV_DIR }}/versions.json",
  '''yq -i '. // {"data": []}' {{ vars.ENV_DIR }}/uploads.json''',
  '''yq -i '.data = (.data // [])' {{ vars.ENV_DIR }}/versions.json''',
  '''yq -e '.data | tag == "!!seq"' {{ vars.ENV_DIR }}/versions.json > /dev/null''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} BUCKET={{ ((env.TASKV_BUCKET)) | quote }} NAMESPACE={{ ((env.TASKV_NAMESPACE)) | quote }} mise run cloud:purge-objects",
  "{{ vars.OCI }} os object list --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --bucket-name {{ (env.TASKV_BUCKET) | quote }} --all > {{ vars.ENV_DIR }}/objects-after.json",
  '''yq -i '. // {"data": []}' {{ vars.ENV_DIR }}/objects-after.json''',
  "yq -e '.data | length == 0' {{ vars.ENV_DIR }}/objects-after.json",
  "{{ vars.OCI }} os object list-object-versions --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --bucket-name {{ (env.TASKV_BUCKET) | quote }} --all > {{ vars.ENV_DIR }}/versions-after.json",
  '''yq -i '. // {"data": []}' {{ vars.ENV_DIR }}/versions-after.json''',
  "yq -e '(.data // []) | length == 0' {{ vars.ENV_DIR }}/versions-after.json",
  "{{ vars.OCI }} os multipart list --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --bucket-name {{ (env.TASKV_BUCKET) | quote }} --all > {{ vars.ENV_DIR }}/uploads-after.json",
  '''yq -i '. // {"data": []}' {{ vars.ENV_DIR }}/uploads-after.json''',
  "yq -e '(.data // []) | length == 0' {{ vars.ENV_DIR }}/uploads-after.json",
]
env.TASKV_BUCKET = '''{% if env.BUCKET is defined %}{{ env.BUCKET }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.storage.bucket " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''
env.TASKV_NAMESPACE = '''{% if env.NAMESPACE is defined %}{{ env.NAMESPACE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.storage.namespace " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''
env.BUCKET_NAME = "{{ env.TASKV_BUCKET }}"

["cloud:empty-bucket"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "mise run cloud:empty-bucket:apply",
]
env.TASKV_BUCKET = '''{% if env.BUCKET is defined %}{{ env.BUCKET }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.storage.bucket " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''
env.BUCKET_NAME = "{{ env.TASKV_BUCKET }}"

["cloud:purge-objects"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_BUCKET | quote }} || { printf '%s\n' "Missing required input: BUCKET" >&2; exit 1; }''',
  '''test -n {{ env.TASKV_NAMESPACE | quote }} || { printf '%s\n' "Missing required input: NAMESPACE" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  '''yq -n '{"bucket": {"name": "{{ env.TASKV_BUCKET }}", "namespace": "{{ env.TASKV_NAMESPACE }}", "uploads": load("{{ vars.ENV_DIR }}/uploads.json").data}}' > '{{ vars.ENV_DIR }}/retirement-values.yaml'''',
  { task = "retirement:run:remote" },
]
env.TASKV_BUCKET = '''{{ env.BUCKET | default(value="") }}'''
env.TASKV_NAMESPACE = '''{{ env.NAMESPACE | default(value="") }}'''

["cloud:delete-backups"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "{{ vars.OCI }} psql backup-collection list-backups --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --all > {{ vars.ENV_DIR }}/backups.json",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:purge-backups",
]
env.TASKV_COMPARTMENT = '''{% if env.COMPARTMENT is defined %}{{ env.COMPARTMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .spec.compartmentId " ~ (vars.ENV_DIR) ~ "/environment.yaml") }}{% endif %}'''

["cloud:purge-backups"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  '''yq -n '{"backups": [load("{{ vars.ENV_DIR }}/backups.json").data.items[] | select(."lifecycle-state" != "DELETED") | select(."db-system-id" as $id | load_str("{{ vars.ENV_DIR }}/database-ids.txt") | split("\n") | contains([$id]))]}' > '{{ vars.ENV_DIR }}/retirement-values.yaml'''',
  { task = "retirement:run:remote" },
]

["cloud:observe-owned"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  '''ENV_DIR={{ ((vars.ENV_DIR)) | quote }} INVENTORY_DIR={{ ((vars.ENV_DIR) ~ "/inventory-current") | quote }} mise run cloud:inventory''',
  '''yq eval-all '[.data | (select(tag == "!!seq"), (select(tag == "!!map") | .items)) | .[] | select(."freeform-tags"."tamoss-deployment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID and ."freeform-tags"."tamoss-composite-uid" == (load("{{ vars.ENV_DIR }}/identity.yaml").creationCompositeUID // load("{{ vars.ENV_DIR }}/identity.yaml").compositeUID)) | select(."lifecycle-state" != "DELETED" and ."lifecycle-state" != "TERMINATED")]' {{ vars.ENV_DIR }}/inventory-current/*.json > '{{ vars.ENV_DIR }}/owned-current.yaml'''',
  "touch '{{ vars.ENV_DIR }}/owned-cloud.yaml'",
  "yq eval-all '. as $item ireduce ([]; . + ($item // [])) | unique_by(.id // .name)' {{ vars.ENV_DIR }}/owned-current.yaml {{ vars.ENV_DIR }}/owned-cloud.yaml > {{ vars.ENV_DIR }}/owned-cloud.pending.yaml",
  "mv '{{ vars.ENV_DIR }}/owned-cloud.pending.yaml' '{{ vars.ENV_DIR }}/owned-cloud.yaml'",
  '''yq -e '[.data[] | select(."lifecycle-state" != "DELETED") | select(.id == load("{{ vars.ENV_DIR }}/identity.yaml").clusterID) | select(."freeform-tags"."tamoss-deployment-id" != load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID or ."freeform-tags"."tamoss-composite-uid" != (load("{{ vars.ENV_DIR }}/identity.yaml").creationCompositeUID // load("{{ vars.ENV_DIR }}/identity.yaml").compositeUID))] | length == 0' '{{ vars.ENV_DIR }}/inventory-current/clusters.json' > /dev/null''',
]

["cloud:remote:apply"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
skip_if = '''(test -z "${TASKV_CLUSTER_ID}")'''
run = [
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "install -m 600 /dev/null '{{ vars.ENV_DIR }}/remote.pending.kubeconfig'",
  "{{ vars.OCI }} ce cluster create-kubeconfig --cluster-id {{ (env.TASKV_CLUSTER_ID) | quote }} --file - --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT > {{ vars.ENV_DIR }}/remote.pending.kubeconfig",
  "CLUSTER_ID={{ env.TASKV_CLUSTER_ID | quote }} mise run cloud:remote:record",
]
env.TASKV_CLUSTER_ID = '''{% if env.CLUSTER_ID is defined %}{{ env.CLUSTER_ID }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '[.[] | select(.id | test(\"^ocid1[.]cluster[.]\"))] | .[0].id // \"\"' " ~ (vars.ENV_DIR) ~ "/owned-current.yaml") }}{% endif %}'''

["cloud:remote:record"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''yq -e '[.clusters | length == 1, .users | length == 1, .users[0].user.exec.command == "oci", (.users[0].user.exec.args | contains(["{{ env.TASKV_CLUSTER_ID }}"])), (.clusters[0].cluster.server | test("^https://")), (.clusters[0].cluster."certificate-authority-data" | length > 0), .clusters[0].cluster."insecure-skip-tls-verify" != true] | all' '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' > /dev/null''',
  '''yq -i '.users[].user.exec |= (.command = "oci" | .env = [{"name": "OCI_CLI_CONFIG_FILE", "value": strenv(OCI_CLI_CONFIG_FILE)}, {"name": "OCI_CLI_PROFILE", "value": strenv(OCI_CLI_PROFILE)}])' '{{ vars.ENV_DIR }}/remote.pending.kubeconfig'''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' --request-timeout=30s get namespace kube-system -o jsonpath='{.metadata.uid}' > '{{ vars.ENV_DIR }}/remote-uid'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' config view --minify -o jsonpath='{.clusters[0].cluster.server}' > '{{ vars.ENV_DIR }}/remote-server'",
  '''yq -e '.remoteUID == null or (.remoteUID == load_str("{{ vars.ENV_DIR }}/remote-uid") and .remoteServer == load_str("{{ vars.ENV_DIR }}/remote-server"))' {{ vars.ENV_DIR }}/identity.yaml > /dev/null''',
  '''yq -i '.clusterID = "{{ env.TASKV_CLUSTER_ID }}" | .remoteUID = load_str("{{ vars.ENV_DIR }}/remote-uid") | .remoteServer = load_str("{{ vars.ENV_DIR }}/remote-server")' {{ vars.ENV_DIR }}/identity.yaml''',
  "mv '{{ vars.ENV_DIR }}/remote.pending.kubeconfig' '{{ vars.ENV_DIR }}/remote.kubeconfig'",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
]
env.TASKV_CLUSTER_ID = '''{{ env.CLUSTER_ID | default(value=env.TASKV_CLUSTER_ID | default(value="")) }}'''

["cloud:remote"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''yq -e '[.[] | select(.id | test("^ocid1[.]cluster[.]"))] | length <= 1' {{ vars.ENV_DIR }}/owned-current.yaml || { printf '%s\n' "Expected at most one owned OKE cluster" >&2; exit 1; }''',
  '''test -z '{{ env.TASKV_CLUSTER_ID }}' || yq -e '.clusterID == null or .clusterID == "{{ env.TASKV_CLUSTER_ID }}"' '{{ vars.ENV_DIR }}/identity.yaml' || { printf '%s\n' "OKE identity changed; retain management state and investigate" >&2; exit 1; }''',
  '''test -z '{{ env.TASKV_CLUSTER_ID }}' || yq -e 'map(.id) | contains(["{{ env.TASKV_CLUSTER_ID }}"])' '{{ vars.ENV_DIR }}/owned-current.yaml' > /dev/null || { printf '%s\n' "OKE cluster is not in the owned resource inventory" >&2; exit 1; }''',
  "mise run cloud:remote:apply",
]
env.TASKV_CLUSTER_ID = '''{% if env.CLUSTER_ID is defined %}{{ env.CLUSTER_ID }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '[.[] | select(.id | test(\"^ocid1[.]cluster[.]\"))] | .[0].id // \"\"' " ~ (vars.ENV_DIR) ~ "/owned-current.yaml") }}{% endif %}'''

["cloud:fixture"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  "{{ vars.OCI }} os bucket get --namespace-name {{ (env.TASKV_NAMESPACE) | quote }} --name {{ (env.TASKV_BUCKET) | quote }} > {{ vars.ENV_DIR }}/fixture-bucket.json",
  '''yq -e '.data."freeform-tags"."tamoss-deployment-id" == load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID and .data."freeform-tags"."tamoss-composite-uid" == (load("{{ vars.ENV_DIR }}/identity.yaml").creationCompositeUID // load("{{ vars.ENV_DIR }}/identity.yaml").compositeUID)' {{ vars.ENV_DIR }}/fixture-bucket.json''',
  "{{ vars.OCI }} os object put --namespace-name '{{ env.TASKV_NAMESPACE }}' --bucket-name '{{ env.TASKV_BUCKET }}' --name 'qualification-input/{{ env.TASKV_HASH }}.mp4' --file '{{ vars.ROOT_DIR }}/.local/tmp/check/media/qualification.mp4' --content-type video/mp4 --force --verify-checksum > '{{ vars.ENV_DIR }}/fixture-upload.json'",
]
env.TASKV_BUCKET = '''{% if env.BUCKET is defined %}{{ env.BUCKET }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.storage.bucket " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''
env.TASKV_HASH = '''{% if env.HASH is defined %}{{ env.HASH }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "cut -d ' ' -f 1 '" ~ (vars.ROOT_DIR) ~ "/.local/tmp/check/media/qualification.sha256'") }}{% endif %}'''
env.TASKV_NAMESPACE = '''{% if env.NAMESPACE is defined %}{{ env.NAMESPACE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .environment.storage.namespace " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["cloud:secret-inventory"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "{{ vars.OCI }} vault secret list --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --vault-id {{ (env.TASKV_VAULT) | quote }} --all > {{ vars.ENV_DIR }}/vault-secrets.json",
  '''yq -p=json -o=json '[.data[] | select(."secret-name" | test("^" + load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID + "-"))]' '{{ vars.ENV_DIR }}/vault-secrets.json' > '{{ vars.ENV_DIR }}/environment-secrets.json'''',
]
env.TASKV_COMPARTMENT = '''{% if env.COMPARTMENT is defined %}{{ env.COMPARTMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .compartmentId " ~ (vars.ENV_DIR) ~ "/foundation-record.yaml") }}{% endif %}'''
env.TASKV_VAULT = '''{% if env.VAULT is defined %}{{ env.VAULT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .vaultId " ~ (vars.ENV_DIR) ~ "/foundation-record.yaml") }}{% endif %}'''

["cloud:retire-secrets"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  '''yq -n '{"deletionTime": "{{ env.TASKV_DELETION_TIME }}", "secretDeletions": [load("{{ vars.ENV_DIR }}/environment-secrets.json")[] | select(."lifecycle-state" == "ACTIVE")]}' > '{{ vars.ENV_DIR }}/retirement-values.yaml'''',
  { task = "retirement:run" },
  "TAMOSS_ENV_DIR='{{ vars.ENV_DIR }}' helmfile --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -f deploy/secrets/retirement-helmfile.yaml.gotmpl sync",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:secret-inventory",
  '''yq -e '[.[] | (."lifecycle-state" == "PENDING_DELETION" or ."lifecycle-state" == "DELETED")] | all' {{ vars.ENV_DIR }}/environment-secrets.json > /dev/null''',
]
env.TASKV_DELETION_TIME = '''{% if env.DELETION_TIME is defined %}{{ env.DELETION_TIME }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "date -u -d '+25 hours' +%Y-%m-%dT%H:%M:%SZ") }}{% endif %}'''

["cloud:retained-foundation"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:management",
  "{{ vars.OCI }} kms management vault get --vault-id {{ (env.TASKV_VAULT) | quote }} > {{ vars.ENV_DIR }}/retained-vault.json",
  "{{ vars.OCI }} kms management key get --endpoint {{ (env.TASKV_ENDPOINT) | quote }} --key-id {{ (env.TASKV_KEY) | quote }} > {{ vars.ENV_DIR }}/retained-key.json",
  "{{ vars.OCI }} iam policy list --compartment-id {{ (env.TASKV_COMPARTMENT) | quote }} --all > {{ vars.ENV_DIR }}/remaining-policies.json",
  '''yq -e '[.data[] | select(.name | test("^" + load("{{ vars.ENV_DIR }}/identity.yaml").deploymentUID + "-"))] | length == 0' {{ vars.ENV_DIR }}/remaining-policies.json > /dev/null''',
  '''yq -e '.data.id == load("{{ vars.ENV_DIR }}/foundation-record.yaml").vaultId and .data."lifecycle-state" == "ACTIVE"' {{ vars.ENV_DIR }}/retained-vault.json > /dev/null''',
  '''yq -e '.data.id == load("{{ vars.ENV_DIR }}/foundation-record.yaml").keyId and .data."lifecycle-state" == "ENABLED"' {{ vars.ENV_DIR }}/retained-key.json > /dev/null''',
  '''yq -n '{"foundation": load("{{ vars.ENV_DIR }}/foundation-record.yaml"), "environmentSecrets": load("{{ vars.ENV_DIR }}/environment-secrets.json"), "runtimePoliciesAbsent": true, "vaultRetained": true, "keyRetained": true}' > '{{ vars.ENV_DIR }}/retained-foundation.yaml'''',
]
env.TASKV_COMPARTMENT = '''{% if env.COMPARTMENT is defined %}{{ env.COMPARTMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .compartmentId " ~ (vars.ENV_DIR) ~ "/foundation-record.yaml") }}{% endif %}'''
env.TASKV_ENDPOINT = '''{% if env.ENDPOINT is defined %}{{ env.ENDPOINT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .managementEndpoint " ~ (vars.ENV_DIR) ~ "/foundation-record.yaml") }}{% endif %}'''
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .keyId " ~ (vars.ENV_DIR) ~ "/foundation-record.yaml") }}{% endif %}'''
env.TASKV_VAULT = '''{% if env.VAULT is defined %}{{ env.VAULT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .vaultId " ~ (vars.ENV_DIR) ~ "/foundation-record.yaml") }}{% endif %}'''
