
["test:bootstrap:render-native"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''helm template bootstrap '{{ vars.ROOT_DIR }}/charts/bootstrap' | yq 'select(.kind == "Composition" and .metadata.name == "tamoss-bootstrap")' > '{{ env.TASKV_DIRECTORY }}/native-composition.yaml'''',
  '''yq '.spec.vaultAuth = {"user": "ocid1.user.oc1.fixture", "tenancy": "ocid1.tenancy.oc1.fixture"}' {{ env.TASKV_DIRECTORY }}/root.yaml > {{ env.TASKV_DIRECTORY }}/native-root.yaml''',
  '''yq 'with(select(.kind == "TamossEnvironment"); .status.outputs.clusterId = "ocid1.cluster.oc1.fixture")' '{{ env.TASKV_DIRECTORY }}/ready-observed.yaml' > '{{ env.TASKV_DIRECTORY }}/native-observed.yaml'''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-observed.yaml' --required-resources='{{ vars.ROOT_DIR }}/tests/bootstrap/credentials.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native.yaml'",
  '''yq eval-all -e '[select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | ([.spec.values.initialise == true, (.spec.values.deliveries | length == 9), .spec.values.oracle.vault == "ocid1.vault.oc1.fixture", .spec.values.oracle.encryptionKey == "ocid1.key.oc1.fixture"] | all)] | [length > 0, all] | all' '{{ env.TASKV_DIRECTORY }}/native.yaml'''',
  '''yq 'select(.kind == "Policy")' {{ env.TASKV_DIRECTORY }}/native.yaml > {{ env.TASKV_DIRECTORY }}/native-policies.yaml''',
  "crossplane resource validate '{{ vars.ROOT_DIR }}/.local/tmp/check/schemas' '{{ env.TASKV_DIRECTORY }}/native-policies.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ vars.ROOT_DIR }}/.local/tmp/check/crossplane' --error-on-missing-schemas --skip-success-results",
  '''yq eval-all -e '[select(.kind == "Policy")] | [length == 7, ([.[].spec.forProvider.statements[]] | length == 24), ([.[].spec.forProvider.statements[] | select(test("^Allow any-user to read secret-bundles in compartment id ocid1[.]compartment[.]") and contains("ocid1.cluster.oc1.fixture") and contains("ocid1.vault.oc1.fixture"))] | length == 12), ([.[] | select(.metadata.name | test("-secrets-tads$")) | .spec.forProvider.statements[]] | length == 1), ([.[] | select(.metadata.name | test("-secrets-tamoss-infra$")) | .spec.forProvider.statements[] | select(test("request[.]principal[.]namespace = .tamoss-infra.,") and contains("-authentik-"))] | length == 4), ([.[] | select(.metadata.name | test("-secrets-tamoss-infra$")) | .spec.forProvider.statements[] | select(test("request[.]principal[.]namespace = .tamoss-infra.,") and test("target[.]secret[.]name = .[a-f0-9]{32}-database-admin.[}]$"))] | length == 1), ([.[] | select(.metadata.name | test("-services$")) | .spec.forProvider.statements[]] | length == 5), ([.[] | select(.metadata.name | test("-services$")) | .spec.forProvider.statements[] | select(test("^Allow any-user to (manage postgres-db-systems|read postgres-configurations|read postgres-work-requests|use virtual-network-family|manage buckets) in compartment id ocid1[.]compartment[.]") and test("request[.]principal[.]type = .workload., request[.]principal[.]cluster_id = .ocid1[.]cluster[.]oc1[.]fixture., request[.]principal[.]namespace = .crossplane-system., request[.]principal[.]service_account = .provider-oci.[}]$"))] | unique | length == 5), ([.[] | select(.metadata.name | test("-retirement$")) | .spec.forProvider.statements[] | select(test("^Allow any-user to (manage objects|read buckets|read load-balancers|read postgres-db-systems|manage postgres-backups|read postgres-work-requests) in compartment id ocid1[.]compartment[.]") and test("request[.]principal[.]type = .workload., request[.]principal[.]cluster_id = .ocid1[.]cluster[.]oc1[.]fixture., request[.]principal[.]namespace = .tamoss-infra., request[.]principal[.]service_account = .services-retirement.[}]$"))] | unique | length == 6), ([.[] | select(.metadata.name | test("-database-connection$")) | .spec.forProvider.statements[] | select(test("^Allow any-user to read postgres-db-systems in compartment id ocid1[.]compartment[.]") and contains("ocid1.cluster.oc1.fixture") and test("request[.]principal[.]service_account = .database-connection.[}]$"))] | length == 1)] | all' '{{ env.TASKV_DIRECTORY }}/native-policies.yaml' ''',
  '''yq 'with(select(.kind == "TamossEnvironment"); .status.outputs.clusterId = "ocid1.cluster.oc1.fixture\u0027 or \u0027x\u0027 = \u0027x")' '{{ env.TASKV_DIRECTORY }}/native-observed.yaml' > '{{ env.TASKV_DIRECTORY }}/native-injection.yaml' ''',
  "! crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-injection.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native-injection-render.yaml' 2> '{{ env.TASKV_DIRECTORY }}/native-injection.log'",
  "grep -q 'Runtime policy inputs must be plain OCIDs' '{{ env.TASKV_DIRECTORY }}/native-injection.log'",
  '''yq 'select(.kind != "TamossBootstrap") | del(.status)' {{ env.TASKV_DIRECTORY }}/native.yaml > {{ env.TASKV_DIRECTORY }}/native-lost-status.yaml''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-lost-status.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native-recovering.yaml'",
  '''yq 'select(.kind == "HelmRelease" or .kind == "Policy")' {{ env.TASKV_DIRECTORY }}/native.yaml > {{ env.TASKV_DIRECTORY }}/native-releases.yaml''',
  '''yq 'select(.kind == "HelmRelease" or .kind == "Policy")' {{ env.TASKV_DIRECTORY }}/native-recovering.yaml > {{ env.TASKV_DIRECTORY }}/native-recovering-releases.yaml''',
  '''{% for item in ["native-releases", "native-recovering-releases"] %}
yq -i 'del(.metadata.annotations."gotemplating.fn.crossplane.io/ready")' {{ env.TASKV_DIRECTORY }}/{{ item }}.yaml
{% endfor %}''',
  "diff -u '{{ env.TASKV_DIRECTORY }}/native-releases.yaml' '{{ env.TASKV_DIRECTORY }}/native-recovering-releases.yaml'",
  "yq '.spec.credentialsEstablished = true' {{ env.TASKV_DIRECTORY }}/native-root.yaml > {{ env.TASKV_DIRECTORY }}/native-retired-root.yaml",
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-retired-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-lost-status.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/native-retired.yaml'",
  '''yq eval-all -e '[select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | (.spec.values.initialise == false)] | [length > 0, all] | all' {{ env.TASKV_DIRECTORY }}/native-retired.yaml''',
  '''yq 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | .spec.values' {{ env.TASKV_DIRECTORY }}/native-retired.yaml > {{ env.TASKV_DIRECTORY }}/native-secret-values.yaml''',
  "helm template tamoss-secrets '{{ vars.ROOT_DIR }}/charts/secrets' -n tamoss-infra -f '{{ env.TASKV_DIRECTORY }}/native-secret-values.yaml' > '{{ env.TASKV_DIRECTORY }}/native-deliveries.yaml'",
  '''yq eval-all -e '[select(.kind == "PushSecret" or .kind == "Password")] | length == 0' {{ env.TASKV_DIRECTORY }}/native-deliveries.yaml''',
  '''yq eval-all -e '[select(.kind == "ExternalSecret")] | length == 9' {{ env.TASKV_DIRECTORY }}/native-deliveries.yaml''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap{% endif %}"

["test:bootstrap:credential-completion"]
hide = true
run = [
  '''yq 'select(.kind == "ExternalSecret") | .status.conditions = [{"type":"Ready","status":"True"}]' '{{ env.TASKV_DIRECTORY }}/native-deliveries.yaml' > '{{ env.TASKV_DIRECTORY }}/all-deliveries.yaml' ''',
  '''yq 'select(.metadata.name != "database-admin")' '{{ env.TASKV_DIRECTORY }}/all-deliveries.yaml' > '{{ env.TASKV_DIRECTORY }}/missing-delivery.yaml' ''',
  '''yq 'with(select(.metadata.name == "s3"); .spec.data[0].remoteRef.key = "another-deployment-s3")' '{{ env.TASKV_DIRECTORY }}/all-deliveries.yaml' > '{{ env.TASKV_DIRECTORY }}/wrong-delivery.yaml' ''',
  '''{% for item in ["all-deliveries", "missing-delivery", "wrong-delivery"] %}
crossplane composition render '{{ env.TASKV_DIRECTORY }}/native-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-observed.yaml' --required-resources='{{ env.TASKV_DIRECTORY }}/{{ item }}.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/{{ item }}-result.yaml'
yq eval-all -e '[select(.kind == "TamossBootstrap") | (.status.credentialsEstablished == {{ item == "all-deliveries" }})] | [length > 0, all] | all' '{{ env.TASKV_DIRECTORY }}/{{ item }}-result.yaml'
yq eval-all -e '[select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | (.spec.values.initialise == {{ item != "all-deliveries" }})] | [length > 0, all] | all' '{{ env.TASKV_DIRECTORY }}/{{ item }}-result.yaml'
{% endfor %}''',
  '''yq 'select(.kind == "TamossBootstrap") | del(.spec.credentialsEstablished)' '{{ env.TASKV_DIRECTORY }}/all-deliveries-result.yaml' > '{{ env.TASKV_DIRECTORY }}/established-root.yaml' ''',
  "crossplane composition render '{{ env.TASKV_DIRECTORY }}/established-root.yaml' '{{ env.TASKV_DIRECTORY }}/native-composition.yaml' '{{ vars.ROOT_DIR }}/.local/tmp/check/functions.yaml' --include-full-xr --observed-resources='{{ env.TASKV_DIRECTORY }}/native-lost-status.yaml' --crossplane-image={{ vars.CORE }} > '{{ env.TASKV_DIRECTORY }}/established-without-deliveries.yaml'",
  '''yq eval-all -e '[select(.kind == "HelmRelease" and .metadata.name == "tamoss-secrets") | (.spec.values.initialise == false)] | [length > 0, all] | all' '{{ env.TASKV_DIRECTORY }}/established-without-deliveries.yaml' ''',
]
env.TASKV_DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap"

["test:bootstrap:prepare-management"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mkdir -p -m 700 '{{ env.TASKV_DIRECTORY }}/management'",
  "cp '{{ env.TASKV_DIRECTORY }}/root.yaml' '{{ env.TASKV_DIRECTORY }}/management/bootstrap.yaml'",
  '''yq '{"apiVersion": .apiVersion, "kind": "TamossEnvironment", "metadata": .metadata, "spec": .spec.environment}' {{ env.TASKV_DIRECTORY }}/root.yaml > {{ env.TASKV_DIRECTORY }}/management/environment.yaml''',
  '''cp "$KUBECONFIG" '{{ env.TASKV_DIRECTORY }}/management/management.kubeconfig'''',
  '''ENV_DIR={{ ((env.TASKV_DIRECTORY) ~ "/management") | quote }} mise run identity:observe-inputs''',
  "cp '{{ env.TASKV_DIRECTORY }}/management/identity-inputs.yaml' '{{ env.TASKV_DIRECTORY }}/management/identity.yaml'",
  "kubectl get namespace kube-system -o json > '{{ env.TASKV_DIRECTORY }}/management/namespace.json'",
  '''yq -i '.deploymentUID = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" | .managementUID = load("{{ env.TASKV_DIRECTORY }}/management/namespace.json").metadata.uid' {{ env.TASKV_DIRECTORY }}/management/identity.yaml''',
]
env.TASKV_DIRECTORY = "{% if env.DIRECTORY is defined %}{{ env.DIRECTORY }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check/bootstrap{% endif %}"

["test:bootstrap:deliver-all"]
hide = true
run = [
  '''yq '.deliveries | map({"key": ("aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-" + .name), "value": ({"accesskey": "fixture-only", "secretkey": "fixture-only", "accessKey": "fixture-only", "secretKey": "fixture-only"} | to_json(0))}) | {"apiVersion": "external-secrets.io/v1", "kind": "SecretStore", "metadata": {"name": "tamoss-vault", "namespace": "tamoss-infra"}, "spec": {"provider": {"fake": {"data": .}}}}' charts/bootstrap/secret-values.yaml > .local/tmp/check/bootstrap/fake-store.yaml''',
  "kubectl apply -f .local/tmp/check/bootstrap/fake-store.yaml",
  '''yq 'select(.kind == "ExternalSecret")' .local/tmp/check/bootstrap/native-deliveries.yaml | kubectl apply -f -''',
]

