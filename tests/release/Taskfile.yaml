version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT_DIR: '{{.PROJECT_ROOT}}'
includes:
  verify: {taskfile: ../../tasks/check.yaml, dir: '{{.PROJECT_ROOT}}', internal: true}
  tamoss: {taskfile: ../../deploy/tamoss/Taskfile.yaml, dir: '{{.PROJECT_ROOT}}', internal: true}
  application: {taskfile: ../../tasks/application.yaml, dir: '{{.PROJECT_ROOT}}', internal: true}
tasks:
  prepare:
    dir: '{{.PROJECT_ROOT}}'
    cmds:
      - mkdir -p -m 700 '{{.ENV_DIR}}' '{{.ENV_DIR}}/candidate/deploy/tamoss' '{{.ENV_DIR}}/candidate/.local/tmp'
      - cp deploy/tamoss/release.yaml '{{.ENV_DIR}}/candidate/release.yaml'
      - 'yq -i ''.tag = "0.0.0-unpublished-test"'' {{.ENV_DIR}}/candidate/release.yaml'
      - cp '{{.ENV_DIR}}/candidate/release.yaml' '{{.ENV_DIR}}/candidate/deploy/tamoss/release.yaml'
      - cp dependencies.yaml '{{.ENV_DIR}}/candidate/'
      - cp -a deploy/tamoss/operator '{{.ENV_DIR}}/candidate/deploy/tamoss/'
      - test -L '{{.ENV_DIR}}/candidate/.local/tmp/tamoss' || ln -s '{{.ROOT_DIR}}/.local/tmp/tamoss' '{{.ENV_DIR}}/candidate/.local/tmp/tamoss'
      - task: tamoss:record
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  match:
    cmds:
      - task: tamoss:assert-current
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  record:
    cmds:
      - task: tamoss:record
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  metadata:
    cmds:
      - task: tamoss:metadata
  entrypoints:
    cmds:
      - task: tamoss:entrypoints
        vars: {ASSETS: '{{.CHECK_ASSETS}}'}
  prepare-removal:
    cmds:
      - task: application:prepare-removal
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  prepare-removal-alternate:
    cmds:
      - >-
        PROJECT_ROOT='{{.ENV_DIR}}/candidate'
        task -d '{{.ENV_DIR}}/candidate' -t '{{.ROOT_DIR}}/tests/release/Taskfile.yaml'
        prepare-removal PROJECT_ROOT='{{.ENV_DIR}}/candidate' ENV_DIR='{{.ENV_DIR}}'
  bad-download:
    vars:
      SHA: {sh: 'yq -r .releaseSha256 {{.PROJECT_ROOT}}/deploy/tamoss/release.yaml'}
    cmds:
      - task: verify:artifact
        vars:
          CACHE: '{{.ENV_DIR}}/download'
          TARGET: release.json
          URL: 'file://{{.ENV_DIR}}/candidate/release.yaml'
          SHA: '{{.SHA}}'
