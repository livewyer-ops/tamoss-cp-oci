apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tamoss-release
  namespace: flux-system
spec:
  interval: 10m
  url: {{ .Values.release.bundleURL | quote }}
  ref: {digest: {{ .Values.release.digest | quote }}}
  provider: generic
  secretRef: {name: ghcr}
{{ range $name, $url := dict "jetstack" "https://charts.jetstack.io" "traefik" "https://traefik.github.io/charts" "authentik" "https://charts.goauthentik.io" }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ $name }}
  namespace: flux-system
spec:
  interval: 1h
  url: {{ $url }}
{{ end }}
