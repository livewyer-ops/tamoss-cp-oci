apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: tamoss-secrets, namespace: tamoss-infra}
spec:
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: SecretStore}
            patch: |
              - op: replace
                path: /spec/provider
                value:
                  kubernetes:
                    remoteNamespace: secret-backend
                    server:
                      caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt}
                    auth:
                      serviceAccount: {name: store-client}
          - target:
              kind: PushSecret
              name: database-admin|tams-database|authentik-secret-key|authentik-password|authentik-token|authentik-database|tadoss-database|tadoss-oauth
            patch: |
              - op: add
                path: /spec/data/0/match/remoteRef/property
                value: password
          - target:
              kind: ExternalSecret
              name: database-admin|tams-database|authentik-secret-key|authentik-password|authentik-token|authentik-database|tadoss-database|tadoss-oauth
            patch: |
              - op: add
                path: /spec/data/0/remoteRef/property
                value: password
