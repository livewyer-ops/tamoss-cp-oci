apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: bootstrap-retry-guards}
spec:
  steps:
    - name: preserve active absent and completed Jobs
      try:
        - command:
            entrypoint: env
            env: &paths
              - {name: PROJECT_ROOT, value: ($values.root)}
            args: ["ROOT=$PROJECT_ROOT", "CASE=active", "mise", "-C", "$PROJECT_ROOT", "run", "test:oke-bootstrap:guarded-retry"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "CASE=absent", "mise", "-C", "$PROJECT_ROOT", "run", "test:oke-bootstrap:guarded-retry"]
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "CASE=completed", "mise", "-C", "$PROJECT_ROOT", "run", "test:oke-bootstrap:guarded-retry"]
    - name: refuse released and foreign retries before API access
      try:
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "CASE=released", "mise", "-C", "$PROJECT_ROOT", "run", "test:oke-bootstrap:guarded-retry"]
            check:
              ($error != null): true
              (contains($stderr, 'released or completed')): true
        - command:
            entrypoint: env
            env: *paths
            args: ["ROOT=$PROJECT_ROOT", "CASE=foreign", "mise", "-C", "$PROJECT_ROOT", "run", "test:oke-bootstrap:guarded-retry"]
            check:
              ($error != null): true
              (contains($stderr, 'original bootstrap Job ownership')): true
