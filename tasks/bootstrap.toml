  '''yq -e '.spec.released != true and .status.remoteBootstrapCompleted != true' {{ vars.ENV_DIR }}/bootstrap-observed.json > /dev/null || { printf '%s\n' "A released or completed bootstrap cannot be retried" >&2; exit 1; }''',
  '''yq -e 'load("{{ vars.ENV_DIR }}/bootstrap-observed.json").metadata.uid as $uid | [.items | length == 1, (.items[0].metadata.ownerReferences | map(.uid) | contains([$uid]))] | all' '{{ vars.ENV_DIR }}/bootstrap-jobs.json' > /dev/null || { printf '%s\n' "Retry requires the original bootstrap Job ownership" >&2; exit 1; }''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/management.kubeconfig' -n tamoss-infra get secret oke-connection -o json | yq -p=json -e '.data.complete != "dHJ1ZQ=="' > /dev/null || { printf '%s\n' "A recorded successful seed must not be replayed" >&2; exit 1; }''',
  "mkdir -p -m 700 '{{ env.TASKV_REPORT }}'",
