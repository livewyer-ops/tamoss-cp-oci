version: '3'
set: [errexit, nounset, pipefail]
vars:
  OCI_CONFIG: '{{env "OCI_CLI_CONFIG_FILE" | default (printf "%s/.oci/config" (env "HOME"))}}'
  OCI_PROFILE: '{{env "OCI_CLI_PROFILE" | default "DEFAULT"}}'
  OCI: oci --config-file {{shellQuote .OCI_CONFIG}} --profile {{shellQuote .OCI_PROFILE}} --connection-timeout 10 --read-timeout 30 --max-retries 0
# Explicit CLI environment also applies to native Chainsaw commands.
env:
  OCI_CLI_CONFIG_FILE: '{{.OCI_CONFIG}}'
  OCI_CLI_PROFILE: '{{.OCI_PROFILE}}'
tasks:
  profile:
    requires: {vars: [ENV_DIR]}
    env:
      OCI_PROFILE: '{{.OCI_PROFILE}}'
    cmds:
      - 'yq -p=ini -e ''(. * (.[strenv(OCI_PROFILE)] // {})).region == load("{{.ENV_DIR}}/environment.yaml").spec.region'' {{shellQuote .OCI_CONFIG}}'
  credentials:
    silent: true
    vars:
      OCI_KEY_FILE:
        sh: 'OCI_PROFILE={{shellQuote .OCI_PROFILE}} yq -p=ini -oy -r ''(. * (.[strenv(OCI_PROFILE)] // {})).key_file'' {{shellQuote .OCI_CONFIG}}'
    env:
      OCI_PROFILE: '{{.OCI_PROFILE}}'
      OCI_KEY_FILE: '{{.OCI_KEY_FILE}}'
    requires:
      vars: [CREDENTIAL_DIR]
    preconditions:
      - sh: test -f '{{.OCI_CONFIG}}' && test -z "$(find '{{.OCI_CONFIG}}' -perm /077 -print)"
        msg: OCI config must have owner-only permissions
      - sh: test -f '{{.OCI_KEY_FILE}}' && test -z "$(find '{{.OCI_KEY_FILE}}' -perm /077 -print)"
        msg: OCI key must exist and have owner-only permissions
      - sh: 'yq -n -e ''strenv(OCI_KEY_FILE) | test("^/")'''
        msg: OCI key_file must be an absolute path
      - sh: 'yq -p=ini -e ''strenv(OCI_PROFILE) == "DEFAULT" or has(strenv(OCI_PROFILE))'' {{shellQuote .OCI_CONFIG}}'
        msg: Selected OCI profile is missing
    cmds:
      - mkdir -p -m 700 '{{.CREDENTIAL_DIR}}'
      - install -m 600 /dev/null '{{.CREDENTIAL_DIR}}/credentials.json'
      - >-
        yq -p=ini -o=json
        '(. * (.[strenv(OCI_PROFILE)] // {})) |
        {"auth": "ApiKey", "tenancy_ocid": .tenancy, "user_ocid": .user,
        "fingerprint": .fingerprint, "region": .region,
        "private_key": load_str(strenv(OCI_KEY_FILE)), "private_key_password": .pass_phrase}
        | with_entries(select(.value != null))'
        {{shellQuote .OCI_CONFIG}} > '{{.CREDENTIAL_DIR}}/credentials.json'
      - cp deploy/credentials/kustomization.yaml deploy/credentials/namespace.yaml '{{.CREDENTIAL_DIR}}/'
      - 'yq -i ''.resources = []'' {{.CREDENTIAL_DIR}}/kustomization.yaml'
  storage-run:
    requires:
      vars: [OCI_TEST_COMPARTMENT_ID]
    vars:
      CHECK_NAME: 'tamoss-cp-storage-{{now | unixEpoch}}'
    preconditions:
      - sh: test ! -e '{{.STORAGE_DIR}}/values.yaml' && test ! -e '{{.STORAGE_DIR}}/management.kubeconfig'
        msg: A previous storage run is retained; run task check:storage:cleanup before retrying
      - sh: 'yq -n -e ''"{{.OCI_TEST_COMPARTMENT_ID}}" | test("^ocid1\\.(compartment|tenancy)\\.")'''
        msg: Set the authorised test compartment OCID
    cmds:
      - mkdir -p -m 700 '{{.STORAGE_DIR}}' '{{.ROOT_DIR}}/.local/reports'
      - task: storage-context
      - '{{.OCI}} os ns get --query data --raw-output > {{.STORAGE_DIR}}/namespace.txt'
      - '{{.OCI}} os bucket list --compartment-id {{shellQuote .OCI_TEST_COMPARTMENT_ID}} --namespace-name "$(cat {{.STORAGE_DIR}}/namespace.txt)" --all > {{.STORAGE_DIR}}/baseline.json'
      - 'yq -i ''. // {"data": []}'' {{.STORAGE_DIR}}/baseline.json'
      - install -m 600 /dev/null '{{.STORAGE_DIR}}/values.yaml'
      - >-
        yq -n
        '{"compartmentId": "{{.OCI_TEST_COMPARTMENT_ID}}", "objectNamespace": (load_str("{{.STORAGE_DIR}}/namespace.txt") | trim),
        "bucketName": "{{.CHECK_NAME}}", "expiresAt": "{{now | dateModify "30m" | date "2006-01-02T15:04:05Z07:00"}}",
        "oci": load("{{.STORAGE_DIR}}/oci-current.yaml")}'
        > '{{.STORAGE_DIR}}/values.yaml'
      - 'yq -e ''[.data[] | select(.name == "{{.CHECK_NAME}}")] | length == 0'' {{.STORAGE_DIR}}/baseline.json'
      - kind create cluster --name '{{.CHECK_NAME}}' --config deploy/management/kind.yaml --kubeconfig '{{.STORAGE_DIR}}/management.kubeconfig' --wait 120s
      - task: :management:install
        vars: {MANAGEMENT_KUBECONFIG: '{{.STORAGE_DIR}}/management.kubeconfig'}
      - defer: rm -f '{{.STORAGE_DIR}}/credentials/credentials.json'
      - task: credentials
        vars:
          CREDENTIAL_DIR: '{{.STORAGE_DIR}}/credentials'
          MANAGEMENT_KUBECONFIG: '{{.STORAGE_DIR}}/management.kubeconfig'
      - cp environments/example/provider.yaml '{{.STORAGE_DIR}}/credentials/'
      - 'yq -i ''.resources += ["namespace.yaml", "provider.yaml"]'' {{.STORAGE_DIR}}/credentials/kustomization.yaml'
      - kubectl --kubeconfig '{{.STORAGE_DIR}}/management.kubeconfig' apply --server-side -k '{{.STORAGE_DIR}}/credentials'
      - KUBECONFIG='{{.STORAGE_DIR}}/management.kubeconfig' chainsaw test --skip-delete --exec-timeout 600s --test-dir tests/storage --values '{{.STORAGE_DIR}}/values.yaml' --set-string root='{{.ROOT_DIR}}' --set-string directory='{{.STORAGE_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name storage
      - task: storage-cleanup
      - echo 'Storage lifecycle check passed and cleanup was verified.'
  storage-context:
    env:
      OCI_PROFILE: '{{.OCI_PROFILE}}'
    cmds:
      - >-
        yq -p=ini -oy '(. * (.[strenv(OCI_PROFILE)] // {})) |
        {"tenancy": .tenancy, "user": .user, "fingerprint": .fingerprint, "region": .region}'
        {{shellQuote .OCI_CONFIG}} > '{{.STORAGE_DIR}}/oci-current.yaml'
      - yq -e '[.tenancy, .user, .fingerprint, .region] | all_c((. != null) and (. != ""))' '{{.STORAGE_DIR}}/oci-current.yaml' > /dev/null
  storage-cleanup:
    vars:
      CHECK_NAME: {sh: 'yq -e -r .bucketName {{shellQuote .STORAGE_DIR}}/values.yaml'}
    preconditions:
      - sh: test -s '{{.STORAGE_DIR}}/values.yaml' && test -s '{{.STORAGE_DIR}}/baseline.json'
        msg: No complete storage probe record; retain any Kind state and establish ownership before cleanup
    cmds:
      - task: storage-context
      - >-
        yq -e 'load("{{.STORAGE_DIR}}/oci-current.yaml") as $current |
        [(.oci.tenancy == $current.tenancy), (.oci.user == $current.user),
        (.oci.fingerprint == $current.fingerprint), (.oci.region == $current.region),
        (.bucketName | test("^tamoss-cp-[a-z0-9-]+$"))] | all' '{{.STORAGE_DIR}}/values.yaml' > /dev/null
      - task: storage-remove
        vars: {CHECK_NAME: '{{.CHECK_NAME}}'}
      - >-
        {{.OCI}} os bucket list --compartment-id "$(yq -r .compartmentId '{{.STORAGE_DIR}}/values.yaml')"
        --namespace-name "$(yq -r .objectNamespace '{{.STORAGE_DIR}}/values.yaml')" --all > '{{.STORAGE_DIR}}/after.json'
      - task: storage-audit
      - kind delete cluster --name '{{.CHECK_NAME}}'
      - rm -f '{{.STORAGE_DIR}}/management.kubeconfig' '{{.STORAGE_DIR}}/observed.kubeconfig' '{{.STORAGE_DIR}}/credentials/credentials.json'
      - mkdir -p -m 700 '{{.ROOT_DIR}}/.local/reports/storage'
      - mv '{{.STORAGE_DIR}}' '{{.ROOT_DIR}}/.local/reports/storage/{{.CHECK_NAME}}'
      - echo 'Storage probe deletion verified; its records are archived under .local/reports/storage.'
  storage-remove:
    requires: {vars: [CHECK_NAME]}
    status:
      - docker ps -aq --filter 'label=io.x-k8s.kind.cluster={{.CHECK_NAME}}' | wc -c | xargs test 0 -eq
    cmds:
      - install -m 600 /dev/null '{{.STORAGE_DIR}}/observed.kubeconfig'
      - kind get kubeconfig --name '{{.CHECK_NAME}}' > '{{.STORAGE_DIR}}/observed.kubeconfig'
      - >-
        yq -e 'load("{{.STORAGE_DIR}}/observed.kubeconfig") as $current |
        [((.clusters | length) == 1), (($current.clusters | length) == 1),
        (.clusters[0].name == $current.clusters[0].name),
        (.clusters[0].cluster.server == $current.clusters[0].cluster.server),
        (.clusters[0].cluster."certificate-authority-data" == $current.clusters[0].cluster."certificate-authority-data")] | all'
        '{{.STORAGE_DIR}}/management.kubeconfig' > /dev/null
      - task: storage-remove-bucket
  storage-remove-bucket:
    status:
      - >-
        kubectl --kubeconfig '{{.STORAGE_DIR}}/management.kubeconfig'
        get crd buckets.objectstorage.oci.m.upbound.io --ignore-not-found -o json |
        yq -e 'length == 0' > /dev/null
    cmds:
      - >-
        kubectl --kubeconfig '{{.STORAGE_DIR}}/management.kubeconfig' -n tamoss-infra
        get bucket.objectstorage.oci.m.upbound.io storage-check --ignore-not-found -o json > '{{.STORAGE_DIR}}/bucket.json'
      - >-
        yq -e '(length == 0) or
        ([(.spec.forProvider.name == load("{{.STORAGE_DIR}}/values.yaml").bucketName),
        (.spec.forProvider.compartmentId == load("{{.STORAGE_DIR}}/values.yaml").compartmentId),
        (.spec.forProvider.namespace == load("{{.STORAGE_DIR}}/values.yaml").objectNamespace),
        (.spec.forProvider.freeformTags.purpose == "storage-lifecycle-check")] | all)' '{{.STORAGE_DIR}}/bucket.json' > /dev/null
      - helmfile --kubeconfig '{{.STORAGE_DIR}}/management.kubeconfig' -f deploy/storage-check/helmfile.yaml.gotmpl --state-values-file '{{.STORAGE_DIR}}/values.yaml' destroy
      - kubectl --kubeconfig '{{.STORAGE_DIR}}/management.kubeconfig' -n tamoss-infra delete bucket.objectstorage.oci.m.upbound.io storage-check --ignore-not-found --wait=true --timeout=300s
  storage-audit:
    cmds:
      - 'yq -i ''. // {"data": []}'' {{.STORAGE_DIR}}/after.json'
      - for: [baseline, after]
        cmd: 'yq -e ''.data | tag == "!!seq"'' {{.STORAGE_DIR}}/{{.ITEM}}.json > /dev/null'
      - 'yq -e ''[.data[] | select(.name == load("{{.STORAGE_DIR}}/values.yaml").bucketName)] | length == 0'' {{.STORAGE_DIR}}/after.json'
      - 'yq -r ''.data[] | [.name, .id] | @tsv'' {{.STORAGE_DIR}}/baseline.json | sort > {{.STORAGE_DIR}}/baseline-names.txt'
      - 'yq -r ''.data[] | [.name, .id] | @tsv'' {{.STORAGE_DIR}}/after.json | sort > {{.STORAGE_DIR}}/after-names.txt'
      - diff -u '{{.STORAGE_DIR}}/baseline-names.txt' '{{.STORAGE_DIR}}/after-names.txt'
  bootstrap-ready:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .metadata.name {{.ENV_DIR}}/environment.yaml'}
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait tamossbootstrap/{{.NAME}} --for=jsonpath='{.status.bootstrapReady}=true' --timeout=1800s
      - task: observe-owned
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  infrastructure-ready:
    requires: {vars: [ENV_DIR]}
    vars:
      NAME: {sh: 'yq -r .metadata.name {{.ENV_DIR}}/environment.yaml'}
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait 'tamossbootstrap/{{.NAME}}' --for=condition=Ready --timeout=1800s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra wait managed -l 'tamoss.livewyer.io/environment={{.NAME}}' --for=condition=Synced --timeout=120s
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get 'tamossenvironment/{{.NAME}}' -o json | yq -p=json -o=json .status.outputs > '{{.ENV_DIR}}/outputs.json'
      - task: observe-owned
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  inventory:
    requires: {vars: [ENV_DIR, INVENTORY_DIR]}
    vars:
      COMPARTMENT: {sh: 'yq -r .spec.compartmentId {{.ENV_DIR}}/environment.yaml'}
      COMMAND_JSON: {sh: 'yq -o=json -I=0 . deploy/oci/inventory.yaml'}
      COMMANDS: {ref: .COMMAND_JSON | fromJson}
      AD_JSON: {sh: 'yq -o=json -I=0 ''[.spec.oke.placements[].availabilityDomain] | unique'' {{.ENV_DIR}}/environment.yaml'}
      ADS: {ref: .AD_JSON | fromJson}
    cmds:
      - mkdir -p -m 700 '{{.INVENTORY_DIR}}'
      - for: {var: COMMANDS}
        cmd: '{{.OCI}} {{.ITEM.command}} --compartment-id {{shellQuote .COMPARTMENT}} --all > {{.INVENTORY_DIR}}/{{.ITEM.name}}.json'
      - for: {var: ADS}
        cmd: '{{.OCI}} bv boot-volume list --compartment-id {{shellQuote .COMPARTMENT}} --availability-domain {{shellQuote .ITEM}} --all > {{.INVENTORY_DIR}}/boot-volumes-{{sha256sum .ITEM}}.json'
      - for: {var: COMMANDS}
        cmd: 'yq -i ''. // {"data": []}'' {{.INVENTORY_DIR}}/{{.ITEM.name}}.json'
      - for: {var: COMMANDS}
        cmd: 'yq -r ''(.data | (select(tag == "!!seq"), (select(tag == "!!map") | .items))) // [] | .[] | select(."lifecycle-state" != "DELETED" and ."lifecycle-state" != "TERMINATED") | .id // .name'' {{.INVENTORY_DIR}}/{{.ITEM.name}}.json | sort > {{.INVENTORY_DIR}}/{{.ITEM.name}}.json.ids'
      - for: {var: ADS}
        cmd: 'yq -r ''(.data // [])[] | select(."lifecycle-state" != "TERMINATED") | .id'' {{.INVENTORY_DIR}}/boot-volumes-{{sha256sum .ITEM}}.json | sort > {{.INVENTORY_DIR}}/boot-volumes-{{sha256sum .ITEM}}.json.ids'
      - touch '{{.INVENTORY_DIR}}/.complete'
  audit:
    requires: {vars: [ENV_DIR]}
    vars:
      INVENTORY_NAMES:
        sh: find '{{.ENV_DIR}}/inventory-before' -maxdepth 1 -name '*.ids' -printf '%f\n'
    preconditions:
      - sh: test -f '{{.ENV_DIR}}/inventory-before/.complete'
        msg: Baseline cloud inventory is missing; retain management state
    cmds:
      - task: inventory
        vars: {ENV_DIR: '{{.ENV_DIR}}', INVENTORY_DIR: '{{.ENV_DIR}}/inventory-after'}
      - find '{{.ENV_DIR}}/inventory-before' -maxdepth 1 -name '*.ids' -printf '%f\n' | sort > '{{.ENV_DIR}}/inventory-before-files.txt'
      - find '{{.ENV_DIR}}/inventory-after' -maxdepth 1 -name '*.ids' -printf '%f\n' | sort > '{{.ENV_DIR}}/inventory-after-files.txt'
      - diff -u '{{.ENV_DIR}}/inventory-before-files.txt' '{{.ENV_DIR}}/inventory-after-files.txt'
      - for: {var: INVENTORY_NAMES}
        cmd: diff -u '{{.ENV_DIR}}/inventory-before/{{.ITEM}}' '{{.ENV_DIR}}/inventory-after/{{.ITEM}}'
  prepare-deletion:
    requires: {vars: [ENV_DIR]}
    vars:
      COMPARTMENT: {sh: 'yq -r .spec.compartmentId {{.ENV_DIR}}/environment.yaml'}
      NAMESPACE: {sh: 'yq -r .spec.storage.namespace {{.ENV_DIR}}/environment.yaml'}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - '{{.OCI}} lb load-balancer list --compartment-id {{shellQuote .COMPARTMENT}} --all > {{.ENV_DIR}}/load-balancers.json'
      - 'yq -r ''.data[] | select(."lifecycle-state" != "DELETED") | .id'' {{.ENV_DIR}}/load-balancers.json | sort > {{.ENV_DIR}}/load-balancers.json.ids'
      - diff -u '{{.ENV_DIR}}/inventory-before/load-balancers.json.ids' '{{.ENV_DIR}}/load-balancers.json.ids'
      - '{{.OCI}} psql db-system-collection list-db-systems --compartment-id {{shellQuote .COMPARTMENT}} --all > {{.ENV_DIR}}/database-systems.json'
      - 'yq -r ''.data.items[] | select(."freeform-tags"."tamoss-deployment-id" == load("{{.ENV_DIR}}/identity.yaml").deploymentUID and ."freeform-tags"."tamoss-composite-uid" == (load("{{.ENV_DIR}}/identity.yaml").creationCompositeUID // load("{{.ENV_DIR}}/identity.yaml").compositeUID)) | .id'' {{.ENV_DIR}}/database-systems.json >> {{.ENV_DIR}}/database-ids.txt'
      - '{{.OCI}} os bucket list --compartment-id {{shellQuote .COMPARTMENT}} --namespace-name {{shellQuote .NAMESPACE}} --all > {{.ENV_DIR}}/buckets.json'
      - 'yq -i ''. // {"data": []}'' {{.ENV_DIR}}/buckets.json'
      - 'yq -r ''.[] | select(.kind == "PsqlDbSystem" and .id != null) | .id'' {{.ENV_DIR}}/resources.yaml >> {{.ENV_DIR}}/database-ids.txt'
      - task: empty-bucket
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  empty-bucket:
    requires: {vars: [ENV_DIR]}
    vars:
      BUCKET: {sh: 'yq -r .spec.storage.bucket {{.ENV_DIR}}/environment.yaml'}
      NAMESPACE: {sh: 'yq -r .spec.storage.namespace {{.ENV_DIR}}/environment.yaml'}
    env:
      BUCKET_NAME: '{{.BUCKET}}'
    status:
      - 'yq -e ''[.data[] | select(.name == strenv(BUCKET_NAME))] | length == 0'' {{.ENV_DIR}}/buckets.json'
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - '{{.OCI}} os bucket get --namespace-name {{shellQuote .NAMESPACE}} --name {{shellQuote .BUCKET}} > {{.ENV_DIR}}/bucket.json'
      - 'yq -e ''.data."freeform-tags"."tamoss-deployment-id" == load("{{.ENV_DIR}}/identity.yaml").deploymentUID and .data."freeform-tags"."tamoss-composite-uid" == (load("{{.ENV_DIR}}/identity.yaml").creationCompositeUID // load("{{.ENV_DIR}}/identity.yaml").compositeUID) and .data."compartment-id" == load("{{.ENV_DIR}}/identity.yaml").environment.compartmentId'' {{.ENV_DIR}}/bucket.json'
      - '{{.OCI}} os multipart list --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --all > {{.ENV_DIR}}/uploads.json'
      - '{{.OCI}} os object list-object-versions --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --all > {{.ENV_DIR}}/versions.json'
      - 'yq -i ''. // {"data": []}'' {{.ENV_DIR}}/uploads.json'
      - 'yq -i ''. // {"data": []}'' {{.ENV_DIR}}/versions.json'
      - 'yq -e ''.data | tag == "!!seq"'' {{.ENV_DIR}}/versions.json > /dev/null'
      - task: purge-objects
        vars: {ENV_DIR: '{{.ENV_DIR}}', BUCKET: '{{.BUCKET}}', NAMESPACE: '{{.NAMESPACE}}'}
      - '{{.OCI}} os object list --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --all > {{.ENV_DIR}}/objects-after.json'
      - 'yq -i ''. // {"data": []}'' {{.ENV_DIR}}/objects-after.json'
      - 'yq -e ''.data | length == 0'' {{.ENV_DIR}}/objects-after.json'
      - '{{.OCI}} os object list-object-versions --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --all > {{.ENV_DIR}}/versions-after.json'
      - 'yq -i ''. // {"data": []}'' {{.ENV_DIR}}/versions-after.json'
      - 'yq -e ''(.data // []) | length == 0'' {{.ENV_DIR}}/versions-after.json'
      - '{{.OCI}} os multipart list --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --all > {{.ENV_DIR}}/uploads-after.json'
      - 'yq -i ''. // {"data": []}'' {{.ENV_DIR}}/uploads-after.json'
      - 'yq -e ''(.data // []) | length == 0'' {{.ENV_DIR}}/uploads-after.json'
  purge-objects:
    requires: {vars: [ENV_DIR, BUCKET, NAMESPACE]}
    vars:
      UPLOAD_JSON: {sh: 'yq -o=json -I=0 ''.data // []'' {{.ENV_DIR}}/uploads.json'}
      UPLOADS: {ref: .UPLOAD_JSON | fromJson}
      VERSION_JSON: {sh: 'yq -o=json -I=0 ''.data // []'' {{.ENV_DIR}}/versions.json'}
      VERSIONS: {ref: .VERSION_JSON | fromJson}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - for: {var: UPLOADS}
        cmd: '{{.OCI}} os multipart abort --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --object-name {{shellQuote .ITEM.object}} --upload-id {{shellQuote (index .ITEM "upload-id")}} --force'
      - for: {var: VERSIONS}
        cmd: '{{.OCI}} os object delete --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --name {{shellQuote .ITEM.name}} --version-id {{shellQuote (index .ITEM "version-id")}} --force'
      - '{{.OCI}} os object bulk-delete --namespace-name {{shellQuote .NAMESPACE}} --bucket-name {{shellQuote .BUCKET}} --force > {{.ENV_DIR}}/object-deletion.json'
  delete-backups:
    requires: {vars: [ENV_DIR]}
    vars:
      COMPARTMENT: {sh: 'yq -r .spec.compartmentId {{.ENV_DIR}}/environment.yaml'}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - '{{.OCI}} psql backup-collection list-backups --compartment-id {{shellQuote .COMPARTMENT}} --all > {{.ENV_DIR}}/backups.json'
      - task: purge-backups
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  purge-backups:
    requires: {vars: [ENV_DIR]}
    vars:
      BACKUP_JSON:
        sh: 'yq -o=json -I=0 ''[.data.items[] | select(."lifecycle-state" != "DELETED") | select(."db-system-id" as $id | (load_str("{{.ENV_DIR}}/database-ids.txt") | split("\n") | contains([$id])))]'' {{.ENV_DIR}}/backups.json'
      BACKUPS: {ref: .BACKUP_JSON | fromJson}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - for: {var: BACKUPS}
        cmd: '{{.OCI}} psql backup delete --backup-id {{shellQuote .ITEM.id}} --force --wait-for-state SUCCEEDED --max-wait-seconds 1200'
  observe-owned:
    silent: true
    requires: {vars: [ENV_DIR]}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - task: inventory
        vars: {ENV_DIR: '{{.ENV_DIR}}', INVENTORY_DIR: '{{.ENV_DIR}}/inventory-current'}
      - >-
        yq eval-all '[.data | (select(tag == "!!seq"), (select(tag == "!!map") | .items)) | .[] |
        select(."freeform-tags"."tamoss-deployment-id" == load("{{.ENV_DIR}}/identity.yaml").deploymentUID and
        ."freeform-tags"."tamoss-composite-uid" == (load("{{.ENV_DIR}}/identity.yaml").creationCompositeUID // load("{{.ENV_DIR}}/identity.yaml").compositeUID)) |
        select(."lifecycle-state" != "DELETED" and ."lifecycle-state" != "TERMINATED")]'
        {{.ENV_DIR}}/inventory-current/*.json > '{{.ENV_DIR}}/owned-current.yaml'
      - touch '{{.ENV_DIR}}/owned-cloud.yaml'
      - 'yq eval-all ''. as $item ireduce ([]; . + ($item // [])) | unique_by(.id // .name)'' {{.ENV_DIR}}/owned-current.yaml {{.ENV_DIR}}/owned-cloud.yaml > {{.ENV_DIR}}/owned-cloud.pending.yaml'
      - mv '{{.ENV_DIR}}/owned-cloud.pending.yaml' '{{.ENV_DIR}}/owned-cloud.yaml'
      - >-
        yq -e '[.data[] | select(."lifecycle-state" != "DELETED") |
        select(.id == load("{{.ENV_DIR}}/identity.yaml").clusterID) |
        select(."freeform-tags"."tamoss-deployment-id" != load("{{.ENV_DIR}}/identity.yaml").deploymentUID or
        ."freeform-tags"."tamoss-composite-uid" != (load("{{.ENV_DIR}}/identity.yaml").creationCompositeUID // load("{{.ENV_DIR}}/identity.yaml").compositeUID))] | length == 0'
        '{{.ENV_DIR}}/inventory-current/clusters.json' > /dev/null
  remote:
    silent: true
    requires: {vars: [ENV_DIR]}
    vars:
      CLUSTER_ID:
        sh: 'yq -r ''[.[] | select(.id | test("^ocid1[.]cluster[.]"))] | .[0].id // ""'' {{.ENV_DIR}}/owned-current.yaml'
    status:
      - test -z '{{.CLUSTER_ID}}'
    preconditions:
      - sh: 'yq -e ''[.[] | select(.id | test("^ocid1[.]cluster[.]"))] | length <= 1'' {{.ENV_DIR}}/owned-current.yaml'
        msg: Expected at most one owned OKE cluster
      - sh: test -z '{{.CLUSTER_ID}}' || yq -e '.clusterID == null or .clusterID == "{{.CLUSTER_ID}}"' '{{.ENV_DIR}}/identity.yaml'
        msg: OKE identity changed; retain management state and investigate
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - install -m 600 /dev/null '{{.ENV_DIR}}/remote.pending.kubeconfig'
      - '{{.OCI}} ce cluster create-kubeconfig --cluster-id {{shellQuote .CLUSTER_ID}} --file - --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT > {{.ENV_DIR}}/remote.pending.kubeconfig'
      - >-
        yq -i '.users[].user.exec |=
        (.command = "oci" |
        .env = [{"name": "OCI_CLI_CONFIG_FILE", "value": strenv(OCI_CLI_CONFIG_FILE)},
        {"name": "OCI_CLI_PROFILE", "value": strenv(OCI_CLI_PROFILE)}])' '{{.ENV_DIR}}/remote.pending.kubeconfig'
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.pending.kubeconfig' get namespace kube-system -o jsonpath='{.metadata.uid}' > '{{.ENV_DIR}}/remote-uid'
      - kubectl --kubeconfig '{{.ENV_DIR}}/remote.pending.kubeconfig' config view --minify -o jsonpath='{.clusters[0].cluster.server}' > '{{.ENV_DIR}}/remote-server'
      - 'yq -e ''.remoteUID == null or (.remoteUID == load_str("{{.ENV_DIR}}/remote-uid") and .remoteServer == load_str("{{.ENV_DIR}}/remote-server"))'' {{.ENV_DIR}}/identity.yaml > /dev/null'
      - 'yq -i ''.clusterID = "{{.CLUSTER_ID}}" | .remoteUID = load_str("{{.ENV_DIR}}/remote-uid") | .remoteServer = load_str("{{.ENV_DIR}}/remote-server")'' {{.ENV_DIR}}/identity.yaml'
      - mv '{{.ENV_DIR}}/remote.pending.kubeconfig' '{{.ENV_DIR}}/remote.kubeconfig'
      - task: :identity:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
  fixture:
    requires: {vars: [ENV_DIR]}
    vars:
      BUCKET: {sh: 'yq -r .environment.storage.bucket {{.ENV_DIR}}/identity.yaml'}
      NAMESPACE: {sh: 'yq -r .environment.storage.namespace {{.ENV_DIR}}/identity.yaml'}
      HASH:
        sh: cut -d ' ' -f 1 '{{.ROOT_DIR}}/.local/tmp/check/media/qualification.sha256'
    cmds:
      - task: :identity:remote
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - '{{.OCI}} os bucket get --namespace-name {{shellQuote .NAMESPACE}} --name {{shellQuote .BUCKET}} > {{.ENV_DIR}}/fixture-bucket.json'
      - 'yq -e ''.data."freeform-tags"."tamoss-deployment-id" == load("{{.ENV_DIR}}/identity.yaml").deploymentUID and .data."freeform-tags"."tamoss-composite-uid" == (load("{{.ENV_DIR}}/identity.yaml").creationCompositeUID // load("{{.ENV_DIR}}/identity.yaml").compositeUID)'' {{.ENV_DIR}}/fixture-bucket.json'
      - >-
        {{.OCI}} os object put --namespace-name '{{.NAMESPACE}}' --bucket-name '{{.BUCKET}}'
        --name 'qualification-input/{{.HASH}}.mp4' --file '{{.ROOT_DIR}}/.local/tmp/check/media/qualification.mp4'
        --content-type video/mp4 --force --verify-checksum > '{{.ENV_DIR}}/fixture-upload.json'
  secret-inventory:
    requires: {vars: [ENV_DIR]}
    vars:
      COMPARTMENT: {sh: 'yq -r .compartmentId {{.ENV_DIR}}/foundation-record.yaml'}
      VAULT: {sh: 'yq -r .vaultId {{.ENV_DIR}}/foundation-record.yaml'}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - '{{.OCI}} vault secret list --compartment-id {{shellQuote .COMPARTMENT}} --vault-id {{shellQuote .VAULT}} --all > {{.ENV_DIR}}/vault-secrets.json'
      - >-
        yq -p=json -o=json '[.data[] | select(."secret-name" | test("^" + load("{{.ENV_DIR}}/identity.yaml").deploymentUID + "-"))]'
        '{{.ENV_DIR}}/vault-secrets.json' > '{{.ENV_DIR}}/environment-secrets.json'
  retire-secrets:
    requires: {vars: [ENV_DIR]}
    vars:
      IDS_JSON: {sh: 'yq -o=json -I=0 ''[.[] | select(."lifecycle-state" == "ACTIVE") | .id]'' {{.ENV_DIR}}/environment-secrets.json'}
      IDS: {ref: .IDS_JSON | fromJson}
      DELETION_TIME: {sh: "date -u -d '+25 hours' +%Y-%m-%dT%H:%M:%SZ"}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - for: {var: IDS}
        cmd: '{{.OCI}} vault secret schedule-secret-deletion --secret-id {{shellQuote .ITEM}} --time-of-deletion {{shellQuote .DELETION_TIME}} > /dev/null'
      - TAMOSS_ENV_DIR='{{.ENV_DIR}}' helmfile --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -f deploy/secrets/retirement-helmfile.yaml.gotmpl sync
      - task: secret-inventory
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - 'yq -e ''[.[] | (."lifecycle-state" == "PENDING_DELETION" or ."lifecycle-state" == "DELETED")] | all'' {{.ENV_DIR}}/environment-secrets.json > /dev/null'
  retained-foundation:
    requires: {vars: [ENV_DIR]}
    vars:
      COMPARTMENT: {sh: 'yq -r .compartmentId {{.ENV_DIR}}/foundation-record.yaml'}
      VAULT: {sh: 'yq -r .vaultId {{.ENV_DIR}}/foundation-record.yaml'}
      KEY: {sh: 'yq -r .keyId {{.ENV_DIR}}/foundation-record.yaml'}
      ENDPOINT: {sh: 'yq -r .managementEndpoint {{.ENV_DIR}}/foundation-record.yaml'}
    cmds:
      - task: :identity:management
        vars: {ENV_DIR: '{{.ENV_DIR}}'}
      - '{{.OCI}} kms management vault get --vault-id {{shellQuote .VAULT}} > {{.ENV_DIR}}/retained-vault.json'
      - '{{.OCI}} kms management key get --endpoint {{shellQuote .ENDPOINT}} --key-id {{shellQuote .KEY}} > {{.ENV_DIR}}/retained-key.json'
      - '{{.OCI}} iam policy list --compartment-id {{shellQuote .COMPARTMENT}} --all > {{.ENV_DIR}}/remaining-policies.json'
      - 'yq -e ''[.data[] | select(.name | test("^" + load("{{.ENV_DIR}}/identity.yaml").deploymentUID + "-"))] | length == 0'' {{.ENV_DIR}}/remaining-policies.json > /dev/null'
      - 'yq -e ''.data.id == load("{{.ENV_DIR}}/foundation-record.yaml").vaultId and .data."lifecycle-state" == "ACTIVE"'' {{.ENV_DIR}}/retained-vault.json > /dev/null'
      - 'yq -e ''.data.id == load("{{.ENV_DIR}}/foundation-record.yaml").keyId and .data."lifecycle-state" == "ENABLED"'' {{.ENV_DIR}}/retained-key.json > /dev/null'
      - >-
        yq -n '{"foundation": load("{{.ENV_DIR}}/foundation-record.yaml"),
        "environmentSecrets": load("{{.ENV_DIR}}/environment-secrets.json"),
        "runtimePoliciesAbsent": true, "vaultRetained": true, "keyRetained": true}'
        > '{{.ENV_DIR}}/retained-foundation.yaml'
