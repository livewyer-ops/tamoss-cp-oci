apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adoption-bindings
  namespace: tamoss-infra
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef: {name: tamoss-vault, kind: SecretStore}
  target:
    name: adoption-bindings
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  dataFrom:
    - extract: {key: '${DEPLOYMENT_ID}-adoption-bindings'}
