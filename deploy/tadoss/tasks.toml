
["tadoss:selection"]
hide = true
quiet = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''export KUBECONFIG={{ (vars.ENV_DIR ~ "/remote.kubeconfig") | quote }}
desired="$(kubectl -n tamoss-infra get configmap tamoss-gitops-values -o json | yq -er '.data."values.yaml" | from_yaml | .tadoss.enabled | select(tag == "!!bool") | to_string')"
applied="$(helm get values tamoss-gitops -n tamoss-infra -o json | yq -p=json -er '.tadoss.enabled | select(tag == "!!bool") | to_string')"
test "$desired" = "$applied" || { echo 'Flux has not applied the TADOSS selection yet' >&2; exit 1; }
echo "$applied"''',
]

["tadoss:tls:protected:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "docker compose --project-name tadoss-cp-tls-check -f tests/tadoss-tls/compose.yaml pull --quiet migration database",
  "openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=database -addext subjectAltName=DNS:database -keyout '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check/server.key' -out '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check/server.crt' 2>/dev/null",
  "openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=untrusted -keyout '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check/untrusted.key' -out '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check/untrusted.crt' 2>/dev/null",
  "chmod 644 '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check/server.crt' '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check/untrusted.crt'",
  "docker compose --project-name tadoss-cp-tls-check -f tests/tadoss-tls/compose.yaml run --rm certificates",
  "docker compose --project-name tadoss-cp-tls-check -f tests/tadoss-tls/compose.yaml up --wait --wait-timeout 45 database plaintext",
  "chainsaw test --no-cluster --test-dir tests/tadoss-tls --report-format JUNIT-TEST --report-path .local/reports --report-name tadoss-database-tls",
]
env.TASKV_LOCK = "{% if env.LOCK is defined %}{{ env.LOCK }}{% else %}{{ vars.ROOT_DIR }}/deploy/tadoss/release.yaml{% endif %}"
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.artifacts.\"release.json\"' " ~ (env.TASKV_LOCK)) }}{% endif %}'''
env.TASKV_ASSETS = "{% if env.ASSETS is defined %}{{ env.ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tadoss/{{ env.TASKV_KEY }}{% endif %}"
env.TEST_TLS_DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check"
env.TEST_DB_IMAGE = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .qualification.postgres16Image " ~ (vars.ROOT_DIR) ~ "/dependencies.yaml") }}'''
env.TEST_API_IMAGE = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '\"docker.io/\" + .runtimeImage' " ~ (env.TASKV_ASSETS) ~ "/release.json") }}'''
depends_post = ["tadoss:tls:protected:cleanup"]

["tadoss:tls:protected:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "docker compose --project-name tadoss-cp-tls-check -f tests/tadoss-tls/compose.yaml down --volumes",
]
env.TASKV_LOCK = "{% if env.LOCK is defined %}{{ env.LOCK }}{% else %}{{ vars.ROOT_DIR }}/deploy/tadoss/release.yaml{% endif %}"
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.artifacts.\"release.json\"' " ~ (env.TASKV_LOCK)) }}{% endif %}'''
env.TASKV_ASSETS = "{% if env.ASSETS is defined %}{{ env.ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tadoss/{{ env.TASKV_KEY }}{% endif %}"
env.TEST_TLS_DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check"
env.TEST_DB_IMAGE = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .qualification.postgres16Image " ~ (vars.ROOT_DIR) ~ "/dependencies.yaml") }}'''
env.TEST_API_IMAGE = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '\"docker.io/\" + .runtimeImage' " ~ (env.TASKV_ASSETS) ~ "/release.json") }}'''

["tadoss:tls:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "LOCK={{ env.TASKV_LOCK | quote }} KEY={{ env.TASKV_KEY | quote }} ASSETS={{ env.TASKV_ASSETS | quote }} CACHE={{ env.TASKV_CACHE | quote }} mise run tadoss:tls:protected:protected",
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"
env.TASKV_LOCK = "{% if env.LOCK is defined %}{{ env.LOCK }}{% else %}{{ vars.ROOT_DIR }}/deploy/tadoss/release.yaml{% endif %}"
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.artifacts.\"release.json\"' " ~ (env.TASKV_LOCK)) }}{% endif %}'''
env.TASKV_ASSETS = "{% if env.ASSETS is defined %}{{ env.ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tadoss/{{ env.TASKV_KEY }}{% endif %}"
env.TEST_TLS_DIRECTORY = "{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check"
env.TEST_DB_IMAGE = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .qualification.postgres16Image " ~ (vars.ROOT_DIR) ~ "/dependencies.yaml") }}'''
env.TEST_API_IMAGE = '''{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '\"docker.io/\" + .runtimeImage' " ~ (env.TASKV_ASSETS) ~ "/release.json") }}'''
depends_post = ["tadoss:tls:cleanup"]

["tadoss:tls:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "rm -r '{{ vars.ROOT_DIR }}/.local/tmp/tadoss-tls-check'",
