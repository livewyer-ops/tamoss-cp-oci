version: '3'
set: [errexit, nounset, pipefail]
tasks:
  render:
    requires: {vars: [ENV_DIR]}
    cmds:
      - >-
        yq -n '{"dependencies": load("{{.ROOT_DIR}}/dependencies.yaml"),
        "packages": load("{{.ROOT_DIR}}/charts/packages/values.yaml"),
        "externalSecrets": load("{{.ROOT_DIR}}/deploy/secrets/controller-values.yaml"),
        "product": load("{{.ENV_DIR}}/product.yaml").product,
        "credentialsEstablished": (load("{{.ENV_DIR}}/identity.yaml").credentialsEstablished == true),
        "instance": load("{{.ENV_DIR}}/bootstrap.yaml")}' > '{{.ENV_DIR}}/management-values.yaml'
      - >-
        helm template management '{{.ROOT_DIR}}/charts/management' -f '{{.ENV_DIR}}/management-values.yaml'
        --set-file environmentDefinition='{{.ROOT_DIR}}/charts/environment/definition.yaml'
        --set-file foundationDefinition='{{.ROOT_DIR}}/charts/secret-foundation/definition.yaml'
        --set-file secretBootstrapFile='{{.ROOT_DIR}}/deploy/secrets/bootstrap-values.yaml'
        > '{{.ENV_DIR}}/management.yaml'
  freeze-instance:
    requires: {vars: [ENV_DIR]}
    status:
      - 'yq -e ''.spec.vaultAuth == null'' {{.ENV_DIR}}/bootstrap-observed.json > /dev/null'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra get helmrelease/tamoss-bootstrap-instance --ignore-not-found -o json | yq -p=json -e 'length == 0' > /dev/null
    cmds:
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n flux-system scale deployment/helm-controller --replicas=0
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n flux-system wait pod -l app=helm-controller --for=delete --timeout=180s
      - flux --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n tamoss-infra suspend helmrelease tamoss-bootstrap-instance
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' -n flux-system scale deployment/helm-controller --replicas=1
  refresh:
    requires: {vars: [ENV_DIR, GITOPS_VALUES, PRODUCT_COMMIT]}
    cmds:
      - >-
        yq 'del(.instance) | .credentialsEstablished = true |
        .dependencies = load("{{.GITOPS_VALUES}}").dependencies |
        .packages = load("{{.GITOPS_VALUES}}").packages |
        .externalSecrets = load("{{.GITOPS_VALUES}}").externalSecrets |
        .product.commit = "{{.PRODUCT_COMMIT}}"'
        '{{.ENV_DIR}}/management-values.yaml' > '{{.ENV_DIR}}/management-current.yaml'
      - >-
        helm template management '{{.ROOT_DIR}}/charts/management' -f '{{.ENV_DIR}}/management-current.yaml'
        --set-file environmentDefinition='{{.ROOT_DIR}}/charts/environment/definition.yaml'
        --set-file foundationDefinition='{{.ROOT_DIR}}/charts/secret-foundation/definition.yaml'
        --set-file secretBootstrapFile='{{.ROOT_DIR}}/deploy/secrets/bootstrap-values.yaml'
        > '{{.ENV_DIR}}/management.yaml'
      - kubectl --kubeconfig '{{.ENV_DIR}}/management.kubeconfig' apply --server-side -f '{{.ENV_DIR}}/management.yaml'
      - >-
        KUBECONFIG='{{.ENV_DIR}}/management.kubeconfig' chainsaw test --skip-delete --namespace tamoss-infra
        --test-dir '{{.ROOT_DIR}}/deploy/management/readiness' --assert-timeout=1200s
        --report-format JUNIT-TEST --report-path '{{.ENV_DIR}}/reports' --report-name management-ready
  check:
    vars:
      CHECK_NAME: 'tamoss-cp-check-{{now | unixEpoch}}'
      RELEASE_KEY: {sh: 'yq -r .releaseSha256 {{.ROOT_DIR}}/deploy/tamoss/release.yaml'}
      CONNECTION_IMAGES: {sh: 'yq -r ''select(.kind == "Job") | .spec.template.spec | [.initContainers[].image, .containers[].image] | unique | .[]'' {{.ROOT_DIR}}/.local/tmp/check/database-connection-fixture.yaml'}
    cmds:
      - defer: kind delete cluster --name '{{.CHECK_NAME}}'
      - defer: rm -f '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig'
      - defer: rm -f '{{.ROOT_DIR}}/.local/tmp/check/flux-bootstrap/environment/management.kubeconfig' '{{.ROOT_DIR}}/.local/tmp/check/flux-bootstrap/restart/management.kubeconfig' '{{.ROOT_DIR}}/.local/tmp/check/bootstrap/management/management.kubeconfig'
      - kind create cluster --name '{{.CHECK_NAME}}' --config deploy/management/kind.yaml --kubeconfig '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' --wait 120s
      - defer: rm -rf '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-identity'
      - kubectl --kubeconfig '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' apply --server-side -f '{{.ROOT_DIR}}/.local/tmp/check/schemas/flux.yaml'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/deployment-readiness --set-string root='{{.ROOT_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name deployment-readiness
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' task -t tests/flux-bootstrap/Taskfile.yaml install ROOT='{{.ROOT_DIR}}'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/operations/packaging --report-format JUNIT-TEST --report-path .local/reports --report-name operation-packaging
      - kubectl --kubeconfig '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' wait compositeresourcedefinition/secretfoundations.tamoss.livewyer.io --for=condition=Established --timeout=120s
      - kubectl --kubeconfig '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' apply --server-side -f '{{.ROOT_DIR}}/.local/tmp/check/schemas/kms.oci.m.upbound.io_vaults.yaml' -f '{{.ROOT_DIR}}/.local/tmp/check/schemas/kms.oci.m.upbound.io_keys.yaml'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --exec-timeout 180s --test-dir tests/lifecycle --set-string root='{{.ROOT_DIR}}' --set-string directory='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-identity' --set-string kubeconfig='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' --report-format JUNIT-TEST --report-path .local/reports --report-name lifecycle
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --exec-timeout 30s --test-dir tests/management --report-format JUNIT-TEST --report-path .local/reports --report-name management
      - defer: rm -rf '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-tadoss'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/tadoss-management --set-string root='{{.ROOT_DIR}}' --set-string directory='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-tadoss' --set-string kubeconfig='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' --report-format JUNIT-TEST --report-path .local/reports --report-name tadoss-lifecycle
      - mkdir -p -m 700 '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-startup'
      - defer: rm -r '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-startup'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/tadoss-startup --set-string root='{{.ROOT_DIR}}' --set-string directory='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-startup' --set-string databaseImage="$(yq -r .qualification.postgres16Image dependencies.yaml)" --set-string chartVersion="$(yq -r .dependencies.platform.authentik.chartVersion '{{.ROOT_DIR}}/.local/tmp/check/gitops-pins.yaml')" --report-format JUNIT-TEST --report-path .local/reports --report-name tadoss-startup
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --assert-timeout 90s --test-dir tests/secret-persistence --report-format JUNIT-TEST --report-path .local/reports --report-name secret-persistence
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --assert-timeout 90s --test-dir tests/gitops-key --set-string root='{{.ROOT_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name gitops-key
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/controller-state/management --set-string root='{{.ROOT_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name controller-state-management
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --assert-timeout 120s --test-dir tests/secret-retirement --report-format JUNIT-TEST --report-path .local/reports --report-name secret-retirement
      - for: {var: CONNECTION_IMAGES}
        cmd: docker exec '{{.CHECK_NAME}}-control-plane' crictl pull '{{.ITEM}}'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --assert-timeout 120s --test-dir tests/database-connection --report-format JUNIT-TEST --report-path .local/reports --report-name database-connection
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --exec-timeout 180s --assert-timeout 180s --test-dir tests/gitops-adoption --set-string root='{{.ROOT_DIR}}' --set-string chart='{{.ROOT_DIR}}/.local/tmp/tamoss/{{.RELEASE_KEY}}/source/deploy/platform/charts/authentik-bootstrap' --report-format JUNIT-TEST --report-path .local/reports --report-name gitops-adoption
      - defer: rm -rf '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-storage'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/storage-cleanup --set-string root='{{.ROOT_DIR}}' --set-string name='{{.CHECK_NAME}}' --set-string directory='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-storage' --set-string kubeconfig='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' --report-format JUNIT-TEST --report-path .local/reports --report-name storage-cleanup
      - defer: rm -rf '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-restart'
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --test-dir tests/kind-restart --set-string root='{{.ROOT_DIR}}' --set-string directory='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}-restart' --set-string kubeconfig='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' --report-format JUNIT-TEST --report-path .local/reports --report-name kind-restart
      - kubectl --kubeconfig '{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' wait compositeresourcedefinition/secretfoundations.tamoss.livewyer.io compositeresourcedefinition/tamossbootstraps.tamoss.livewyer.io --for=condition=Established --timeout=120s
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --exec-timeout 180s --assert-timeout 180s --test-dir tests/bootstrap/management --set-string root='{{.ROOT_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name bootstrap-controller
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' chainsaw test --skip-delete --test-dir tests/flux-bootstrap --set-string root='{{.ROOT_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name flux-bootstrap
      - KUBECONFIG='{{.ROOT_DIR}}/.local/tmp/check/{{.CHECK_NAME}}.kubeconfig' task -t tests/oke-bootstrap/Taskfile.yaml check ROOT='{{.ROOT_DIR}}' MANAGEMENT_NAME='{{.CHECK_NAME}}'
  install:
    requires:
      vars: [MANAGEMENT_KUBECONFIG]
    cmds:
      - helmfile --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' -f deploy/management/helmfile.yaml.gotmpl -l stage=crossplane sync
      - helmfile --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' -f deploy/management/helmfile.yaml.gotmpl -l stage=family sync
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait provider.pkg.crossplane.io/oracle-provider-family-oci --for=condition=Healthy --timeout=300s
      - helmfile --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' -f deploy/management/helmfile.yaml.gotmpl -l stage=services sync
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait providers.pkg.crossplane.io --all --for=condition=Healthy --timeout=600s
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait functions.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s
      - helmfile --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' -f deploy/management/helmfile.yaml.gotmpl -l stage=api sync
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait compositeresourcedefinition/tamossenvironments.tamoss.livewyer.io --for='jsonpath={.status.conditions}' --timeout=120s
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait compositeresourcedefinition/tamossenvironments.tamoss.livewyer.io --for=condition=Established --timeout=120s
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait crd/tamossenvironments.tamoss.livewyer.io --for='jsonpath={.status.conditions}' --timeout=120s
      - kubectl --kubeconfig '{{.MANAGEMENT_KUBECONFIG}}' wait crd/tamossenvironments.tamoss.livewyer.io --for=condition=Established --timeout=120s
