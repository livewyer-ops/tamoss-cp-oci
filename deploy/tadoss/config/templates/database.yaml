apiVersion: v1
kind: ConfigMap
metadata: {name: tadoss-database-ca, namespace: tads}
data:
  ca.pem: {{ required "caBase64 is required" .Values.caBase64 | b64dec | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tadoss-database-init, namespace: {{ .Release.Namespace }}}
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tadoss-database-init
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: tadoss-database-init}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: initialise
          image: {{ required "image is required" .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          env:
            - {name: PGHOST, value: {{ required "host is required" .Values.host | quote }}}
            - {name: PGDATABASE, value: postgres}
            - {name: PGPORT, value: '5432'}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/oci-postgresql/ca.pem}
            - {name: PGCONNECT_TIMEOUT, value: '10'}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: database-admin, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: database-admin, key: password}}
            - name: TADOSS_PASSWORD
              valueFrom: {secretKeyRef: {name: tadoss-database, key: password}}
          volumeMounts:
            - {name: ca, mountPath: /etc/oci-postgresql, readOnly: true}
            - {name: sql, mountPath: /sql, readOnly: true}
          command: [psql]
          args: [--no-psqlrc, --set=ON_ERROR_STOP=1, --file=/sql/init.sql]
      volumes:
        - name: sql
          configMap: {name: tadoss-database-init}
        - name: ca
          configMap: {name: database-ca}
