version: '3'
set: [errexit, nounset, pipefail]
vars:
  TOOL_ROOT:
    sh: aqua root-dir
  ENV_DIR: '{{.ENV_DIR | default ".local/environment"}}'
  STORAGE_DIR: '{{.STORAGE_DIR | default (printf "%s/.local/tmp/storage-check" .ROOT_DIR)}}'
  STORAGE_PATH:
    sh: realpath -m {{shellQuote .STORAGE_DIR}}
  ENV_PATH:
    sh: realpath -m {{shellQuote .ENV_DIR}}
  CHECKOUT: '{{.CHECKOUT | default ".local/gitops"}}'
  CHECKOUT_PATH:
    sh: realpath -m {{shellQuote .CHECKOUT}}
  CORE:
    sh: aqua exec -- yq -r '"xpkg.crossplane.io/crossplane/crossplane:v" + .crossplane.version' dependencies.yaml
includes:
  setup: {taskfile: tasks/setup.yaml, internal: true}
  tamoss: {taskfile: deploy/tamoss/Taskfile.yaml, internal: true}
  tadoss: {taskfile: deploy/tadoss/Taskfile.yaml, internal: true}
  verify: {taskfile: tasks/check.yaml, internal: true}
  management: {taskfile: tasks/management.yaml, internal: true}
  cloud: {taskfile: tasks/cloud.yaml, internal: true}
  runtime: {taskfile: tasks/runtime.yaml, internal: true}
  application: {taskfile: tasks/application.yaml, internal: true}
  lifecycle: {taskfile: tasks/lifecycle.yaml, internal: true}
  identity: {taskfile: tasks/identity.yaml, internal: true}
  gitops: {taskfile: tasks/gitops.yaml, internal: true}
  bootstrap: {taskfile: tasks/bootstrap.yaml, internal: true}
  transfer: {taskfile: tasks/transfer.yaml, internal: true}
  qualification: {taskfile: tasks/qualification.yaml, internal: true}
tasks:
  setup:
    desc: Install pinned tooling and prepare private deployment settings
    cmds:
      - task: setup:tools
      - task: verify:tools
      - task: verify:privacy
      - task: setup:initialise
        vars: {ENV_DIR: '{{.ENV_PATH}}'}
  check:
    desc: Validate pinned artefacts, composition lifecycle and native deployment configuration
    cmds:
      - task: verify:tools
      - "echo 'Running local checks; reports: .local/reports'"
      - task: verify:privacy
      - mkdir -p -m 700 '{{.ROOT_DIR}}/.local/reports'
      - task: verify:artifacts
      - task: tamoss:fetch
      - task: tamoss:release
      - task: tamoss:bundle
      - task: tadoss:fetch
      - task: tadoss:bundle
      - task: verify:render
      - task: verify:database
      - task: tamoss:tls
      - task: tadoss:tls
      - task: runtime:check
      - task: verify:contracts
      - task: tamoss:browser-build
      - task: tamoss:source-check
      - chainsaw test --no-cluster --test-dir tests/release --set-string root='{{.ROOT_DIR}}' --report-format JUNIT-TEST --report-path .local/reports --report-name release
  check:management:
    desc: Run local checks and a disposable credential-free Kind bootstrap
    cmds:
      - task: check
      - task: management:check
  check:storage:
    desc: Test a real OCI bucket in an authorised compartment, then verify cleanup
    cmds:
      - task: verify:tools
      - task: verify:privacy
      - task: cloud:storage-run
        vars: {STORAGE_DIR: '{{.STORAGE_PATH}}'}
  check:storage:cleanup:
    desc: Finish an interrupted storage probe's deletion without recording a test pass
    cmds:
      - task: verify:tools
      - task: cloud:storage-cleanup
        vars: {STORAGE_DIR: '{{.STORAGE_PATH}}'}
  up:
    desc: Deploy OCI and TAMOSS with Kind retaining infrastructure ownership
    cmds:
      - task: verify:tools
      - task: verify:privacy
      - task: setup:resolve
        vars: {ENV_DIR: '{{.ENV_PATH}}'}
      - task: bootstrap:up
        vars: {ENV_DIR: '{{.ENV_PATH}}', CHECKOUT: '{{.CHECKOUT_PATH}}'}
  handover:
    desc: Enable GitOps, transfer infrastructure ownership to OKE and stop original Kind
    cmds:
      - task: verify:tools
      - task: verify:privacy
      - task: bootstrap:handover
        vars: {ENV_DIR: '{{.ENV_PATH}}', CHECKOUT: '{{.CHECKOUT_PATH}}'}
  qualify:
    desc: Qualify ingest, media reads and availability during one worker drain
    preconditions:
      - sh: test -s '{{.ENV_PATH}}/tamoss-release.yaml'
        msg: Selected environment has no TAMOSS release record
    cmds:
      - task: verify:tools
      - task: verify:privacy
      - task: bootstrap:qualify
        vars: {ENV_DIR: '{{.ENV_PATH}}', CHECKOUT: '{{.CHECKOUT_PATH}}'}
  down:
    desc: Remove hardware and retire secrets, returning GitOps ownership when needed
    preconditions:
      - sh: test -f '{{.ENV_DIR}}/management.kubeconfig'
        msg: No selected management kubeconfig; no deletion attempted
    cmds:
      - task: verify:tools
      - task: bootstrap:down
        vars: {ENV_DIR: '{{.ENV_PATH}}', CHECKOUT: '{{.CHECKOUT_PATH}}'}
