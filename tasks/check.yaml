version: '3'
set: [errexit, nounset, pipefail]
vars:
  CACHE: '{{.ROOT_DIR}}/.local/tmp/check'
  ARTIFACT_JSON:
    sh: 'yq -o=json -I=0 ".artifacts" {{.ROOT_DIR}}/dependencies.yaml'
  ARTIFACTS:
    ref: .ARTIFACT_JSON | fromJson
tasks:
  tools:
    preconditions:
      - sh: test "$(command -v task)" = '{{.TOOL_ROOT}}/bin/task'
        msg: 'Add Aqua shims to PATH: export PATH="$(aqua root-dir)/bin:$PATH"'
    cmds:
      - for: [kind, kubectl, helm, helmfile, crossplane, yq, chainsaw, vegeta, hurl, flux]
        cmd: 'test "$(command -v {{.ITEM}})" = "{{.TOOL_ROOT}}/bin/{{.ITEM}}"'
  privacy:
    cmds:
      - test ! -d scripts
      - git ls-files --cached --others --exclude-standard -z -- '*.py' '*.sh' | wc -c | xargs test 0 -eq
      - git ls-files -z -- AGENTS.md CLAUDE.md .local | wc -c | xargs test 0 -eq
      - git check-ignore -q AGENTS.md
      - git check-ignore -q .local/AGENTS.md
  artifacts:
    cmds:
      - mkdir -p -m 700 '{{.CACHE}}'
      # Regenerate the schema set so an earlier release cannot override its CRDs.
      - rm -rf '{{.CACHE}}/schemas'
      - for: {var: ARTIFACTS}
        task: artifact
        vars: {URL: '{{.ITEM.url}}', TARGET: '{{.ITEM.path}}', SHA: '{{.ITEM.sha256}}'}
  artifact:
    status:
      - echo '{{.SHA}}  {{.CACHE}}/{{.TARGET}}' | sha256sum --check --status
    cmds:
      - curl --fail --location --silent --show-error --max-time 60 --max-filesize 16777216 --create-dirs --output '{{.CACHE}}/{{.TARGET}}.download' '{{.URL}}'
      - echo '{{.SHA}}  {{.CACHE}}/{{.TARGET}}.download' | sha256sum --check --status
      - mv '{{.CACHE}}/{{.TARGET}}.download' '{{.CACHE}}/{{.TARGET}}'
  render:
    cmds:
      - task: :tamoss:media
      - task: :runtime:fixture
      - helm lint charts/packages charts/environment deploy/tamoss/database/chart charts/storage-check
      - helm template environment charts/environment > '{{.CACHE}}/environment-api.yaml'
      - 'yq ''select(.kind == "Composition")'' {{.CACHE}}/environment-api.yaml > {{.CACHE}}/composition.yaml'
      - helm template packages charts/packages --set services=true | yq 'select(.kind == "Function")' > '{{.CACHE}}/functions.yaml'
      - task: :application:calico
      - helm template calico-oci-policy '{{.CACHE}}/calico-chart' > '{{.CACHE}}/calico.yaml'
      - task: :tamoss:operator
      - cp '{{.CACHE}}/operator/rendered.yaml' '{{.CACHE}}/operator.yaml'
      - task: :tamoss:instance
        vars: {OUTPUT_DIR: '{{.CACHE}}/instance-base'}
      - cp '{{.CACHE}}/instance-base/rendered.yaml' '{{.CACHE}}/tamoss.yaml'
      - >-
        yq 'select(.kind == "Tamoss") | .spec as $s |
        {"apiVersion": "v1", "kind": "List", "items": ["api", "worker", "ui", "console"] | map(
        {"apiVersion": "v1", "kind": "Pod", "metadata": {"name": ("ha-admission-" + .), "namespace": "tams",
        "labels": ({"app.kubernetes.io/instance": "tamoss"} * $s[.].podLabels)},
        "spec": {"affinity": $s[.].affinity, "containers": [{"name": "check",
        "image": load("{{.ROOT_DIR}}/deploy/tamoss/database/chart/values.yaml").image}]}})}'
        '{{.CACHE}}/tamoss.yaml' > '{{.CACHE}}/ha-pods.yaml'
      - kubectl kustomize deploy/tamoss/ingest > '{{.CACHE}}/ingest.yaml'
      - TAMOSS_ENV_DIR='{{.ROOT_DIR}}/.local/tmp/check/runtime' helmfile -f deploy/tamoss/platform/helmfile.yaml.gotmpl --state-values-file '{{.ROOT_DIR}}/deploy/runtime/values.yaml.gotmpl' template > '{{.CACHE}}/platform.yaml'
      - TAMOSS_ENV_DIR='{{.ROOT_DIR}}/.local/tmp/check/runtime' helmfile -f deploy/tamoss/database/helmfile.yaml.gotmpl --state-values-file '{{.ROOT_DIR}}/deploy/runtime/values.yaml.gotmpl' template > '{{.CACHE}}/database.yaml'
      - TAMOSS_ENV_DIR='{{.ROOT_DIR}}/.local/tmp/check/runtime' helmfile -f deploy/storage-check/helmfile.yaml.gotmpl --state-values-file '{{.ROOT_DIR}}/tests/storage-values.yaml' template > '{{.CACHE}}/storage-check.yaml'
      - >-
        yq eval-all -e '[.. | select(tag == "!!map") | select(has("image")) | .image |
        select(tag == "!!str") | select(test("^[^/]*[.:][^/]*/") | not)] | length == 0'
        '{{.CACHE}}/calico.yaml' '{{.CACHE}}/platform.yaml' '{{.CACHE}}/operator.yaml' '{{.CACHE}}/database.yaml'
      - for: [calico, platform, operator]
        cmd: 'yq ''select(.kind == "CustomResourceDefinition")'' {{.CACHE}}/{{.ITEM}}.yaml > {{.CACHE}}/schemas/{{.ITEM}}.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --crossplane-image={{.CORE}} > {{.CACHE}}/initial.yaml'
      - 'yq ''select(.metadata.annotations."crossplane.io/composition-resource-name" != null) | .status = {"conditions": [{"type": "Ready", "status": "True"}], "atProvider": {"id": ("ocid1.test.oc1.." + .metadata.annotations."crossplane.io/composition-resource-name")}}'' {{.CACHE}}/initial.yaml > {{.CACHE}}/observed.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --observed-resources={{.CACHE}}/observed.yaml --crossplane-image={{.CORE}} > {{.CACHE}}/partial.yaml'
      - 'yq ''select(.kind == "Cluster") | del(.metadata.ownerReferences) | .metadata.annotations."crossplane.io/paused" = "true"'' {{.CACHE}}/partial.yaml > {{.CACHE}}/cluster-reference.yaml'
      - 'yq ''select(.metadata.annotations."crossplane.io/composition-resource-name" != null) | .status.conditions = [{"type": "Ready", "status": "True"}]'' {{.CACHE}}/partial.yaml > {{.CACHE}}/observed.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --observed-resources={{.CACHE}}/observed.yaml --crossplane-image={{.CORE}} > {{.CACHE}}/ready.yaml'
      - 'yq ''del(.status)'' {{.CACHE}}/observed.yaml > {{.CACHE}}/recovering-observed.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --observed-resources={{.CACHE}}/recovering-observed.yaml --crossplane-image={{.CORE}} > {{.CACHE}}/recovering.yaml'
      - for: [calico, platform, operator, database, tamoss, ingest, storage-check, initial, partial, ready, recovering]
        cmd: 'crossplane resource validate {{.CACHE}}/schemas,charts/environment/definition.yaml {{.CACHE}}/{{.ITEM}}.yaml --crossplane-image={{.CORE}} --cache-dir={{.CACHE}}/crossplane --error-on-missing-schemas --skip-success-results'
      - for: [initial, partial, ready, platform, operator, tamoss]
        cmd: 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/{{.ITEM}}.yaml > {{.CACHE}}/{{.ITEM}}-list.yaml'
      - 'yq -r ''select(.kind == "Usage") | [.spec.of.resourceRef.name, .spec.by.resourceRef.name] | @tsv'' {{.CACHE}}/partial.yaml | tsort > {{.CACHE}}/deletion-order.txt'
      - 'yq ''select(.kind != "TamossEnvironment") | del(.status)'' {{.CACHE}}/partial.yaml > {{.CACHE}}/expected-recovery.yaml'
      - 'yq ''select(.kind != "TamossEnvironment") | del(.status)'' {{.CACHE}}/recovering.yaml > {{.CACHE}}/actual-recovery.yaml'
      - diff -u '{{.CACHE}}/expected-recovery.yaml' '{{.CACHE}}/actual-recovery.yaml'
      - 'yq ''with(select(.metadata.annotations."crossplane.io/composition-resource-name" == "service"); del(.status))'' {{.CACHE}}/observed.yaml > {{.CACHE}}/service-recovering-observed.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --observed-resources={{.CACHE}}/service-recovering-observed.yaml --crossplane-image={{.CORE}} > {{.CACHE}}/service-recovering.yaml'
      - 'yq ''select(.kind != "TamossEnvironment") | del(.status)'' {{.CACHE}}/service-recovering.yaml > {{.CACHE}}/service-recovering-resources.yaml'
      - diff -u '{{.CACHE}}/expected-recovery.yaml' '{{.CACHE}}/service-recovering-resources.yaml'
      - 'yq ''with(select(.kind == "PsqlDbSystem"); .status.atProvider.id = "ocid1.postgresqldbsystem.oc1.eu-frankfurt-1.fixture")'' {{.CACHE}}/observed.yaml > {{.CACHE}}/database-created-observed.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --observed-resources={{.CACHE}}/database-created-observed.yaml --crossplane-image={{.CORE}} > {{.CACHE}}/database-created.yaml'
      - 'yq ''with(select(.kind == "PsqlDbSystem"); .metadata.annotations."crossplane.io/external-name" = .status.atProvider.id | del(.status))'' {{.CACHE}}/database-created-observed.yaml > {{.CACHE}}/database-binding-recovering-observed.yaml'
      - 'crossplane composition render environments/example/environment.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --observed-resources={{.CACHE}}/database-binding-recovering-observed.yaml --crossplane-image={{.CORE}} > {{.CACHE}}/database-binding-recovering.yaml'
      - for: [database-created, database-binding-recovering]
        cmd: 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/{{.ITEM}}.yaml > {{.CACHE}}/{{.ITEM}}-list.yaml'
      - chainsaw test --no-cluster --test-dir tests/render --report-format JUNIT-TEST --report-path .local/reports --report-name render
      - task: handover
      - task --taskfile tests/bootstrap/Taskfile.yaml render ROOT='{{.ROOT_DIR}}'
      - task: secrets
      - task: connection-details
      - task: gitops
      - task: tadoss
      - for: [open-api, overlap, outside-vcn, service-overlap, zero-budget, catalogue-shape, unsupported-oke, duplicate-placement, name-length]
        cmd: kubectl kustomize tests/invalid/{{.ITEM}} > '{{.CACHE}}/rejected-{{.ITEM}}.yaml'
      - chainsaw test --no-cluster --set-string crossplaneImage={{.CORE}} --test-dir tests/invalid --report-format JUNIT-TEST --report-path .local/reports --report-name invalid-inputs
  handover:
    cmds:
      - kubectl kustomize tests/handover | yq 'select(.kind == "TamossEnvironment")' > '{{.CACHE}}/adoption.yaml'
      - 'yq ''.metadata.annotations."crossplane.io/paused" = "true"'' {{.CACHE}}/adoption.yaml > {{.CACHE}}/adoption-admission.yaml'
      - crossplane resource validate charts/environment/definition.yaml '{{.CACHE}}/adoption.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas
      - 'crossplane composition render {{.CACHE}}/adoption.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --crossplane-image={{.CORE}} > {{.CACHE}}/adoption-render.yaml'
      - 'yq ''select(.kind != "TamossEnvironment")'' {{.CACHE}}/adoption-render.yaml > {{.CACHE}}/adoption-observed.yaml'
      - 'yq ''.spec.managementPolicies = ["Observe", "Delete"]'' {{.CACHE}}/adoption.yaml > {{.CACHE}}/adoption-return.yaml'
      - 'crossplane composition render {{.CACHE}}/adoption-return.yaml {{.CACHE}}/composition.yaml {{.CACHE}}/functions.yaml --include-full-xr --crossplane-image={{.CORE}} > {{.CACHE}}/adoption-return-render.yaml'
      - 'yq ''del(.spec.adoption.externalNames.vcn)'' {{.CACHE}}/adoption.yaml > {{.CACHE}}/adoption-missing.yaml'
      - 'yq ''.spec.adoption.deploymentId = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"'' {{.CACHE}}/adoption.yaml > {{.CACHE}}/adoption-wrong-identity.yaml'
      - 'yq ''.spec.adoption.externalNames.bucket = "n/REPLACE/b/unrelated-media"'' {{.CACHE}}/adoption.yaml > {{.CACHE}}/adoption-wrong-bucket.yaml'
      - 'yq ''select(.kind != "TamossEnvironment") | with(select(.kind == "Vcn"); .metadata.annotations."crossplane.io/external-name" = "ocid1.test.oc1..unrelated")'' {{.CACHE}}/adoption-render.yaml > {{.CACHE}}/adoption-conflict.yaml'
      - 'yq ''select(.kind != "TamossEnvironment") | with(select(.kind == "Vcn"); .spec.forProvider.freeformTags."tamoss-composite-uid" = "22222222-2222-4222-8222-222222222222")'' {{.CACHE}}/adoption-render.yaml > {{.CACHE}}/adoption-wrong-owner.yaml'
      - helm template oci-services charts/packages --set services=true --set okeWorkloadIdentity.region=eu-frankfurt-1 > '{{.CACHE}}/workload-identity.yaml'
      - for: [adoption-render, adoption-return-render, workload-identity]
        cmd: 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/{{.ITEM}}.yaml > {{.CACHE}}/{{.ITEM}}-list.yaml'
      - mkdir -p '{{.CACHE}}/transfer'
      - >-
        yq eval-all -o=json '[select(.spec.forProvider != null) |
        .metadata.annotations."crossplane.io/paused" = "true" |
        .status = {"conditions": [{"type": "Synced", "status": "False", "reason": "ReconcilePaused"},
        {"type": "AsyncOperation", "status": "True"}], "atProvider": {
        "id": .metadata.annotations."crossplane.io/external-name", "freeformTags": .spec.forProvider.freeformTags}}] |
        {"apiVersion": "v1", "kind": "TransferInventory", "resources": .}' '{{.CACHE}}/adoption-render.yaml'
        > '{{.CACHE}}/transfer/remote-resources.json'
      - cp '{{.CACHE}}/transfer/remote-resources.json' '{{.CACHE}}/transfer/management-resources.json'
      - 'yq ''.resources[0].status.conditions[1].status = "False"'' {{.CACHE}}/transfer/management-resources.json > {{.CACHE}}/transfer/ongoing.yaml'
      - 'yq ''.resources[0].spec.managementPolicies = ["*"]'' {{.CACHE}}/transfer/management-resources.json > {{.CACHE}}/transfer/writer.yaml'
      - 'yq ''del(.resources[0])'' {{.CACHE}}/transfer/management-resources.json > {{.CACHE}}/transfer/incomplete.yaml'
      - chainsaw test --no-cluster --set-string root='{{.ROOT_DIR}}' --set-string crossplaneImage={{.CORE}} --test-dir tests/handover --report-format JUNIT-TEST --report-path .local/reports --report-name handover
  secrets:
    cmds:
      - helm lint charts/runtime-access -f tests/secrets/access-values.yaml
      - helm template access charts/runtime-access -n tamoss-infra -f tests/secrets/access-values.yaml > '{{.CACHE}}/runtime-access.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/runtime-access.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/runtime-access.yaml > {{.CACHE}}/runtime-access-list.yaml'
      - helm lint charts/secret-foundation
      - helm lint charts/secrets -f tests/secrets/values.yaml
      - helm template foundation charts/secret-foundation > '{{.CACHE}}/foundation-api.yaml'
      - 'yq ''del(.metadata.uid) | .metadata.annotations."crossplane.io/paused" = "true"'' tests/secrets/foundation.yaml > {{.CACHE}}/foundation-admission.yaml'
      - 'yq ''select(.kind == "Composition")'' {{.CACHE}}/foundation-api.yaml > {{.CACHE}}/foundation-composition.yaml'
      - crossplane composition render tests/secrets/foundation.yaml '{{.CACHE}}/foundation-composition.yaml' '{{.CACHE}}/functions.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.CACHE}}/foundation-initial.yaml'
      - 'yq ''select(.kind == "Vault") | .status.atProvider = {"id": "ocid1.vault.oc1..example", "managementEndpoint": "https://example-management.kms.eu-frankfurt-1.oraclecloud.com"}'' {{.CACHE}}/foundation-initial.yaml > {{.CACHE}}/foundation-observed.yaml'
      - crossplane composition render tests/secrets/foundation.yaml '{{.CACHE}}/foundation-composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.CACHE}}/foundation-observed.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.CACHE}}/foundation-ready.yaml'
      - 'yq ''select(.kind == "Vault" or .kind == "Key") | del(.status)'' {{.CACHE}}/foundation-ready.yaml > {{.CACHE}}/foundation-recovering-observed.yaml'
      - crossplane composition render tests/secrets/foundation.yaml '{{.CACHE}}/foundation-composition.yaml' '{{.CACHE}}/functions.yaml' --observed-resources='{{.CACHE}}/foundation-recovering-observed.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.CACHE}}/foundation-recovering.yaml'
      - for: [ready, recovering]
        cmd: 'yq ''select(.kind == "Vault" or .kind == "Key") | del(.status)'' {{.CACHE}}/foundation-{{.ITEM}}.yaml > {{.CACHE}}/foundation-{{.ITEM}}-resources.yaml'
      - diff -u '{{.CACHE}}/foundation-ready-resources.yaml' '{{.CACHE}}/foundation-recovering-resources.yaml'
      - 'yq ''. * load("tests/secrets/foundation-adoption.yaml")'' tests/secrets/foundation.yaml > {{.CACHE}}/foundation-adoption.yaml'
      - 'yq ''del(.metadata.uid) | .metadata.annotations."crossplane.io/paused" = "true"'' {{.CACHE}}/foundation-adoption.yaml > {{.CACHE}}/foundation-adoption-admission.yaml'
      - crossplane composition render '{{.CACHE}}/foundation-adoption.yaml' '{{.CACHE}}/foundation-composition.yaml' '{{.CACHE}}/functions.yaml' --include-full-xr --crossplane-image={{.CORE}} > '{{.CACHE}}/foundation-adoption-render.yaml'
      - 'yq eval-all -e ''[select(.kind == "Vault" or .kind == "Key") | .spec.managementPolicies | join(",")] | join(",") == "Observe,Observe"'' {{.CACHE}}/foundation-adoption-render.yaml'
      - 'yq -e ''select(.kind == "Key") | .metadata.annotations."crossplane.io/external-name" == load("tests/secrets/foundation-adoption.yaml").spec.adoption.keyExternalName'' {{.CACHE}}/foundation-adoption-render.yaml'
      - helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml > '{{.CACHE}}/secrets.yaml'
      - helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml -f tests/secrets/runtime-values.yaml > '{{.CACHE}}/secrets-runtime.yaml'
      - helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml -f deploy/secrets/bootstrap-values.yaml --set initialise=true > '{{.CACHE}}/secrets-bootstrap.yaml'
      - helm template secrets charts/secrets -n tamoss-infra -f tests/secrets/values.yaml -f deploy/secrets/bootstrap-values.yaml --set initialise=false > '{{.CACHE}}/secrets-established.yaml'
      - 'yq eval-all -e ''[select(.kind == "PushSecret" or .kind == "Password")] | length == 0'' {{.CACHE}}/secrets-established.yaml'
      - 'yq eval-all -e ''[select(.kind == "ExternalSecret")] | length == 11'' {{.CACHE}}/secrets-established.yaml'
      - >-
        yq '.metadata.namespace = "secret-check" |
        with(select(.kind == "SecretStore"); .spec.provider = load("tests/secret-persistence/provider.yaml")) |
        with(select(.kind == "PushSecret" and .metadata.name == "database-admin"); .spec.data[0].match.remoteRef.property = "password") |
        with(select(.kind == "ExternalSecret" and .metadata.name == "database-admin"); .spec.data[0].remoteRef.property = "password")'
        '{{.CACHE}}/secrets.yaml' > '{{.CACHE}}/secrets-persistence.yaml'
      - for: [secrets, secrets-runtime, secrets-bootstrap, secrets-established, foundation-initial, foundation-ready, foundation-recovering]
        cmd: crossplane resource validate '{{.CACHE}}/schemas,charts/secret-foundation/definition.yaml' '{{.CACHE}}/{{.ITEM}}.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - for: [secrets, secrets-runtime, foundation-ready]
        cmd: 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/{{.ITEM}}.yaml > {{.CACHE}}/{{.ITEM}}-list.yaml'
      - chainsaw test --no-cluster --test-dir tests/secrets --report-format JUNIT-TEST --report-path .local/reports --report-name secrets
      - mkdir -p '{{.CACHE}}/secret-retirement'
      - cp tests/secrets/values.yaml '{{.CACHE}}/secret-retirement/secret-store.yaml'
      - TAMOSS_ENV_DIR='{{.CACHE}}/secret-retirement' helmfile -f deploy/secrets/retirement-helmfile.yaml.gotmpl template > '{{.CACHE}}/secret-retirement.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/secret-retirement.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - >-
        yq '.metadata.namespace = "secret-retirement-check" | del(.metadata.annotations) |
        .spec.template.spec.initContainers[0].image = .spec.template.spec.containers[0].image |
        .spec.template.spec.initContainers[0].command = ["cp"] |
        .spec.template.spec.initContainers[0].args = ["/fixture/secrets.json", "/work/secrets.json"] |
        .spec.template.spec.initContainers[0].env = [] |
        .spec.template.spec.initContainers[0].volumeMounts += [{"name": "fixture", "mountPath": "/fixture", "readOnly": true}] |
        .spec.template.spec.volumes += [{"name": "fixture", "configMap": {"name": "secret-inventory"}}]'
        '{{.CACHE}}/secret-retirement.yaml' > '{{.CACHE}}/secret-retirement-fixture.yaml'
      - 'yq ''.metadata.name = "retirement-timeout" | .spec.activeDeadlineSeconds = 30'' {{.CACHE}}/secret-retirement-fixture.yaml > {{.CACHE}}/secret-retirement-timeout.yaml'
      - 'yq ''.metadata.name = "retirement-fetch-failed" | .spec.backoffLimit = 0 | .spec.template.spec.initContainers[0].command = ["false"] | .spec.template.spec.initContainers[0].args = []'' {{.CACHE}}/secret-retirement-fixture.yaml > {{.CACHE}}/secret-retirement-fetch-failed.yaml'
  connection-details:
    cmds:
      - >-
        yq -n '{"databaseId": "ocid1.postgresqldbsystem.oc1.eu-frankfurt-1.example", "region": "eu-frankfurt-1",
        "images": {"oci": load("deploy/oci/compose.yaml").services.oci.image,
        "yq": load("dependencies.yaml").connectionDetails.yqImage,
        "kubectl": load("dependencies.yaml").connectionDetails.kubectlImage}}'
        > '{{.CACHE}}/connection-values.yaml'
      - helm lint charts/database-connection -f '{{.CACHE}}/connection-values.yaml'
      - helm template connection charts/database-connection -n database-connection-check -f '{{.CACHE}}/connection-values.yaml' > '{{.CACHE}}/database-connection.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/database-connection.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/database-connection.yaml > {{.CACHE}}/database-connection-list.yaml'
      - >-
        yq 'with(select(.kind == "Job"); .metadata.name = "connection-success" |
        .spec.backoffLimit = 0 | .spec.activeDeadlineSeconds = 60 |
        .spec.template.spec.initContainers[0].command = ["cp"] |
        .spec.template.spec.initContainers[0].args = ["/fixture/connection.json", "/work/connection.json"] |
        .spec.template.spec.initContainers[0].volumeMounts += [{"name": "fixture", "mountPath": "/fixture", "readOnly": true}] |
        .spec.template.spec.volumes += [{"name": "fixture", "configMap": {"name": "connection-fixture"}}])'
        '{{.CACHE}}/database-connection.yaml' > '{{.CACHE}}/database-connection-fixture.yaml'
      - for: [stale, invalid]
        cmd: 'yq ''select(.kind == "Job") | .metadata.name = "connection-{{.ITEM}}"'' {{.CACHE}}/database-connection-fixture.yaml > {{.CACHE}}/database-connection-{{.ITEM}}.yaml'
      - 'yq ''select(.kind == "Job") | .metadata.name = "connection-failed" | .spec.template.spec.initContainers[0].command = ["false"] | .spec.template.spec.initContainers[0].args = []'' {{.CACHE}}/database-connection-fixture.yaml > {{.CACHE}}/database-connection-failed.yaml'
  database:
    env:
      TEST_DB_IMAGE:
        sh: 'yq -r .image deploy/tamoss/database/chart/values.yaml'
    cmds:
      - defer: docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml down --volumes
      - docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml up --wait --wait-timeout 45 database
      - docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml run --rm initialise
      - docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml run --rm initialise
      - docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml run --rm initialise-tadoss
      - docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml run --rm initialise-tadoss
      - docker compose --project-name tamoss-cp-sql-check -f tests/database/compose.yaml run --rm verify
  gitops:
    vars:
      KEY: {sh: 'yq -r .releaseSha256 {{.ROOT_DIR}}/deploy/tamoss/release.yaml'}
      ASSETS: '{{.ROOT_DIR}}/.local/tmp/tamoss/{{.KEY}}'
      CHART: '{{.ROOT_DIR}}/charts/gitops'
      FLUX_VERSION: {sh: 'yq -e -r ''.packages[].name | select(test("^fluxcd/flux2@")) | split("@")[1]'' {{.ROOT_DIR}}/aqua.yaml'}
    cmds:
      - task: :gitops:pins
        vars: {RELEASE_LOCK: '{{.ROOT_DIR}}/deploy/tamoss/release.yaml', OUTPUT: '{{.CACHE}}/gitops-pins.yaml'}
      - helm lint '{{.CHART}}' -f '{{.ASSETS}}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{.CACHE}}/gitops-pins.yaml'
      - helm template tamoss-gitops '{{.CHART}}' -n flux-system -f '{{.ASSETS}}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{.CACHE}}/gitops-pins.yaml' > '{{.CACHE}}/gitops-render.yaml'
      - 'yq ''select(.kind == "HelmRelease" and .metadata.name == "tamoss-platform-config") | .spec.values'' {{.CACHE}}/gitops-render.yaml > {{.CACHE}}/gitops-platform-config-values.yaml'
      - helm template tamoss-platform-config '{{.ASSETS}}/source/deploy/platform/charts/config' -n tamoss-platform -f '{{.CACHE}}/gitops-platform-config-values.yaml' > '{{.CACHE}}/gitops-platform-config.yaml'
      - mkdir -p '{{.CACHE}}/gitops-defaults/upstream'
      - cp deploy/gitops/platform-defaults/kustomization.yaml '{{.CACHE}}/gitops-defaults/'
      - cp '{{.ASSETS}}/source/deploy/platform/values/defaults.yaml' '{{.CACHE}}/gitops-defaults/upstream/'
      - kubectl kustomize '{{.CACHE}}/gitops-defaults' > '{{.CACHE}}/gitops-defaults.yaml'
      - 'yq -e ''.data."values.yaml" == load_str("{{.ASSETS}}/source/deploy/platform/values/defaults.yaml")'' {{.CACHE}}/gitops-defaults.yaml > /dev/null'
      - flux install --version={{.FLUX_VERSION}} --export > '{{.CACHE}}/flux-install.yaml'
      - 'yq ''select(.kind == "CustomResourceDefinition")'' {{.CACHE}}/flux-install.yaml > {{.CACHE}}/schemas/flux.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/gitops-render.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/gitops-render.yaml > {{.CACHE}}/gitops-list.yaml'
      - >-
        yq -n '{"apiVersion": "source.toolkit.fluxcd.io/v1", "kind": "GitRepository",
        "metadata": {"name": "tamoss-upstream", "namespace": "flux-check"},
        "spec": {"interval": "1m", "url": "https://github.com/livewyer-ops/tamoss",
        "ref": {"commit": load("{{.ASSETS}}/release.json").sourceCommit}}}' > '{{.CACHE}}/gitops-adoption-source.yaml'
      - 'yq ''.metadata.name = "health-only" | .spec.ignore = "/*\n!/README.md\n"'' {{.CACHE}}/gitops-adoption-source.yaml > {{.CACHE}}/gitops-adoption-health-source.yaml'
      - 'yq ''select(.kind == "Kustomization" and .metadata.name == "tamoss-operator")'' {{.CACHE}}/gitops-render.yaml > {{.CACHE}}/gitops-operator-flux.yaml'
      - flux build kustomization tamoss-operator -n auth --dry-run --in-memory-build --path '{{.ROOT_DIR}}/.local/tmp/tamoss-bundle' --kustomization-file '{{.CACHE}}/gitops-operator-flux.yaml' > '{{.CACHE}}/gitops-operator.yaml'
      - 'yq eval-all -e ''[select(.kind == "Namespace")] | length == 0'' {{.CACHE}}/gitops-operator.yaml > /dev/null'
      - mkdir -p '{{.CACHE}}/gitops-instance/upstream'
      - cp deploy/tamoss/instance/kustomization.yaml deploy/tamoss/instance/patch.yaml deploy/tamoss/instance/storage.yaml '{{.CACHE}}/gitops-instance/'
      - cp -a '{{.ASSETS}}/source/deploy' '{{.CACHE}}/gitops-instance/upstream/'
      - >-
        yq 'select(.kind == "Kustomization" and .metadata.name == "tamoss") |
        .spec.postBuild.substitute = {"DATABASE_HOST": "fixture.postgresql.oci.oraclecloud.com"}'
        '{{.CACHE}}/gitops-render.yaml' > '{{.CACHE}}/gitops-instance-flux.yaml'
      - flux build kustomization tamoss -n auth --dry-run --in-memory-build --strict-substitute --path '{{.CACHE}}/gitops-instance' --kustomization-file '{{.CACHE}}/gitops-instance-flux.yaml' > '{{.CACHE}}/gitops-instance.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/gitops-instance.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - 'yq ''select(.kind == "Tamoss")'' {{.CACHE}}/gitops-instance.yaml > {{.CACHE}}/gitops-tamoss.yaml'
      - 'yq -e ''[.spec.version == load("deploy/tamoss/release.yaml").tag, .spec.backends.db.external.host == "fixture.postgresql.oci.oraclecloud.com", .spec.ingest.sources[0].s3.pathStyle == true] | all'' {{.CACHE}}/gitops-tamoss.yaml'
      - 'yq ''.packages.providerVersion = "v0.0.0" | .packages.okeWorkloadIdentity.region = "eu-frankfurt-1"'' {{.CACHE}}/gitops-pins.yaml > {{.CACHE}}/management-return-values.yaml'
      - TAMOSS_GITOPS_VALUES='{{.CACHE}}/management-return-values.yaml' helmfile -f deploy/management/helmfile.yaml.gotmpl -l stage=services template > '{{.CACHE}}/management-return-render.yaml'
      - >-
        yq eval-all -e '[select(.kind == "Provider") | select(.spec.runtimeConfigRef == null) |
        select(.spec.package | test(":v0.0.0$"))] | length == 4'
        '{{.CACHE}}/management-return-render.yaml' > /dev/null
      - rm -rf '{{.CACHE}}/gitops-export-test' '{{.CACHE}}/gitops-export-test-publication'
      - chainsaw test --no-cluster --test-dir tests/gitops --set-string root='{{.ROOT_DIR}}' --set-string directory='{{.CACHE}}/gitops-export-test' --report-format JUNIT-TEST --report-path .local/reports --report-name gitops
  tadoss:
    vars:
      KEY: {sh: 'yq -r .releaseSha256 {{.ROOT_DIR}}/deploy/tamoss/release.yaml'}
      ASSETS: '{{.ROOT_DIR}}/.local/tmp/tamoss/{{.KEY}}'
    cmds:
      - hurlfmt --check tests/http/tadoss.hurl tests/http/tadoss-persistence.hurl
      - task: :gitops:pins
        vars: {RELEASE_LOCK: '{{.ROOT_DIR}}/deploy/tamoss/release.yaml', OUTPUT: '{{.CACHE}}/gitops-pins.yaml'}
      - helm template tamoss-gitops charts/gitops -n flux-system -f '{{.ASSETS}}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{.CACHE}}/gitops-pins.yaml' -f tests/tadoss/values.yaml > '{{.CACHE}}/tadoss-gitops.yaml'
      - helm template tamoss-gitops charts/gitops -n flux-system -f '{{.ASSETS}}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{.CACHE}}/gitops-pins.yaml' -f tests/tadoss/values.yaml --set tadoss.enabled=false > '{{.CACHE}}/tadoss-disabled.yaml'
      - 'yq ''select(.kind == "CustomResourceDefinition")'' {{.CACHE}}/tadoss-operator.yaml > {{.CACHE}}/schemas/tadoss.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/tadoss-gitops.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - for: [operator, credentials, instance]
        task: tadoss-build
        vars: {COMPONENT: '{{.ITEM}}'}
      - 'yq ''with(select(.kind == "Deployment"); .spec.replicas = 1 | del(.spec.template.spec.affinity))'' {{.CACHE}}/tadoss-operator-render.yaml > {{.CACHE}}/tadoss-operator-management.yaml'
      - 'yq ''select(.kind == "HelmRelease" and .metadata.name == "tadoss-config") | .spec.values | .host = "fixture.postgresql.oci.oraclecloud.com" | .caBase64 = "Zml4dHVyZQ=="'' {{.CACHE}}/tadoss-gitops.yaml > {{.CACHE}}/tadoss-config-values.yaml'
      - helm lint deploy/tadoss/config -f '{{.CACHE}}/tadoss-config-values.yaml'
      - helm template tadoss-config deploy/tadoss/config -n auth -f '{{.CACHE}}/tadoss-config-values.yaml' > '{{.CACHE}}/tadoss-config.yaml'
      - 'yq ''select(.kind == "ConfigMap" and .metadata.name == "tadoss-authentik-blueprint") | .metadata.namespace = "authentik-startup"'' {{.CACHE}}/tadoss-config.yaml > {{.CACHE}}/tadoss-startup-blueprint.yaml'
      - 'yq ''select(.kind == "HelmRelease" and .metadata.name == "authentik") | .spec.values'' {{.CACHE}}/tadoss-gitops.yaml > {{.CACHE}}/tadoss-authentik-values.yaml'
      - helm template authentik authentik --repo https://charts.goauthentik.io --version $(yq -r .dependencies.platform.authentik.chartVersion '{{.CACHE}}/gitops-pins.yaml') -n auth -f '{{.CACHE}}/tadoss-authentik-values.yaml' > '{{.CACHE}}/tadoss-authentik.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/tadoss-authentik.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
      - 'yq ''select(.kind == "HelmRelease") | .spec.values'' {{.CACHE}}/tadoss-credentials-render.yaml > {{.CACHE}}/tadoss-secrets-values.yaml'
      - helm template tadoss-secrets charts/secrets -n tads -f '{{.CACHE}}/tadoss-secrets-values.yaml' > '{{.CACHE}}/tadoss-secrets.yaml'
      - for: [tadoss-gitops, tadoss-instance-render, tadoss-secrets, tadoss-config]
        cmd: 'yq eval-all ''[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}'' {{.CACHE}}/{{.ITEM}}.yaml > {{.CACHE}}/{{.ITEM}}-list.yaml'
      - chainsaw test --no-cluster --test-dir tests/tadoss --report-format JUNIT-TEST --report-path .local/reports --report-name tadoss
  tadoss-build:
    requires: {vars: [COMPONENT]}
    vars:
      NAME: 'tadoss{{if ne .COMPONENT "instance"}}-{{.COMPONENT}}{{end}}'
      BUILD_PATH: '{{if eq .COMPONENT "operator"}}{{.ROOT_DIR}}/.local/tmp/tadoss-bundle{{else}}{{.ROOT_DIR}}/deploy/tadoss/{{.COMPONENT}}{{end}}'
    cmds:
      - >-
        yq 'select(.kind == "Kustomization" and .metadata.name == "{{.NAME}}") |
        .spec.postBuild.substitute.DATABASE_HOST = "fixture.postgresql.oci.oraclecloud.com"'
        '{{.CACHE}}/tadoss-gitops.yaml' > '{{.CACHE}}/tadoss-{{.COMPONENT}}-flux.yaml'
      - flux build kustomization '{{.NAME}}' -n auth --dry-run --in-memory-build --strict-substitute --path '{{.BUILD_PATH}}' --kustomization-file '{{.CACHE}}/tadoss-{{.COMPONENT}}-flux.yaml' > '{{.CACHE}}/tadoss-{{.COMPONENT}}-render.yaml'
      - crossplane resource validate '{{.CACHE}}/schemas' '{{.CACHE}}/tadoss-{{.COMPONENT}}-render.yaml' --crossplane-image={{.CORE}} --cache-dir='{{.CACHE}}/crossplane' --error-on-missing-schemas --skip-success-results
  contracts:
    cmds:
      - chainsaw test --no-cluster --test-dir tests/contracts --report-format JUNIT-TEST --report-path .local/reports --report-name contracts
