min_version = "2026.11.3"

[tools]
"aqua:kubernetes-sigs/kind" = "v0.33.0"
"aqua:kubernetes/kubectl" = "v1.37.1"
"aqua:helm/helm" = "v4.3.1"
"aqua:helmfile/helmfile" = "v1.8.2"
"aqua:crossplane/cli" = "v2.5.0"
"aqua:mikefarah/yq" = "v4.54.1"
"aqua:kyverno/chainsaw" = "v0.2.15"
"aqua:tsenart/vegeta" = "v12.13.0"
"aqua:Orange-OpenSource/hurl" = "8.0.1"
"aqua:fluxcd/flux2" = "v2.9.6"
"aqua:cli/cli" = "v2.103.3"
"uv" = "0.13.7"
"pypi:oci-cli" = { "version" = "{{ vars.OCI_VERSION }}", "python" = "3.12" }

[env]
OCI_CLI_CONFIG_FILE = '{{ env.OCI_CLI_CONFIG_FILE | default(value=env.HOME ~ "/.oci/config") }}'
OCI_CLI_PROFILE = '{{ env.OCI_CLI_PROFILE | default(value="DEFAULT") }}'

[task_config]
shell = "bash -euo pipefail -c"
includes = ["deploy/tadoss/tasks.toml", "deploy/tamoss/tasks.toml", "tasks/account.toml", "tasks/application.toml", "tasks/assets.toml", "tasks/retirement.toml", "tasks/bootstrap.toml", "tasks/check.toml", "tasks/cloud.toml", "tasks/environment.toml", "tasks/gitops.toml", "tasks/identity.toml", "tasks/lifecycle.toml", "tasks/management.toml", "tasks/qualification.toml", "tasks/runtime.toml", "tasks/setup.toml", "tasks/source.toml", "tasks/seed.toml", "tasks/storage.toml", "tests/account/tasks.toml", "tests/bootstrap/tasks.toml", "tests/contracts/install/tasks.toml", "tests/controller-state/tasks.toml", "tests/flux-bootstrap/tasks.toml", "tests/kind-restart/tasks.toml", "tests/lifecycle/tasks.toml", "tests/oke-bootstrap/tasks.toml", "tests/release/tasks.toml", "tests/setup/tasks.toml", "tests/source/tasks.toml", "tests/tadoss/tasks.toml", "tests/s3-credentials/tasks.toml", "tests/storage-identity/tasks.toml", "tests/sequences.toml", "tests/status.toml"]

[vars]
ROOT_DIR = "{{config_root}}"
PROJECT_ROOT = "{{config_root}}"
ROOT = "{{config_root}}"
ENV_DIR = '''{% if env.ENV_DIR | default(value="") %}{{ env.ENV_DIR | absolute }}{% else %}{{ config_root }}/.local/environment{% endif %}'''
ENV_PATH = "{{vars.ENV_DIR | absolute}}"
CORE = '''{% set dependencies = read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") %}{{ dependencies.crossplane.imageRepository }}:v{{ dependencies.crossplane.version }}'''
OCI = "oci --connection-timeout 10 --read-timeout 30 --max-retries 0"
OCI_VERSION = '''{% set dependencies = read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") %}{{ dependencies.oci.version }}'''

[tasks."setup"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Prepare private deployment settings and discover OCI values"
usage = '''
flag "--compartment-id <ocid>" help="OCID of the empty deployment compartment"
flag "--contact-email <email>" help="Operator contact address"
'''
depends = ["setup:initialise"]
run = [
  """COMPARTMENT="${usage_compartment_id:-}" CONTACT="${usage_contact_email:-}" yq -i 'with(select(strenv(COMPARTMENT) != ""); .compartmentId = strenv(COMPARTMENT)) | with(select(strenv(CONTACT) != ""); .contactEmail = strenv(CONTACT))' '{{ vars.ENV_DIR }}/values.yaml'""",
  { task = "setup:discover" },
  """yq -e '(.compartmentId // "") as $c | (.contactEmail // "") as $e | [($c | test("^ocid1[.]compartment[.]")), ($c | test("REPLACE") | not), ($e | test("@")), ($e | test("[.]invalid$") | not)] | all' '{{ vars.ENV_DIR }}/values.yaml' > /dev/null 2>&1 && echo 'Settings are ready in {{ vars.ENV_DIR }}/values.yaml. Review them, then run: mise run up' || echo 'Enter compartmentId and contactEmail in {{ vars.ENV_DIR }}/values.yaml, then run: mise run up'""",
]

[tasks."check"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Contributor: validate pinned artefacts, composition lifecycle and deployment configuration"
run = [
  "mise run verify:tools",
  "echo 'Running local checks; reports: .local/reports'",
  "mise run verify:privacy",
  "mkdir -p -m 700 '{{ vars.ROOT_DIR }}/.local/reports'",
  "mise run verify:artifacts",
  "mise run tamoss:fetch",
  "mise run tamoss:release",
  "mise run tamoss:bundle",
  "mise run tadoss:fetch",
  "mise run tadoss:bundle",
  "mise run source:verify",
  "mise run verify:render",
  "mise run verify:database",
  "mise run tamoss:tls",
  "mise run tadoss:tls",
  "mise run runtime:check",
  "mise run verify:contracts",
  "mise run tamoss:source-check",
  "chainsaw test --no-cluster --test-dir tests/release --set-string root='{{ vars.ROOT_DIR }}' --report-format JUNIT-TEST --report-path .local/reports --report-name release",
]

[tasks."check:management"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Contributor: run local checks and a disposable credential-free Kind bootstrap"
run = [
  "mise run check",
  "mise run management:check",
]

[tasks."up"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Create a fresh deployment and wait for public HTTPS"
run = [
  { task = "preflight" },
  { task = "bootstrap:install" },
  { task = "bootstrap:access" },
  { task = "management:stop-kind" },
]

[tasks."apply"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Apply changed deployment settings to OKE and wait for readiness"
run = [
  "mise run verify:tools",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run settings:update",
]

[tasks."handover"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Move the deployment settings to a private GitHub repository that Flux in OKE follows"
usage = '''
flag "--repository <owner/name>" required=#true help="Existing, empty, private GitHub repository"
'''
run = [
  "mise run verify:tools",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} REPOSITORY=\"${usage_repository}\" mise run environment:handover",
]

[tasks."qualify"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Contributor: qualify ingest, media reads, availability during one worker drain and enabled TADOSS"
run = [
  '''test -s '{{ vars.ENV_PATH }}/tamoss-release.yaml' || { printf '%s\n' "Selected environment has no TAMOSS release record" >&2; exit 1; }''',
  "mise run verify:tools",
  "mise run verify:privacy",
  "if yq -e '.tadoss.enabled == true' '{{ vars.ENV_PATH }}/settings.yaml' >/dev/null; then ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run tadoss:baseline; fi",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run bootstrap:qualify",
  "if yq -e '.tadoss.enabled == true' '{{ vars.ENV_PATH }}/settings.yaml' >/dev/null; then ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run tadoss:qualify; fi",
]

[tasks."down"]
hide = false
dir = "{{ vars.ROOT_DIR }}"
description = "Remove the application and OCI resources, then retire credentials"
run = [
  "mise run verify:tools",
  "ENV_DIR={{ ((vars.ENV_PATH)) | quote }} mise run bootstrap:down",
]
