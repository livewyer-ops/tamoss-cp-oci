{{- if .Values.s3 -}}
{{- if or (ne .Values.oracle.principalType "UserPrincipal") (eq .Values.s3.userId .Values.oracle.auth.user) -}}
{{- fail "S3 credentials require a separate storage user and the Kind provisioner" -}}
{{- end -}}
{{ if .Values.initialise }}
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-input
  namespace: {{ .Release.Namespace }}
  annotations:
    tamoss.livewyer.io/deployment-id: {{ .Values.deploymentId | quote }}
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [create]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [s3-input]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: s3-credentials}
subjects:
  - {kind: ServiceAccount, name: s3-credentials, namespace: {{ .Release.Namespace }}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
  labels: &labels
    tamoss.livewyer.io/credential-operation: s3
    tamoss.livewyer.io/deployment-id: {{ .Values.deploymentId | quote }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 300
  podReplacementPolicy: Failed
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: s3-credentials
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "operation-common.podSecurity" . | nindent 8 }}
      initContainers:
        - name: prepare
          image: {{ .Values.s3.images.oci | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              cat > /work/claim.yaml <<EOF
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: s3-credential-operation
                namespace: $NAMESPACE
                annotations:
                  tamoss.livewyer.io/deployment-id: "$DEPLOYMENT_ID"
                  tamoss.livewyer.io/storage-user: "$STORAGE_USER"
              data:
                attempt: "$ATTEMPT"
              EOF
          env:
            - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: DEPLOYMENT_ID, value: {{ .Values.deploymentId | quote }}}
            - {name: STORAGE_USER, value: {{ .Values.s3.userId | quote }}}
            - name: ATTEMPT
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          securityContext: &security
            {{- include "operation-common.containerSecurity" . | nindent 12 }}
          resources: &resources
            {{- include "operation-common.resources" . | nindent 12 }}
          volumeMounts: &mounts
            {{- include "operation-common.mounts" . | nindent 12 }}
        # Atomic creation prevents a duplicate Pod from issuing another one-time key.
        - name: claim
          image: {{ .Values.s3.images.kubectl | quote }}
          command: [kubectl]
          args: [create, --filename=/work/claim.yaml]
          securityContext: *security
          resources: *resources
          volumeMounts: &apiMounts
            {{- include "operation-common.mounts" . | nindent 12 }}
            - {name: api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        - name: create
          image: {{ .Values.s3.images.oci | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              oci --connection-timeout 10 --read-timeout 30 --max-retries 0 iam customer-secret-key create --user-id "$STORAGE_USER" --display-name "tamoss-$DEPLOYMENT_ID-$ATTEMPT" --query 'data.{stringData:{credentials:to_string({accessKey:id,secretKey:key})}}' > /work/key.json
          env:
            - {name: HOME, value: /tmp}
            - {name: OCI_CLI_AUTH, value: api_key}
            - {name: OCI_CLI_REGION, value: {{ .Values.oracle.region | quote }}}
            - {name: OCI_CLI_USER, value: {{ .Values.oracle.auth.user | quote }}}
            - {name: OCI_CLI_TENANCY, value: {{ .Values.oracle.auth.tenancy | quote }}}
            - {name: OCI_CLI_KEY_FILE, value: /oci/privatekey}
            - name: OCI_CLI_FINGERPRINT
              valueFrom: {secretKeyRef: {name: oci-vault-bootstrap, key: fingerprint}}
            - {name: DEPLOYMENT_ID, value: {{ .Values.deploymentId | quote }}}
            - {name: STORAGE_USER, value: {{ .Values.s3.userId | quote }}}
            - name: ATTEMPT
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          securityContext: *security
          resources: *resources
          volumeMounts:
            {{- include "operation-common.mounts" . | nindent 12 }}
            - {name: oci, mountPath: /oci, readOnly: true}
      containers:
        - name: publish
          image: {{ .Values.s3.images.kubectl | quote }}
          command: [kubectl]
          args: [patch, secret, s3-input, --namespace, {{ .Release.Namespace | quote }}, --type=merge, --patch-file=/work/key.json, --output=name]
          securityContext: *security
          resources: *resources
          volumeMounts: *apiMounts
      volumes:
        {{- include "operation-common.volumes" . | nindent 8 }}
        - name: oci
          secret:
            secretName: oci-vault-bootstrap
            defaultMode: 0440
            items: [{key: privatekey, path: privatekey}]
        - name: api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]
{{ end }}
{{ end }}
