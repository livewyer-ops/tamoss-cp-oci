apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: handover-completion}
spec:
  timeouts: {exec: 30s}
  steps:
    - name: resume each interrupted ownership boundary
      try:
        - command: &prepare
            entrypoint: env
            env: &paths
              - {name: PROJECT_ROOT, value: ($values.root)}
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:prepare"]
        - command: &interrupted
            entrypoint: env
            env: *paths
            args: ["STOP_AT=before-promotion", "mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
            check: &interruption
              ($error != null): true
              (contains($stderr, 'Injected interruption')): true
        - command: &incomplete
            entrypoint: env
            env: *paths
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:incomplete"]
        - command: &resume
            entrypoint: env
            env: *paths
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
        - command: &complete
            entrypoint: env
            env: *paths
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:complete"]
        - command: *prepare
        - command:
            entrypoint: env
            env: *paths
            args: ["STOP_AT=after-iam", "mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
            check: *interruption
        - command: *incomplete
        - command: *resume
        - command: *complete
        - command: *prepare
        - command:
            entrypoint: env
            env: *paths
            args: ["STOP_AT=after-publication", "mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
            check: *interruption
        - command: *incomplete
        - command: *resume
        - command: *complete
        - command: *prepare
        - command:
            entrypoint: env
            env: *paths
            args: ["STOP_AT=before-stop", "mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
            check: *interruption
        - command: *incomplete
        - command: *resume
        - command: *complete
    - name: repeat observes readiness without restarting Kind or publishing again
      try:
        - command: *prepare
        - command: *resume
        - command: *complete
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 2', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command:
            entrypoint: env
            env: *paths
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:repeat"]
    - name: failed readiness cannot complete handover and is checked again on repeat
      try:
        - command: *prepare
        - command: &unhealthy
            entrypoint: yq
            env: *paths
            args: [-i, '.unhealthy = true', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: &failed
            <<: *resume
            check: {($error != null): true}
        - command: *incomplete
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, 'del(.unhealthy)', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: *resume
        - command: *complete
        - command: *unhealthy
        - command: *failed
    - name: deployment completes once without handing over and repeats only observe
      try:
        - command: *prepare
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.deploymentReady = false | .gitopsEstablished = false', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: &up
            entrypoint: env
            env: *paths
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:up"]
        - command: &deployed
            entrypoint: env
            env: *paths
            args: ["mise", "-C", "$PROJECT_ROOT", "run", "test:handover:deployed"]
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 1 and .provisions == 1', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: *up
        - command: *deployed
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 2 and .provisions == 1', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: *resume
        - command: *complete
        - command: *up
        - command: *complete
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 5 and .provisions == 1 and .starts == 1 and .publications == 1', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
    - name: failed Git attachment leaves the quick deployment available
      try:
        - command: *prepare
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.gitopsEstablished = false', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command:
            entrypoint: env
            env: *paths
            args: ["STOP_AT=before-git", "mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
            check: *interruption
        - command: *up
        - command: *deployed
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.provisions == 0 and .gitopsEstablished == false', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
    - name: pending ownership change resumes through handover only
      try:
        - command: *prepare
        - command:
            entrypoint: env
            env: *paths
            args: ["STOP_AT=after-iam", "mise", "-C", "$PROJECT_ROOT", "run", "test:handover:run"]
            check: *interruption
        - command:
            <<: *up
            check:
              ($error != null): true
              (contains($stderr, 'resume mise run handover')): true
        - command: *resume
        - command: *complete
    - name: failed promoted readiness cannot stop Kind
      try:
        - command: *prepare
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.unhealthyAfterPublication = true', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: *failed
        - command: *incomplete
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.published == true and .observations == 1', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, 'del(.unhealthyAfterPublication)', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command: *resume
        - command: *complete
    - name: reject a different product revision before changing ownership
      try:
        - command: *prepare
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.spec.ref.commit = "different-product"', '$PROJECT_ROOT/.local/tmp/check/handover-flow/checkout/clusters/fixture/sources.yaml']
        - command:
            <<: *resume
            check:
              ($error != null): true
              (contains($stderr, 'product commit selected in environment Git')): true
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 0 and .starts == 0 and .publications == 0', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
    - name: incomplete deployment and teardown reject handover
      try:
        - command: *prepare
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.deploymentReady = false | .gitopsEstablished = false', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command:
            <<: *resume
            check:
              ($error != null): true
              (contains($stderr, 'Complete up')): true
        - command:
            entrypoint: yq
            env: *paths
            args: [-i, '.deploymentReady = true | .gitopsEstablished = true | .teardownStarted = true', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
        - command:
            <<: *resume
            check:
              ($error != null): true
              (contains($stderr, 'Teardown has started')): true
        - command:
            <<: *up
            check:
              ($error != null): true
              (contains($stderr, 'Teardown has started')): true
        - command:
            entrypoint: yq
            env: *paths
            args: [-e, '.observations == 0 and .starts == 0 and .publications == 0', '$PROJECT_ROOT/.local/tmp/check/handover-flow/identity.yaml']
