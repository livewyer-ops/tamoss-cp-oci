apiVersion: v1
kind: Render
(length(resources[?kind == 'Secret' || kind == 'Password' || kind == 'PushSecret'])): 0
(resources[?kind == 'SecretStore'] | [0].spec.provider.oracle.principalType): Workload
(resources[?kind == 'ExternalSecret'] | [0]):
  metadata: {name: tadoss-database, namespace: tads}
  spec:
    target:
      deletionPolicy: Retain
      template:
        data:
          uri: 'postgresql://tadoss:{{ .password | urlquery }}@fixture.postgresql.oci.oraclecloud.com:5432/tadoss?sslmode=verify-full'
    data:
      - secretKey: password
        remoteRef: {key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-tadoss-database}
