version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT: '{{.ROOT}}'
  ROOT_DIR: '{{.ROOT}}'
  DIRECTORY: '{{.ROOT}}/.local/tmp/check/setup'
  CORE: {sh: 'yq -r ''"xpkg.crossplane.io/crossplane/crossplane:v" + .crossplane.version'' {{.ROOT}}/dependencies.yaml'}
includes:
  setup: {taskfile: ../../tasks/setup.yaml, internal: true}
tasks:
  check:
    cmds:
      - chainsaw test --no-cluster --test-dir '{{.ROOT}}/tests/setup/contracts' --exec-timeout 120s --set-string root='{{.ROOT}}' --report-format JUNIT-TEST --report-path '{{.ROOT}}/.local/reports' --report-name setup
  fixture:
    cmds:
      - rm -rf '{{.DIRECTORY}}'
      - task: setup:initialise
        vars: {ENV_DIR: '{{.DIRECTORY}}'}
      - test "$(stat -c '%a' '{{.DIRECTORY}}')" = 700
      - test "$(stat -c '%a' '{{.DIRECTORY}}/values.yaml')" = 600
      - >-
        yq -i '.name = "setup-test" | .compartmentId = "ocid1.compartment.oc1.fixture" |
        .contactEmail = "operator@example.test" | .adminCidrs = ["192.0.2.10/32"]'
        '{{.DIRECTORY}}/values.yaml'
      - cp '{{.DIRECTORY}}/values.yaml' '{{.DIRECTORY}}/before-setup.yaml'
      - task: setup:initialise
        vars: {ENV_DIR: '{{.DIRECTORY}}'}
      - cmp '{{.DIRECTORY}}/values.yaml' '{{.DIRECTORY}}/before-setup.yaml'
      - install -d -m 700 '{{.DIRECTORY}}/discovery'
      - cp '{{.ROOT}}/tests/setup/discovery/'* '{{.DIRECTORY}}/discovery/'
  render:
    cmds:
      - task: setup:render
        vars: {ENV_DIR: '{{.DIRECTORY}}'}
  defaults:
    cmds:
      - task: render
      - >-
        yq -e '[.metadata.name == "setup-test", .spec.region == "eu-frankfurt-1",
        .spec.owner == "operator@example.test", .spec.expiresAt == null, .spec.budget == null,
        .spec.oke.imageId == "ocid1.image.oc1.fixture", (.spec.oke.placements | length == 3),
        .spec.oke.placements[0].availabilityDomain == "fixture:AD-1",
        .spec.oke.ocpus == 4, .spec.database.ocpus == 2,
        .spec.storage.bucket == "tamoss-setup-test-media"] | all'
        '{{.DIRECTORY}}/setup-render/setup/templates/environment.yaml'
      - 'yq -e ''.product.commit != null and .tadoss.bundle.digest != null and .url == null'' {{.DIRECTORY}}/setup-render/setup/templates/product.yaml'
      - 'yq -e ''.spec.region == "eu-frankfurt-1" and .spec.owner == "operator@example.test"'' {{.DIRECTORY}}/setup-render/setup/templates/foundation.yaml'
      - cp '{{.DIRECTORY}}/setup-render/setup/templates/environment.yaml' '{{.DIRECTORY}}/before-reorder.yaml'
      - 'yq -i ''.data |= reverse'' {{.DIRECTORY}}/discovery/domains.json'
      - task: render
      - cmp '{{.DIRECTORY}}/before-reorder.yaml' '{{.DIRECTORY}}/setup-render/setup/templates/environment.yaml'
  ambiguous:
    cmds:
      - 'yq -i ''.data.sources += .data.sources'' {{.DIRECTORY}}/discovery/node-options.json'
      - task: render
  unavailable:
    cmds:
      - 'yq -i ''.data.sources = []'' {{.DIRECTORY}}/discovery/node-options.json'
      - task: render
  bad-input:
    cmds:
      - 'yq -i ''{{.CHANGE}}'' {{.DIRECTORY}}/values.yaml'
      - task: render
  preserve:
    cmds:
      - task: render
      - install -m 600 '{{.DIRECTORY}}/values.yaml' '{{.DIRECTORY}}/setup-values.yaml'
      - mkdir -p '{{.DIRECTORY}}/checkout/.git'
      - task: setup:resolve
        vars: {ENV_DIR: '{{.DIRECTORY}}', CHECKOUT: '{{.DIRECTORY}}/checkout'}
      - test -s '{{.DIRECTORY}}/environment.yaml'
      - rm '{{.DIRECTORY}}/foundation.yaml'
      - task: setup:resolve
        vars: {ENV_DIR: '{{.DIRECTORY}}', CHECKOUT: '{{.DIRECTORY}}/checkout'}
      - test -s '{{.DIRECTORY}}/foundation.yaml'
      - 'yq -i ''.name = "changed"'' {{.DIRECTORY}}/values.yaml'
  changed:
    cmds:
      - task: setup:resolve
        vars: {ENV_DIR: '{{.DIRECTORY}}', CHECKOUT: '{{.DIRECTORY}}/checkout'}
  recorded:
    cmds:
      - mkdir -p '{{.DIRECTORY}}/recorded/checkout/.git'
      - 'yq -n ''{"gitopsEstablished": true}'' > {{.DIRECTORY}}/recorded/identity.yaml'
      - task: setup:resolve
        vars: {ENV_DIR: '{{.DIRECTORY}}/recorded', CHECKOUT: '{{.DIRECTORY}}/recorded/checkout'}
      - test ! -e '{{.DIRECTORY}}/recorded/values.yaml'
      - test ! -e '{{.DIRECTORY}}/recorded/discovery'
  existing:
    cmds:
      - mkdir -p '{{.DIRECTORY}}/old'
      - touch '{{.DIRECTORY}}/old/identity.yaml'
      - task: setup:initialise
        vars: {ENV_DIR: '{{.DIRECTORY}}/old'}
