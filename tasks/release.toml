["release:build"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "mise run verify:privacy",
  "git diff --exit-code HEAD -- charts deploy dependencies.yaml",
  "mise run tamoss:fetch",
  "mise run tadoss:fetch",
  "mise run tamoss:release",
  '''{% for artifact in read_yaml(path=vars.ROOT_DIR ~ "/dependencies.yaml") | get(key="artifacts") %}
{% if artifact.path == "calico/calico-policy-only.yaml" %}
URL={{ artifact.url | quote }} TARGET={{ artifact.path | quote }} SHA={{ artifact.sha256 | quote }} mise run verify:artifact
{% endif %}{% endfor %}''',
  "install -d -m 700 '{{ vars.RELEASE_BUILD_DIR }}/assets-build'",
  '''PRODUCT_COMMIT="$(git rev-parse HEAD)" yq -n -P 'sort_keys(..) | {"format": 1, "product": {"commit": strenv(PRODUCT_COMMIT), "url": load("{{ vars.ROOT_DIR }}/charts/setup/values.yaml").product.url}, "tamoss": load("{{ vars.ROOT_DIR }}/deploy/tamoss/release.yaml"), "tadoss": load("{{ vars.ROOT_DIR }}/deploy/tadoss/release.yaml")} | sort_keys(..)' > '{{ vars.RELEASE_BUILD_DIR }}/assets-build/input.yaml' ''',
  "RELEASE_LOCK='{{ vars.ROOT_DIR }}/deploy/tamoss/release.yaml' OUTPUT='{{ vars.RELEASE_BUILD_DIR }}/assets-build/pins.yaml' mise run gitops:pins",
  "ENV_DIR={{ vars.RELEASE_BUILD_DIR | quote }} mise run release:assemble",
]

["release:assemble"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "rm -rf '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree'",
  "install -d -m 700 '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree'",
  '''git archive --format=tar HEAD {% for path in read_file(path=vars.ROOT_DIR ~ "/deploy/assets/paths.txt") | trim | split(pat="\n") %} {{ path | quote }}{% endfor %} | tar --extract --no-same-owner --directory '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree' ''',
  "git archive --format=tar.gz --output='{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/operator-source.tar.gz' HEAD",
  "install -d '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/deploy/tamoss/instance/upstream' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/deploy/gitops/platform-defaults/upstream' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/tamoss' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/tadoss'",
  "cp -a '{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_TAMOSS_KEY }}/source/deploy' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/deploy/tamoss/instance/upstream/'",
  "cp '{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_TAMOSS_KEY }}/source/deploy/platform/values/defaults.yaml' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/deploy/gitops/platform-defaults/upstream/defaults.yaml'",
  '''{% for item in ["tamoss", "tadoss"] %}
DOCKER_CONFIG='{{ vars.RELEASE_BUILD_DIR }}/registry' flux pull artifact "$(yq -r '.bundle.url + "@" + .bundle.digest' '{{ vars.ROOT_DIR }}/deploy/{{ item }}/release.yaml')" --output '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/{{ item }}' --timeout=60s
{% endfor %}''',
  "{% for item in [\"tamoss\", \"tadoss\"] %}\n{% set lock = read_yaml(path=vars.ROOT_DIR ~ \"/deploy/\" ~ item ~ \"/release.yaml\") %}\n{% if item == \"tamoss\" %}{% set key = lock.releaseSha256 %}{% set names = [\"release.json\", \"install.yaml\", \"compatibility.yaml\", \"catalogue.json\", \"dependencies.yaml\"] %}{% else %}{% set key = lock.artifacts[\"release.json\"] %}{% set names = [\"release.json\", \"install.yaml\", \"compatibility.yaml\", \"catalogue.json\"] %}{% endif %}\n{% for name in names %}\ncmp '{{ vars.ROOT_DIR }}/.local/tmp/{{ item }}/{{ key }}/{{ name }}' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/{{ item }}/{{ name }}'\n{% endfor %}{% endfor %}",
  "install -d '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/calico'",
  "cp '{{ vars.ROOT_DIR }}/.local/tmp/check/calico/calico-policy-only.yaml' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/calico/'",
  "cp '{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_TAMOSS_KEY }}/source.tar.gz' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/tamoss/source.tar.gz'",
  "cp '{{ vars.RELEASE_BUILD_DIR }}/assets-build/input.yaml' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/build.yaml'",
  '''test -z "$(find '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree' -type l -print)" || { printf '%s\n' "Deployment assets must not contain symlinks" >&2; exit 1; }''',
  '''test -z "$(find '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree' \( -name .local -o -name .git -o -name AGENTS.md -o -name CLAUDE.md -o -name '*.pem' -o -name '*.kubeconfig' \) -print)" || { printf '%s\n' "Private material found in deployment assets" >&2; exit 1; }''',
  "kubectl kustomize '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/deploy/tamoss/instance' > /dev/null",
  "kubectl kustomize '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/tamoss' > /dev/null",
  "kubectl kustomize '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/upstream/tadoss' > /dev/null",
  "cp '{{ vars.RELEASE_BUILD_DIR }}/assets-build/pins.yaml' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/pins.yaml'",
]
env.TASKV_TAMOSS_KEY = '''{{ read_yaml(path=vars.ROOT_DIR ~ "/deploy/tamoss/release.yaml") | get(key="releaseSha256") }}'''

["release:charts"]
hide = true
run = [
  "rm -rf '{{ vars.RELEASE_BUILD_DIR }}/charts'",
  "install -d '{{ vars.RELEASE_BUILD_DIR }}/charts'",
  '''{% for key, path in read_yaml(path=vars.ROOT_DIR ~ "/deploy/assets/charts.yaml") %}
install -d '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/anonymous'
helm package '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/{{ path }}' --dependency-update --version '0.0.0-{{ env.PRODUCT_COMMIT }}' --destination '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}'
helm push '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/'*.tgz '{{ env.CHART_REGISTRY }}' {% if env.CHART_PLAIN_HTTP | default(value="false") == "true" %}--plain-http{% endif %} 2>&1 | tee '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/push.log'
CHART_URL='{{ env.CHART_REGISTRY }}/{{ read_yaml(path=vars.RELEASE_BUILD_DIR ~ "/assets-build/tree/" ~ path ~ "/Chart.yaml") | get(key="name") }}' yq -n -e '{"{{ key }}": {"url": strenv(CHART_URL), "digest": (load_str("{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/push.log") | capture("Digest: (?P<digest>sha256:[a-f0-9]{64})").digest)}} | select(."{{ key }}".digest != null)' > '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}.yaml'
{% endfor %}''',
  '''yq eval-all '. as $item ireduce ({}; . * $item)' '{{ vars.RELEASE_BUILD_DIR }}/charts/'*.yaml > '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/charts.yaml'''',
  '''{% for key, path in read_yaml(path=vars.ROOT_DIR ~ "/deploy/assets/charts.yaml") %}
DOCKER_CONFIG='{{ vars.RELEASE_BUILD_DIR }}/anonymous-docker' helm pull '{{ env.CHART_REGISTRY }}/{{ read_yaml(path=vars.RELEASE_BUILD_DIR ~ "/assets-build/tree/" ~ path ~ "/Chart.yaml") | get(key="name") }}@'"$(yq -r '."{{ key }}".digest' '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}.yaml')" {% if env.CHART_PLAIN_HTTP | default(value="false") == "true" %}--plain-http{% endif %} --registry-config '{{ vars.RELEASE_BUILD_DIR }}/anonymous-registry.json' --destination '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/anonymous'
cmp '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/'*.tgz '{{ vars.RELEASE_BUILD_DIR }}/charts/{{ key }}/anonymous/'*.tgz
{% endfor %}''',
]

["release:seal"]
hide = true
run = [
  '''cd '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree' && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > '../SHA256SUMS' ''',
  "mv '{{ vars.RELEASE_BUILD_DIR }}/assets-build/SHA256SUMS' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/SHA256SUMS'",
  '''MANIFEST_SHA256="$(sha256sum '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/SHA256SUMS' | cut -d ' ' -f 1)" yq '.manifestSha256 = strenv(MANIFEST_SHA256) | .charts = load("{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/charts.yaml")' '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/build.yaml' > '{{ vars.RELEASE_BUILD_DIR }}/assets-build/tree/release.yaml'''',
]
