{{ range $name, $url := dict "crossplane" "https://charts.crossplane.io/stable" "external-secrets" "https://charts.external-secrets.io" }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ $name }}
  namespace: flux-system
spec:
  interval: 1h
  url: {{ $url }}
{{ end }}
