version: '3'
set: [errexit, nounset, pipefail]
vars:
  ROOT: '{{.ROOT}}'
  ROOT_DIR: '{{.ROOT}}'
  DIRECTORY: '{{.ROOT}}/.local/tmp/check/flux-bootstrap'
  FLUX_VERSION: {sh: 'yq -r ''.packages[].name | select(test("^fluxcd/flux2@")) | split("@")[1]'' {{.ROOT}}/aqua.yaml'}
includes:
  bootstrap: {taskfile: ../../tasks/bootstrap.yaml, internal: true}
  identity: {taskfile: ../../tasks/identity.yaml, internal: true}
  management: {taskfile: ../../tasks/management.yaml, internal: true}
tasks:
  restart:
    vars:
      NAME: {sh: 'kubectl get nodes -o json | yq -p=json -r ''.items | select(length == 1) | .[0].metadata.name | sub("^tamoss-cp-"; "") | sub("-control-plane$"; "")'''}
    env:
      PROJECT_ROOT: '{{.ROOT}}'
      DIRECTORY: '{{.DIRECTORY}}/restart-{{.NAME}}'
      MANAGEMENT_KUBECONFIG: '{{.DIRECTORY}}/restart-input.kubeconfig'
    cmds:
      - install -m 600 /dev/null '{{.DIRECTORY}}/restart-input.kubeconfig'
      - defer: rm -f '{{.DIRECTORY}}/restart-input.kubeconfig'
      - defer: rm -f '{{.DIRECTORY}}/restart-{{.NAME}}/management.kubeconfig'
      - kubectl config view --raw --flatten > '{{.DIRECTORY}}/restart-input.kubeconfig'
      - kubectl --kubeconfig '{{.DIRECTORY}}/restart-input.kubeconfig' config rename-context "$(kubectl config current-context)" 'kind-tamoss-cp-{{.NAME}}'
      - task -t '{{.ROOT}}/tests/kind-restart/Taskfile.yaml' prepare
      - task -t '{{.ROOT}}/tests/kind-restart/Taskfile.yaml' restart
  prepare:
    cmds:
      - mkdir -p -m 700 '{{.DIRECTORY}}/environment'
      - >-
        yq '.metadata.name = "flux-bootstrap-check" | .spec.foundationName = "flux-bootstrap-check" |
        .spec.credentialsEstablished = false | .spec.vaultAuth = {"user": "ocid1.user.oc1.fixture", "tenancy": "ocid1.tenancy.oc1.fixture"} |
        .spec.environment.compartmentId = "ocid1.compartment.oc1.fixture" |
        .spec.foundation.compartmentId = "ocid1.compartment.oc1.fixture"'
        '{{.ROOT}}/.local/tmp/check/bootstrap/root.yaml' > '{{.DIRECTORY}}/environment/bootstrap.yaml'
      - 'yq -n ''{"instance": load("{{.DIRECTORY}}/environment/bootstrap.yaml")}'' > {{.DIRECTORY}}/instance-values.yaml'
      - >-
        helm template management '{{.ROOT}}/charts/management' -f '{{.DIRECTORY}}/values.yaml'
        --set-file environmentDefinition='{{.ROOT}}/charts/environment/definition.yaml'
        --set-file foundationDefinition='{{.ROOT}}/charts/secret-foundation/definition.yaml'
        --set-file secretBootstrapFile='{{.ROOT}}/deploy/secrets/bootstrap-values.yaml'
        -f '{{.DIRECTORY}}/instance-values.yaml' |
        yq 'select(.kind == "ConfigMap" or .metadata.name == "tamoss-bootstrap-instance") |
        with(select(.kind == "HelmRelease"); .spec.chart.spec.chart = "./missing-chart")'
        > '{{.DIRECTORY}}/instance.yaml'
      - >-
        yq 'with(select(.metadata.namespace == "secret-check"); .metadata.namespace = "tamoss-infra") |
        with(select(.kind == "RoleBinding" and .metadata.namespace == "secret-backend"); .subjects[0].namespace = "tamoss-infra") |
        select(.kind != "Secret" and (.kind != "Namespace" or .metadata.name != "secret-check"))'
        '{{.ROOT}}/tests/secret-persistence/backend.yaml' > '{{.DIRECTORY}}/backend.yaml'
      - 'yq ''{"apiVersion": "tamoss.livewyer.io/v1alpha1", "kind": "TamossEnvironment", "metadata": .metadata, "spec": .spec.environment}'' {{.DIRECTORY}}/environment/bootstrap.yaml > {{.DIRECTORY}}/environment/environment.yaml'
      - cp "$KUBECONFIG" '{{.DIRECTORY}}/environment/management.kubeconfig'
      - task: identity:observe-inputs
        vars: {ENV_DIR: '{{.DIRECTORY}}/environment'}
      - kubectl get namespace kube-system -o json > '{{.DIRECTORY}}/namespace.json'
      - 'yq ''.deploymentUID = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" | .managementUID = load("{{.DIRECTORY}}/namespace.json").metadata.uid'' {{.DIRECTORY}}/environment/identity-inputs.yaml > {{.DIRECTORY}}/environment/identity.yaml'
  release:
    cmds:
      - task: bootstrap:observe
        vars: {ENV_DIR: '{{.DIRECTORY}}/environment'}
      - task: bootstrap:release
        vars: {ENV_DIR: '{{.DIRECTORY}}/environment'}
  install:
    cmds:
      - mkdir -p '{{.DIRECTORY}}'
      - flux install --version='{{.FLUX_VERSION}}' --timeout=5m
      - tar --exclude='*/charts/*.tgz' -czf '{{.DIRECTORY}}/product.tar.gz' -C '{{.ROOT}}' charts
      - kubectl -n flux-system cp '{{.DIRECTORY}}/product.tar.gz' "$(kubectl -n flux-system get pod -l app=source-controller -o jsonpath='{.items[0].metadata.name}'):/data/tamoss-bootstrap-product.tar.gz"
      - >-
        yq -n '{"dependencies": load("{{.ROOT}}/dependencies.yaml"),
        "packages": load("{{.ROOT}}/charts/packages/values.yaml"),
        "externalSecrets": load("{{.ROOT}}/deploy/secrets/controller-values.yaml"),
        "product": {"url": "https://github.com/example/fixture", "commit": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}}'
        > '{{.DIRECTORY}}/values.yaml'
      - >-
        helm template management '{{.ROOT}}/charts/management' -f '{{.DIRECTORY}}/values.yaml'
        --set-file environmentDefinition='{{.ROOT}}/charts/environment/definition.yaml'
        --set-file foundationDefinition='{{.ROOT}}/charts/secret-foundation/definition.yaml'
        --set-file secretBootstrapFile='{{.ROOT}}/deploy/secrets/bootstrap-values.yaml' |
        yq 'with(select(.kind == "GitRepository"); .spec.suspend = true | del(.spec.secretRef, .spec.provider))'
        > '{{.DIRECTORY}}/seed.yaml'
      - kubectl apply --server-side -f '{{.DIRECTORY}}/seed.yaml'
      - >-
        ARTIFACT_DIGEST="$(sha256sum '{{.DIRECTORY}}/product.tar.gz' | cut -d ' ' -f 1)"
        yq -n '{"status": {"observedGeneration": 1,
        "conditions": [{"type": "Ready", "status": "True", "reason": "Fixture", "message": "Local chart artifact", "lastTransitionTime": "2026-01-01T00:00:00Z"}],
        "artifact": {"path": "tamoss-bootstrap-product.tar.gz",
        "url": "http://source-controller.flux-system.svc.cluster.local./tamoss-bootstrap-product.tar.gz",
        "revision": "main@sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
        "digest": ("sha256:" + strenv(ARTIFACT_DIGEST)), "lastUpdateTime": "2026-01-01T00:00:00Z"}}}'
        > '{{.DIRECTORY}}/source-status.yaml'
      - kubectl -n tamoss-infra patch gitrepository/tamoss-bootstrap-product --subresource=status --type=merge --patch-file '{{.DIRECTORY}}/source-status.yaml'
      - kubectl -n tamoss-infra wait helmrelease --all --for=condition=Ready --timeout=1200s
      - kubectl wait provider.pkg.crossplane.io --all --for=condition=Healthy --timeout=600s
      - kubectl wait function.pkg.crossplane.io --all --for=condition=Healthy --timeout=300s
      - kubectl wait crd/tamossenvironments.tamoss.livewyer.io crd/secretfoundations.tamoss.livewyer.io crd/tamossbootstraps.tamoss.livewyer.io --for=condition=Established --timeout=180s
