apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: dedicated-compartment-absence}
spec:
  bindings:
    - {name: directory, value: "(join('/', [$values.root, '.local/tmp/check/absence']))"}
  steps:
    - name: accept empty inventories and terminated resources
      try:
        - command:
            env: &paths
              - {name: PROJECT_ROOT, value: ($values.root)}
              - {name: DIRECTORY, value: ($directory)}
            entrypoint: mise
            args: [-C, "$PROJECT_ROOT", run, 'test:lifecycle:absence']
        - command: &audit
            env: *paths
            entrypoint: env
            args: [MISE_OVERRIDE_CONFIG_FILENAMES=fixture.mise.toml, mise, -C, "$DIRECTORY", run, audit]
    - name: reject an active volume
      try:
        - command:
            env: *paths
            entrypoint: yq
            args: [-i, '.data = [{"name": "volume", "lifecycle-state": "AVAILABLE"}]', "$DIRECTORY/inventory-after/volumes.json"]
        - command:
            <<: *audit
            check: {($error != null): true}
    - name: reject an unowned bucket
      try:
        - command:
            env: *paths
            entrypoint: yq
            args: [-i, '.data = []', "$DIRECTORY/inventory-after/volumes.json"]
        - command:
            env: *paths
            entrypoint: yq
            args: [-i, '.data = [{"name": "unexpected-bucket"}]', "$DIRECTORY/inventory-after/buckets.json"]
        - command:
            <<: *audit
            check: {($error != null): true}
