["verify:gitops"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''RELEASE_LOCK={{ ((vars.ROOT_DIR) ~ "/deploy/tamoss/release.yaml") | quote }} OUTPUT={{ ((env.TASKV_CACHE) ~ "/gitops-pins.yaml") | quote }} mise run gitops:pins''',
  "helm lint '{{ env.TASKV_CHART }}' -f '{{ env.TASKV_ASSETS }}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{ env.TASKV_CACHE }}/gitops-pins.yaml'",
  "helm template tamoss-gitops '{{ env.TASKV_CHART }}' -n flux-system -f '{{ env.TASKV_ASSETS }}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{ env.TASKV_CACHE }}/gitops-pins.yaml' > '{{ env.TASKV_CACHE }}/gitops-render.yaml'",
  '''yq 'select(.kind == "HelmRelease" and .metadata.name == "tamoss-platform-config") | .spec.values' {{ env.TASKV_CACHE }}/gitops-render.yaml > {{ env.TASKV_CACHE }}/gitops-platform-config-values.yaml''',
  "helm template tamoss-platform-config '{{ env.TASKV_ASSETS }}/source/deploy/platform/charts/config' -n tamoss-platform -f '{{ env.TASKV_CACHE }}/gitops-platform-config-values.yaml' > '{{ env.TASKV_CACHE }}/gitops-platform-config.yaml'",
  "mkdir -p '{{ env.TASKV_CACHE }}/gitops-defaults/upstream'",
  "cp deploy/gitops/platform-defaults/kustomization.yaml '{{ env.TASKV_CACHE }}/gitops-defaults/'",
  "cp '{{ env.TASKV_ASSETS }}/source/deploy/platform/values/defaults.yaml' '{{ env.TASKV_CACHE }}/gitops-defaults/upstream/'",
  "kubectl kustomize '{{ env.TASKV_CACHE }}/gitops-defaults' > '{{ env.TASKV_CACHE }}/gitops-defaults.yaml'",
  '''yq -e '.data."values.yaml" == load_str("{{ env.TASKV_ASSETS }}/source/deploy/platform/values/defaults.yaml")' {{ env.TASKV_CACHE }}/gitops-defaults.yaml > /dev/null''',
  "flux install --version={{ env.TASKV_FLUX_VERSION }} --export > '{{ env.TASKV_CACHE }}/flux-install.yaml'",
  '''yq 'select(.kind == "CustomResourceDefinition")' {{ env.TASKV_CACHE }}/flux-install.yaml > {{ env.TASKV_CACHE }}/schemas/flux.yaml''',
  '''helm template cert-manager jetstack/cert-manager --set crds.enabled=true --version="$(yq -r .dependencies.platform.certManager.chartVersion '{{ env.TASKV_CACHE }}/gitops-pins.yaml')" | yq -e 'select(.kind == "CustomResourceDefinition" and .metadata.name == "certificates.cert-manager.io")' > '{{ env.TASKV_CACHE }}/certificate-crd.yaml'''',
  "crossplane resource validate '{{ env.TASKV_CACHE }}/schemas' '{{ env.TASKV_CACHE }}/gitops-render.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results",
  '''yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_CACHE }}/gitops-render.yaml > {{ env.TASKV_CACHE }}/gitops-list.yaml''',
  '''yq -n '{"apiVersion": "source.toolkit.fluxcd.io/v1", "kind": "GitRepository", "metadata": {"name": "tamoss-upstream", "namespace": "flux-check"}, "spec": {"interval": "1m", "url": "https://github.com/livewyer-ops/tamoss", "ref": {"commit": load("{{ env.TASKV_ASSETS }}/release.json").sourceCommit}}}' > '{{ env.TASKV_CACHE }}/flux-readiness-source.yaml'''',
  '''yq '.metadata.name = "health-only" | .spec.ignore = "/*\n!/README.md\n"' {{ env.TASKV_CACHE }}/flux-readiness-source.yaml > {{ env.TASKV_CACHE }}/flux-readiness-health-source.yaml''',
  '''yq '
    select(.kind == "Kustomization" and (.metadata.name == "deployment-ready" or .metadata.name == "application-ready")) |
    .metadata.namespace = "flux-check" | .spec.sourceRef.kind = "GitRepository" | .spec.sourceRef.name = "health-only" |
    .spec.path = "./" | .spec.interval = "5s" | .spec.retryInterval = "5s" | .spec.timeout = "5s" |
    del(.spec.kubeConfig) | del(.spec.dependsOn) |
    with(select(.metadata.name == "application-ready");
      .spec.healthChecks = [{"apiVersion":"cert-manager.io/v1", "kind":"Certificate", "name":"public-tls", "namespace":"flux-check"}]) |
    with(select(.metadata.name == "deployment-ready");
      .spec.healthChecks = [{"apiVersion":"kustomize.toolkit.fluxcd.io/v1", "kind":"Kustomization", "name":"connection-readiness", "namespace":"flux-check"}, {"apiVersion":"helm.toolkit.fluxcd.io/v2", "kind":"HelmRelease", "name":"authentik-bootstrap", "namespace":"flux-check"}, {"apiVersion":"kustomize.toolkit.fluxcd.io/v1", "kind":"Kustomization", "name":"application-ready", "namespace":"flux-check"}])' '{{ env.TASKV_CACHE }}/gitops-render.yaml' > '{{ env.TASKV_CACHE }}/flux-readiness-readiness.yaml'''',
  '''yq 'select(.kind == "Kustomization" and .metadata.name == "tamoss-operator")' {{ env.TASKV_CACHE }}/gitops-render.yaml > {{ env.TASKV_CACHE }}/gitops-operator-flux.yaml''',
  "flux build kustomization tamoss-operator -n tamoss-infra --dry-run --in-memory-build --path '{{ vars.ROOT_DIR }}/.local/tmp/tamoss-bundle' --kustomization-file '{{ env.TASKV_CACHE }}/gitops-operator-flux.yaml' > '{{ env.TASKV_CACHE }}/gitops-operator.yaml'",
  '''yq eval-all -e '[select(.kind == "Namespace")] | length == 0' {{ env.TASKV_CACHE }}/gitops-operator.yaml > /dev/null''',
  "mkdir -p '{{ env.TASKV_CACHE }}/gitops-instance/upstream'",
  "cp deploy/tamoss/instance/kustomization.yaml deploy/tamoss/instance/patch.yaml deploy/tamoss/instance/storage.yaml '{{ env.TASKV_CACHE }}/gitops-instance/'",
  "cp -a '{{ env.TASKV_ASSETS }}/source/deploy' '{{ env.TASKV_CACHE }}/gitops-instance/upstream/'",
  '''yq 'select(.kind == "Kustomization" and .metadata.name == "tamoss") | .spec.postBuild.substitute = {"DATABASE_HOST": "fixture.postgresql.oci.oraclecloud.com"}' '{{ env.TASKV_CACHE }}/gitops-render.yaml' > '{{ env.TASKV_CACHE }}/gitops-instance-flux.yaml'''',
  "flux build kustomization tamoss -n tamoss-infra --dry-run --in-memory-build --strict-substitute --path '{{ env.TASKV_CACHE }}/gitops-instance' --kustomization-file '{{ env.TASKV_CACHE }}/gitops-instance-flux.yaml' > '{{ env.TASKV_CACHE }}/gitops-instance.yaml'",
  "crossplane resource validate '{{ env.TASKV_CACHE }}/schemas' '{{ env.TASKV_CACHE }}/gitops-instance.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results",
  '''yq 'select(.kind == "Tamoss")' {{ env.TASKV_CACHE }}/gitops-instance.yaml > {{ env.TASKV_CACHE }}/gitops-tamoss.yaml''',
  '''yq -e '[.spec.version == load("deploy/tamoss/release.yaml").tag, .spec.backends.db.external.host == "fixture.postgresql.oci.oraclecloud.com", .spec.ingest.sources[0].s3.pathStyle == true] | all' {{ env.TASKV_CACHE }}/gitops-tamoss.yaml''',
  "chainsaw test --no-cluster --test-dir tests/gitops --set-string root='{{ vars.ROOT_DIR }}' --set-string directory='{{ env.TASKV_CACHE }}/gitops-export-test' --report-format JUNIT-TEST --report-path .local/reports --report-name gitops",
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"
env.TASKV_CHART = "{% if env.CHART is defined %}{{ env.CHART }}{% else %}{{ vars.ROOT_DIR }}/charts/gitops{% endif %}"
env.TASKV_FLUX_VERSION = '''{% if env.FLUX_VERSION is defined %}{{ env.FLUX_VERSION }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -p=toml -r '.tools.\"aqua:fluxcd/flux2\"' " ~ (vars.ROOT_DIR) ~ "/mise.toml") }}{% endif %}'''
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .releaseSha256 " ~ (vars.ROOT_DIR) ~ "/deploy/tamoss/release.yaml") }}{% endif %}'''
env.TASKV_ASSETS = "{% if env.ASSETS is defined %}{{ env.ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_KEY }}{% endif %}"

["verify:tadoss"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  "hurlfmt --check tests/http/tadoss.hurl tests/http/tadoss-persistence.hurl",
  '''RELEASE_LOCK={{ ((vars.ROOT_DIR) ~ "/deploy/tamoss/release.yaml") | quote }} OUTPUT={{ ((env.TASKV_CACHE) ~ "/gitops-pins.yaml") | quote }} mise run gitops:pins''',
  "helm template tamoss-gitops charts/gitops -n flux-system -f '{{ env.TASKV_ASSETS }}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{ env.TASKV_CACHE }}/gitops-pins.yaml' -f tests/tadoss/values.yaml > '{{ env.TASKV_CACHE }}/tadoss-gitops.yaml'",
  '''yq eval-all -e '[select(.kind == "HelmRepository") | .metadata.name] as $have | [select(.kind == "HelmRelease") | .spec.chart.spec.sourceRef | select(.kind == "HelmRepository") | .name] | unique | . - $have | length == 0' {{ env.TASKV_CACHE }}/tadoss-gitops.yaml > /dev/null''',
  "helm template tamoss-gitops charts/gitops -n flux-system -f '{{ env.TASKV_ASSETS }}/source/deploy/platform/values/defaults.yaml' -f tests/gitops/values.yaml -f '{{ env.TASKV_CACHE }}/gitops-pins.yaml' -f tests/tadoss/values.yaml --set tadoss.enabled=false > '{{ env.TASKV_CACHE }}/tadoss-disabled.yaml'",
  '''yq 'select(.kind == "CustomResourceDefinition")' {{ env.TASKV_CACHE }}/tadoss-operator.yaml > {{ env.TASKV_CACHE }}/schemas/tadoss.yaml''',
  "crossplane resource validate '{{ env.TASKV_CACHE }}/schemas' '{{ env.TASKV_CACHE }}/tadoss-gitops.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results",
  '''{% for item in ["operator", "credentials", "instance"] %}
COMPONENT={{ ((item)) | quote }} mise run verify:tadoss-build
{% endfor %}''',
  '''yq 'with(select(.kind == "Deployment"); .spec.replicas = 1 | del(.spec.template.spec.affinity))' {{ env.TASKV_CACHE }}/tadoss-operator-render.yaml > {{ env.TASKV_CACHE }}/tadoss-operator-management.yaml''',
  '''yq 'select(.kind == "HelmRelease" and .metadata.name == "tadoss-config") | .spec.values | .host = "fixture.postgresql.oci.oraclecloud.com" | .caBase64 = "Zml4dHVyZQ=="' {{ env.TASKV_CACHE }}/tadoss-gitops.yaml > {{ env.TASKV_CACHE }}/tadoss-config-values.yaml''',
  "helm lint deploy/tadoss/config -f '{{ env.TASKV_CACHE }}/tadoss-config-values.yaml'",
  "helm template tadoss-config deploy/tadoss/config -n auth -f '{{ env.TASKV_CACHE }}/tadoss-config-values.yaml' > '{{ env.TASKV_CACHE }}/tadoss-config.yaml'",
  '''yq 'select(.kind == "ConfigMap" and .metadata.name == "tadoss-authentik-blueprint") | .metadata.namespace = "authentik-startup"' {{ env.TASKV_CACHE }}/tadoss-config.yaml > {{ env.TASKV_CACHE }}/tadoss-startup-blueprint.yaml''',
  '''yq 'select(.kind == "HelmRelease" and .metadata.name == "authentik") | .spec.values' {{ env.TASKV_CACHE }}/tadoss-gitops.yaml > {{ env.TASKV_CACHE }}/tadoss-authentik-values.yaml''',
  "helm template authentik authentik --repo https://charts.goauthentik.io --version $(yq -r .dependencies.platform.authentik.chartVersion '{{ env.TASKV_CACHE }}/gitops-pins.yaml') -n auth -f '{{ env.TASKV_CACHE }}/tadoss-authentik-values.yaml' > '{{ env.TASKV_CACHE }}/tadoss-authentik.yaml'",
  "crossplane resource validate '{{ env.TASKV_CACHE }}/schemas' '{{ env.TASKV_CACHE }}/tadoss-authentik.yaml' --crossplane-image={{ vars.CORE }} --cache-dir='{{ env.TASKV_CACHE }}/crossplane' --error-on-missing-schemas --skip-success-results",
  '''yq 'select(.kind == "HelmRelease") | .spec.values' {{ env.TASKV_CACHE }}/tadoss-credentials-render.yaml > {{ env.TASKV_CACHE }}/tadoss-secrets-values.yaml''',
  "helm template tadoss-secrets charts/secrets -n tads -f '{{ env.TASKV_CACHE }}/tadoss-secrets-values.yaml' > '{{ env.TASKV_CACHE }}/tadoss-secrets.yaml'",
  '''{% for item in ["tadoss-gitops", "tadoss-instance-render", "tadoss-secrets", "tadoss-config"] %}
yq eval-all '[select(. != null)] | {"apiVersion": "v1", "kind": "Render", "resources": .}' {{ env.TASKV_CACHE }}/{{ item }}.yaml > {{ env.TASKV_CACHE }}/{{ item }}-list.yaml
{% endfor %}''',
  "chainsaw test --no-cluster --test-dir tests/tadoss --report-format JUNIT-TEST --report-path .local/reports --report-name tadoss",
]
env.TASKV_CACHE = "{% if env.CACHE is defined %}{{ env.CACHE }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/check{% endif %}"
env.TASKV_KEY = '''{% if env.KEY is defined %}{{ env.KEY }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .releaseSha256 " ~ (vars.ROOT_DIR) ~ "/deploy/tamoss/release.yaml") }}{% endif %}'''
env.TASKV_ASSETS = "{% if env.ASSETS is defined %}{{ env.ASSETS }}{% else %}{{ vars.ROOT_DIR }}/.local/tmp/tamoss/{{ env.TASKV_KEY }}{% endif %}"

