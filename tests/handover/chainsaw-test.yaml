apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: adoption-contracts
spec:
  timeouts: {exec: 30s}
  steps:
    - name: render a complete observe-only destination without copied status
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/adoption-render-list.yaml, -f, render.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/adoption-return-render-list.yaml, -f, return.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1s, -r, ../../.local/tmp/check/workload-identity-list.yaml, -f, workload-identity.yaml]
    - name: refuse incomplete adoption at schema and composition boundaries
      try:
        - command:
            entrypoint: crossplane
            env: &crossplane
              - {name: CROSSPLANE_IMAGE, value: ($values.crossplaneImage)}
            args: [resource, validate, ../../charts/environment/definition.yaml, ../../.local/tmp/check/adoption-missing.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --cache-dir=../../.local/tmp/check/crossplane, --error-on-missing-schemas]
            check:
              ($error != null): true
              (contains($stdout, 'failure cases')): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption-missing.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE]
            check:
              ($error != null): true
              (contains($stderr, 'complete external-name binding set')): true
    - name: reject a wrong deployment or bucket identity
      try:
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption-wrong-identity.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE]
            check:
              ($error != null): true
              (contains($stderr, 'Adoption deployment identity')): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption-wrong-bucket.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE]
            check:
              ($error != null): true
              (contains($stderr, 'Bucket external name')): true
    - name: preserve external identity and creator tags after an interrupted transfer
      try:
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --observed-resources=../../.local/tmp/check/adoption-observed.yaml]
            check:
              ($error == null): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --observed-resources=../../.local/tmp/check/adoption-conflict.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'Observed external name differs')): true
        - command:
            entrypoint: crossplane
            env: *crossplane
            args: [composition, render, ../../.local/tmp/check/adoption.yaml, ../../.local/tmp/check/composition.yaml, ../../.local/tmp/check/functions.yaml, --crossplane-image, $CROSSPLANE_IMAGE, --observed-resources=../../.local/tmp/check/adoption-wrong-owner.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'Observed ownership tag differs')): true
    - name: reject an adopted environment in the local lifecycle
      try:
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../environments/example/environment.yaml, -f, ../../deploy/contracts/local-owner.yaml]
        - command:
            entrypoint: chainsaw
            args: [assert, --timeout, 1ms, -r, ../../.local/tmp/check/adoption.yaml, -f, ../../deploy/contracts/local-owner.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'assertion failed')): true
