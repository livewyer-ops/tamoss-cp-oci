{{- $services := required "services is required" .Values.services -}}
apiVersion: v1
kind: Secret
metadata:
  name: oci-workload
  namespace: {{ .Release.Namespace }}
stringData:
  credentials: {{ dict "auth" "OKEWorkloadIdentity" "region" $services.spec.region | toJson | quote }}
---
apiVersion: oci.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ $services.spec.providerConfigName }}
  namespace: {{ .Release.Namespace }}
spec:
  credentials:
    source: Secret
    secretRef:
      name: oci-workload
      namespace: {{ .Release.Namespace }}
      key: credentials
---
{{ $services | toYaml }}
