{{- if and .Values.files.pins .Values.files.environment }}
{{- $e := (.Values.files.environment | fromYaml).spec -}}
{{- $s := .Values.files.settings | fromYaml -}}
tadoss: {enabled: {{ dig "tadoss" "enabled" false $s }}}
deploymentId: {{ (.Values.files.identity | fromYaml).deploymentUID | quote }}
region: {{ $e.region | quote }}
databaseAdministrator: {{ $e.database.administrator | quote }}
runtime:
  bucket: {{ $e.storage.bucket | quote }}
  objectEndpoint: {{ printf "https://%s.compat.objectstorage.%s.oci.customer-oci.com" $e.storage.namespace $e.region | quote }}
  acmeEmail: {{ $s.acmeEmail | quote }}
  adminEmail: {{ $s.adminEmail | quote }}
{{- end }}
