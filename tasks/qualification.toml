
["qualification:run:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:credentials",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:prepare-ingest",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:ingest",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:media",
  "KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig' chainsaw test --test-dir tests/placement --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name placement",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:browser",
  "KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig' chainsaw test --values dependencies.yaml --test-dir tests/network --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name network",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:disruption",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:media",
]
depends_post = ["qualification:run:cleanup"]

["qualification:run:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "rm -f '{{ vars.ENV_DIR }}/api-token' '{{ vars.ENV_DIR }}/api.curl' '{{ vars.ENV_DIR }}/targets.jsonl' '{{ vars.ENV_DIR }}/http-secrets.env' '{{ vars.ENV_DIR }}/browser.env' '{{ vars.ENV_DIR }}/browser-secrets.json'",
]

["qualification:run"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  "mkdir -p -m 700 '{{ vars.ENV_DIR }}/reports'",
  "echo 'Qualifying ingest, browser access and worker disruption; reports: {{ vars.ENV_DIR }}/reports'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' get nodes -o json | yq -p=json -e '.items | length == 3'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' wait nodes --all --for=condition=Ready --timeout=300s",
  '''RELEASE_LOCK={{ ((vars.ENV_DIR) ~ "/tamoss-release.yaml") | quote }} mise run tamoss:media''',
  "cp '{{ vars.ROOT_DIR }}/.local/tmp/check/media/qualification.sha256' '{{ vars.ENV_DIR }}/qualification.sha256'",
  "RUNTIME_DIR={{ ((vars.ENV_DIR)) | quote }} mise run runtime:render",
  "mise run qualification:run:protected",
]

["qualification:prepare-ingest"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run identity:remote",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get ingestrun/qualification --ignore-not-found -o json > '{{ vars.ENV_DIR }}/previous-ingest.json'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams delete ingestrun/qualification --ignore-not-found --cascade=foreground --wait=true --timeout=300s",
  "curl --proto '=https' --fail --silent --show-error --max-time 20 --max-filesize 1048576 --config '{{ vars.ENV_DIR }}/api.curl' --output '{{ vars.ENV_DIR }}/previous-flows.json' '{{ env.TASKV_API_URL }}/flows?tag.qualification_deployment={{ env.TASKV_DEPLOYMENT }}&limit=100'",
  '''yq -e 'length < 100 and ([.[] | select(.tags.qualification_deployment != "{{ env.TASKV_DEPLOYMENT }}" or (.id | test("^[a-f0-9-]{36}$") | not))] | length == 0)' {{ vars.ENV_DIR }}/previous-flows.json > /dev/null''',
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run qualification:remove-flows",
  "curl --proto '=https' --fail --silent --show-error --max-time 20 --max-filesize 1048576 --config '{{ vars.ENV_DIR }}/api.curl' --output '{{ vars.ENV_DIR }}/remaining-flows.json' '{{ env.TASKV_API_URL }}/flows?limit=1'",
  "yq -e 'length == 0' {{ vars.ENV_DIR }}/remaining-flows.json > /dev/null",
  "ENV_DIR={{ ((vars.ENV_DIR)) | quote }} mise run cloud:fixture",
  "mkdir -p -m 700 '{{ vars.ENV_DIR }}/ingest'",
  "cp deploy/tamoss/ingest/runtime-kustomization.yaml '{{ vars.ENV_DIR }}/ingest/kustomization.yaml'",
  "cp '{{ vars.ENV_DIR }}/instance/runtime.yaml' '{{ vars.ENV_DIR }}/ingest/runtime.yaml'",
  '''yq -i '.resources[0] = "{{ env.TASKV_BASE_RELATIVE }}"' {{ vars.ENV_DIR }}/ingest/kustomization.yaml''',
  '''kubectl kustomize '{{ vars.ENV_DIR }}/ingest' | yq 'select(.kind == "IngestRun") | .spec.output.flowMetadata.tags.qualification_deployment = "{{ env.TASKV_DEPLOYMENT }}"' > '{{ vars.ENV_DIR }}/ingest.yaml'''',
]
env.TASKV_API_URL = '''{% if env.API_URL is defined %}{{ env.API_URL }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .data.apiURL " ~ (vars.ENV_DIR) ~ "/instance/runtime.yaml") }}{% endif %}'''
env.TASKV_BASE_RELATIVE = '''{% if env.BASE_RELATIVE is defined %}{{ env.BASE_RELATIVE }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "realpath -m --relative-to='" ~ (vars.ENV_DIR) ~ "/ingest' '" ~ (vars.ROOT_DIR) ~ "/deploy/tamoss/ingest'") }}{% endif %}'''
env.TASKV_DEPLOYMENT = '''{% if env.DEPLOYMENT is defined %}{{ env.DEPLOYMENT }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .deploymentUID " ~ (vars.ENV_DIR) ~ "/identity.yaml") }}{% endif %}'''

["qualification:remove-flows"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''{% for item in read_json(path=vars.ENV_DIR ~ "/previous-flows.json") | map(attribute="id") %}
hurl --no-output --secrets-file '{{ vars.ENV_DIR }}/http-secrets.env' --variable api='{{ env.TASKV_API_URL }}' --variable flow='{{ item }}' --max-time 10 --max-filesize 1048576 tests/http/delete-flow.hurl
{% endfor %}''',
]
env.TASKV_API_URL = '''{% if env.API_URL is defined %}{{ env.API_URL }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .data.apiURL " ~ (vars.ENV_DIR) ~ "/instance/runtime.yaml") }}{% endif %}'''

["qualification:ingest"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' apply --server-side -f '{{ vars.ENV_DIR }}/ingest.yaml'",
  "KUBECONFIG='{{ vars.ENV_DIR }}/remote.kubeconfig' chainsaw test --skip-delete --test-dir tests/qualification --set-string previousUID='{{ env.TASKV_PREVIOUS }}' --report-format JUNIT-TEST --report-path '{{ vars.ENV_DIR }}/reports' --report-name ingest",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get ingestrun/qualification -o json > '{{ vars.ENV_DIR }}/reports/ingest.json'",
  "kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get jobs -l tamoss.livewyer.io/ingest-run=qualification -o json > '{{ vars.ENV_DIR }}/reports/ingest-jobs.json'",
]
env.TASKV_PREVIOUS = '''{% if env.PREVIOUS is defined %}{{ env.PREVIOUS }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r '.metadata.uid // \"absent\"' " ~ (vars.ENV_DIR) ~ "/previous-ingest.json") }}{% endif %}'''

["qualification:credentials"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
quiet = true
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''{% for item in ["api-token", "api.curl", "targets.jsonl", "http-secrets.env"] %}
install -m 600 /dev/null '{{ vars.ENV_DIR }}/{{ item }}'
{% endfor %}''',
  '''kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get secret "$(kubectl --kubeconfig '{{ vars.ENV_DIR }}/remote.kubeconfig' -n tams get tamoss tamoss -o jsonpath='{.status.resolved.generatedSecrets.apiToken}')" -o json | yq -p=json -e -r '.data.TAMOSS_API_TOKEN | @base64d | select(length > 0)' > '{{ vars.ENV_DIR }}/api-token'''',
  "test -s '{{ vars.ENV_DIR }}/api-token'",
  '''yq -n -r '"header = " + (("Authorization: Bearer " + (load_str("{{ vars.ENV_DIR }}/api-token") | trim)) | @json)' > '{{ vars.ENV_DIR }}/api.curl'''',
  '''yq -n -o=json -I=0 '(load("{{ vars.ENV_DIR }}/instance/runtime.yaml").data) as $r | [{"method": "GET", "url": ($r.apiURL + "/flows"), "header": {"Authorization": ["Bearer " + (load_str("{{ vars.ENV_DIR }}/api-token") | trim)]}}, {"method": "GET", "url": ($r.uiURL + "/")}] | .[]' > '{{ vars.ENV_DIR }}/targets.jsonl'''',
  '''yq -n -r '"token=" + (load_str("{{ vars.ENV_DIR }}/api-token") | trim)' > {{ vars.ENV_DIR }}/http-secrets.env''',
]

["qualification:media:protected"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  '''{% for item in ["segments.json", "media.curl"] %}
install -m 600 /dev/null '{{ vars.ENV_DIR }}/{{ item }}'
{% endfor %}''',
  "curl --proto '=https' --fail --silent --show-error --max-time 20 --max-filesize 1048576 --config '{{ vars.ENV_DIR }}/api.curl' --output '{{ vars.ENV_DIR }}/segments.json' '{{ env.TASKV_API_URL }}/flows/{{ env.TASKV_FLOW }}/segments?presigned=true'",
  '''yq -e 'length > 0 and ((.[0].get_urls[0].url | split("/") | .[0:3] | join("/")) == load("{{ vars.ENV_DIR }}/outputs.json").objectEndpoint)' {{ vars.ENV_DIR }}/segments.json''',
  '''yq -r '"url = " + (.[0].get_urls[0].url | @json)' {{ vars.ENV_DIR }}/segments.json > {{ vars.ENV_DIR }}/media.curl''',
  "curl --proto '=https' --fail --silent --show-error --max-time 20 --max-filesize 8388608 --config '{{ vars.ENV_DIR }}/media.curl' --output '{{ vars.ENV_DIR }}/media.ts'",
  "test -s '{{ vars.ENV_DIR }}/media.ts'",
  "curl --proto '=https' --fail --silent --show-error --max-time 20 --max-filesize 1024 --range 0-1023 --config '{{ vars.ENV_DIR }}/media.curl' --output '{{ vars.ENV_DIR }}/media-range.bin'",
  "cmp --bytes=1024 '{{ vars.ENV_DIR }}/media.ts' '{{ vars.ENV_DIR }}/media-range.bin'",
  "curl --silent --show-error --max-time 20 --max-filesize 1048576 --output /dev/null --write-out '%{http_code}' '{{ env.TASKV_API_URL }}/flows' > '{{ vars.ENV_DIR }}/anonymous-status.txt'",
  "grep -Eq '^(401|403)$' '{{ vars.ENV_DIR }}/anonymous-status.txt'",
]
env.TASKV_API_URL = '''{% if env.API_URL is defined %}{{ env.API_URL }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "yq -r .data.apiURL " ~ (vars.ENV_DIR) ~ "/instance/runtime.yaml") }}{% endif %}'''
env.TASKV_FLOW = '''{% if env.FLOW is defined %}{{ env.FLOW }}{% else %}{{ exec(command="cd " ~ (vars.ROOT_DIR | quote) ~ " && " ~ "kubectl --kubeconfig " ~ (vars.ENV_DIR) ~ "/remote.kubeconfig -n tams get ingestrun qualification -o json | yq -p=json -e -r '[.status.output.memberFlows[] | select(.format == \"urn:x-nmos:format:video\")][0].id'") }}{% endif %}'''
depends_post = ["qualification:media:cleanup"]

["qualification:media:cleanup"]
hide = true
dir = "{{ vars.ROOT_DIR }}"
run = [
  '''test -n {{ vars.ENV_DIR | quote }} || { printf '%s\n' "Missing required input: ENV_DIR" >&2; exit 1; }''',
  "rm -f '{{ vars.ENV_DIR }}/media.curl' '{{ vars.ENV_DIR }}/segments.json'",
]

