name: Publish OKE bootstrap tools
on: workflow_dispatch
permissions:
  contents: read
  packages: write
concurrency:
  group: tamoss-bootstrap-tools
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_NAME: tamoss-bootstrap-tools
      PACKAGE_OWNER: ${{ github.repository_owner }}
      PRODUCT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
      - name: Check package ownership and visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p -m 700 .local/tmp/image
          gh api "/users/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME" > .local/tmp/image/package.json ||
            aqua exec -- yq -e '.status == "404"' .local/tmp/image/package.json
          aqua exec -- yq -e '(.status == "404") or (.visibility == "public" and .repository.full_name == strenv(PRODUCT_REPOSITORY))' .local/tmp/image/package.json
      - name: Build and verify pinned tools
        run: |
          export PATH="$(aqua root-dir)/bin:$PATH"
          docker build --build-arg OCI_IMAGE="$(yq -r .oci.image dependencies.yaml)" --build-arg FLUX_IMAGE="$(yq -r .bootstrapTools.fluxImage dependencies.yaml)" --build-arg KUBECTL_IMAGE="$(yq -r .connectionDetails.kubectlImage dependencies.yaml)" --build-arg YQ_IMAGE="$(yq -r .connectionDetails.yqImage dependencies.yaml)" --label "org.opencontainers.image.source=https://github.com/$PRODUCT_REPOSITORY" --tag "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" deploy/oke-bootstrap
          test "$(docker run --rm --network none "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" --version)" = "$(yq -r .oci.version dependencies.yaml)"
          docker run --rm --network none --entrypoint flux "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" --version
          docker run --rm --network none --entrypoint kubectl "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" version --client
          docker run --rm --network none --entrypoint yq "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" --version
      - name: Publish
        env:
          PUBLISHER: ${{ github.actor }}
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$PUBLISH_TOKEN" | docker login ghcr.io --username "$PUBLISHER" --password-stdin
          docker push "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA"
      - name: Verify publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/users/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME" > .local/tmp/image/published.json
          aqua exec -- yq -e '.visibility == "public" and .repository.full_name == strenv(PRODUCT_REPOSITORY)' .local/tmp/image/published.json
          docker buildx imagetools inspect "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous consumption
        run: |
          mkdir -p .local/tmp/anonymous-registry
          docker --config "$PWD/.local/tmp/anonymous-registry" manifest inspect "ghcr.io/$PACKAGE_OWNER/$PACKAGE_NAME:$GITHUB_SHA" > /dev/null
      - name: Remove publisher credentials
        if: always()
        run: docker logout ghcr.io
