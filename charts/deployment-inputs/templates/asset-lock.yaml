{{- if .Values.files.releaseMetadata }}
{{- $build := .Values.files.releaseMetadata | fromYaml -}}
{{- $pins := .Values.files.pins | fromYaml -}}
{{- with $pins.tadoss }}{{- $_ := unset . "enabled" }}{{- end }}
{{- $charts := required "Release chart digests are required" $build.charts -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tamoss-assets
  namespace: tamoss-infra
  labels: {reconcile.fluxcd.io/watch: Enabled}
  annotations: {kustomize.toolkit.fluxcd.io/substitute: disabled}
data:
  schemaVersion: '3'
  bundleURL: {{ required "releaseURL is required" .Values.releaseURL | quote }}
  bundleDigest: {{ required "releaseDigest is required" .Values.releaseDigest | quote }}
  bootstrapChartURL: {{ (index $charts "gitops-bootstrap").url | quote }}
  bootstrapChartDigest: {{ (index $charts "gitops-bootstrap").digest | quote }}
  manifestSha256: {{ $build.manifestSha256 | quote }}
  productCommit: {{ $build.product.commit | quote }}
  externalSecretsVersion: {{ $pins.dependencies.externalSecrets.version | quote }}
  externalSecretsValues: |
{{ $pins.externalSecrets | toYaml | indent 4 }}
  values.yaml: |
{{ $pins | toYaml | indent 4 }}
    assets:
      url: {{ .Values.releaseURL | quote }}
      digest: {{ .Values.releaseDigest | quote }}
      charts:
{{ $charts | toYaml | indent 8 }}
{{- end }}
