apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata: {name: asset-credential-recovery}
spec:
  bindings:
    - {name: directory, value: "(join('/', [$values.root, '.local/tmp/check/asset-credential-recovery']))"}
  steps:
    - name: stop interrupted preparation and preserve the captured key
      try:
        - command:
            env: &paths
              - {name: PROJECT_ROOT, value: ($values.root)}
              - {name: DIRECTORY, value: ($directory)}
              - {name: ENV_DIR, value: ($directory)}
            entrypoint: mkdir
            args: [-p, "$DIRECTORY/assets-state"]
        - command:
            env: *paths
            entrypoint: cp
            args: [identity.json, "$DIRECTORY/identity.yaml"]
        - command:
            env: *paths
            entrypoint: cp
            args: [key.json, "$DIRECTORY/assets-state/key.json"]
        - command: &retry
            env: *paths
            entrypoint: env
            args: [mise, -C, "$PROJECT_ROOT", run, 'bootstrap:install']
            check:
              ($error != null): true
              (contains($stderr, 'Preparation was interrupted')): true
        - command:
            env: *paths
            entrypoint: cmp
            args: [key.json, "$DIRECTORY/assets-state/key.json"]
    - name: preserve an ambiguous creation response for explicit recovery
      try:
        - command:
            env: *paths
            entrypoint: truncate
            args: [-s, '0', "$DIRECTORY/assets-state/key.json"]
        - command: *retry
        - command:
            env: *paths
            entrypoint: test
            args: ['!', -s, "$DIRECTORY/assets-state/key.json"]
        - command:
            env: *paths
            entrypoint: test
            args: [-f, "$DIRECTORY/assets-state/key.json"]
    - name: require the foundation record after controllers may have started
      try:
        - command:
            env: *paths
            entrypoint: cp
            args: [identity.json, "$DIRECTORY/identity.yaml"]
        - command:
            env: *paths
            entrypoint: env
            args: [mise, -C, "$PROJECT_ROOT", run, 'bootstrap:down:early']
            check:
              ($error != null): true
              (contains($stderr, 'Restore the retained foundation record')): true
