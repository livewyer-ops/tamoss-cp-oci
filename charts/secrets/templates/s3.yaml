{{- if .Values.s3 -}}
{{- if or (ne .Values.oracle.principalType "UserPrincipal") (eq .Values.s3.userId .Values.oracle.auth.user) -}}
{{- fail "S3 credentials require a separate storage user and the Kind provisioner" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-credential-operation
  namespace: {{ .Release.Namespace }}
  annotations:
    tamoss.livewyer.io/deployment-id: {{ .Values.deploymentId | quote }}
    tamoss.livewyer.io/storage-user: {{ .Values.s3.userId | quote }}
# The Job adds its claim and key ID. Helm must preserve them across upgrades.
{{ if .Values.initialise }}
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-input
  namespace: {{ .Release.Namespace }}
  annotations:
    tamoss.livewyer.io/deployment-id: {{ .Values.deploymentId | quote }}
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [s3-credential-operation]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [s3-input]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: s3-credentials}
subjects:
  - {kind: ServiceAccount, name: s3-credentials, namespace: {{ .Release.Namespace }}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
  labels: &labels
    tamoss.livewyer.io/credential-operation: s3
    tamoss.livewyer.io/deployment-id: {{ .Values.deploymentId | quote }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 300
  podReplacementPolicy: Failed
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: s3-credentials
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "operation-common.podSecurity" . | nindent 8 }}
      initContainers:
        - name: inspect
          image: &image {{ .Values.s3.image | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              kubectl -n "$NAMESPACE" get configmap s3-credential-operation -o json > /work/operation.json
              kubectl -n "$NAMESPACE" get secret s3-input -o json > /work/input.json
              oci --connection-timeout 10 --read-timeout 30 --max-retries 0 iam customer-secret-key list --user-id "$STORAGE_USER" --all > /work/keys.json
              yq -i '. // {"data": []}' /work/keys.json
          env: &environment
            - {name: HOME, value: /tmp}
            - {name: OCI_CLI_AUTH, value: api_key}
            - {name: OCI_CLI_REGION, value: {{ .Values.oracle.region | quote }}}
            - {name: OCI_CLI_USER, value: {{ .Values.oracle.auth.user | quote }}}
            - {name: OCI_CLI_TENANCY, value: {{ .Values.oracle.auth.tenancy | quote }}}
            - {name: OCI_CLI_KEY_FILE, value: /oci/privatekey}
            - name: OCI_CLI_FINGERPRINT
              valueFrom: {secretKeyRef: {name: oci-vault-bootstrap, key: fingerprint}}
            - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: DEPLOYMENT_ID, value: {{ .Values.deploymentId | quote }}}
            - {name: STORAGE_USER, value: {{ .Values.s3.userId | quote }}}
            - name: ATTEMPT
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          securityContext: &security
            {{- include "operation-common.containerSecurity" . | nindent 12 }}
          resources: &resources
            {{- include "operation-common.resources" . | nindent 12 }}
          volumeMounts: &mounts
            {{- include "operation-common.mounts" . | nindent 12 }}
            - {name: oci, mountPath: /oci, readOnly: true}
            - {name: api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        - name: prepare-claim
          image: *image
          command: [yq]
          args:
            - --exit-status
            - --output-format=json
            - --inplace
            - >-
              select(.metadata.annotations."tamoss.livewyer.io/deployment-id" == strenv(DEPLOYMENT_ID)) |
              select(.metadata.annotations."tamoss.livewyer.io/storage-user" == strenv(STORAGE_USER)) |
              select((.data.attempt // "") == "" and (.data.keyId // "") == "" and .data.retired != "true") |
              select(load("/work/input.json").metadata.annotations."tamoss.livewyer.io/deployment-id" == strenv(DEPLOYMENT_ID)) |
              select(load("/work/input.json").data.credentials == null) |
              select((load("/work/keys.json").data | tag) == "!!seq") |
              select((load("/work/keys.json").data | length) < 2) |
              select((load("/work/keys.json").data | map(select((."display-name" // "") | test("^tamoss-" + strenv(DEPLOYMENT_ID) + "-"))) | length) == 0) |
              [{"op": "test", "path": "/metadata/resourceVersion", "value": .metadata.resourceVersion},
              {"op": "add", "path": "/data", "value": {"attempt": strenv(ATTEMPT)}}] | select(length == 2)
            - /work/operation.json
          env: *environment
          securityContext: *security
          resources: *resources
          volumeMounts: *mounts
        - name: create
          image: *image
          command: [/bin/sh, -ec]
          args:
            - |
              kubectl -n "$NAMESPACE" patch configmap s3-credential-operation --type=json --patch-file=/work/operation.json -o json > /work/claimed.json
              oci --connection-timeout 10 --read-timeout 30 --max-retries 0 iam customer-secret-key create --user-id "$STORAGE_USER" --display-name "tamoss-$DEPLOYMENT_ID-$ATTEMPT" > /work/key.json
          env: *environment
          securityContext: *security
          resources: *resources
          volumeMounts: *mounts
        - name: prepare-secret
          image: *image
          command: [yq]
          args:
            - --exit-status
            - --output-format=json
            - --inplace
            - >-
              .data |
              select(."user-id" == strenv(STORAGE_USER) and ."display-name" == "tamoss-" + strenv(DEPLOYMENT_ID) + "-" + strenv(ATTEMPT)) |
              select((.id | length) > 0 and (.key | length) > 0) |
              [{"op": "test", "path": "/metadata/resourceVersion", "value": load("/work/input.json").metadata.resourceVersion},
              {"op": "test", "path": "/metadata/annotations/tamoss.livewyer.io~1deployment-id", "value": strenv(DEPLOYMENT_ID)},
              {"op": "add", "path": "/data", "value": {"credentials": ({"accessKey": .id, "secretKey": .key} | to_json | @base64)}}] |
              select(length == 3)
            - /work/key.json
          env: *environment
          securityContext: *security
          resources: *resources
          volumeMounts: *mounts
        - name: persist
          image: *image
          command: [kubectl]
          args: [-n, {{ .Release.Namespace | quote }}, patch, secret, s3-input, --type=json, --patch-file=/work/key.json, -o, name]
          securityContext: *security
          resources: *resources
          volumeMounts: *mounts
        - name: prepare-receipt
          image: *image
          command: [yq]
          args:
            - --exit-status
            - --output-format=json
            - --inplace
            - >-
              select(.data.attempt == strenv(ATTEMPT)) |
              [{"op": "test", "path": "/metadata/resourceVersion", "value": .metadata.resourceVersion},
              {"op": "add", "path": "/data/keyId", "value": (load("/work/key.json")[2].value.credentials | @base64d | from_json | .accessKey)}] |
              select(length == 2)
            - /work/claimed.json
          env: *environment
          securityContext: *security
          resources: *resources
          volumeMounts: *mounts
      containers:
        - name: receipt
          image: *image
          command: [kubectl]
          args: [-n, {{ .Release.Namespace | quote }}, patch, configmap, s3-credential-operation, --type=json, --patch-file=/work/claimed.json, -o, name]
          securityContext: *security
          resources: *resources
          volumeMounts: *mounts
      volumes:
        {{- include "operation-common.volumes" . | nindent 8 }}
        - name: oci
          secret:
            secretName: oci-vault-bootstrap
            defaultMode: 0440
            items: [{key: privatekey, path: privatekey}]
        - name: api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]
{{ end }}
{{ end }}
