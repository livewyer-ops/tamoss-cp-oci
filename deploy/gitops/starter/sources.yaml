apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: tamoss-upstream, namespace: flux-system}
spec:
  interval: 10m
  url: https://github.com/livewyer-ops/tamoss
  ref: {commit: REPLACE}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: tamoss-product, namespace: flux-system}
spec:
  interval: 10m
  url: REPLACE
  provider: github
  secretRef: {name: github-app}
  ref: {commit: REPLACE}
  include:
    - repository: {name: tamoss-upstream}
      fromPath: .
      toPath: deploy/tamoss/instance/upstream
    - repository: {name: tamoss-upstream}
      fromPath: deploy/platform/values
      toPath: deploy/gitops/platform-defaults/upstream
